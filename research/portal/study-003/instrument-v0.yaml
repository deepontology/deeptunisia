# -----------------------------------------------------------------------------
# DT Research 003: citizen budget instrument v0.1.0-draft
#
# "Citizen Budget 2027" (slug citizen-budget). Spec: specs/budget-game/SPEC.md.
#
# Status: draft. Not frozen. Not fielded. The English column is the source.
# French and Arabic are null on purpose: the project rule is human translation
# with reconciliation and back-translation. The interim UI copy lives in the
# prototype (src/lib/budget-game/copy.ts) and is marked unreviewed there; it is
# not the instrument text.
#
# Every figure in the allocation block is a DRAFT figure from
# data/studies/dt-research-003/figures-2027.yaml, labelled draft, not verified.
# The frozen instrument takes figures only from rows with status adopted-lf,
# each with a page reference.
# -----------------------------------------------------------------------------

instrument:
  id: dt003-citizen-budget
  study: dt-research-003
  version: 0.1.0-draft
  status: draft
  frozen: false
  content_hash: null
  source_locale: en
  locales: [en, fr, ar]
  estimated_minutes: 6
  completion_target_minutes_max: 10
  pretest_required: true
  response_scale_note: >-
    The allocation item gives each line a share of its draft from 0% to 200%,
    stored as integer basis points (10000 is the draft). Money moves in coins of
    100 MD (rule A, the default; the last coin out of or into a line may be
    short so a line can reach exactly 0% or 200%). The movable lines must
    balance to the envelope within 0.5%; under rule A the board asks for every
    dinar to be placed. Locked lines stay at the
    draft. The two short questions use a 0 to 10 scale for citizens' say and a
    three-option choice for total spending.

translation:
  policy: >-
    Human translation only, with two independent translators per locale,
    reconciliation, back-translation and cognitive interviews, before freeze.
    No machine text in this file.
  report: null
  locales:
    en:
      status: source
    fr:
      status: pending-human-translation
      translator_a: null
      translator_b: null
      back_translator: null
      cognitive_interviews: 0
    ar:
      status: pending-human-translation
      translator_a: null
      translator_b: null
      back_translator: null
      cognitive_interviews: 0

response_types:
  consent: boolean required, recorded with consent version
  single_choice: one option plus prefer-not-to-say where stated
  scale_0_10: integer 0-10 plus skip
  allocation: object of integer basis points per declared line, plus kept_draft (boolean); validated by community/research-contract.ts
  auto: recorded by the platform, not shown

modules:
  - id: consent
    label: Consent and age
    items: [consent_read, consent_withdrawal, consent_age]
  - id: budget
    label: The budget
    items: [alloc_budget]
  - id: questions
    label: Two short questions
    items: [q_spending, q_say]
  - id: about
    label: About you (optional)
    items: [demo_governorate]

items:
  - id: consent_read
    module: consent
    tier: core
    construct: consent
    provenance: project
    text_en: "I have read the study information and what happens to my answers."
    text_fr: null
    text_ar: null
    response: consent
    required: true

  - id: consent_withdrawal
    module: consent
    tier: core
    construct: consent
    provenance: project
    text_en: "I understand that I will receive a receipt code, and that I can withdraw my answers with it until the study window closes."
    text_fr: null
    text_ar: null
    response: consent
    required: true

  - id: consent_age
    module: consent
    tier: core
    construct: consent
    provenance: project
    text_en: "I confirm that I am 18 years old or older."
    text_fr: null
    text_ar: null
    response: consent
    required: true
    routing: if false, end the session and store nothing

  - id: alloc_budget
    module: budget
    tier: core
    construct: budget allocation
    provenance: project (SPEC section 2, the game screen)
    text_en: "Use the Treasury board: move money between the lines of the 2027 state budget, as a citizen. Every move carries one coin of 100 MD. Place every dinar in the purse before you go on. Keeping the draft is a valid answer."
    text_fr: null
    text_ar: null
    response: allocation
    required: true
    notes: "Amounts are the draft figures from figures-2027.yaml, labelled draft, not verified. Freeze only on adopted-law rows with page references."
    allocation:
      envelope_md: 59932.381
      tolerance: 0.005
      # Any whole basis point: the default move rule (A) moves 100 MD coins, so a
      # share is the amount over the draft, rounded to the basis point. Rule B
      # (5% steps) gives multiples of 500, which this also accepts.
      step_bp: 1
      max_bp: 20000
      categories:
      - { id: education, draft_md: 9184.5, locked: false }
      - { id: higher_education, draft_md: 2484, locked: false }
      - { id: health, draft_md: 4741.2, locked: false }
      - { id: social, draft_md: 4547.49, locked: false }
      - { id: subsidies, draft_md: 11846, locked: false }
      - { id: energy_trade, draft_md: 272.8, locked: false }
      - { id: police, draft_md: 6560, locked: false }
      - { id: army, draft_md: 5628.2, locked: false }
      - { id: justice, draft_md: 1112, locked: false }
      - { id: farming, draft_md: 2530, locked: false }
      - { id: roads_housing, draft_md: 2249, locked: false }
      - { id: youth_sports, draft_md: 1065, locked: false }
      - { id: culture, draft_md: 500, locked: false }
      - { id: presidency, draft_md: 248.576, locked: false }
      - { id: government, draft_md: 878.475, locked: false }
      - { id: other, draft_md: 6085.14, locked: false }
      - { id: debt, draft_md: 7968, locked: true }
      - { id: reserve, draft_md: 995, locked: true }

  - id: q_spending
    module: questions
    tier: core
    construct: total spending direction
    provenance: project (SPEC section 1, secondary question 1)
    text_en: "Knowing that the gap is borrowed, should total spending be lower, the same, or higher?"
    text_fr: null
    text_ar: null
    response: single_choice
    required: false
    options: [lower, same, higher]

  - id: q_say
    module: questions
    tier: core
    construct: citizen say over the budget
    provenance: project (SPEC section 1, secondary question 2)
    text_en: "How much say do citizens have today over how the budget is spent? 0 means none, 10 means a lot."
    text_fr: null
    text_ar: null
    response: scale_0_10
    required: false

  - id: demo_governorate
    module: about
    tier: optional
    construct: demographics
    provenance: reused from study 001 (demo_governorate)
    text_en: "Which governorate do you live in?"
    text_fr: null
    text_ar: null
    response: single_choice
    required: false
    notes: "Published only as the seven INS regions, under the cell floor of 20 (SPEC section 5). Options below are the study 001 list, to be re-cut before fielding."
    options: [ariana, beja, ben_arous, bizerte, gabes, gafsa, jendouba, kairouan, kasserine, kebili, kef, mahdia, manouba, medenine, monastir, nabeul, sfax, sidi_bouzid, siliana, sousse, tataouine, tozeur, tunis, zaghouan, prefer_not_to_say]
