# -----------------------------------------------------------------------------
# DT Research 003: citizen budget instrument (workshop copy)
#
# "Citizen Budget 2027" (slug citizen-budget). Spec: specs/budget-game/SPEC.md.
#
# The English column is the source. French and Arabic are interim project
# translations, the same strings the board shows (see translation below).
#
# The allocation block carries the 2027 draft figures from
# data/studies/dt-research-003/figures-2027.yaml, labelled draft. Version 1.0.0
# fields on the draft: the adopted 2020 to 2026 budgets on the board are the
# main reference and the draft is an extra one (preregistration, amendment of
# 22 November 2026). When the 2027 finance law is adopted, a new version takes
# the adopted figures and its answers are reported separately.
# -----------------------------------------------------------------------------

instrument:
  id: dt003-citizen-budget
  study: dt-research-003
  version: 0.1.0-draft
  status: draft
  frozen: false
  content_hash: null
  source_locale: en
  locales: [en, fr, ar]
  estimated_minutes: 6
  completion_target_minutes_max: 10
  pretest_required: true
  response_scale_note: >-
    The allocation item gives each line a share of its draft from 0% to 200%,
    stored as integer basis points (10000 is the draft). Money moves in coins of
    100 MD (rule A, the default; the last coin out of or into a line may be
    short so a line can reach exactly 0% or 200%). The movable lines must
    balance to the envelope within 0.5% at the server; the board itself only
    finishes when the purse is empty, so every dinar is placed. Locked lines stay at the
    draft. The two short questions use a 0 to 10 scale for citizens' say and a
    three-option choice for total spending.

translation:
  policy: >-
    Interim: French and Arabic are the project's own drafts, the same strings the
    board shows, published as interim translations and marked so on screen. Not
    yet reviewed by an independent person who reads the language. Target: two
    independent human translators per locale, reconciliation, back-translation
    and cognitive interviews before a later version freezes.
  report: null
  locales:
    en:
      status: source
    fr:
      status: interim-project-translation
      reviewer: null
    ar:
      status: interim-project-translation
      reviewer: null
      register: Modern Standard Arabic, plain

response_types:
  consent: boolean required, recorded with consent version
  single_choice: one option plus prefer-not-to-say where stated
  scale_0_10: integer 0-10 plus skip
  allocation: object of integer basis points per declared line, plus kept_draft (boolean); validated by community/research-contract.ts
  auto: recorded by the platform, not shown

modules:
  - id: consent
    label: Consent and age
    items: [consent_read, consent_withdrawal, consent_age]
  - id: budget
    label: The budget
    items: [alloc_budget]
  - id: questions
    label: Two short questions
    items: [q_spending, q_say]
  - id: about
    label: About you (optional)
    items: [demo_governorate]

items:
  - id: consent_read
    module: consent
    tier: core
    construct: consent
    provenance: project
    text_en: "I have read the study information and what happens to my answers."
    text_fr: "J'ai lu les informations de l'étude et ce qu'il advient de mes réponses."
    text_ar: "قرأت معلومات الدراسة وما يحدث بإجاباتي."
    response: consent
    required: true

  - id: consent_withdrawal
    module: consent
    tier: core
    construct: consent
    provenance: project
    text_en: "I understand that I will receive a receipt code, and that I can withdraw my answers with it until the study window closes."
    text_fr: "Je comprends que je recevrai un code de reçu et que je pourrai retirer mes réponses avec ce code jusqu’à la clôture de l’étude."
    text_ar: "أفهم أنني سأحصل على رمز إيصال، وأنه يمكنني سحب إجاباتي به حتى إغلاق نافذة الدراسة."
    response: consent
    required: true

  - id: consent_age
    module: consent
    tier: core
    construct: consent
    provenance: project
    text_en: "I confirm that I am 18 years old or older."
    text_fr: "Je confirme avoir 18 ans ou plus."
    text_ar: "أؤكّد أن عمري 18 سنة أو أكثر."
    response: consent
    required: true
    routing: if false, end the session and store nothing

  - id: alloc_budget
    module: budget
    tier: core
    construct: budget allocation
    provenance: project (SPEC section 2, the game screen)
    text_en: "Use the Treasury board: move money between the lines of the 2027 state budget, as a citizen. Start from the draft. Every move carries one coin of 100 MD. Finish when the purse is empty and either you have made a move or you tick that you would keep the draft exactly as it is. Keeping the draft is a valid answer, not a skip."
    text_fr: "Utilisez le tableau du Trésor : déplacez l'argent entre les lignes du budget de l'État 2027, en tant que citoyen. Partez du projet. Chaque mouvement porte une pièce de 100 MD. Terminez quand la bourse est vide et que vous avez fait au moins un mouvement ou coché que vous garderiez le projet exactement tel quel. Garder le projet est une réponse valable, pas un saut."
    text_ar: "استعمل لوحة الخزينة: انقل المال بين بنود ميزانية الدولة لسنة 2027، كمواطن. ابدأ من المشروع. كل نقلة تحمل قطعة واحدة من 100 مليون دينار. أنهِ عندما تكون المحفظة فارغة وتكون قد قمت بنقلة واحدة على الأقل أو أشرت إلى أنك تُبقي على المشروع كما هو تمامًا. الإبقاء على المشروع إجابة صحيحة، وليس تخطّيًا."
    response: allocation
    required: true
    notes: "Amounts are the draft figures from figures-2027.yaml, labelled draft, not verified. Freeze only on adopted-law rows with page references. The subsidy memo is split into fuel and electricity versus basic food; the 2027 split by type is derived from the two containing lines and is labelled as such on screen. The small missions reported only as one group are split by their 2026 adopted shares into Religious Affairs, Communication Technologies, State Domains and Land Affairs, and Courts and Oversight; the National Council of Regions and Districts is counted with Parliament and the Higher Council of Education with Higher Education. The six derived rows sum to the group total and are labelled derived."
    allocation:
      envelope_md: 59932.000
      tolerance: 0.005
      # Any whole basis point: the default move rule (A) moves 100 MD coins, so a
      # share is the amount over the draft, rounded to the basis point. Rule B
      # (5% steps) gives multiples of 500, which this also accepts.
      step_bp: 1
      max_bp: 20000
      categories:
      - { id: parliament, draft_md: 71.468, locked: false }
      - { id: presidency, draft_md: 248.576, locked: false }
      - { id: government_offices, draft_md: 368, locked: false }
      - { id: police, draft_md: 6560, locked: false }
      - { id: justice, draft_md: 1112, locked: false }
      - { id: foreign_affairs, draft_md: 404, locked: false }
      - { id: army, draft_md: 5628.2, locked: false }
      - { id: finance, draft_md: 1626.6, locked: false }
      - { id: economy, draft_md: 794.1, locked: false }
      - { id: farming, draft_md: 2530, locked: false }
      - { id: subsidies_energy, draft_md: 7712.588, locked: false }
      - { id: subsidies_food, draft_md: 4133.412, locked: false }
      - { id: energy_trade, draft_md: 272.8, locked: false }
      - { id: tourism, draft_md: 182.14, locked: false }
      - { id: roads_housing, draft_md: 2249, locked: false }
      - { id: environment, draft_md: 524, locked: false }
      - { id: transport, draft_md: 1321, locked: false }
      - { id: culture, draft_md: 500, locked: false }
      - { id: youth_sports, draft_md: 1065, locked: false }
      - { id: family, draft_md: 331.69, locked: false }
      - { id: health, draft_md: 4741.2, locked: false }
      - { id: social_affairs, draft_md: 4215.8, locked: false }
      - { id: education, draft_md: 9184.5, locked: false }
      - { id: higher_education, draft_md: 2493.431, locked: false }
      - { id: employment, draft_md: 1104, locked: false }
      - { id: religious_affairs, draft_md: 190.883, locked: false }
      - { id: communication_technologies, draft_md: 186.105, locked: false }
      - { id: state_domains, draft_md: 88.806, locked: false }
      - { id: courts_oversight, draft_md: 34.977, locked: false }
      - { id: elections, draft_md: 57.724, locked: false }
      - { id: debt, draft_md: 7968, locked: true }
      - { id: reserve, draft_md: 995, locked: true }

  - id: q_spending
    module: questions
    tier: core
    construct: total spending direction
    provenance: project (SPEC section 1, secondary question 1)
    text_en: "Knowing that the gap is borrowed, should total spending be lower, the same, or higher?"
    text_fr: "Sachant que le déficit est emprunté, la dépense totale devrait-elle être plus basse, identique ou plus haute ?"
    text_ar: "مع العلم أن الفجوة تُقترض، هل ينبغي أن تكون النفقات الإجمالية أقل أم نفسها أم أعلى؟"
    response: single_choice
    required: false
    options: [lower, same, higher]
    option_labels:
      en: { lower: "Lower", same: "The same", higher: "Higher" }
      fr: { lower: "Plus basse", same: "Identique", higher: "Plus haute" }
      ar: { lower: "أقل", same: "نفسها", higher: "أعلى" }

  - id: q_say
    module: questions
    tier: core
    construct: citizen say over the budget
    provenance: project (SPEC section 1, secondary question 2)
    text_en: "How much say do citizens have today over how the budget is spent? 0 means none, 10 means a lot."
    text_fr: "Quelle influence les citoyens ont-ils aujourd'hui sur la façon dont le budget est dépensé ? 0 signifie aucune, 10 signifie beaucoup."
    text_ar: "ما مدى تأثير المواطنين اليوم في طريقة إنفاق الميزانية؟ 0 يعني لا تأثير، و10 يعني تأثيرًا كبيرًا."
    response: scale_0_10
    required: false

  - id: demo_governorate
    module: about
    tier: optional
    construct: demographics
    provenance: reused from study 002 (demo_governorate), the re-cut list with its labels
    text_en: "Which governorate do you live in?"
    text_fr: "Dans quel gouvernorat vivez-vous ?"
    text_ar: "في أيّ ولاية تقيم؟"
    response: single_choice
    required: false
    notes: "Optional. Published only as the seven INS regions (scoring.regions), each under the cell floor."
    options: [tunis, ariana, ben_arous, manouba, nabeul, zaghouan, bizerte, beja, jendouba, kef, siliana, sousse, monastir, mahdia, sfax, kairouan, kasserine, sidi_bouzid, gabes, medenine, tataouine, gafsa, tozeur, kebili, outside_tunisia, prefer_not_to_say]
