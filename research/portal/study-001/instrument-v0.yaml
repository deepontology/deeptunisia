  pool:
    - ess_core_elections
    - ess_core_civil_rights
    - ess_core_women
    - ess_core_tax_rich
    - ess_core_religious_law
    - ess_core_army_takeover
    - ess_core_obey
    - ess_core_strong_leader
    - ess_ext_courts
    - ess_ext_equality_law
    - ess_ext_press
    - ess_ext_protest
    - ess_ext_local_power
    - ess_ext_basic_needs
    - ess_ext_anti_corruption
  design:
    status: generated
    constraints:
      - each item appears in 2 or 3 sets
      - position frequency balanced
      - pair frequency near-balanced
    frozen_with_instrument: true
    sets:
      - id: mds1
        items: [ess_ext_anti_corruption, ess_core_women, ess_core_strong_leader, ess_core_army_takeover]
      - id: mds2
        items: [ess_ext_courts, ess_ext_anti_corruption, ess_ext_basic_needs, ess_core_civil_rights]
      - id: mds3
        items: [ess_core_women, ess_ext_equality_law, ess_ext_press, ess_ext_local_power]
      - id: mds4
        items: [ess_ext_protest, ess_core_tax_rich, ess_core_elections, ess_core_obey]
      - id: mds5
        items: [ess_ext_equality_law, ess_ext_protest, ess_ext_anti_corruption, ess_core_religious_law]
      - id: mds6
        items: [ess_core_tax_rich, ess_ext_courts, ess_core_religious_law, ess_core_women]
      - id: mds7
        items: [ess_core_strong_leader, ess_ext_basic_needs, ess_core_obey, ess_ext_press]
      - id: mds8
        items: [ess_core_army_takeover, ess_core_civil_rights, ess_ext_local_power, ess_core_elections]
  instruction_en: "Which of these four is MOST essential to democracy, and which is LEAST essential?"
  text_fr: null
  text_ar: null

gap_block:
  id: gap_block
  response: scale_present
  instruction_en: "For each of these, how much is it a reality in Tunisia today?"
  text_fr: null
  text_ar: null
  items:
    - ess_core_elections
    - ess_core_civil_rights
    - ess_core_women
    - ess_ext_courts
    - ess_ext_equality_law
    - ess_ext_press
    - ess_ext_speech
    - ess_ext_protest
    - ess_ext_local_power
    - ess_ext_basic_needs
    - ess_ext_anti_corruption
    - ess_ext_regional_equality
  excluded_note: >-
    The anti-democratic items (religious law, army takeover, obey rulers, strong
    leader) are excluded from the presence block by design: asking how present
    military rule is does not measure a democratic deficit.

experiments:
  - id: exp_block_order
    factor: essentiality block order
    arms: [core_first, extended_first]
    allocation: simple randomization, 50/50
    analysis: section 10.7 of the protocol
  - id: exp_scale_direction
    factor: visible scale anchor direction
    arms: [ascending, descending]
    allocation: simple randomization, 50/50
    analysis: section 10.7 of the protocol

tiers:
  core: always fielded; required
  extended: fielded in v1; required
  optional: fielded in v1 only if pretest median completion stays under the protocol target; droppable by a pre-registered rule, never dropped after fielding begins

