# -----------------------------------------------------------------------------
# DT Research 001: instrument v0.1.0-draft
#
# "What Does Democracy Mean to Tunisians?"
#
# Status: draft. Not frozen. Not fielded. The English column is the source.
# French and Modern Standard Arabic are intentionally null: the project rule is
# that instruments are human-translated, with reconciliation and back-translation
# (protocol §6). Do not machine-fill text_fr or text_ar. A machine draft may be
# used only as a post-hoc comprehension check by a native reviewer, and recorded
# as such in the translation report.
#
# Every item carries a construct and a provenance. No item enters the battery
# without both (portal README, validator rule S2).
#
# WVS item numbers refer to the WVS-7 master questionnaire (2017-2021). The
# wording quoted here is from the master English version; the localization
# actually administered in Tunisia must be pulled from the WVS Tunisia country
# questionnaire and cited in the final instrument. Where master versions differ
# (Q246 appears as "protect people from state oppression" in some printings and
# "protect people's liberty against oppression" in others), pin the version and
# say which one was used.
# -----------------------------------------------------------------------------

instrument:
  id: dt001-democracy
  study: dt-research-001
  version: 0.1.0-draft
  status: draft
  frozen: false
  content_hash: null
  source_locale: en
  locales: [en, fr, ar]
  estimated_minutes: 12
  completion_target_minutes_max: 15
  pretest_required: true
  response_scale_note: >-
    Essentiality items use 0-10 where the explicit 0 is "it is against democracy",
    1 is "not at all an essential characteristic" and 10 is "definitely an
    essential characteristic", plus a skip option. Present-in-Tunisia items use
    0-10 where 0 is "not at all present" and 10 is "fully present", plus skip.
    The explicit 0 option is a deviation from interviewer administration: WVS
    codes "against democracy" only when volunteered. The deviation is published.

translation:
  policy: >-
    Two independent translators per locale working from the English source and the
    construct definitions; reconciliation; back-translation by a third translator;
    resolution; cognitive interviews with 12 to 15 respondents per locale; freeze
    with the instrument hash. No machine translation at any step.
  report: null
  locales:
    en:
      status: source
    fr:
      status: pending-human-translation
      translator_a: null
      translator_b: null
      back_translator: null
      cognitive_interviews: 0
    ar:
      status: pending-human-translation
      translator_a: null
      translator_b: null
      back_translator: null
      cognitive_interviews: 0
      register: Modern Standard Arabic
      note: >-
        Tunisian Arabic (derja) is accepted in open_definition but is not a written
        instrument locale in v1. Rationale in protocol §6.

response_types:
  consent: boolean required, recorded with consent version
  scale_essential: integer 0-10 plus skip; 0 means "against democracy"
  scale_present: integer 0-10 plus skip; 0 means "not at all present"
  agree_4: integer 1-4 (strongly disagree to strongly agree) plus skip
  scale_0_10: integer 0-10 plus skip
  single_choice: one option plus prefer-not-to-say where stated
  multi_choice: zero or more options
  text_short: free text, maximum 500 characters
  auto: recorded by the platform, not shown

modules:
  - id: consent
    label: Consent and age
    items: [consent_read, consent_voluntary, consent_withdrawal, consent_age]
  - id: essentiality_core
    label: Essential characteristics of democracy (WVS core)
    items: [ess_core_elections, ess_core_civil_rights, ess_core_women, ess_core_tax_rich, ess_core_unemployment_aid, ess_core_incomes_equal, ess_core_religious_law, ess_core_army_takeover, ess_core_obey, ess_core_strong_leader]
  - id: essentiality_extended
    label: Essential characteristics of democracy (extended)
    items: [ess_ext_electoral_commission, ess_ext_electoral_choice, ess_ext_courts, ess_ext_equality_law, ess_ext_press, ess_ext_speech, ess_ext_minorities, ess_ext_no_torture, ess_ext_protest, ess_ext_referendums, ess_ext_local_power, ess_ext_civil_society, ess_ext_consultation, ess_ext_informed_debate, ess_ext_basic_needs, ess_ext_no_poverty, ess_ext_anti_corruption, ess_ext_regional_equality, tun_civil_state, tun_army_politics, tun_transitional_justice]
  - id: maxdiff_priority
    label: Prioritization (MaxDiff)
    block: maxdiff_priority
  - id: presence_tunisia
    label: Present in Tunisia today
    block: gap_block
  - id: support_regime
    label: Support and regime evaluation
    items: [sup_democracy_preferable, sup_democracy_best, sup_strong_leader, sup_govt_economy_unimportant, sup_govt_order_unimportant, sup_satisfaction_democracy, sup_tunisia_democratic_rating]
  - id: safety_mode
    label: Safety and response environment
    items: [saf_comfort, saf_screen, mod_face_to_face]
  - id: open_text
    label: Own words
    items: [open_definition]
  - id: demographics
    label: About you
    items: [demo_residence, demo_governorate, demo_abroad_region, demo_age_band, demo_sex, demo_education, demo_employment, demo_finance, demo_political_interest, demo_religiosity, demo_language_completion, demo_prev_survey]
  - id: design
    label: Design variables (not shown)
    items: [exp_block_order, exp_scale_direction]

