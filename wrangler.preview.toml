# The preview Worker.
#
# It serves the built site and nothing else: no Worker script, no database, no
# variables, no secrets, no route, no custom domain. It lives on its
# workers.dev address, and the deploy command passes --name as well as this file
# so a change to this file cannot make it write the production Worker.
#
# The header that keeps that address out of search results is not declared here,
# because Workers Assets takes custom headers only from the `_headers` file in
# the assets directory. It is the last block of static/_headers, scoped to
# workers.dev hosts. After the first deploy, check it before sharing the address:
#   curl -sI https://<the printed workers.dev address>/ | grep -i x-robots-tag
# If that prints nothing, delete the preview Worker; do not leave it up.

name = "deeptunisia-preview"
compatibility_date = "2026-07-29"
# Explicit, because the preview is reachable by its workers.dev address only.
workers_dev = true

[assets]
directory = "build"
# The same 404 as production, so the preview shows what a reader would get.
not_found_handling = "404-page"
