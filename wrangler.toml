# Cloudflare deployment.
#
# One Worker serves the whole product. The prerendered atlas is uploaded as static
# assets and served by the platform WITHOUT invoking the Worker; only /api reaches
# code. That is what keeps this inside a free tier — reading the map is not a
# request against the Worker quota, so a person clicking through forty entity cards
# costs nothing, and only Agora activity counts.
#
# It also means the atlas survives the Worker failing. The map is files.
#
# Nothing here contains a secret. RATE_PEPPER and MODERATORS are set with
# `wrangler secret put`, never in this file, because this file is committed.

name = "deeptunisia"
main = "community/worker.ts"
compatibility_date = "2026-07-29"

# Ed25519 via crypto.subtle needs the Node compatibility layer on Workers.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "build"
binding = "ASSETS"
# The atlas is fully prerendered, so every route has a file. A request that matches
# nothing is a genuine 404 rather than something to hand to the Worker.
not_found_handling = "404-page"

# The enforced community mode, read at runtime by community/worker.ts and resolved
# by community/mode.ts. An absent or unrecognised value is `off`, so this value
# being present, absent or typo'd all leave the API closed.
#
#   off        every /api/* route answers the uniform 404 before any D1 access.
#   read-only  public GET reads only; every write and identity action refused.
#   beta       the signed API, still with no budget or hold wired.
#
# This is a deployment control, not a build flag: closing Agora must never
# require rebuilding the atlas.
[vars]
COMMUNITY_MODE = "off"

[[d1_databases]]
binding = "DB"
database_name = "deeptunisia-db"
database_id = "cc16abcd-1ff5-4f64-8ed7-cdb1770bc9f8"

[observability]
enabled = true
# Sampling, not full capture. Worker logs are a record of who asked for what, and
# docs/anonymity-audit.md is explicit that the operator not looking at a log is not
# the same as the log not existing.
head_sampling_rate = 0.01

# There is no staging environment.
#
# One existed here and its D1 binding pointed at the production database above
# (same database_id), so a staging deploy would have read and written production
# data while its name suggested otherwise. Rather than carry a binding that lies
# about which database it serves, the environment is gone until a distinct staging
# database exists: uncomment a block below with its OWN database_id first.
#
# Staging must also declare COMMUNITY_MODE. It defaults to `off` from [vars], and
# `beta` is an explicit choice to test the live client against real data.
#
# [env.staging]
# name = "deeptunisia-staging"
# [env.staging.vars]
# COMMUNITY_MODE = "beta"
# [[env.staging.d1_databases]]
# binding = "DB"
# database_name = "deeptunisia-db-staging"
# database_id = "<distinct from the production id>"
# [env.staging.assets]
# directory = "build"
# binding = "ASSETS"
# not_found_handling = "404-page"
