    grade: documented
    sources: [fb-cib-may2020-announcement, fb-cib-may2020-detailed-pdf, dfrlab-operation-carthage-2020-06-05]
    entities: [ureputation, facebook-meta-cib, dfrlab-atlantic-council]
    sections: [S03]
    disputed: false
    text_note: "A — converged across 3 primaries live-verified 2026-08-28; only 182 is the account count"

  - id: C006
    text:
      en: "Operation Carthage targeted 10 African countries and produced election content for Nabil Karoui (Tunisia 2019), Faure Gnassingbé (Togo Feb 2020), Henri Konan Bédié (CIV Oct 2020), Azali Assoumani (Comoros Mar 2019)"
    grade: documented
