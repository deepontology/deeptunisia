  # ── S04 — Collateral (full section per instruction) ─────────────────

  - id: C010
    text:
      en: "29–30 May 2020 — up to 60 accounts/pages belonging to journalists, bloggers, artists and musicians deactivated without warning (incl. Haythem El Mekki, Sarah Ben Hamadi, Bendir Man; participative web radio Radyoon active since 2012)"
    grade: reported
    sources: [article19-tunisia-accounts-2020-06-15]
    entities: [article-19]
    sections: [S04]
    disputed: true
    dispute:
      description: "Are the ~60 collateral accounts part of the 993 UReputation network or false positives?"
      positions:
        - claim: "The ~60 were UReputation fakes and their removal proves success"
          source: fb-cib-may2020-announcement
          holder: "Implied by proximity of CIB numbers to May-29 window"
        - claim: "Deleted pages are not pages related to UReputation (Radyoon since 2012 and others deny link; ~20 restored)"
          source: article19-tunisia-accounts-2020-06-15
          holder: "ARTICLE 19 via affected users + Access Now / Nawaat"
      adopted: "Dispute open — both holdings retained; ~20 restored <24h via I Watch suggests at least partial false positive"
    text_note: "C — attributed_to ARTICLE 19 + affected-user testimony"

  - id: C011
    text:
      en: "At least 28 accounts restored via Facebook Trusted Partner I Watch and Access Now Helpline; Facebook sequence — 4 Jun via Guardian: 'technical error, small number restored' then 5 Jun CIB Report: deliberate 993 removal — no reconciliation published"
    grade: reported
    sources: [article19-tunisia-accounts-2020-06-15, accessnow-carthage-transparency-2020-06-12]
    entities: [article-19, access-now]
    sections: [S04]
    disputed: true
    dispute:
      description: "Technical error vs deliberate removal sequencing"
      positions:
        - claim: "Small number, technical error, now restored"
          source: article19-tunisia-accounts-2020-06-15
          holder: "Facebook via Guardian 4 Jun 2020"
        - claim: "Deliberate removal of 446/182/96/60/209 UReputation assets"
          source: fb-cib-may2020-announcement
          holder: "Facebook May CIB Report 5 Jun 2020"
      adopted: "Open — per-handle audit required to reconcile; Access Now 12 Jun: 'we can only speculate collateral damage'"

  # ── S05 — Foreign amplification (not domestic farm) ─────────────────

  - id: C012
    text:
      en: "Jul 2021 hashtag 'Tunisians revolt against the brotherhood' — 12,000 tweets from 6,800 unique accounts; majority self-reported location Saudi Arabia / UAE; top 10 most influential all Gulf-based (monther72, faljubairi, s_hm2030, emarati_shield) — foreign amplification of Saied's 25 Jul move"
    grade: reported
    sources: [aljazeera-tunisia-manipulation-2021-07-28]
    entities: [marc-owen-jones]
    sections: [S05]
    disputed: false
    text_note: "C — Marc Owen Jones via Al Jazeera; 12k is tweets not accounts"

  - id: C013
    text:
      en: "Sock-puppet cluster >200 accounts retweeting persona Fairuz @7__e7 >200 times within 5 minutes (velocity as automation signal); hacked-account reuse (14yo Filipino girl, Emma Roberts / Smurf avatar); persona tweet carried unrelated comic video; disconnected blue constellation vs main cluster = inorganic"
    grade: reported
    sources: [aljazeera-tunisia-manipulation-2021-07-28]
    entities: [marc-owen-jones]
    sections: [S05]
    disputed: true
    dispute:
      description: "Were 6,800 Tunisian bots or foreign influencers + sock-puppets?"
      positions:
        - claim: "6,800 were Tunisian bots"
          source: aljazeera-tunisia-manipulation-2021-07-28
          holder: "Loose summary (non-specific)"
        - claim: "Gulf influencer core (real, high centrality) + sock-puppet automated retweeters — typology matters, not one bot label"
          source: aljazeera-tunisia-manipulation-2021-07-28
          holder: "Marc Owen Jones typology via Al Jazeera"
      adopted: "Jones typology adopted — not 6,800 bots"
    text_note: "C — velocity + graph shape + reuse pattern is claim; dataset not located — falsifiable by tweet-ID re-collection"

