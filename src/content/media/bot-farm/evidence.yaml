# Bot Farm — evidence layer
# Claims C001–C027 map to outline §6; IDs preserve manual outline numbering for cross-ref to research/bot-farm-outline.md.
# Grades: documented (platform/institutional verbatim), reported (journalism/single-researcher), unsubstantiated (circulating without number).
# Sources are registered in ../media/bot-farm/sources.yaml and in data/contrib/bot-farm-*.yaml.

claims:

  # ── S02 — Archimedes (2019) ─────────────────────────────────────────

  - id: C001
    text:
      en: "16 May 2019 — Meta (Archimedes Group) removes 265 assets globally including Tunisia: 65 FB accounts + 161 Pages + 23 Groups + 12 events + 4 IG = 265; ~2.8M Page followers, ~5,500 Group joins, ~920 IG followers; ~$812k ad spend Dec 2012–Apr 2019 (BRL/ILS/USD); focus: Nigeria, Senegal, Togo, Angola, Niger and Tunisia + LatAm/SEA"
    grade: documented
    sources: [fb-cib-israel-2019-05-16]
    entities: [archimedes-group, facebook-meta-cib]
    sections: [S02]
    disputed: true
    dispute:
      description: "265 is global-including-Tunisia, not Tunisia count — Tunisia slice is ?"
      positions:
        - claim: "265 is the Tunisia bot farm"
          source: fb-cib-israel-2019-05-16
          holder: "Popular retelling (non-specific)"
        - claim: "265 is global across at least 13 countries; Tunisia list membership only"
          source: fb-cib-israel-2019-05-16
          holder: "Meta primary (country list) + Nawaat 2019-05-27 note of scarcity"
      adopted: "Global total retained; Tunisia share = ? until Meta country slice published"
    text_note: "A-grade verbatim; live-verified 2026-08-28 via webfetch body captured; arithmetic 65+161+23+12+4 verified"

  - id: C002
    text:
      en: "17 Jan–12 Mar 2019 — Inkyfada (via DFRLab dataset) counts 11 Tunisia-related Pages of the Archimedes takedown, 494,865 followers (~500k); 359 posts >1M interactions, 36 videos ~8M views; never attacked Nabil Karoui; 5 shared Nessma TV / Khalil Tounes"
    grade: reported
    sources: [inkyfada-facebook-israel-2019-06-03]
    entities: [archimedes-group, nabil-karoui]
    sections: [S02]
    disputed: false
    text_note: "C — single outlet via DFRLab dataset; Inkyfada body live-verified 2026-08-28"

  - id: C003
    text:
      en: "15 May–15 Jul 2019 — ATIDE/DRI study sample: unaffiliated entertainment/satirical Pages produced 38.5% of political messages; flag clusters sharing similar content within time windows as 'page network'"
    grade: documented
    sources: [dri-atide-tunisia-social-media-2019-09-11]
    entities: [atide, dri-democracy-reporting]
    sections: [S02]
    disputed: false
    text_note: "B — institutional research; prevalence not a bot count; PDF live fetch 403 flagged needs-primary-source"

  - id: C004
    text:
      en: "Tunisia slice of Archimedes remains undisclosed by Meta — only Tunisia-sliced enumeration for 2019 is Inkyfada's 11 Pages; contemporary Nawaat (27 May 2019) noted 'published information about Tunisia are quite scarce'"
    grade: documented
    sources: [fb-cib-israel-2019-05-16, inkyfada-facebook-israel-2019-06-03, nawaat-archimedes-tunisia-2019-05-27]
    entities: [archimedes-group]
    sections: [S02]
    disputed: false
    text_note: "Documented negative on enumeration — do not inflate 11 Pages or 161 Pages to Tunisia bots"

