      en: "The quantified estimates rely on four non-additive methods: (a) platform CIB graph detection (assets = Pages/accounts/Groups/events/IG), (b) OSINT Page/content review (Inkyfada 11 Pages, DFRLab WHOIS/SecurityTrails), (c) sample-based prevalence (ATIDE/DRI 38.5% share of messages), (d) hashtag network science (Jones 12k tweets, graph shape + velocity) — totals must not be summed"
