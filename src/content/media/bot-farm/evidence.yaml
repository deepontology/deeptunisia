        - claim: "265 is the Tunisia bot farm"
          source: fb-cib-israel-2019-05-16
          holder: "Popular retelling (non-specific)"
        - claim: "265 is global across at least 13 countries; Tunisia list membership only"
          source: fb-cib-israel-2019-05-16
          holder: "Meta primary (country list) + Nawaat 2019-05-27 note of scarcity"
      adopted: "Global total retained; Tunisia share = ? until Meta country slice published"
    text_note: "A-grade verbatim; live-verified 2026-08-28 via webfetch body captured; arithmetic 65+161+23+12+4 verified"

  - id: C002
