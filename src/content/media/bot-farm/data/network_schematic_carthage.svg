<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
<title id="title">Operation Carthage — 993 assets (redrawn from Meta + DFRLab counts)</title>
<desc id="desc">Redrawn from data, not traced from DFRLab artwork. Source: Meta May 2020 Detailed CIB Report (446 Pages, 182 accounts, 96 Groups, 60 events, 209 IG = 993) and DFRLab Operation Carthage PDF (30 pp, Jun 2020). Target: 10 African countries. Up to 60 collateral accounts are separate and not added to 993.</desc>
<style>
  .bg { fill: #fafaf8; }
  .card { fill: #ffffff; stroke: #222; stroke-width: 1.2; rx: 10; }
  .label { font: 700 13px/1 system-ui, -apple-system, sans-serif; fill: #111; }
  .num { font: 800 28px/1 system-ui, sans-serif; fill: #111; }
  .small { font: 400 11.5px/1.35 system-ui, sans-serif; fill: #333; }
  .muted { font: 400 10.5px/1.35 system-ui, sans-serif; fill: #555; }
  .origin { fill: #111; font: 700 12px system-ui, sans-serif; }
</style>
<rect class="bg" width="860" height="420" rx="12"/>
<!-- Header -->
<text x="24" y="28" class="label">Operation Carthage — origin Tunisia, focus Francophone Sub-Saharan Africa</text>
<text x="24" y="44" class="muted">Sources: Meta May 2020 Detailed CIB Report + DFRLab Atlantic Council PDF (5 Jun 2020). Redrawn from counts — no tracing of DFRLab artwork.</text>
<!-- Central total -->
<g transform="translate(340,76)">
  <rect class="card" x="0" y="0" width="180" height="78"/>
  <text x="90" y="32" text-anchor="middle" class="num">993</text>
  <text x="90" y="52" text-anchor="middle" class="label">total assets removed</text>
  <text x="90" y="66" text-anchor="middle" class="muted">5 Jun 2020 — UReputation</text>
</g>
<!-- Five asset types -->
<g transform="translate(24,176)">
  <rect class="card" x="0" y="0" width="150" height="86"/>
  <text x="75" y="28" text-anchor="middle" class="num">446</text>
  <text x="75" y="46" text-anchor="middle" class="label">Pages</text>
  <text x="75" y="62" text-anchor="middle" class="small">posing as news entities</text>
  <text x="75" y="76" text-anchor="middle" class="muted">not accounts — do not sum as bots</text>
</g>
<g transform="translate(186,176)">
  <rect class="card" x="0" y="0" width="150" height="86"/>
  <text x="75" y="28" text-anchor="middle" class="num">182</text>
  <text x="75" y="46" text-anchor="middle" class="label">FB accounts</text>
  <text x="75" y="62" text-anchor="middle" class="small">fake, posing as locals</text>
  <text x="75" y="76" text-anchor="middle" class="muted">only this is account count</text>
</g>
<g transform="translate(348,176)">
  <rect class="card" x="0" y="0" width="150" height="86"/>
  <text x="75" y="28" text-anchor="middle" class="num">96</text>
  <text x="75" y="46" text-anchor="middle" class="label">Groups</text>
  <text x="75" y="62" text-anchor="middle" class="small">managed as independent</text>
</g>
<g transform="translate(510,176)">
  <rect class="card" x="0" y="0" width="112" height="86"/>
  <text x="56" y="28" text-anchor="middle" class="num">60</text>
  <text x="56" y="46" text-anchor="middle" class="label">events</text>
  <text x="56" y="62" text-anchor="middle" class="small">up to 4,300 interested</text>
</g>
<g transform="translate(634,176)">
  <rect class="card" x="0" y="0" width="150" height="86"/>
  <text x="75" y="28" text-anchor="middle" class="num">209</text>
  <text x="75" y="46" text-anchor="middle" class="label">Instagram</text>
  <text x="75" y="62" text-anchor="middle" class="small">accounts</text>
</g>
<!-- Arrows from total to types -->
<g stroke="#222" stroke-width="1" fill="none" opacity="0.35">
  <line x1="400" y1="154" x2="99" y2="176"/>
  <line x1="420" y1="154" x2="261" y2="176"/>
  <line x1="430" y1="154" x2="423" y2="176"/>
  <line x1="440" y1="154" x2="566" y2="176"/>
  <line x1="450" y1="154" x2="709" y2="176"/>
</g>
<!-- Reach row -->
<g transform="translate(24,280)">
  <text x="0" y="0" class="label">Reach (not unique humans):</text>
  <text x="0" y="16" class="small">~3.8M followed a Page  ·  ~131,900 joined a Group  ·  ~171,500 followed an IG account  ·  ~$331k ad spend (EUR/USD)</text>
  <text x="0" y="32" class="muted">DFRLab: francophone sites some &gt;5 years old (e.g., Revue de l'Afrique May 2014); deceptive audience building (non-political → political, name/admin changes).</text>
</g>
<!-- Target strip -->
<g transform="translate(24,320)">
  <text x="0" y="0" class="label">Targeted — 10 countries (DFRLab p.19):</text>
  <g transform="translate(0,10)">
    <!-- simple flag-like pills -->
    <g class="small">
      <rect x="0" y="0" width="56" height="22" rx="11" fill="#fff" stroke="#222"/><text x="28" y="15" text-anchor="middle">Tunisia</text>
      <rect x="62" y="0" width="48" height="22" rx="11" fill="#fff" stroke="#222"/><text x="86" y="15" text-anchor="middle">Chad</text>
      <rect x="116" y="0" width="74" height="22" rx="11" fill="#fff" stroke="#222"/><text x="153" y="15" text-anchor="middle">Comoros</text>
      <rect x="196" y="0" width="94" height="22" rx="11" fill="#fff" stroke="#222"/><text x="243" y="15" text-anchor="middle">Congo-Brazz.</text>
      <rect x="296" y="0" width="82" height="22" rx="11" fill="#fff" stroke="#222"/><text x="337" y="15" text-anchor="middle">Côte d'Ivoire</text>
      <rect x="384" y="0" width="60" height="22" rx="11" fill="#fff" stroke="#222"/><text x="414" y="15" text-anchor="middle">Gambia</text>
      <rect x="450" y="0" width="54" height="22" rx="11" fill="#fff" stroke="#222"/><text x="477" y="15" text-anchor="middle">Guinea</text>
      <rect x="510" y="0" width="46" height="22" rx="11" fill="#fff" stroke="#222"/><text x="533" y="15" text-anchor="middle">Mali</text>
      <rect x="562" y="0" width="48" height="22" rx="11" fill="#fff" stroke="#222"/><text x="586" y="15" text-anchor="middle">Niger</text>
      <rect x="616" y="0" width="64" height="22" rx="11" fill="#fff" stroke="#222"/><text x="648" y="15" text-anchor="middle">Senegal</text>
    </g>
  </g>
</g>
<!-- Footer -->
<text x="24" y="386" class="muted">Beneficiaries (election windows): Nabil Karoui (Tunisia 2019), Faure Gnassingbé (Togo Feb 2020), H. K. Bédié (CIV Oct 2020), Azali Assoumani (Comoros Mar 2019).</text>
<text x="24" y="402" class="muted">Collateral (29–30 May 2020): up to 60 artist/journalist accounts deactivated — separate from 993, dispute open. Do not sum 265 (2019 Archimedes global) with 993 (2020 Carthage).</text>
</svg>
