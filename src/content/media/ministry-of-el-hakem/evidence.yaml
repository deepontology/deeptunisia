- id: C095
  text:
    en: The lawyer Mehdi Zagrouba was arrested in a second raid on the same building. The ICJ page says
      he reportedly showed physical signs of torture (OHCHR, 31 May 2024). His lawyers say he lost consciousness.
      The Interior Ministry says the order concerned a physical and verbal assault on two officers and
      denies torture (Reuters, 16 May 2024).
  grade: reported
  sources:
