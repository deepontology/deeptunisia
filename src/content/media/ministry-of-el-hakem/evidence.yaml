- id: C021
  text:
    en: In 1991, in the Barraket Essahel affair, 244 military men were arrested over an alleged coup plot.
      The victims call the charge fabricated. Victims and Human Rights Watch (3 May 2012) say many were
      tortured in the Interior Ministry basements. Abdallah Kallel was interior minister at the time.
  grade: reported
