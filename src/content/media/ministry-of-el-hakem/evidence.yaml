- id: C008
  text:
    en: On 4 June 2002 six plainclothes officers arrested Zouhair Yahyaoui in the internet café in Ben
      Arous where he worked (UN WGAD Opinion 15/2003). On 20 June he was sentenced to 28 months, cut to
      two years on appeal on 10 July 2002, on a charge of spreading false news (CPJ; RSF).
  grade: reported
