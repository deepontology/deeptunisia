  - S01
  disputed: false
  text_note: No source mentions a stamp; the film's red stamp is not used here.
- id: C006
  text:
    en: Yahyaoui was suspended on 14 July 2001 and removed from the bench by the disciplinary council
      on 29 December 2001. His salary was cut before that. By his own account he was then banned from
      travel for ten years.
  grade: reported
  sources:
