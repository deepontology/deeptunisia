- id: C004
  text:
    en: On 6 July 2001 the judge Mokhtar Yahyaoui sent an open letter to President Ben Ali saying the
      judiciary was no longer independent and that judges handed down rulings dictated by the political
      power, under fear, suspicion and denunciation.
