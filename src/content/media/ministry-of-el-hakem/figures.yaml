- id: compare
  kind: compare
  title: Ben Ali's system set beside today's
  caption: The film's own comparison, in one table. Each cell carries its evidence. That the two columns
    resemble each other is a reading, set out in the panel above; the cells are what the sources say.
  columns:
  - Ben Ali, 1987 to 2010
  - Today, 2021 to 2026
  rows:
  - label: Ruling party
    cells:
    - The RCD claimed more than two million members [C019] until a court dissolved it in March 2011 [C034].
    - None. Candidates ran as individuals in December 2022 [C078], with a first-round turnout of 8.8 percent,
      later given as 11.22 percent [C079].
  - label: Presidential security
    cells:
    - Attached to the presidency by Decree 88-250 [C016]. Seriati led it from 2001 to 2011 [C015].
    - Khaled Yahyaoui has directed it since 2019 [C072], and by one report took command of the ministry
      on 25 July 2021 [C065].
  - label: Secretary of state for security
    cells:
    - Mohamed Ali Ganzoui, 1995 to 2002 [C018].
    - Post restored in May 2024 for Sofiane Bessadok [C075].
  - label: Head of the national police
    cells:
    - Seriati from 1991 [C014]; Bennour in 2005 and again in 2011 [C044].
    - Saidane since 2022 [C070].
  - label: Military justice
    cells:
    - 279 tried and 265 convicted in 1992 [C022].
    - At least ten civilians before military courts in the three months after 25 July 2021 [C098].
  - label: The false-news charge
    cells:
    - Used against Zouhair Yahyaoui in 2002 [C008].
    - Article 24 of Decree-Law 54 from September 2022 [C080], amended on 30 September 2026 [C118].
  - label: Presidential immunity
    cells:
    - Article 41, added by the 2002 referendum [C023].
    - Article 110 of the 2022 constitution [C123].
