<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Resolve theme AND language before first paint. Without this the app renders
			// dark and left-to-right, then flips — the single most noticeable defect a
			// themed, bidirectional site can have.
			//
			// A theme is one complete look (mode + character): data-theme carries the
			// mode, data-palette the character. Must mirror migrateLegacy()/isThemeId()
			// in theme.svelte.ts — this runs before hydration and cannot import modules.
			try {
				var t = localStorage.getItem('deeptunisia:theme');
				var tint = localStorage.getItem('deeptunisia:appearance');
				var sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
				var ids = ['paper', 'porcelain', 'daylight', 'midnight', 'ember', 'eclipse'];
				var modes = {
					paper: 'light',
					porcelain: 'light',
					daylight: 'light',
					midnight: 'dark',
					ember: 'dark',
					eclipse: 'dark'
				};
				var pick = null;
				if (ids.indexOf(t) >= 0) {
					pick = t;
				} else if (t === 'light' || t === 'dark' || tint) {
					/* Pre-unification pair: map it once to the closest new theme. */
					var m = t === 'dark' ? 'dark' : 'light';
					pick =
						tint === 'slate'
							? m === 'dark' ? 'midnight' : 'porcelain'
							: tint === 'graphite'
								? m === 'dark' ? 'eclipse' : 'porcelain'
								: tint === 'sepia'
									? m === 'dark' ? 'ember' : 'paper'
									: m === 'dark' ? 'ember' : 'paper';
					try {
						localStorage.setItem('deeptunisia:theme', pick);
					} catch (e2) {}
				}
				if (tint) {
					try {
						localStorage.removeItem('deeptunisia:appearance');
					} catch (e3) {}
				}
				var mode = pick ? modes[pick] : sysDark ? 'dark' : 'light';
				document.documentElement.dataset.theme = mode;
				document.documentElement.dataset.palette = pick || (sysDark ? 'midnight' : 'paper');
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
				document.documentElement.dataset.palette = 'midnight';
			}
			try {
				var a = localStorage.getItem('deeptunisia:accent');
				if (a) document.documentElement.style.setProperty('--accent-hue', a);
			} catch (e) {
				/* accent stays ochre */
			}
			try {
				var loc = localStorage.getItem('deeptunisia:locale');
				if (loc !== 'ar' && loc !== 'fr' && loc !== 'en') {
					/* No stored choice: follow the system, so a first-time reader is
					   greeted in their own language. The landing writes this same
					   key, so a choice made there carries straight through. */
					var sys = (navigator.language || '').toLowerCase();
					loc = sys.indexOf('ar') === 0 ? 'ar' : sys.indexOf('fr') === 0 ? 'fr' : 'en';
				}
				document.documentElement.setAttribute('lang', loc);
				document.documentElement.setAttribute('dir', loc === 'ar' ? 'rtl' : 'ltr');
			} catch (e) {
				/* language stays as authored */
			}
			// Boot gate: hide the instrument until we know whether the
			// full-screen boot sequence should run. Without this the
			// server-rendered UI (booted=true) paints for one frame before
			// the client's onMount flips it to false and the boot overlay
			// appears — the flash testers reported.
			try {
				var _b = sessionStorage.getItem('deeptunisia:booted');
				document.documentElement.dataset.boot = _b === '1' ? 'ready' : 'pending';
			} catch (e) {
				document.documentElement.dataset.boot = 'pending';
			}
		</script>
		<style>
			html[data-boot='pending'] .os {
				visibility: hidden;
			}
			#static-boot {
				position: fixed;
				inset: 0;
				z-index: 500;
				display: none;
				place-items: center;
				background: var(--surface-base);
			}
			html[data-boot='pending'] #static-boot {
				display: grid;
			}
			#static-boot .core {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: var(--s-4);
				width: min(420px, calc(100vw - 48px));
			}
			#static-boot .label {
				font-family: var(--font-mono);
				font-size: var(--t-2xs);
				letter-spacing: 0.28em;
				text-transform: uppercase;
				color: var(--text-faint);
			}
			#static-boot .figure {
				display: flex;
				align-items: baseline;
				gap: var(--s-4);
				width: 100%;
			}
			#static-boot .count {
				font-size: var(--t-3xl);
				font-weight: 400;
				letter-spacing: 0.16em;
				color: var(--text-primary);
				font-variant-numeric: tabular-nums;
			}
			#static-boot .unit {
				font-size: var(--t-xs);
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: var(--text-faint);
			}
			#static-boot .pulse {
				margin-inline-start: auto;
				display: grid;
				place-items: center;
			}
			#static-boot .ring2 {
				transform-origin: center;
				animation: sonar 1.9s var(--ease-out) infinite;
			}
			@keyframes sonar {
				0% { transform: scale(0.45); stroke-opacity: 0.9; }
				100% { transform: scale(1.3); stroke-opacity: 0; }
			}
			#static-boot .rule {
				position: relative;
				width: 100%;
				height: 1px;
				background: var(--border-default);
				overflow: hidden;
			}
			#static-boot .fill {
				position: absolute;
				inset: 0;
				background: var(--text-primary);
				transform-origin: left center;
			}
			#static-boot .wordmark {
				display: flex;
				flex-direction: column;
				gap: 1px;
				margin-top: var(--s-5);
			}
			#static-boot .wordmark span {
				font-size: var(--t-sm);
				color: var(--text-muted);
				letter-spacing: var(--track-tight);
			}
			#static-boot .wordmark b {
				font-weight: 620;
				color: var(--text-primary);
			}
			#static-boot .wordmark .sub {
				font-family: var(--font-mono);
				font-size: var(--t-2xs);
				letter-spacing: 0.14em;
				color: var(--text-faint);
			}
		</style>
		<meta
			name="description"
			content="A source-backed interactive atlas of political, military, security and economic power in Tunisia, 1956-2026."
		/>
		<!-- Self-hosted, and it must stay that way. Loading these from Google told a
		     third party every reader's IP, User-Agent and — through Referer — which
		     page they were reading: opening a named official's entry disclosed that
		     you had. See docs/anonymity-audit.md. Never reintroduce a remote font,
		     icon, map or analytics host here. -->
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<div id="static-boot" class="boot" aria-hidden="true"><div class="core"><span class="label">Reading sources</span><div class="figure"><span class="count mono">0</span><span class="unit mono">records</span><span class="pulse" aria-hidden="true"><svg viewBox="0 0 28 28" width="26" height="26"><circle cx="14" cy="14" r="10" fill="none" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.55"/><circle class="ring2" cx="14" cy="14" r="10" fill="none" stroke="var(--accent)" stroke-width="1"/><circle cx="14" cy="14" r="2.6" fill="var(--accent)"/></svg></span></div><div class="rule"><span class="fill" style="transform:scaleX(0)"></span></div><div class="wordmark"><span>Deep<b>Tunisia</b></span><span class="sub">Power, institutions and evidence · 1956–2026</span></div></div></div>
	</body>
</html>
