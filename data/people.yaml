- id: rachid-ammar
  name_en: Rachid Ammar
  name_fr: Rachid Ammar
  name_ar: رشيد عمار
  aliases: [عمار]
  layers: [security, political]
  tagline: The general who did not fire, then held more military power than anyone since 1956
  tagline_fr: >-
    Le général qui n'a pas tiré, puis a détenu plus de pouvoir militaire que quiconque
    depuis 1956
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    الجنرال الذي لم يُطلق النار، ثم حاز سلطة عسكرية أكبر من أي أحد منذ 1956
  tagline_ar_by: model-reviewed
  trajectory: [Land Army, Armed Forces Chief of Staff, Retirement]
  trajectory_fr: [Armée de terre, 'Chef d''état-major des armées', Retraite]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [الجيش البري, رئيس أركان القوات المسلحة, تقاعد]
  trajectory_ar_by: model-reviewed
  summary: >-
    Already Land Army chief before the revolution. In April 2011 the dormant
    tri-service Chief of Staff post was revived for him while he kept the Land
    Army, and Carnegie's research describes him acquiring near-hegemony over
    military decisions, with one former senior officer saying he effectively became
    the real defence minister. He retired in June 2013 and the joint post was not
    maintained after him.
  summary_fr: >-
    Déjà chef d'état-major de l'armée de terre avant la révolution. En avril 2011, le poste
    interarmées de chef d'état-major, en sommeil, a été réactivé pour lui tandis qu'il
    gardait l'armée de terre, et les travaux de Carnegie le décrivent acquérant une
    quasi-hégémonie sur les décisions militaires, un ancien haut officier affirmant qu'il
    était devenu en pratique le vrai ministre de la Défense. Parti à la retraite en juin
    2013, le poste interarmées n'a pas été maintenu après lui.
  summary_fr_by: model-reviewed
  summary_ar: >-
    كان رئيسًا لأركان الجيش البري قبل الثورة. في أفريل 2011 أُحيي له منصب رئيس الأركان
    المشترك الثلاثي الذي كان معطّلًا بينما أبقى على الجيش البري، وتصفه أبحاث كارنيغي بأنه
    بلغ شبه هيمنة على القرارات العسكرية، إذ قال أحد الضباط الكبار السابقين إنه صار فعليًا
    وزير الدفاع الحقيقي. تقاعد في جوان 2013 ولم يُحافظ على المنصب المشترك من بعده.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [carnegie-quiet-revolution, leaders-ammar-2011, babnet-ammar-retirement, lemonde-ammar-2011]

