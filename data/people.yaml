    as Foreign Minister (1962-1964). From an aristocratic Tunis family.
  summary_fr: >-
    Diplomate éminent, premier Africain à présider l'Assemblée générale des Nations unies en
    1961. Ambassadeur de Tunisie aux États-Unis et auprès de l'ONU (1956-1962), élu
    président de l'AGNU, il est ensuite rentré à Tunis comme ministre des Affaires
    étrangères (1962-1964). Issu d'une famille aristocratique tunisoise.
  summary_fr_by: model-reviewed
  summary_ar: >-
