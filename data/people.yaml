    transitionnelle (RTJT), coalition de douze associations accompagnant le processus
    vérité-dignité, et a interpellé à plusieurs reprises la présidence et le Parlement sur
    sa mise en œuvre. Les versions antérieures de cette fiche le décrivaient comme fondateur
    du magazine Leaders ; cette confusion est réfutée — le site a été créé par Taoufik
    Habaieb en octobre 2008 (voir le journal de recherche, lot 5).
  summary_fr_by: model-reviewed
  summary_ar: >-
    محمد كمال الغربي، باحث في العلوم السياسية، يترأس الشبكة التونسية للعدالة الانتقالية، وهي
    ائتلاف من اثنتي عشرة جمعية ترافق مسار الحقيقة والكرامة، وظل يضغط على الرئاسة والبرلمان
    لتنفيذه. كانت نسخ سابقة من هذه البطاقة تصفه كمؤسس لمجلة ليدرز؛ وهذه الخلط مرفوض —
    فالموقع أنشأه توفيق حبيّب في أكتوبر 2008 (انظر سجل البحث، الدفعة 5).
  summary_ar_by: model-reviewed
  confidence: C
