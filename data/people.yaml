    Ministre de l'Équipement et de l'Habitat depuis mars 2025 ; chargé aussi
    de l'Industrie, des Mines et de l'Énergie
  tagline_fr_by: model-reviewed
  summary: >-
    Civil engineer (ENIT 1989; mastère ponts et chaussées, Paris 1990); career
    in the Equipment ministry's regional directorates (Sousse, Siliana, Mahdia,
    Nabeul) then directeur général des ponts et chaussées from 2014. Appointed
    Minister of Equipment and Housing on 20 March 2025, replacing Sara
    Zaafarani on her elevation to Head of Government; charged in April 2026
    with the interim management of Industry, Mines and Energy after that
    ministry's dismissal.
