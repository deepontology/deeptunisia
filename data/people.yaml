  summary: >-
    Wife of Kais Saied. The Mondafrigue investigation describes her family
    as forming one of two rival clans inside the presidential inner circle,
    competing with the president's brother Naoufel Saied over the
    succession, key nominations, and the "penal settlement" extortion
    system. Her sister Atika Chebil is the clan's public face. No formal
    office is held; influence is exercised through kinship and proximity to
    the president.
  summary_fr: >-
    Épouse de Kais Saïed. L'enquête de Mondafrigue décrit sa famille comme formant l'un des
    deux clans rivaux au sein du cercle intime présidentiel, en concurrence avec le frère du
    président, Naoufel Saïed, sur la succession, les nominations clés et le système
    d'extorsion du « règlement pénal ». Sa sœur Atika Chebil est le visage public du clan.
    Aucune fonction officielle n'est détenue ; l'influence s'exerce par la parenté et la
    proximité avec le président.
  summary_fr_by: model-reviewed
  summary_ar: >-
    زوجة قيس سعيّد. يصف تحقيق موندافريك عائلتها بأنها تشكّل أحد العشيرتين المتنافستين داخل
    الدائرة الرئاسية الضيقة، في صراع مع شقيق الرئيس نوفل سعيّد حول الخلافة والتعيينات
    الحساسة ونظام ابتزاز «التسوية الجزائية». أختها عتيقة شبيل هي الوجه العام للعشيرة. لا
    منصب رسمي؛ النفوذ يمارس عبر القرابة والقرب من الرئيس.
