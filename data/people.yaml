  trajectory_ar_by: model-reviewed
  summary: >-
    A magistrate by training, formerly commander of the National Guard. Served as
    DGSN twice: from 5 June 2006 to ~2008 late in the Ben Ali era, and again from
    2 March 2011 to ~2012 under the post-revolution Interior Ministry — one of the
    few senior security figures to serve on both sides of the rupture. A March 2011
    Tunisoscope report on the second appointment has been persistently misdated as
    2018, which once inflated the apparent count of chiefs in 2011-2012.
  summary_fr: >-
    Magistrat de formation, ancien commandant de la Garde nationale. DGSN à deux reprises :
    du 5 juin 2006 à ~2008, tard dans l'ère Ben Ali, puis du 2 mars 2011 à ~2012 sous le
    ministère de l'Intérieur post-révolution — l'une des rares figures sécuritaires de haut
    rang à avoir servi des deux côtés de la rupture. Un article de Tuniscope de mars 2011
    sur la seconde nomination a été obstinément antidaté en 2018, ce qui a un temps gonflé
    le nombre apparent de chefs en 2011-2012.
  summary_fr_by: model-reviewed
  summary_ar: >-
    قاضٍ بالتكوين، وقائد سابق للحرس الوطني. تولّى المديرية العامة للأمن الوطني مرتين: من 5
    جوان 2006 إلى نحو 2008 في أواخر عهد بن علي، ومرة أخرى من 2 مارس 2011 إلى نحو 2012 في
    وزارة الداخلية ما بعد الثورة — من الشخصيات الأمنية العليا القليلة التي خدمت على جانبي
    القطيعة. ظل تقرير تونيسكوب الصادر في مارس 2011 حول التعيين الثاني يُؤرّخ خطأً بسنة 2018،
    مما ضخّم لوقت ما العدد الظاهر للرؤساء في 2011-2012.
  summary_ar_by: model-reviewed
  confidence: B
  sources: [tuniscope-bennour-2018, wikipedia-bennour-dgsn-fr, webdo-bennour-2011]

