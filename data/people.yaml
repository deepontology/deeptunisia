    depuis 2014. Nommé ministre de l'Équipement et de l'Habitat le 20 mars
    2025, remplaçant Sara Zaafarani élevée au poste de chef du gouvernement ;
    chargé en avril 2026 de l'intérim de l'Industrie, des Mines et de l'Énergie.
