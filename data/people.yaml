    nationale constituante pour Sidi Bouzid, abattu devant chez lui à l'Ariana le 25 juillet
    2013 — l'anniversaire de la proclamation de la république, et la date à laquelle un
    président ultérieur suspendrait le Parlement. Son meurtre a interrompu le processus
    constituant et imposé le dialogue national. Huit condamnations à mort ont été prononcées
    en première instance en février 2025, révisées en appel en février 2026.
  summary_fr_by: model-reviewed
  summary_ar: >-
