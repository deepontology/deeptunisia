    2011، وقادها حتى وفاته. عضو في المجلس الوطني التأسيسي عن سيدي بوزيد، أُطلق عليه النار
    أمام منزله بأريانة في 25 جويلية 2013 — ذكرى إعلان الجمهورية، والتاريخ الذي علّق فيه رئيس
    لاحق عمل البرلمان. أوقف اغتياله مسار كتابة الدستور وفرض الحوار الوطني. صدرت ثماني أحكام
