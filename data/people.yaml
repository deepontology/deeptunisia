  summary: >-
    Mohamed Kamel Gharbi, a political scientist, heads the Réseau tunisien de
    la justice transitionnelle (RTJT), a coalition of twelve associations
    accompanying the truth-and-dignity process, and has repeatedly pressed the
    presidency and parliament on its implementation. Earlier versions of this
    card described him as founder of the magazine Leaders; that conflation is
    refuted — the site was created by Taoufik Habaieb in October 2008 (see the
    research log, batch 5).
