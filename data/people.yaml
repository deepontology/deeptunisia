  trajectory_fr_by: model-reviewed
  trajectory_ar: [وزارة الخارجية, وزارة الدفاع]
  trajectory_ar_by: model-reviewed
  summary: >-
    Career diplomat — foreign ministry since October 1994, Europe directorate
    (including adviser in Bucharest), head of the Europe directorate-general,
    international-organisations directorate from 2014, ambassador to Jordan
    from 2017 with the grade of minister delegate — appointed defence minister
    by decree no. 2024-465 of 25 August 2024, succeeding Imed Memmich. Still
    in post as of July 2026. Mondafrigue (August 2026) notes his appointment as
    a non-military figure to head the defence portfolio positions a political
    loyalist rather than a professional soldier at the head of the ministry,
    while the military institution retains operational autonomy under its own
    chain of command; the May 2025 defence ministry statement affirming
    military neutrality was issued under his name.
  summary_fr: >-
    Diplomate de carrière — ministère des Affaires étrangères depuis octobre 1994, direction
    de l'Europe (dont un poste de conseiller à Bucarest), chef de la direction générale de
    l'Europe, direction des organisations internationales à partir de 2014, ambassadeur en
    Jordanie depuis 2017 avec rang de ministre délégué — nommé ministre de la Défense par le
    décret n° 2024-465 du 25 août 2024, succédant à Imed Memmich. Toujours en poste en
    juillet 2026. Mondafrigue (août 2026) note que sa nomination, un civil à la tête du
    portefeuille de la Défense, place un loyaliste politique plutôt qu'un soldat de métier à
    la tête du ministère, tandis que l'institution militaire conserve son autonomie
    opérationnelle sous sa propre chaîne de commandement ; la déclaration de mai 2025 du
    ministère de la Défense affirmant la neutralité militaire a été publiée sous son nom.
  summary_fr_by: model-reviewed
  summary_ar: >-
    دبلوماسي محترف — في الخارجية منذ أكتوبر 1994، ومديرية أوروبا (منها مستشارًا في بوخارست)،
    ثم رئيس الإدارة العامة لأوروبا، ومديرية المنظمات الدولية منذ 2014، وسفيرًا في الأردن منذ
    2017 بدرجة وزير مفوّض — عُيّن وزيرًا للدفاع بموجب الأمر عدد 2024-465 المؤرخ في 25 أوت
    2024 خلفًا لعماد مميش. ما زال في منصبه إلى جويلية 2026. تلاحظ موندافريك (أوت 2026) أن
    تعيينه، وهو شخصية غير عسكرية على رأس حقيبة الدفاع، يضع مواليًا سياسيًا لا جنديًا محترفًا
    على رأس الوزارة، بينما تحتفظ المؤسسة العسكرية باستقلاليتها العملياتية تحت سلسلة قيادتها
    الخاصة؛ وبيان وزارة الدفاع الصادر في ماي 2025 والمؤكد لحياد المؤسسة العسكرية صدر باسمه.
