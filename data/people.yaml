# ===========================================================================
# THE CONSPIRACY CASE DEFENDANTS
#
# The mass trial of 2025-2026 is the central legal event of the current era and
# this dataset recorded it with two named actors. These are the rest of the
# principals. Every one of them is here as a person with a career, not as a
# defendant: what makes the case analytically interesting is that the accused
# span the secular opposition, the Ennahda leadership, the Bourguibist centre
# and the business elite, which is a coalition that never existed in politics.
#
# The charges are recorded. Their truth is not asserted, in either direction.
# ===========================================================================

