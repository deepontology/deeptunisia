  tagline_fr: >-
    Le frère du président ; avocat sans fonction officielle et à l'influence rapportée
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    شقيق الرئيس؛ محامٍ بلا منصب رسمي ونفوذ مُبلَّغ عنه
  tagline_ar_by: model-reviewed
  trajectory: [Law faculty, 2019 campaign, Informal presidential circle]
  trajectory_fr: [Faculté de droit, Campagne de 2019, Cercle présidentiel informel]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [كلية الحقوق, حملة 2019, الدائرة الرئاسية غير الرسمية]
  trajectory_ar_by: model-reviewed
  summary: >-
    Law professor and brother of Kais Saied. Managed the 2019 presidential
    campaign and, according to reporting, helped assemble the incoming
    presidential team. He has held no formal state office, which is precisely
    what makes him difficult to map: his reported role is exercised through
    kinship and public commentary rather than through any post that appears in
    an appointment decree. He has published positions on constitutional
    questions and endorsed the measures of 25 July 2021.
  summary_fr: >-
    Professeur de droit et frère de Kais Saïed. A dirigé la campagne présidentielle de 2019
    et, selon la presse, contribué à constituer l'équipe présidentielle entrante. Il n'a
    occupé aucune fonction officielle, ce qui le rend précisément difficile à cartographier
    : son rôle rapporté s'exerce par la parenté et le commentaire public, non par un poste
    qui apparaîtrait dans un décret de nomination. Il a publié des positions sur les
    questions constitutionnelles et approuvé les mesures du 25 juillet 2021.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أستاذ قانون وشقيق قيس سعيّد. أدار الحملة الرئاسية لسنة 2019 وساعد بحسب التقارير في تشكيل
    الفريق الرئاسي الجديد. لا يشغل أي منصب رسمي، وهذا هو بالضبط ما يصعّب رسم خريطة نفوذه:
    دوره المنقول يمارس عبر القرابة والتعليق العلني لا عبر منصب يظهر في أمر تعيين. نشر مواقف
    من المسائل الدستورية وأيّد إجراءات 25 جويلية 2021.
  summary_ar_by: model-reviewed
  confidence: B
  notes:
    - >-
      Reporting links the intellectual outlook of the circle around the
      presidency to the Iranian theologian Ali Shariati (d. 1977). That is an
      ideological lineage and must not be recorded as a relationship with the
      Iranian state; the dataset holds no evidence of any such tie, and
      collapsing the two would be exactly the error this project's basis
      grading exists to prevent.
    - >-
      Allegations reported by Noonpost, attributed to the Tunisian Business
      Network Abroad, concern the use of state institutions to pressure
      businessmen. Not independently corroborated; recorded as an open question
      rather than as a claim.
    - >-
      August 2026: Mondafrigue identifies Naoufel as heading one of two rival
      clans inside the presidential inner circle, competing with the Chebil
      family (the president's wife and her sister Atika) over the succession,
      the "penal settlement" extortion system, and key nominations. He backs
      Justice Minister Leila Jaffel for prime minister. Also reportedly
      associated with the "Abou Khater" real estate project at Lac de Tunis
      (Emirati investor). This note adds context to the existing
      reported-influence relationship; the clan dynamics are convergence-reported
      from judicial, business and diplomatic sources, not primary records.
  notes_fr:
    - >-
      La presse relie l'orientation intellectuelle du cercle autour de la présidence au
      théologien iranien Ali Shariati (mort en 1977). C'est une filiation idéologique, qui
      ne doit pas être consignée comme une relation avec l'État iranien ; ce jeu de données
      ne détient aucune preuve d'un tel lien, et les confondre serait exactement l'erreur
      que la gradation des fondements de ce projet existe pour prévenir.
    - >-
      Des allégations rapportées par Noonpost, attribuées au Tunisian Business Network
      Abroad, concernent l'usage d'institutions étatiques pour faire pression sur des hommes
      d'affaires. Non corroborées de manière indépendante ; consignées comme question
      ouverte plutôt que comme affirmation.
    - >-
      Août 2026 : Mondafrigue identifie Naoufel comme chef de l'un des deux clans rivaux au
      sein du cercle intime présidentiel, en concurrence avec la famille Chebil (l'épouse du
      président et sa sœur Atika) sur la succession, le système d'extorsion du « règlement
      pénal » et les nominations clés. Il soutient la ministre de la Justice Leila Jaffel
      pour le poste de chef du gouvernement. Également associé selon les informations au
      projet immobilier « Abou Khater » au lac de Tunis (investisseur émirati). Cette note
      contextualise la relation d'influence rapportée existante ; les dynamiques claniques
      sont rapportées par convergence de sources judiciaires, économiques et diplomatiques,
      non par des documents primaires.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      تربط التقارير التوجه الفكري للدائرة المحيطة بالرئاسة باللاهوتي الإيراني علي شريعتي
      (توفي 1977). هذا نسب فكري ولا يجوز تسجيله كعلاقة مع الدولة الإيرانية؛ لا تحمل هذه
      البيانات أي دليل على وجود مثل هذه الصلة، ودمج الأمرين سيكون بالضبط الخطأ الذي وُجدت
      درجات إسناد هذا المشروع لمنعه.
    - >-
      مزاعم نشرها موقع نون بوست منسوبة إلى شبكة رجال الأعمال التونسيين بالخارج، وتتعلق
      باستخدام مؤسسات الدولة للضغط على رجال الأعمال. لم تُدعَّم بشكل مستقل؛ تُسجَّل كسؤال
      مفتوح لا كادعاء.
    - >-
      أوت 2026: تحدد موندافريك نوفل كرئيس لأحد العشيرتين المتنافستين داخل الدائرة الرئاسية
      الضيقة، في صراع مع عائلة شبيل (زوجة الرئيس وأختها عتيقة) حول الخلافة ونظام ابتزاز
      «التسوية الجزائية» والتعيينات الحساسة. يدعم وزيرة العدل ليلى جفال لمنصب رئيس الحكومة.
      ويُرجَّح أيضًا ارتباطه بمشروع «أبو خاطر» العقاري في بحيرة تونس (مستثمر إماراتي). تضيف
      هذه الملاحظة سياقًا لعلاقة النفوذ المنقول القائمة؛ والحراك العشائري منقول بتقارب مصادر
      قضائية واقتصادية ودبلوماسية، لا من وثائق أولية.
  notes_ar_by: model-reviewed
