  summary: >-
    Lawyer, tried before the State Security Court in 1968, founder in 1983 of the
    party that became the PDP and its secretary-general until 2006. Briefly
    minister of regional development in the first post-Ben Ali cabinet in early
    2011. Announced the creation of the National Salvation Front in April 2022 to
    coordinate opposition to the measures of 25 July 2021, and was arrested in
    December 2025 following an appeal ruling in the conspiracy case. The 1968 and
    2025 proceedings against the same man, under three different regimes, are the
    single most compact illustration of this project's question.
  summary_fr: >-
    Avocat, jugé devant la Cour de sûreté de l'État en 1968, fondateur en 1983 du parti
    devenu le PDP et son secrétaire général jusqu'en 2006. Brièvement ministre du
    Développement régional dans le premier gouvernement post-Ben Ali au début de 2011. A
    annoncé la création du Front de Salut national en avril 2022 pour coordonner
    l'opposition aux mesures du 25 juillet 2021, et a été arrêté en décembre 2025 après un
    arrêt d'appel dans le dossier du complot. Les procédures de 1968 et de 2025 contre le
    même homme, sous trois régimes différents, sont l'illustration la plus compacte de la
    question de ce projet.
  summary_fr_by: model-reviewed
  summary_ar: >-
    محامٍ حوكم أمام محكمة أمن الدولة سنة 1968، ومؤسس سنة 1983 للحزب الذي صار الحزب
    الديمقراطي التقدمي وأمينه العام حتى 2006. وزير التنمية الجهوية لفترة وجيزة في أول حكومة
    بعد بن علي مطلع 2011. أعلن في أفريل 2022 عن تأسيس جبهة الإنقاذ الوطني لتنسيق معارضة
    إجراءات 25 جويلية 2021، وأُوقف في ديسمبر 2025 بعد حكم استئنافي في قضية المؤامرة.
    الإجراءان القضائيان ضد الرجل نفسه سنة 1968 وسنة 2025، تحت ثلاثة أنظمة مختلفة، هما أوجز
    تمثيل لسؤال هذا المشروع.
  summary_ar_by: model-reviewed
