    بودن. شغلت سابقًا وزارة التجهيز والإسكان (2021-2025). وفق تحليل موندافريك لفراغ الخلافة
    الدستوري (الفصل 109)، فهي في خط الخلافة بصفتها رئيسة الحكومة — مع أن المقال يلاحظ أن
    الآلية غير مجرّبة وأن توازنات القوى الحقيقية قد تعلو على النظام الدستوري الرسمي.
