    of equipment and housing (2021-2025). Per Mondafrigue's analysis of the
    constitutional succession vacuum (Article 109), she sits in the succession
    line as head of government — though the article notes the mechanism is
    untested and the real power dynamics may override formal constitutional
    order.
  summary_fr: >-
