    institutionnelle du portefeuille avant le ministère. Dirigeant de l'UGET attiré dans
    l'État sous Bourguiba, puis délégué, gouverneur (Tunis-Cap Bon, Sfax, Grand Tunis) et
    ambassadeur de longue durée en Arabie saoudite, où il devint doyen du corps diplomatique
