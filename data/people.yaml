    Ancien dirigeant syndical de l'UGTT devenu l'architecte de l'expérience socialiste
    tunisienne (1961-1969). A tenu simultanément le Plan, les Finances, l'Économie,
    l'Agriculture et l'Éducation — surnommé le « super-ministre ». Après la fin de
    l'expérience socialiste décidée par Bourguiba, jugé pour haute trahison, condamné à 10
    ans, évadé de prison en 1973, en exil jusqu'en 2011.
  summary_fr_by: model-reviewed
