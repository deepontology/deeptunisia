  summary: >-
    Tunisian lawyer who served as president of the Ordre national des avocats
    de Tunisie (ONAT) from July 2019 to September 2022. Now serves as
    President of the Assembly (head of the legislature). Per Mondafrigue's
    analysis of the constitutional succession vacuum (Article 109), he sits
    in the succession line as head of the Assembly — the first in line if
    the president is incapacitated, though the article notes the mechanism
    is untested and the real power dynamics may override formal constitutional
    order.
  summary_fr: >-
    Avocat tunisien, président de l'ordre national des avocats de Tunisie (ONAT) de juillet
    2019 à septembre 2022. Aujourd'hui président de l'Assemblée (chef de l'organe
    législatif). Selon l'analyse de Mondafrigue sur le vide de succession constitutionnelle
    (article 109), il figure dans la ligne de succession en tant que chef de l'Assemblée —
    premier dans l'ordre si le président est empêché, l'article notant toutefois que le
    mécanisme n'a jamais été éprouvé et que les rapports de force réels peuvent primer sur
    l'ordre constitutionnel formel.
  summary_fr_by: model-reviewed
  summary_ar: >-
    محامٍ تونسي ترأس الهيئة الوطنية للمحامين بتونس من جويلية 2019 إلى سبتمبر 2022. يشغل
    اليوم منصب رئيس مجلس نواب الشعب (رئيس السلطة التشريعية). وفق تحليل موندافريك لفراغ
    الخلافة الدستوري (الفصل 109)، فهو في خط الخلافة بصفته رئيس المجلس — الأول في الترتيب إذا
    عجز الرئيس، مع أن الفصل يلاحظ أن الآلية غير مجرّبة وأن توازنات القوى الحقيقية قد تعلو
    على النظام الدستوري الرسمي.
