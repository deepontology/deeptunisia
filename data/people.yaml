- id: hedi-nouira
  name_en: Hédi Nouira
  name_fr: Hédi Nouira
  name_ar: الهادي نويرة
  aliases: [نويرة]
  birth: "1919-04-06"
  death: "1993-01-25"
  layers: [economic, political]
  tagline: First BCT governor 1958-1970; later prime minister
  tagline_fr: >-
    Premier gouverneur de la BCT 1958-1970 ; plus tard chef du gouvernement
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    أول محافظ للبنك المركزي 1958-1970؛ ثم رئيس الحكومة
  tagline_ar_by: model-reviewed
  trajectory: [Central Bank, Interior Ministry, Prime Minister]
  trajectory_fr: [Banque centrale, 'Ministère de l''Intérieur', Chef du gouvernement]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [البنك المركزي, وزارة الداخلية, رئيس الحكومة]
  trajectory_ar_by: model-reviewed
  summary: >-
    The first governor of the Central Bank, serving from its creation in 1958
    until 1970. Later became prime minister and briefly interior minister.
    His career path from central bank to head of government is the clearest
    single instance of monetary-to-political authority transfer in Tunisian
    history.
  summary_fr: >-
    Premier gouverneur de la banque centrale, en poste de sa création en 1958 jusqu'en 1970.
    Devenu ensuite chef du gouvernement et brièvement ministre de l'Intérieur. Son parcours,
    de la banque centrale à la tête du gouvernement, est l'exemple le plus net de transfert
    d'autorité monétaire vers le politique dans l'histoire tunisienne.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أول محافظ للبنك المركزي، بقي في المنصب من تأسيسه سنة 1958 حتى 1970. صار لاحقًا رئيسًا
    للحكومة ووزيرًا للداخلية لفترة وجيزة. مساره من البنك المركزي إلى رئاسة الحكومة هو أوضح
    مثال منفرد على انتقال السلطة من المجال النقدي إلى المجال السياسي في تاريخ تونس.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [leaders-bct-governors]

