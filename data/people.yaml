  tagline_ar: >-
    مال النفط ونادٍ لكرة القدم وحزب، ثم خمسة وعشرون عامًا غيابيًا
  tagline_ar_by: model-reviewed
  trajectory: [Libyan exile, Oil business, Free Patriotic Union, Club Africain, Exile]
  trajectory_fr: [Exil libyen, Affaires pétrolières, Union patriotique libre, Club Africain, Exil]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [منفى ليبي, أعمال النفط, الاتحاد الوطني الحر, النادي الإفريقي, منفى]
  trajectory_ar_by: model-reviewed
  summary: >-
    Raised in his family's Libyan exile and returned to Tunisia immediately after
    the revolution, founding the Free Patriotic Union in May 2011 and taking over
    Club Africain. The UPL was the third party of the 2014 legislature. Prosecuted
    from August 2017, he resigned both the party presidency and the club, left the
    country, and has been sentenced in absentia. His trajectory — capital
    accumulated abroad converted into a party, a football club and a
    parliamentary bloc within three years — is the clearest post-2011 example in
    this dataset of money entering politics from outside the old networks.
  summary_fr: >-
    Élevé dans l'exil familial en Libye, revenu en Tunisie immédiatement après la
    révolution, fondateur de l'Union patriotique libre en mai 2011 et repreneur du Club
    Africain. L'UPL fut la troisième force de la législature de 2014. Poursuivi à partir
    d'août 2017, il a démissionné de la présidence du parti et du club, quitté le pays et a
    été condamné par contumace. Sa trajectoire — un capital accumulé à l'étranger converti
    en un parti, un club de football et un bloc parlementaire en trois ans — est l'exemple
    post-2011 le plus net de ce jeu de données d'un argent entré en politique depuis
    l'extérieur des anciens réseaux.
