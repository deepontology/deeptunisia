  summary: >-
    Lawyer and coordinator of the Democratic Patriots' Movement, who brought
    twelve left, nationalist and ecologist parties into the Popular Front in
    October 2012, and was shot dead outside his house in El Menzah on 6 February
    2013. The killing produced the first government collapse of the transition
    and, with the assassination of Mohamed Brahmi five months later, the crisis
    that the National Dialogue Quartet was convened to resolve. A court sentenced
    four defendants to death and two to life in March 2024, eleven years later;
    proceedings against those accused of ordering it were still running in 2025.
  summary_fr: >-
    Avocat et coordinateur du Mouvement des patriotes démocrates, qui a rassemblé douze
    partis de gauche, nationalistes et écologistes dans le Front populaire en octobre 2012,
    et a été abattu devant chez lui à El Menzah le 6 février 2013. Le meurtre a provoqué le
    premier effondrement gouvernemental de la transition et, avec l'assassinat de Mohamed
    Brahmi cinq mois plus tard, la crise que le Quartet du dialogue national a été convoqué
    pour résoudre. Un tribunal a condamné quatre prévenus à mort et deux à la perpétuité en
    mars 2024, onze ans plus tard ; les procédures contre les accusés d'avoir ordonné
    l'assassinat se poursuivaient encore en 2025.
  summary_fr_by: model-reviewed
  summary_ar: >-
    محامٍ ومنسق حركة الوطنيين الديمقراطيين، جمع اثني عشر حزبًا يساريًا وقوميًا وبيئيًا في
    الجبهة الشعبية في أكتوبر 2012، وأُطلق عليه النار أمام منزله في المنزه في 6 فيفري 2013.
    أحدث الاغتيال أول انهيار حكومي في الانتقال، ومع اغتيال محمد البراهمي بعد خمسة أشهر،
