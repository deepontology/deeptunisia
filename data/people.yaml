  trajectory_ar_by: model-reviewed
  summary: >-
    Second wife of Habib Bourguiba from April 1962 until he repudiated her by
    communiqué in August 1986, while she was being treated abroad. She held no
    post and is described in accounts of the period as having become one of the
    decisive influences at the Carthage palace, to the point of using the title
    herself. The dataset carries her because a map of Tunisian power that records
    only officeholders would show the Bourguiba presidency as a single person,
    which no serious account of it does. What she actually decided is not
    documented and is not claimed here.
  summary_fr: >-
    Seconde épouse d'Habib Bourguiba d'avril 1962 jusqu'à sa répudiation par communiqué en
    août 1986, alors qu'elle se soignait à l'étranger. Elle n'a occupé aucune fonction et
    les récits de l'époque la décrivent devenue l'une des influences décisives du palais de
    Carthage, jusqu'à user elle-même du titre. Ce jeu de données la porte parce qu'une carte
    du pouvoir tunisien qui n'enregistrerait que les titulaires de fonctions montrerait la
    présidence Bourguiba comme une personne seule, ce qu'aucun récit sérieux ne fait. Ce
    qu'elle a réellement décidé n'est pas documenté et n'est pas affirmé ici.
  summary_fr_by: model-reviewed
  summary_ar: >-
    الزوجة الثانية للحبيب بورقيبة من أفريل 1962 حتى طلاقها ببيان في أوت 1986، بينما كانت
    تتلقى العلاج في الخارج. لم تشغل أي منصب، وتصفها روايات الفترة بأنها صارت من التأثيرات
    الحاسمة في قصر قرطاج، حتى إنها استعملت اللقب بنفسها. تحملها هذه البيانات لأن خريطة
    السلطة التونسية التي تسجل أصحاب المناصب فقط ستُظهر رئاسة بورقيبة كشخص واحد، وهو ما لا
    تفعله أي رواية جادة. ما قررته فعلًا غير موثق ولا يُدعى هنا.
  summary_ar_by: model-reviewed
  confidence: C
  verification: needs-primary-source
  notes:
    - >-
      Her removal in 1986 is the immediate precondition for the last phase of the
