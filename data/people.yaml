    experiment (1961-1969). Held Planning, Finance, Economy, Agriculture, and Education
    portfolios concurrently — called the "Super-Minister". After Bourguiba ended the
    socialist experiment, tried for high treason, sentenced to 10 years, escaped prison
    in 1973, lived in exile until 2011.
