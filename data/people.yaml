- id: bahi-ladgham
  name_en: Bahi Ladgham
  name_fr: Bahi Ladgham
  name_ar: الباهي الأدغم
  aliases: [الأدغم]
  birth: "1913-01-10"
  death: "1998-04-13"
  layers: [political]
  tagline: "First republican PM; the 'silent chief'"
  tagline_fr: >-
    Premier chef du gouvernement républicain ; le « chef silencieux »
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    أول رئيس حكومة في العهد الجمهوري؛ «الزعيم الصامت»
  tagline_ar_by: model-reviewed
  trajectory: [Neo Destour, Secretary of Presidency, Prime Minister]
  trajectory_fr: [Néo-Destour, Secrétaire de la Présidence, Chef du gouvernement]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [الحزب الدستوري الجديد, كاتب دولة لدى الرئاسة, رئيس الحكومة]
  trajectory_ar_by: model-reviewed
  summary: >-
    Long-time second-in-command to Bourguiba. Held the title Secretary of State to
    the Presidency (de facto PM) from 1957 before becoming the first PM of the
    republic in 1969. Also served as Defence Minister for nearly a decade.
    Known as "the silent chief" for his discreet but central role.
  summary_fr: >-
    Numéro deux de Bourguiba pendant longtemps. Porta le titre de secrétaire d'État à la
    Présidence (chef de gouvernement de facto) à partir de 1957 avant de devenir le premier
    chef du gouvernement de la république en 1969. Fut aussi ministre de la Défense pendant
    près d'une décennie. Surnommé « le chef silencieux » pour son rôle discret mais central.
  summary_fr_by: model-reviewed
  summary_ar: >-
    الرجل الثاني لبورقيبة لوقت طويل. حمل لقب كاتب دولة لدى الرئاسة (رئيس حكومة بحكم الأمر
    الواقع) منذ 1957 قبل أن يصبح أول رئيس حكومة في الجمهورية سنة 1969. تولّى أيضًا وزارة
    الدفاع لنحو عقد من الزمن. عُرف بـ«الزعيم الصامت» لدوره الهادئ لكن المحوري.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [wikipedia-bahi-ladgham]

- id: mohammed-mzali
  name_en: Mohammed Mzali
  name_fr: Mohammed Mzali
  name_ar: محمد مزالي
  aliases: [مزالي]
  birth: "1925-12-23"
  death: "2010-06-23"
  layers: [political, security]
  tagline: "Bourguiba's last long-serving PM; crackdown on the left"
  tagline_fr: >-
    Dernier chef du gouvernement de long cours de Bourguiba ; répression de la gauche
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    آخر رؤساء حكومات بورقيبة طويلي المدة؛ حملة القمع ضد اليسار
  tagline_ar_by: model-reviewed
  trajectory: [Education, Defence, Interior, Prime Minister, exile]
  trajectory_fr: [Éducation, Défense, Intérieur, Chef du gouvernement, exil]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [التعليم, الدفاع, الداخلية, رئيس الحكومة, منفى]
  trajectory_ar_by: model-reviewed
  summary: >-
    Held a dozen ministerial portfolios (Defence, Education, Interior, Health,
    Youth and Sport) before becoming PM in 1980. Forced through an IMF austerity
    programme that triggered the 1984 bread riots, briefly held Interior himself
    to manage the crackdown. Dismissed in 1986 and fled to France. Also an
    academic, writer, and IOC member.
  summary_fr: >-
    A occupé une douzaine de portefeuilles ministériels (Défense, Éducation, Intérieur,
    Santé, Jeunesse et Sports) avant de devenir chef du gouvernement en 1980. A imposé un
    programme d'austérité du FMI qui a déclenché les émeutes du pain de 1984, et a
    brièvement tenu l'Intérieur lui-même pour gérer la répression. Démis en 1986, il s'est
    enfui en France. Également universitaire, écrivain et membre du CIO.
  summary_fr_by: model-reviewed
  summary_ar: >-
    تولّى نحو عشرة حقائب وزارية (الدفاع والتعليم والداخلية والصحة والشباب والرياضة) قبل أن
    يصبح رئيسًا للحكومة سنة 1980. فرض برنامج تقشّف لصندوق النقد الدولي أطلق أحداث الخبز سنة
    1984، وتولّى بنفسه الداخلية لفترة وجيزة لإدارة الحملة الأمنية. أُقيل سنة 1986 ولجأ إلى
    فرنسا. كان أيضًا أكاديميًا وكاتبًا وعضوًا في اللجنة الأولمبية الدولية.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [wikipedia-mohammed-mzali]

