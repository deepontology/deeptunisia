  name_ar: كمال الجندوبي
  aliases: [الجندوبي]
  birth: "1952-08-08"
  layers: [civil, political]
  tagline: Exiled rights campaigner who ran the first free elections
  tagline_fr: >-
    Militant des droits humains exilé qui a organisé les premières élections libres
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    ناشط حقوقي منفي أشرف على أول انتخابات حرة
  tagline_ar_by: model-reviewed
  trajectory: [Exile and human-rights activism, Electoral authority, Government, UN expert panels]
  trajectory_fr: [Exil et militantisme des droits humains, Instance électorale, Gouvernement, 'Panels d''experts de l''ONU']
  trajectory_fr_by: model-reviewed
  trajectory_ar: [منفى ونضال حقوقي, الهيئة الانتخابية, الحكومة, لجان خبراء أممية]
  trajectory_ar_by: model-reviewed
  summary: >-
    Spent the Ben Ali years in France running the Committee for the Respect of
    Freedoms and Human Rights in Tunisia, and returned to chair the body that
    organised the October 2011 Constituent Assembly election. Not reappointed
    when the authority was reconstituted as a permanent institution in 2014.
    Later minister for relations with the constitutional bodies and civil
    society, and subsequently chaired United Nations expert panels on Yemen.
  summary_fr: >-
    A passé les années Ben Ali en France à diriger le Comité pour le respect des libertés et
    des droits de l'homme en Tunisie, et est revenu présider l'instance qui a organisé
    l'élection de l'Assemblée constituante d'octobre 2011. Non reconduit quand l'instance a
    été reconstituée en institution permanente en 2014. Ministre ensuite chargé des
    relations avec les instances constitutionnelles et la société civile, puis président de
    panels d'experts des Nations unies sur le Yémen.
  summary_fr_by: model-reviewed
  summary_ar: >-
    قضى سنوات بن علي في فرنسا على رأس لجنة احترام الحريات وحقوق الإنسان في تونس، وعاد ليرأس
    الهيئة التي نظمت انتخابات المجلس الوطني التأسيسي في أكتوبر 2011. لم يُعيّن مجددًا حين
    أُعيدت هيكلة الهيئة كمؤسسة دائمة سنة 2014. صار لاحقًا وزيرًا للعلاقة مع الهيئات
    الدستورية والمجتمع المدني، ثم ترأس لجان خبراء أممية حول اليمن.
  summary_ar_by: model-reviewed
  confidence: B
  sources: [wikipedia-kamel-jendoubi, leaders-jendoubi-bio, wikipedia-isie-fr]

- id: chafik-sarsar
  name_en: Chafik Sarsar
  name_fr: Chafik Sarsar
  name_ar: شفيق صرصار
  birth: "1966-01-08"
  aliases: [Mohamed Chafik Sarsar]
  layers: [political, civil]
  tagline: Public-law professor who resigned the electoral authority citing pressure
  tagline_fr: >-
    Professeur de droit public démissionnaire de l'instance électorale, invoquant des
    pressions
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    أستاذ قانون عام استقال من الهيئة الانتخابية متحدثًا عن ضغوط
  tagline_ar_by: model-reviewed
  trajectory: [Public law faculty, Electoral authority, Resignation]
  trajectory_fr: [Faculté de droit public, Instance électorale, Démission]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [كلية القانون العام, الهيئة الانتخابية, استقالة]
  trajectory_ar_by: model-reviewed
  summary: >-
    Professor of public law elected to head the electoral authority in January
    2014, and the man who certified the 2014 legislative and presidential
    elections. Resigned in May 2017, stating days later that he had been under
    strong pressure. The resignation left the presidency vacant for six months
    while parliamentary blocs failed to agree a successor, which is the first
    visible sign in this dataset that the authority's independence had become a
    contested prize rather than a settled fact.
  summary_fr: >-
    Professeur de droit public élu à la tête de l'instance électorale en janvier 2014,
    l'homme qui a validé les élections législatives et présidentielle de 2014.
    Démissionnaire en mai 2017, déclarant quelques jours plus tard avoir subi de fortes
    pressions. La démission a laissé la présidence vacante pendant six mois, faute d'accord
    des blocs parlementaires sur un successeur — le premier signe visible dans ce jeu de
    données que l'indépendance de l'instance était devenue un enjeu disputé plutôt qu'un
    fait acquis.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أستاذ قانون عام انتُخب على رأس الهيئة الانتخابية في جانفي 2014، وهو الرجل الذي صادق على
    الانتخابات التشريعية والرئاسية لسنة 2014. استقال في ماي 2017، مصرحًا بعد أيام أنه تعرض
    لضغوط شديدة. تركت الاستقالة رئاسة الهيئة شاغرة ستة أشهر لعجز الكتل البرلمانية عن الاتفاق
    على خلف، وهو أول مؤشر مرئي في هذه البيانات على أن استقلالية الهيئة صارت غنيمة متنازعًا
    عليها لا حقيقة مستقرة.
  summary_ar_by: model-reviewed
  confidence: B
  sources: [wikipedia-chafik-sarsar, nawaat-isie-crisis-2017, wikipedia-isie-fr]

