    poste après Najla Bouden. Précédemment ministre de l'Équipement et de l'Habitat
    (2021-2025). Selon l'analyse de Mondafrigue sur le vide de succession constitutionnelle
    (article 109), elle figure dans la ligne de succession en tant que cheffe du
    gouvernement — l'article notant toutefois que le mécanisme n'a jamais été éprouvé et que
    les rapports de force réels peuvent primer sur l'ordre constitutionnel formel.
