  summary: >-
    The longest single arc of institutional survival recorded here. Governor of
    Sousse in 1972, social affairs minister for most of the decade after 1974 —
    the post that handles the state's relationship with the UGTT — and again in
    the first post-revolution cabinet of 2011. Elected speaker of the Assembly of
    Representatives of the People in December 2014, interim president of Nidaa
    Tounes, and interim president of the republic for the ninety days between
    Beji Caid Essebsi's death and Kais Saied's inauguration. Four constitutional
    orders, one career.
  summary_fr: >-
    La plus longue trajectoire de survie institutionnelle consignée ici. Gouverneur de
    Sousse en 1972, ministre des Affaires sociales pendant la plus grande partie de la
    décennie après 1974 — le poste qui gère la relation de l'État avec l'UGTT — et de
    nouveau dans le premier gouvernement post-révolution de 2011. Élu président de
    l'Assemblée des représentants du peuple en décembre 2014, président intérimaire de Nidaa
    Tounes, puis président intérimaire de la République pendant les quatre-vingt-dix jours
    entre la mort de Béji Caïd Essebsi et l'investiture de Kais Saïed. Quatre ordres
    constitutionnels, une seule carrière.
  summary_fr_by: model-reviewed
  summary_ar: >-
