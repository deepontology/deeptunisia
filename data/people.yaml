  summary: >-
    Journalist and human rights activist who became the president of the Truth
    and Dignity Commission (IVD). Her journalism career included founding the
    newspaper Le Maghreb and work with various human rights publications.
    Her tenure at IVD was marked by controversy, particularly surrounding the
    commission's final report and accusations of politicisation. Sentenced to
    25 years in prison in June 2026, one of the heaviest sentences handed down
    to opposition figures under Saied.
  summary_fr: >-
    Journaliste et militante des droits humains devenue présidente de l'Instance Vérité et
    Dignité (IVD). Sa carrière journalistique a inclus la fondation du journal Le Maghreb et
    des collaborations avec diverses publications de droits humains. Son mandat à l'IVD a
    été marqué par la controverse, notamment autour du rapport final de l'instance et
    d'accusations de politisation. Condamnée à 25 ans de prison en juin 2026, l'une des
    peines les plus lourdes infligées à des figures de l'opposition sous Saïed.
  summary_fr_by: model-reviewed
  summary_ar: >-
    صحفية وناشطة حقوقية صارت رئيسة هيئة الحقيقة والكرامة. شمل مسارها الصحفي تأسيس جريدة
    «المغرب» والعمل مع منشورات حقوقية متعددة. اتسمت مدتها على رأس الهيئة بالجدل، ولا سيما
    حول تقريرها الختامي واتهامات بالتسييس. حُكم عليها بـ25 سنة سجنًا في جوان 2026، وهي من
    أثقل الأحكام الصادرة ضد شخصيات معارضة في عهد سعيّد.
  summary_ar_by: model-reviewed
  confidence: B
