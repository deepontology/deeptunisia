  trajectory_fr_by: model-reviewed
  trajectory_ar: [وزارة المالية, الصناعة, الدفاع, الصحة, الاقتصاد, رئيس الحكومة]
  trajectory_ar_by: model-reviewed
  summary: >-
    Career technocrat who rose through the Finance Ministry before serving
    as Industry Minister (1977-1979), Defence Minister (1979-1980), then PM
    (1986-1987). Tasked with implementing a structural adjustment plan:
    devalued the dinar by 10% and secured IMF support. Son of Tahar Sfar,
    a co-founder of Neo Destour.
  summary_fr: >-
    Technocrate de carrière promu au sein du ministère des Finances avant de devenir
    ministre de l'Industrie (1977-1979), ministre de la Défense (1979-1980), puis chef du
    gouvernement (1986-1987). Chargé de mettre en œuvre un plan d'ajustement structurel : il
    a dévalué le dinar de 10 % et obtenu l'appui du FMI. Fils de Tahar Sfar, cofondateur du
    Néo-Destour.
  summary_fr_by: model-reviewed
  summary_ar: >-
    تكنوقراطي محترف ترقّى داخل وزارة المالية قبل أن يتولى الصناعة (1977-1979) ثم الدفاع
    (1979-1980) ثم رئاسة الحكومة (1986-1987). كلّف بتنفيذ برنامج تعديل هيكلي: خفّض قيمة
    الدينار 10% وحصل على دعم صندوق النقد الدولي. ابن الطاهر صفر، أحد مؤسسي الحزب الدستوري
    الجديد.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [wikipedia-rachid-sfar]

