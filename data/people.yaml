    from the creation of the post in April 1989 to the March 1990 remaniement
    — the portfolio's last institutional step before the ministry. A UGET
    leader drawn into the state under Bourguiba, then delegate, governor
    (Tunis-Cap Bon, Sfax, Grand Tunis) and long-serving ambassador to Saudi
    Arabia, where he became dean of the diplomatic corps; the Riyadh posting
    came after the religious affairs tenure.
