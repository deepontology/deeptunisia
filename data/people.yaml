  trajectory_ar_by: model-reviewed
  summary: >-
    Tunisia's leading olive oil exporter and president of Club Sportif
    Sfaxien. Arrested in late 2024 in the "Henchir Chaal" state farm
    dossier for alleged mismanagement and money laundering. Released in
    November 2025 against a bail of 50 million dinars (approximately
    €15 million). His case is cited by Mondafrigue as emblematic of the
    "penal settlement" system — a method of extortion through spectacular
    arrests, prolonged pretrial detention, and release against astronomical
    bail payments. The Tunisian Business Network Abroad announced in July
    2026 its intention to seize European jurisdictions against figures
    linked to the power structure for "systematic financial extortion."
  summary_fr: >-
    Premier exportateur tunisien d'huile d'olive et président du Club sportif sfaxien.
    Arrêté fin 2024 dans le dossier de la ferme d'État « Henchir Chaal » pour de présumés
    mauvaise gestion et blanchiment d'argent. Libéré en novembre 2025 contre une caution de
    50 millions de dinars (environ 15 millions d'euros). Son cas est cité par Mondafrigue
    comme emblématique du système du « règlement pénal » — une méthode d'extorsion par des
    arrestations spectaculaires, une détention provisoire prolongée et une libération contre
    des cautions astronomiques. Le Tunisian Business Network Abroad a annoncé en juillet
    2026 son intention de saisir des juridictions européennes contre des figures liées à la
    structure du pouvoir pour « extorsion financière systématique ».
  summary_fr_by: model-reviewed
  summary_ar: >-
