- id: bourguiba
  name_en: Habib Bourguiba
  name_fr: Habib Bourguiba
  name_ar: الحبيب بورقيبة
  aliases: [بورقيبة]
  birth: "1903-08-03"
  death: "2000-04-06"
  layers: [political]
  tagline: First president; architect of the party-state
  tagline_fr: Premier président ; architecte de l'État-parti
  tagline_fr_by: model-reviewed
  tagline_ar: أول رئيس؛ مهندس دولة الحزب
  tagline_ar_by: model-reviewed
  trajectory: [Nationalist movement, Prime Minister, Presidency]
  trajectory_fr: [Mouvement national, Chef du gouvernement, Présidence]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [الحركة الوطنية, رئيس الحكومة, الرئاسة]
  trajectory_ar_by: model-reviewed
  summary: >-
    Led Tunisia to independence and governed for three decades. Deliberately kept
    the armed forces small and politically constrained, a founding choice that
    explains why Tunisia's later authoritarianism was built on police rather than
    on generals.
  summary_fr: >-
    A conduit la Tunisie à l'indépendance et l'a gouvernée pendant trois décennies. Il a
    délibérément maintenu des forces armées réduites et politiquement encadrées, un choix
    fondateur qui explique pourquoi l'autoritarisme tunisien s'est ensuite construit sur la
    police plutôt que sur les généraux.
  summary_fr_by: model-reviewed
  summary_ar: >-
    قاد تونس إلى الاستقلال وحكمها ثلاثة عقود. أبقى القوات المسلحة صغيرة ومقيّدة سياسيًا عن
    قصد، وهو خيار تأسيسي يفسّر لماذا بُني الاستبداد التونسي لاحقًا على الشرطة لا على
    الجنرالات.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [carnegie-quiet-revolution, wikipedia-bourguiba-ar]

- id: ben-ali
  name_en: Zine El Abidine Ben Ali
  name_fr: Zine El Abidine Ben Ali
  name_ar: زين العابدين بن علي
  aliases: [Ben Ali, ZABA]
  birth: "1936-09-03"
  death: "2019-09-19"
  layers: [security, political, economic]
  tagline: Military intelligence to Interior to the presidency
  tagline_fr: >-
    Du renseignement militaire à l'Intérieur, puis à la présidence
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    من الاستخبارات العسكرية إلى الداخلية ثم إلى الرئاسة
  tagline_ar_by: model-reviewed
  trajectory: [Army, Military Security, National Security, Interior, Prime Minister, Presidency]
  trajectory_fr: [Armée, Sécurité militaire, Sûreté nationale, Intérieur, Chef du gouvernement, Présidence]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [الجيش, الاستخبارات العسكرية, الأمن الوطني, الداخلية, رئيس الحكومة, الرئاسة]
  trajectory_ar_by: model-reviewed
  summary: >-
    The single most important career in the dataset. Ben Ali came out of military
    security, ran the national police, took the Interior Ministry, became prime
    minister, and removed Bourguiba in November 1987. Every institution he passed
    through gained weight afterwards, and the one he came to distrust, the army,
    lost it.
  summary_fr: >-
    La carrière la plus importante de ce jeu de données. Ben Ali est issu de la sécurité
    militaire, a dirigé la police nationale, pris le ministère de l'Intérieur, puis la tête
    du gouvernement, et a écarté Bourguiba en novembre 1987. Chaque institution par laquelle
    il est passé a gagné en poids ensuite ; celle dont il s'est méfié, l'armée, en a perdu.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أهم مسار مهني في هذه البيانات. خرج بن علي من الاستخبارات العسكرية، وأدار الشرطة الوطنية،
    وتولّى وزارة الداخلية ثم رئاسة الحكومة، وأطاح ببورقيبة في نوفمبر 1987. كل مؤسسة مرّ بها
    ازداد وزنها بعده، والمؤسسة التي ارتاب فيها، أي الجيش، خسرت وزنها.
  summary_ar_by: model-reviewed
  confidence: A
  notes:
    - "Some precise dates in his early career rest on secondary biographical sources rather than a single personnel record."
  notes_fr:
    - >-
      Certaines dates précises du début de sa carrière reposent sur des sources
      biographiques secondaires plutôt que sur un seul dossier de personnel.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      بعض التواريخ الدقيقة في بداية مساره المهني تستند إلى مصادر سيرة ذاتية ثانوية لا إلى
      وثيقة إدارية واحدة.
  notes_ar_by: model-reviewed
  sources: [wikipedia-benali, wikipedia-ben-ali-ar, carnegie-quiet-revolution]

- id: fouad-mebazaa
  name_en: Fouad Mebazaa
  name_fr: Fouad Mebazaa
  name_ar: فؤاد المبزع
  aliases: [المبزع]
  birth: "1933-06-15"
  layers: [political]
  tagline: Interim president after the revolution
  tagline_fr: >-
    Président par intérim après la révolution
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    رئيس مؤقت بعد الثورة
  tagline_ar_by: model-reviewed
  trajectory: [Police, Parliament, Presidency]
  trajectory_fr: [Police, Parlement, Présidence]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [الشرطة, البرلمان, الرئاسة]
  trajectory_ar_by: model-reviewed
  summary: >-
    Career police officer turned politician. Headed the DGSN (national
    police) in the 1960s before moving into parliamentary politics. Became
    speaker of the Chamber of Deputies in 1997 and held the post for
    fourteen years. Ascended to the interim presidency on 15 January 2011
    after Ben Ali's departure, serving until the election of Moncef
    Marzouki in December 2011. A RCD figure who bridged the security
    apparatus and the parliamentary establishment.
  summary_fr: >-
    Policier de carrière devenu homme politique. A dirigé la DGSN (police nationale) dans
    les années 1960 avant de passer à la politique parlementaire. Président de la Chambre
    des députés à partir de 1997, il a occupé ce poste pendant quatorze ans. Il est devenu
    président de la République par intérim le 15 janvier 2011, après le départ de Ben Ali,
    jusqu'à l'élection de Moncef Marzouki en décembre 2011. Une figure du RCD qui faisait le
    pont entre l'appareil sécuritaire et l'establishment parlementaire.
  summary_fr_by: model-reviewed
  summary_ar: >-
    ضابط شرطة محترف صار سياسيًا. ترأس المديرية العامة للأمن الوطني في ستينيات القرن الماضي
    قبل الانتقال إلى العمل البرلماني. أصبح رئيسًا لمجلس النواب سنة 1997 وبقي في المنصب أربعة
    عشر عامًا. تولّى الرئاسة المؤقتة في 15 جانفي 2011 بعد رحيل بن علي، وبقي فيها إلى غاية
    انتخاب المنصف المرزوقي في ديسمبر 2011. شخصية من التجمع كانت جسرًا بين الجهاز الأمني
    والمؤسسة البرلمانية.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [carnegie-who-will-lead, tuniscope-mebazaa-bio-2011]

- id: moncef-marzouki
  name_en: Moncef Marzouki
  name_fr: Moncef Marzouki
  name_ar: المنصف المرزوقي
  aliases: [المرزوقي]
  birth: "1945-07-07"
  layers: [political]
  tagline: Human-rights activist turned transitional president
  tagline_fr: >-
    Militant des droits humains devenu président de la transition
  tagline_fr_by: model-reviewed
  tagline_ar: >-
    ناشط حقوقي صار رئيسًا انتقاليًا
  tagline_ar_by: model-reviewed
  trajectory: [Civil society, Opposition, Presidency]
  trajectory_fr: [Société civile, Opposition, Présidence]
  trajectory_fr_by: model-reviewed
  trajectory_ar: [المجتمع المدني, المعارضة, الرئاسة]
  trajectory_ar_by: model-reviewed
  summary: >-
    Human-rights activist and physician who founded the Tunisian League for
    the Defence of Human Rights (LTDH) and led the CPR opposition party.
    Won the 2011 presidential election as the consensus candidate of the
    Troika coalition (Ennahda, CPR, Ettakatol). His presidency was marked
    by conflict with Ennahda over government appointments and by the
    adoption of the 2014 constitution. Lost the 2014 election to Beji
    Caid Essebsi and went into exile in France. Returned to Tunisia in
    2021 and was subsequently sentenced to prison in absentia.
  summary_fr: >-
    Militant des droits humains et médecin, fondateur de la Ligue tunisienne de défense des
    droits de l'homme (LTDH) et dirigeant du parti d'opposition CPR. A remporté l'élection
    présidentielle de 2011 comme candidat de consensus de la coalition de la Troïka
    (Ennahdha, CPR, Ettakatol). Sa présidence a été marquée par le conflit avec Ennahdha sur
    les nominations gouvernementales et par l'adoption de la constitution de 2014. Battu par
    Béji Caïd Essebsi en 2014, il est parti en exil en France. Rentré en Tunisie en 2021, il
    a ensuite été condamné à la prison par contumace.
  summary_fr_by: model-reviewed
  summary_ar: >-
    ناشط حقوقي وطبيب أسّس الرابطة التونسية للدفاع عن حقوق الإنسان وقاد حزب المؤتمر من أجل
    الجمهورية المعارض. فاز في الانتخابات الرئاسية لسنة 2011 بصفته المرشح التوافقي لائتلاف
    الترويكا (النهضة والمؤتمر والتكتل). اتسمت رئاسته بالصراع مع النهضة حول التعيينات
    الحكومية وبإقرار دستور 2014. خسر انتخابات 2014 أمام الباجي قائد السبسي وغادر إلى المنفى
    في فرنسا. عاد إلى تونس سنة 2021 ثم حُكم عليه بالسجن غيابيًا.
  summary_ar_by: model-reviewed
  confidence: A
  sources: [carnegie-back-to-barracks]

