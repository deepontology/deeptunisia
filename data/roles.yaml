# -----------------------------------------------------------------------------
# ROLES
#
# A role is a canonical office. Positions attach a person to a role for a span of
# time. Normalising titles here means the succession chains can be derived
# automatically instead of hand-maintained, and it kills transliteration drift.
#
# `authority` (0-100) is the FORMAL AUTHORITY WEIGHT used by the rankings view.
# It is an editorial judgement, published openly on the methodology page so
# readers can argue with it. It encodes constitutional and command authority, not
# real-world influence. A presidential security chief scores lower here than an
# interior minister even though reporting suggests the reverse may hold in
# practice, precisely because "formal" and "actual" must stay separable.
# -----------------------------------------------------------------------------

# --- Political apex ---------------------------------------------------------

- id: president
  title_en: President of the Republic
  title_fr: Président de la République
  title_ar: رئيس الجمهورية
  institution: presidency
  authority: 100

- id: prime-minister
  title_en: Head of Government
  title_fr: Chef du Gouvernement
  title_ar: رئيس الحكومة
  institution: head-of-government
  authority: 70

- id: speaker
  title_en: Speaker of Parliament
  title_fr: Président de l'Assemblée
  title_ar: رئيس مجلس نواب الشعب
  institution: legislature
  authority: 55

- id: cnrd-president
  title_en: President of the National Council of Regions and Districts
  title_fr: Président du Conseil National des Régions et des Districts
  title_ar: رئيس المجلس الوطني للجهات والأقاليم
  institution: cnrd
  authority: 45
  summary: >-
    Presides the second chamber. Weighted below the Speaker because the chamber's
    competence is confined to budget and regional development, and its members
    arrive indirectly.
  summary_fr: >-
    Préside la seconde chambre. Pondéré en dessous du président du Parlement parce que la
    compétence de cette chambre se limite au budget et au développement régional, et que ses
    membres arrivent indirectement.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يرأس الغرفة الثانية. رُجّح دون رئيس البرلمان لأن اختصاص هذه الغرفة يقتصر على الميزانية
    والتنمية الجهوية، ولأن أعضاءها يصلون إليها بطريقة غير مباشرة.
  summary_ar_by: model-reviewed

- id: isie-president
  title_en: President of the Independent High Authority for Elections
  title_fr: Président de l'Instance Supérieure Indépendante pour les Élections
  title_ar: رئيس الهيئة العليا المستقلة للانتخابات
  institution: isie
  authority: 50
  summary: >-
    Certifies every national result. Weighted at the level of the Central Bank
    governor and the judicial council president: no command authority, but a
    veto-shaped function over who takes office. The office changed character in
    2022, when appointment moved from parliament to the presidency.
  summary_fr: >-
    Certifie chaque résultat national. Pondéré au niveau du gouverneur de la Banque centrale
    et du président du conseil de la magistrature : aucune autorité de commandement, mais
    une fonction en forme de veto sur qui entre en fonction. L'office a changé de nature en
    2022, quand la nomination est passée du Parlement à la présidence.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يصادق على كل نتيجة وطنية. رُجّح في مستوى محافظ البنك المركزي ورئيس مجلس القضاء: لا سلطة
    قيادة له، لكن وظيفته أشبه بحق نقض على مَن يتولى المناصب. وقد تغيّرت طبيعة المنصب سنة
    2022 حين انتقل التعيين من البرلمان إلى رئاسة الجمهورية.
  summary_ar_by: model-reviewed

# --- Security ministries ----------------------------------------------------

- id: interior-minister
  title_en: Minister of the Interior
  title_fr: Ministre de l'Intérieur
  title_ar: وزير الداخلية
  institution: ministry-interior
  authority: 75
  summary: >-
    In the Ben Ali system this was the most powerful office below the presidency.
    Its weight here reflects command of the entire internal security apparatus.
  summary_fr: >-
    Dans le système Ben Ali, c'était la fonction la plus puissante en dessous de la
    présidence. Son poids ici reflète le commandement de l'ensemble de l'appareil de
    sécurité intérieure.
  summary_fr_by: model-reviewed
  summary_ar: >-
    في منظومة بن علي كان هذا أقوى منصب بعد رئاسة الجمهورية. ويعكس وزنه هنا قيادته لكامل جهاز
    الأمن الداخلي.
  summary_ar_by: model-reviewed

- id: defence-minister
  title_en: Minister of National Defence
  title_fr: Ministre de la Défense nationale
  title_ar: وزير الدفاع الوطني
  institution: ministry-defence
  authority: 62

- id: religious-affairs-minister
  title_en: Minister of Religious Affairs
  title_fr: Ministre des Affaires religieuses
  title_ar: وزير الشؤون الدينية
  institution: ministry-religious-affairs
  authority: 45
  summary: >-
    Heads the ministry that administers mosques, imams and religious
    endowments — the instrument of the state's unusually direct supervision
    of the religious field.
  summary_fr: >-
    À la tête du ministère qui administre les mosquées, les imams et les
    biens religieux — l'instrument de la supervision inhabituellement
    directe que l'État exerce sur le champ religieux.
  summary_fr_by: model-reviewed
  summary_ar: >-
    على رأس الوزارة التي تسيّر المساجد والأئمة والأوقاف — أداة الإشراف
    المباشر الذي تمارسه الدولة على الحقل الديني على نحو غير معتاد.
  summary_ar_by: model-reviewed
  sources: [affaires-religieuses-official]

- id: religious-affairs-secretary-of-state
  title_en: Secretary of State to the Prime Minister for Religious Affairs
  title_fr: Secrétaire d'État auprès du Premier ministre chargé des Affaires religieuses
  title_ar: كاتب دولة لدى الوزير الأول مكلف بالشؤون الدينية
  institution: head-of-government
  authority: 40
  summary: >-
    Cabinet-level portfolio attached to the Prime Minister, created in 1989
    as the direct successor of the religious affairs direction and elevated
    to a full ministry on 9 March 1992.
  summary_fr: >-
    Poste gouvernemental rattaché au Premier ministre, créé en 1989 comme
    successeur direct de la direction des affaires religieuses et élevé au
    rang de ministère le 9 mars 1992.
  summary_fr_by: model-reviewed
  summary_ar: >-
    منصب حكومي مرتبط بالوزير الأول، أحدث سنة 1989 خلفًا مباشرًا لإدارة الشؤون
    الدينية، وتمت ترقيته إلى مرتبة وزارة يوم 9 مارس 1992.
  summary_ar_by: model-reviewed
  sources: [frwiki-gouvernement-karoui, frwiki-gouvernement-baccouche-iii]

- id: religious-affairs-director
  title_en: Director of Religious Affairs
  title_fr: Directeur des affaires religieuses (du culte musulman)
  title_ar: مدير الشؤون الدينية
  institution: head-of-government
  authority: 35
  summary: >-
    Head of the state religious administration created by decree 345 of 5
    October 1967 — the direct ancestor of the 1992 ministry — attached to
    the Secretariat of State to the Presidency and, from 6 May 1986, to the
    interior ministry. Held for over twenty years by Mustapha Kamel Tarzi.
  summary_fr: >-
    Chef de l'administration religieuse d'État créée par le décret 345 du 5
    octobre 1967 — l'ancêtre direct du ministère de 1992 — rattachée à la
    Secrétairerie d'État à la Présidence puis, à partir du 6 mai 1986, au
    ministère de l'Intérieur. Occupé pendant plus de vingt ans par Mustapha
    Kamel Tarzi.
  summary_fr_by: model-reviewed
  summary_ar: >-
    رئيس الإدارة الدينية الحكومية التي أحدثها الأمر عدد 345 المؤرخ في 5 أكتوبر
    1967 — السلف المباشر لوزارة 1992 — التابعة لكتابة الدولة للرئاسة ثم لوزارة
    الداخلية ابتداء من 6 ماي 1986. تولاها مصطفى كمال التارزي لأكثر من عشرين سنة.
  summary_ar_by: model-reviewed
  sources: [affaires-religieuses-tn-histoire, frwiki-mustapha-kamel-tarzi]

