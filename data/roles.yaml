# --- Military ---------------------------------------------------------------

- id: chief-armed-forces
  title_en: Chief of Staff of the Armed Forces
  title_fr: Chef d'état-major interarmées
  title_ar: رئيس هيئة أركان القوات المسلحة
  institution: armed-forces
  authority: 78
  summary: >-
    Tri-service coordination. Held only intermittently: it lapsed under Ben Ali
    after 1991 and was revived for Rachid Ammar in April 2011. Do not confuse it
    with the Land Army chief of staff, a common error in secondary accounts.
  summary_fr: >-
    Coordination des trois armes. Exercé seulement par intermittence : le poste est tombé en
    désuétude sous Ben Ali après 1991 et a été rétabli pour Rachid Ammar en avril 2011. À ne
    pas confondre avec le chef d'état-major de l'armée de terre, erreur courante dans les
    sources secondaires.
  summary_fr_by: model-reviewed
  summary_ar: >-
    تنسيق الأسلحة الثلاثة. لم يُشغل إلا متقطعًا: تُرك مهملًا في عهد بن علي بعد 1991 وأُعيد
    إحياؤه لفائدة رشيد عمار في أفريل 2011. ولا يُخلط بينه وبين رئيس أركان الجيش البري، وهو
    خطأ شائع في المصادر الثانوية.
  summary_ar_by: model-reviewed
  sources: [carnegie-quiet-revolution, babnet-joint-chief]

- id: chief-land-forces
  title_en: Chief of Staff of the Land Army
  title_fr: Chef d'état-major de l'armée de terre
