# --- Intelligence -----------------------------------------------------------

- id: dg-military-security
  title_en: Director-General of Military Security
  title_fr: Directeur général de la sécurité militaire
  title_ar: المدير العام للأمن العسكري
  institution: military-security
  authority: 66
  summary: >-
    Military counter-intelligence. Ranked high because its holders have repeatedly
    moved directly into presidential national-security roles.
  summary_fr: >-
    Contre-espionnage militaire. Classé haut parce que ses titulaires sont passés à
    plusieurs reprises directement à des fonctions de sécurité nationale auprès du
    président.
  summary_fr_by: model-reviewed
  summary_ar: >-
    مكافحة التجسس العسكري. رُتّب عاليًا لأن شاغليه انتقلوا مرارًا مباشرةً إلى مهام الأمن
    القومي لدى رئيس الجمهورية.
  summary_ar_by: model-reviewed

- id: head-anrsd
  title_en: Head of the National Agency for Security and Defence Intelligence
  title_fr: Directeur de l'ANRSD
  institution: anrsd
  authority: 72
  summary: >-
    Defence-side intelligence. Ranked high on the basis of its position in the
    security architecture; the agency's formal powers are not publicly documented,
    so this weight is a judgement more than usual.
  summary_fr: >-
    Renseignement du côté de la Défense. Classé haut sur la base de sa position dans
    l'architecture sécuritaire ; les pouvoirs formels de l'agence ne sont pas publiquement
    documentés, si bien que cette pondération relève du jugement plus qu'à l'ordinaire.
  summary_fr_by: model-reviewed
  summary_ar: >-
    الاستخبارات على الجانب الدفاعي. رُتّب عاليًا استنادًا إلى موقعه في البنية الأمنية؛ أما
    صلاحيات الوكالة الرسمية فغير موثّقة علنًا، ما يجعل هذا الترجيح اجتهادًا أكثر من المعتاد.
  summary_ar_by: model-reviewed

# --- Presidency-adjacent ----------------------------------------------------

- id: presidential-security-chief
  title_en: Head of Presidential Security
  title_fr: Chef de la sécurité présidentielle
  title_ar: رئيس الأمن الرئاسي
  institution: presidential-security
  authority: 50
  summary: >-
    Formal authority is modest. Reported influence is not. The gap between those
    two statements is one of the most interesting things in this dataset, and the
    site keeps them in separate columns rather than averaging them.
  summary_fr: >-
    L'autorité formelle est modeste. L'influence rapportée ne l'est pas. L'écart entre ces
    deux énoncés est l'une des choses les plus intéressantes de ce jeu de données, et le
    site les garde dans des colonnes séparées plutôt que d'en faire une moyenne.
  summary_fr_by: model-reviewed
  summary_ar: >-
    السلطة الرسمية متواضعة. أما النفوذ المُبلَّغ عنه فليس كذلك. والفجوة بين هاتين العبارتين
    من أكثر ما يثير الاهتمام في هذه البيانات، ويُبقيهما الموقع في عمودين منفصلين بدل حساب
    متوسط بينهما.
  summary_ar_by: model-reviewed

