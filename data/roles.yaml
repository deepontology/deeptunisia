- id: commerce-minister
  title_en: Minister of Commerce
  title_fr: Ministre du Commerce
  title_ar: وزير التجارة
  institution: head-of-government
  authority: 38
  summary: >-
    Portfolio covering trade, handicrafts and export development. The Tunisian
    ministry was named Commerce and Handicrafts (2009-2011) and Commerce and
    Export Development (2016-2021); both map to this role.
  summary_fr: >-
