# -----------------------------------------------------------------------------
# EDUCATION — records that let multiple timelines overlap (spec §4.7)
#
# Education is a record kind, not a person field, so several people's academic
# timelines can overlap and be scrubbed like any other interval. `institution`
# is a graph entity when the school has a record, null otherwise.
#
# Records landed 2026-08-08 from data/contrib/education-2026-08-08.yaml
# (roadmap P1 #10): presidents, premiers and party leaders' university records
# and elite-channel markers (Sadiki, Zitouna, ENA cohorts).
#
# Failure vocabulary preserved from that run:
#   - study START dates are often not stated in sources and are left "?"
#     (unknown) rather than guessed; the two inferred end dates ("~1967",
#     "~1974") carry explicit reasoning + falsifier.
#   - fr/en Wikipedia versions occasionally disagree on institution naming
#     (e.g. Saïed's department: "faculté des sciences juridiques et politiques
#     de Tunis" vs "University of Carthage" — same faculty, renamed when the
#     university split in 1988/2000).
#   - `institution` is null: no school entity exists in the graph yet; the
#     school names live in notes for the reviewer to mint institution records.
#   - edu-saied-doctorate-claim is a D-grade circulating claim KEPT per rule 6:
#     the popular account says Saïed holds a doctorate; fr.wiki states plainly
#     "Juriste de formation, SANS DOCTORAT". Both are in the graph so the map
#     shows the popular account vs the evidence.
# -----------------------------------------------------------------------------

