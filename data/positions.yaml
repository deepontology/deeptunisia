- id: p-utap-ezzar
  role: utap-president
  holder: abdelmajid-ezzar
  start: "2013-05"
  end: "2022-05-18"
  confidence: B
  notes:
    - >-
      First elected in May 2013, re-elected at the 16th congress in May 2018.
      The central council withdrew confidence on 18 May 2022; the minutes of
      that session, published in the JORT of 17 June 2022, recognise Noureddine
      Ben Ayed as president. Ezzar refused the decision and contested its
      legality — see the dispute below.
  notes_fr:
    - >-
      D'abord élu en mai 2013, réélu au 16e congrès en mai 2018. Le conseil central a retiré
      sa confiance le 18 mai 2022 ; le procès-verbal de cette session, publié au JORT du 17
      juin 2022, reconnaît Noureddine Ben Ayed comme président. Ezzar a refusé la décision
      et contesté sa légalité — voir le différend ci-dessous.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      انتُخب أول مرة في ماي 2013، وأُعيد انتخابه في المؤتمر السادس عشر في ماي 2018. وسحب
      المجلس المركزي ثقته يوم 18 ماي 2022؛ ومحضر تلك الجلسة، المنشور في الرائد الرسمي ليوم
      17 جوان 2022، يعترف بنور الدين بن عياد رئيسًا. رفض الزار القرار وطعن في قانونيته —
      انظر الخلاف أدناه.
  notes_ar_by: model-reviewed
  disputes:
    - claim: >-
        The 9th session of the UTAP central council (18 May 2022) lawfully
        withdrew confidence from Ezzar and elected Noureddine Ben Ayed.
      held_by: UTAP central council majority, as published in the JORT of 17 June 2022
      source: wmc-utap-ben-ayed-2022
      assessment: >-
        ADOPTED. The minutes were published in the official gazette, which the
        state treats as the authoritative record of the organisation's legal
        representative.
    - claim: >-
        The removal was void, taken in breach of the union's internal rules
        (article 14 on convening councils).
      held_by: Abdelmajid Ezzar, in public statements (Shems FM, May 2022)
      source: kapitalis-utap-2022
      assessment: >-
        Not adopted. The council's meeting was held before two notaries and its
        minutes were gazetted; no court ruling invalidating the decision has
        been located.
  sources: [utap-site, wikipedia-utap, wmc-utap-ben-ayed-2022, kapitalis-utap-2022, tunisienumerique-utap-2022]

