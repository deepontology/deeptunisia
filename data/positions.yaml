- id: p-int-essid
  role: interior-minister
  holder: habib-essid
  start: "2011-03-28"
  end: "2011-12-24"
  confidence: B
  verification: needs-primary-source
  notes:
    - >-
      Dates corrected 2026-08-08 from 2011-01-27 → 2011-03-07: the French and
      Arabic Wikipedia dated lists both place Essid 28 March - 24 December 2011,
      between Rajhi and Laarayedh. The earlier span conflated him with Rajhi's
      window (see triage entry).
    - >-
      Research pass 2026-08-11: the fr.wikipedia Gouvernement Caid Essebsi page
      corroborates the corrected start from a third independent account — "Le 28
      mars 2011, sur proposition du Premier ministre, le président par intérim
      Fouad Mebazaa nomme Habib Essid comme ministre de l'Intérieur en
      remplacement de Farhat Rajhi". Corroboration only; the 7 March 2011
      composition decree and the 28 March 2011 reshuffle decree remain unlocated.
  notes_fr:
    - >-
      Dates corrigées le 2026-08-08 de 2011-01-27 → 2011-03-07 : les listes datées de
      Wikipédia en français et en arabe placent toutes deux Essid du 28 mars au 24 décembre
      2011, entre Rajhi et Laarayedh. La durée antérieure le confondait avec la fenêtre de
      Rajhi (voir l'entrée de triage).
    - >-
      Passe de recherche 2026-08-11 : la page Gouvernement Caid Essebsi de Wikipédia en
      français corrobore le début corrigé par un troisième récit indépendant — « Le 28 mars
      2011, sur proposition du Premier ministre, le président par intérim Fouad Mebazaa
      nomme Habib Essid comme ministre de l'Intérieur en remplacement de Farhat Rajhi ».
      Corroboration seulement ; le décret de composition du 7 mars 2011 et le décret de
      remaniement du 28 mars 2011 restent introuvables.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      صُحّحت التواريخ يوم 2026-08-08 من 2011-01-27 ← 2011-03-07: تضع القائمتان المؤرّختان في
      ويكيبيديا الفرنسية والعربية الصيد معًا من 28 مارس إلى 24 ديسمبر 2011، بين
      الالالالالراجحي والعريّض. كانت المدة السابقة تخلط بينه وبين فترة الالالالالراجحي (انظر
      مدخل الفرز).
    - >-
      جولة بحث 2026-08-11: تؤكد صفحة حكومة قائد السبسي في ويكيبيديا الفرنسية البداية
      المصححة برواية ثالثة مستقلة — « وفي 28 مارس 2011، وبناء على اقتراح رئيس الحكومة، عيّن
      الرئيس المؤقت فؤاد المبزع الحبيب الصيد وزيرًا للداخلية خلفًا لفارح الراجحي ».
      تأكيد فقط؛ ويبقى مرسوم التشكيل الصادر في 7 مارس 2011 ومرسوم التعديل الصادر في 28
      مارس 2011 غير محددين.
  notes_ar_by: model-reviewed
  sources: [pm-gov-former, wikipedia-interior-ministers, wikipedia-ministry-of-interior-ar]

