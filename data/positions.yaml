- id: p-pres-saied
  role: president
  holder: kais-saied
  start: "2019-10-23"
  end: ongoing
  notes:
    - "Re-elected October 2024."
    - >-
      The review note here previously read "Checked directly against the JORT
      decree text". No gazette record is cited and none was located; the sources
      are contemporaneous international reporting. Corrected on 29 July 2026
      rather than quietly deleted, because a review that overstates what it
      verified is worse than no review at all.
  notes_fr:
    - >-
      « Réélu en octobre 2024. »
    - >-
      La note de vérification indiquait auparavant « Vérifié directement contre le texte du
      décret au JORT ». Aucun document du journal officiel n'est cité et aucun n'a été
      trouvé ; les sources sont des reportages internationaux contemporains. Corrigé le 29
      juillet 2026 plutôt que supprimé en silence, parce qu'une vérification qui surestime
      ce qu'elle a vérifié est pire que pas de vérification du tout.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      « أُعيد انتخابه في أكتوبر 2024. »
    - >-
      كانت ملاحظة المراجعة السابقة تنص على « تم التحقق مباشرة من نص المرسوم في الرائد الرسمي
      ». لا يُستشهد بأي سجل في الجريدة الرسمية ولم يُعثر على أي سجل؛ والمصادر تقارير دولية
      معاصرة. صُحّح ذلك يوم 29 جويلية 2026 بدل حذفه صامتًا، لأن مراجعة تبالغ في ما تحققت منه
      أسوأ من عدم وجود مراجعة أصلًا.
  notes_ar_by: model-reviewed
  confidence: A
  review:
    by: Initial compilation
    date: "2026-07-26"
    method: source-check
    note: >-
      Checked against contemporaneous international reporting of the 2019 and
      2024 elections. NOT verified against a JORT decree or an ISIE
      proclamation; no gazette record is cited for this position.
  sources: [reuters-election-2024, axios-saied-2021]

