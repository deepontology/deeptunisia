# -----------------------------------------------------------------------------
# POSITIONS
#
# One record per (person, office, span). Successions are DERIVED from these at
# build time rather than hand-maintained, so a gap or an overlap in a command
# chain shows up as a visible gap or overlap instead of a silent error.
#
# Date grammar:  2018-06-01 exact | 2018-06 month | ~2017 approximate
#                <=2018-06 in post by then | ongoing | verified:2025-12 | ?
#
# Where the public record does not support a precise date, it says so. Several
# rows here are deliberately vague and flagged needs-primary-source. That is the
# honest state of the research, and the Chronicle renders those bars with soft
# edges so the reader can see which spans are solid and which are estimates.
# -----------------------------------------------------------------------------

