      - path: landing/index.html
        locator: 'data-count="(\d+)">0</div><div class="micro k" data-i18n="ledger\.1"'
    resolver: { source: stats, key: people }
    format: plain
    population: person records in the published graph
    lifecycle: current
    locale: all
    owner: DATA
    authority: compiler
    assurance: compiled
    validity: cutoff-bound
