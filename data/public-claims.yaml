# Public-claim registry — the declaration file for M3 of the v0.1.3 plan.
#
# WHAT THIS IS
#
# One entry per mutable public figure or product-status statement. Each entry
# names the typed resolver that produces the value, the exact surfaces that
# publish it, the population it belongs to, and its lifecycle. The build
# (scripts/build-public-claims.ts) fails on an unresolved, stale, retired,
# duplicated or malformed claim, and scans governed templates for figures that
# no declaration covers.
#
# WHAT THIS IS NOT
#
# It is not part of the canonical Tunisia evidence graph. It describes the
# product and its evidence state — counts, review populations, translation
# provenance, deployment and release state — and it never carries a claim about
# a person, an institution or an event in Tunisia. Historical evidence keeps its
# own rules in data/*.yaml and scripts/schema.ts.
#
# THE INVENTORY RULES
#
# generated-template  a template with generated or generated-adjacent values; scanned
# authored-prose      authored prose stating current product figures; scanned
# release-paper       only `<!--stat:-->` spans and the current-state summary are governed
# historical-prose    superseded history, kept but never a live claim surface
# generated-artifact  a generated file bound to another surface; never hand-edited
# resolver-input      a canonical record a resolver reads; not a public surface itself
#
# Exclusions are narrow and reviewed: dates, citations, HTTP codes and proposal
# history. An exclusion is where a number is not a current-state claim; it is
# not where a claim was inconvenient.

schemaVersion: 1

inventory:
  - path: README.md
    rule: authored-prose
    note: Current-state product and dataset figures only. Historical narrative and release history are out of scope.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\bv\d+\.\d+[.\d]*\b'
  - path: static/llms.txt
    rule: authored-prose
    note: Machine-facing summary. Every current figure must resolve; historical years are dates.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
  - path: landing/index.html
    rule: generated-template
    note: The landing page. Current-state figures and the generated evidence arrays; historical years and the demo slice size are excluded by pattern.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\b46 people\b'
      - '\b400/500\b'
  - path: landing/_strings.en.json
    rule: generated-template
    note: English translation source extracted from the markup; must mirror it.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\b46 people\b'
  - path: landing/_strings.fr.json
    rule: generated-template
    note: French dictionary; the inline copy in index.html is regenerated from this file.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
  - path: landing/_strings.ar.json
    rule: generated-template
    note: Arabic dictionary; the inline copy in index.html is regenerated from this file.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
  - path: src/content/
    rule: authored-prose
    note: User-visible content pages. Frontmatter translated_by is a separate population resolved under content-translation; historical facts about Tunisia are not product claims.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
  - path: src/lib/i18n.ts
    rule: generated-template
    note: Application chrome. Current figures are interpolated from typed state at render; any literal count in this file must be declared.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\b40 overlap\b'
  - path: src/routes/
    rule: generated-template
    note: Route metadata and application shell text.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
  - path: output/deeptunisia-release-paper-v0.1.2.md
    rule: release-paper
    note: Active release paper. Only its `<!--stat:-->` spans and its current-state summary are governed; the methodology history is historical prose.
  - path: output/deeptunisia-release-paper-v0.1.1.md
    rule: historical-prose
    note: Superseded release paper, kept as release history.
  - path: static/deeptunisia-release-paper-v1.0.pdf
    rule: generated-artifact
    note: Generated PDF bound to the active release identity, not hand-edited.
  - path: docs/agora-deployment.md
    rule: authored-prose
    note: Current-state operational documentation; the mode contract.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
  - path: docs/agora-gaps.md
    rule: authored-prose
    note: Current-state operational documentation; closed-state record.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\bv\d+\.\d+(?:\.\d+)?\b'
  - path: docs/network-continuity.md
    rule: authored-prose
    note: Current-state operational documentation; H1 probe method and thresholds.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\btier-\d+/\d+\b'
  - path: docs/posting-limits.md
    rule: authored-prose
    note: Current-state operational documentation; the specified-not-wired policy.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\b4/8/14/20\b'
  - path: docs/commit-signing.md
    rule: authored-prose
    note: Current-state operational documentation; release artifact set.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\bv\d+\.\d+\b'
      - '\b401/403\b'
  - path: docs/methodology-kind-vs-strength.md
    rule: authored-prose
    note: Current-state methodology documentation.
    exclude:
      - '\b(?:18|19|20)\d{2}\b'
      - '\btier-\d+\b'
      - '\bV\d+\b'
  - path: static/editorial-queue.json
    rule: generated-artifact
    note: Emitted editorial queue; resolver input for the editorial-queue population.
  - path: static/sensitivity.json
    rule: generated-artifact
    note: Emitted sensitivity and ranking-population record; resolver input.
  - path: flows/manifest.json
    rule: resolver-input
    note: External dataset manifest with licence and retrieval state; resolver input.
  - path: data/verifications.yaml
    rule: resolver-input
    note: The independent verification population. Zero records until the v0.2 study fills it.
  - path: data/source-exceptions.yaml
    rule: resolver-input
    note: The live escape register. Categories overlap; it is never summed into one figure.
  - path: src/content/media/
    rule: resolver-input
    note: Investigation evidence, narrative and research ledgers. Data for the media resolvers; the shipped index is the public population, and the narrative prose is evidence, not a product-claim surface.
  - path: src/generated/
    rule: generated-artifact
    note: All compiler output; resolvers read it, no surface is hand-edited.

