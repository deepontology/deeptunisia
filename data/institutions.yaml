  attributed_to: Mondafrique investigation (August 2026)
  notes:
    - "Entity identity (B-grade, documented): \"Abou Khater\" is the Tunisian media's rendering of the Emirati Bukhatir Group's name; the documented project is Tunis Sports City, promoted through the group's Tunisian subsidiary Sport Cities International Tunis (SCIT) — 250 ha on the northern shore of Lac de Tunis, ~$5bn investment, announced May 2008 (capital raised from 5.001M to 82.426M TND, August 2008), approved under Ben Ali in 2008, relaunched March 2022, still stalled per WMC 2024-03-31. The id is kept as abou-khater-project because the media rendering is the name the Saied-family claim circulates under; the documented identity is recorded here rather than by renaming."
    - "The Naoufel-Saied association stays unsubstantiated (D): no registry, board, shareholding, JORT decree or court filing connects him to SCIT; the only claim is Mondafrique's conditional sentence. The documented corruption case in the dossier (WMC 2024-03-31) concerns former State Domains minister Hatem El Euchi, not the Saied family."
  notes_fr:
    - "Identité de l'entité (grade B, documenté) : « Abou Khater » est le rendu médiatique tunisien du nom du groupe émirati Bukhatir ; le projet documenté est Tunis Sports City, porté par la filiale tunisienne du groupe, Sport Cities International Tunis (SCIT) — 250 ha sur la rive nord du lac de Tunis, investissement d'environ 5 milliards USD, annoncé en mai 2008 (capital porté de 5,001M à 82,426M TND en août 2008), approuvé sous Ben Ali en 2008, relancé en mars 2022, toujours à l'arrêt selon WMC 2024-03-31. L'id est conservé sous abou-khater-project parce que le rendu médiatique est le nom sous lequel circule la revendication liée à la famille Saïed ; l'identité documentée est enregistrée ici plutôt que par un renommage."
    - "L'association avec Naoufel Saïed reste non étayée (D) : aucun registre, conseil, participation, décret JORT ou document judiciaire ne le relie à SCIT ; la seule affirmation est la phrase conditionnelle de Mondafrique. L'affaire de corruption documentée dans le dossier (WMC 2024-03-31) concerne l'ancien ministre des Domaines de l'État Hatem El Euchi, non la famille Saïed."
  notes_fr_by: model-reviewed
  notes_ar:
    - "هوية الكيان (درجة B، موثّقة): «أبو خاطر» هو النقل الإعلامي التونسي لاسم مجموعة بخيتير الإماراتية؛ والمشروع الموثّق هو مدينة تونس الرياضية (Tunis Sports City)، الذي تروّج له الشركة الفرعية التونسية للمجموعة Sport Cities International Tunis (SCIT) — 250 هكتارًا على الضفة الشمالية لبحيرة تونس، استثمار نحو 5 مليارات دولار، أُعلن عنه في ماي 2008 (رفع رأس المال من 5.001 مليون إلى 82.426 مليون دينار في أوت 2008)، وأُقرّ في عهد بن علي سنة 2008، وأُعيد إطلاقه في مارس 2022، وما زال متعطلًا وفق WMC 2024-03-31. أُبقي المعرف abou-khater-project لأن النقل الإعلامي هو الاسم الذي تتداول به دعوى عائلة سعيّد؛ أما الهوية الموثّقة فتُسجَّل هنا لا بإعادة التسمية."
    - "تبقى الصلة بنوفل سعيّد غير مدعومة بأدلة (D): لا سجل ولا مجلس إدارة ولا مساهمة ولا أمر بالرائد الرسمي ولا وثيقة قضائية تربطه بـSCIT؛ والادعاء الوحيد هو جملة موندافريك الشرطية. أما قضية الفساد الموثّقة في الملف (WMC 2024-03-31) فتخص وزير أملاك الدولة السابق حاتم الأوجي، لا عائلة سعيّد."
  notes_ar_by: model-reviewed
