  notes_fr_by: model-reviewed
  notes_ar:
    - أُرفقت المصادر بتاريخ 2026-08-13 في جولة إرفاق المصادر بالمؤسسات. الادعاءات التاريخية في الملخص (بأي مؤسسات «استندت فعليًا» الرئاسة حسب كل عصر) تحليلية وتخص العصور، لا هذا السجل.
  notes_ar_by: model-reviewed
