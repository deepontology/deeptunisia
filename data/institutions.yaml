- id: national-security-council
  name_en: National Security Council
  name_fr: Conseil de sécurité nationale
  name_ar: مجلس الأمن القومي
  abbr: CSN
  type: presidency
  layer: security
  parent: presidency
  order: 3
  active:
    start: 2017-01-19
    end: ongoing
  summary: "Chaired by the president. Membership set out in Decree 2017-70: the heads of government and parliament, the justice, defence, interior, foreign and finance ministers, and the head of the National Intelligence Centre. This is the only official document that maps the intended architecture of Tunisian security decision-making."
  summary_fr: "Présidé par le chef de l'État. Composition fixée par le décret 2017-70 : les chefs du gouvernement et du Parlement, les ministres de la Justice, de la Défense, de l'Intérieur, des Affaires étrangères et des Finances, et le chef du Centre national du renseignement. C'est le seul document officiel qui cartographie l'architecture voulue de la décision sécuritaire en Tunisie."
  summary_fr_by: model-reviewed
  summary_ar: "يرأسه رئيس الجمهورية. حُدّدت تركيبته بالأمر 2017-70: رئيسا الحكومة والبرلمان، ووزراء العدل والدفاع والداخلية والخارجية والمالية، ورئيس المركز الوطني للاستخبارات. وهو الوثيقة الرسمية الوحيدة التي ترسم البنية المقصودة لصنع القرار الأمني في تونس."
  summary_ar_by: model-reviewed
  sources:
    - legislation-nsc-2017
- id: legislature
  name_en: Parliament
  name_fr: Assemblée des représentants du peuple
  name_ar: مجلس نواب الشعب
  type: legislature
  layer: political
  parent: null
  order: 4
  active:
    start: 1956-04-09
    end: ongoing
  summary: "Modelled as one continuous row across five names — Constituent Assembly (1956-1959), National Assembly (1959-1981), Chamber of Deputies (1981-2011), National Constituent Assembly (2011-2014), Assembly of Representatives of the People (2014-) — because the office of speaker is what this dataset tracks and it has run without conceptual interruption. Two real discontinuities are visible as gaps in the succession rather than smoothed over: March 2011 to November 2011, when no chamber sat, and July 2021 to March 2023, when the chamber was suspended, then dissolved, then re-elected under new rules."
  summary_fr: "Modélisé comme une seule lignée continue sous cinq noms — Assemblée constituante (1956-1959), Assemblée nationale (1959-1981), Chambre des députés (1981-2011), Assemblée nationale constituante (2011-2014), Assemblée des représentants du peuple (2014-) — parce que c'est la fonction de président de chambre que suit ce jeu de données, et qu'elle s'est exercée sans interruption conceptuelle. Deux discontinuités réelles apparaissent comme des trous dans la succession plutôt que d'être lissées : de mars à novembre 2011, où aucune chambre ne siégeait, et de juillet 2021 à mars 2023, où la chambre fut suspendue, puis dissoute, puis réélue selon de nouvelles règles."
  summary_fr_by: model-reviewed
  summary_ar: "يُنمذَج بوصفه سلسلة واحدة متصلة تحت خمسة أسماء — المجلس القومي التأسيسي (1956-1959)، ومجلس الأمة (1959-1981)، ومجلس النواب (1981-2011)، والمجلس الوطني التأسيسي (2011-2014)، ومجلس نواب الشعب (2014-) — لأن ما تتبعه هذه البيانات هو منصب رئيس المجلس، وقد استمر دون انقطاع مفاهيمي. وينكشف انقطاعان حقيقيان بوصفهما ثغرتين في التعاقب لا يُطمسان: من مارس إلى نوفمبر 2011 حين لم ينعقد أي مجلس، ومن جويلية 2021 إلى مارس 2023 حين عُلّق المجلس ثم حُلّ ثم أُعيد انتخابه بقواعد جديدة."
  summary_ar_by: model-reviewed
  confidence: A
  sources:
    - wikipedia-arp-presidents
    - enwiki-arp
- id: cnrd
  name_en: National Council of Regions and Districts
  name_fr: Conseil National des Régions et des Districts
  name_ar: المجلس الوطني للجهات والأقاليم
  aliases:
    - CNRD
    - Regional Council
    - المجلس
  abbr: CNRD
  type: legislature
  layer: political
  parent: null
  order: 5
  active:
    start: 2024-04-19
    end: ongoing
  summary: "The second chamber created by the 2022 constitution and seated in April 2024. Members are not directly elected: regional and district councils send them, which routes the composition of a legislative chamber through local bodies chosen under rules the presidency wrote. Budget bills and regional development plans must pass through it."
  summary_fr: "La seconde chambre créée par la constitution de 2022 et installée en avril 2024. Ses membres ne sont pas élus au suffrage direct : ce sont les conseils régionaux et de districts qui les délèguent, ce qui fait transiter la composition d'une chambre législative par des instances locales désignées selon des règles écrites par la présidence. Les projets de loi de finances et les plans de développement régional doivent y passer."
  summary_fr_by: model-reviewed
  summary_ar: "الغرفة الثانية التي أنشأها دستور 2022 وشُكّلت في أفريل 2024. لا يُنتخب أعضاؤها انتخابًا مباشرًا: ترسلهم المجالس الجهوية ومجالس الأقاليم، ما يجعل تركيبة غرفة تشريعية تمرّ عبر هياكل محلية اختيرت بقواعد كتبتها رئاسة الجمهورية. ويجب أن تمرّ عبرها مشاريع قوانين المالية وخطط التنمية الجهوية."
  summary_ar_by: model-reviewed
  confidence: A
  sources:
    - cnrd-bardo-portal
    - wikipedia-cnrd
- id: isie
  name_en: Independent High Authority for Elections
  name_fr: Instance Supérieure Indépendante pour les Élections
  name_ar: الهيئة العليا المستقلة للانتخابات
  aliases:
    - ISIE
    - Elections Authority
    - الهيئة العليا
  abbr: ISIE
  type: judiciary
  layer: political
  parent: null
  order: 6
  active:
    start: 2011-04-18
    end: ongoing
  summary: The body that has organised every Tunisian election since 2011, and the clearest single measure of how much independence the post-2011 institutions retained. Created by decree-law in April 2011 and made permanent by organic law 2012-23, with its council elected by parliament. Decree-law 2022-22 deleted the composition articles and transferred appointment of all seven members, and of the president, to the head of state — after which the same authority certified the referendum on the constitution that authorised the change, and the presidential election of 2024.
  summary_fr: L'instance qui a organisé toutes les élections tunisiennes depuis 2011, et la mesure la plus nette de l'autonomie que les institutions issues de 2011 ont conservée. Créée par décret-loi en avril 2011 et pérennisée par la loi organique 2012-23, son conseil étant élu par le Parlement. Le décret-loi 2022-22 a supprimé les articles relatifs à sa composition et transféré au chef de l'État la nomination des sept membres et du président — après quoi la même autorité a certifié le référendum sur la constitution qui autorisait ce changement, puis l'élection présidentielle de 2024.
  summary_fr_by: model-reviewed
  summary_ar: الهيئة التي نظّمت كل الانتخابات التونسية منذ 2011، وأوضح مقياس منفرد لمقدار الاستقلال الذي احتفظت به مؤسسات ما بعد 2011. أُنشئت بمرسوم في أفريل 2011 وصارت قارّة بالقانون الأساسي 2012-23، ومجلسها يُنتخب من البرلمان. وألغى المرسوم 2022-22 فصول التركيبة ونقل تعيين الأعضاء السبعة ورئيسهم إلى رئيس الدولة — ثم صادقت الهيئة نفسها على استفتاء الدستور الذي أجاز هذا التغيير، وعلى الانتخابات الرئاسية لسنة 2024.
  summary_ar_by: model-reviewed
  confidence: A
  sources:
    - isie-presentation
    - wikipedia-isie-fr
    - nawaat-isie-2022
    - inkyfada-isie-2022
