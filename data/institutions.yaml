- id: haute-instance
  name_en: Higher Authority for the Realisation of the Objectives of the Revolution, Political Reform and Democratic Transition
  name_fr: Haute instance pour la réalisation des objectifs de la révolution, de la réforme politique et de la transition démocratique
  name_ar: الهيئة العليا لتحقيق أهداف الثورة والإصلاح السياسي والانتقال الديمقراطي
  type: legislature
  layer: political
  parent: null
  order: 7
  active:
    start: 2011-03-15
    end: 2011-10-13
  summary: The unelected body that wrote the rules of the transition. Formed on 15 March 2011 by merging the Council for the Defence of the Revolution with the Higher Political Reform Commission, it acted as a legislature in all but name and passed the six laws governing elections, parties, associations, the electoral authority and the press. It imposed gender parity on candidate lists and full proportional representation, and it elected the first ISIE council. It dissolved itself on 13 October 2011, ten days before the election it had designed. Nearly every structural feature of post-2011 Tunisian politics was set by a body that nobody voted for and that lasted seven months.
  summary_fr: L'organe non élu qui a écrit les règles de la transition. Formé le 15 mars 2011 par la fusion du Conseil de défense de la révolution et de la Haute Commission de la réforme politique, il a agi comme un législateur en tout sauf le nom et a adopté les six lois régissant les élections, les partis, les associations, l'instance électorale et la presse. Il a imposé la parité sur les listes de candidats et la proportionnelle intégrale, et il a élu le premier conseil de l'ISIE. Il s'est auto-dissous le 13 octobre 2011, dix jours avant l'élection qu'il avait conçue. Presque toutes les caractéristiques structurelles de la politique tunisienne post-2011 ont été fixées par un organe que personne n'a élu et qui a duré sept mois.
  summary_fr_by: model-reviewed
  summary_ar: الهيئة غير المنتخبة التي كتبت قواعد الانتقال. تشكّلت في 15 مارس 2011 بدمج مجلس حماية الثورة مع الهيئة العليا للإصلاح السياسي، وعملت كسلطة تشريعية في كل شيء إلا الاسم، وأصدرت القوانين الستة المنظِّمة للانتخابات والأحزاب والجمعيات والهيئة الانتخابية والصحافة. وفرضت التناصف في قوائم الترشح والاقتراع على القائمات بالتمثيل النسبي الكامل، وانتخبت أول مجلس للهيئة العليا المستقلة للانتخابات. ثم حلّت نفسها في 13 أكتوبر 2011، أي قبل عشرة أيام من الانتخابات التي صمّمتها. وهكذا حُدّدت جل الملامح البنيوية للسياسة التونسية بعد 2011 على يد هيئة لم ينتخبها أحد ولم تدم سوى سبعة أشهر.
  summary_ar_by: model-reviewed
  confidence: B
  sources:
