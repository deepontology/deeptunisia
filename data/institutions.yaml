  summary: Administers mosques, imams and religious endowments. The Tunisian state has supervised the religious field directly since independence — Bourguiba abolished the habous administration and absorbed the Zitouna into the state university — and this ministry is the instrument. Recorded here because a map of Tunisian authority with no religious institution in it implies the religious field is not governed, when in fact it is governed unusually closely.
  summary_fr: Administre les mosquées, les imams et les biens religieux. L'État tunisien supervise directement le champ religieux depuis l'indépendance — Bourguiba a supprimé l'administration des habous et absorbé la Zitouna dans l'université d'État — et ce ministère en est l'instrument. Recensé ici parce qu'une carte de l'autorité tunisienne sans aucune institution religieuse laisserait croire que le champ religieux n'est pas gouverné, alors qu'il l'est de façon inhabituellement étroite.
  summary_fr_by: model-reviewed
  summary_ar: تدير المساجد والأئمة والأوقاف الدينية. تشرف الدولة التونسية على الحقل الديني إشرافًا مباشرًا منذ الاستقلال — إذ ألغى بورقيبة إدارة الأحباس وأدمج الزيتونة في الجامعة الحكومية — وهذه الوزارة هي أداة ذلك. وقد سُجّلت هنا لأن خريطة للسلطة في تونس خالية من أي مؤسسة دينية توحي بأن الحقل الديني غير محكوم، وهو في الواقع محكوم على نحو شديد الإحكام.
