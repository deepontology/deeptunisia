  summary: Head of state and, constitutionally, Supreme Commander of the Armed Forces. The formal apex in every era, though the institutions it actually relied on changed dramatically.
  summary_fr: Chef de l'État et, constitutionnellement, chef suprême des forces armées. Le sommet formel à toutes les époques, même si les institutions sur lesquelles il s'est réellement appuyé ont changé du tout au tout.
  summary_fr_by: model-reviewed
  summary_ar: رئيس الدولة، ودستوريًا القائد الأعلى للقوات المسلحة. القمة الشكلية في كل العهود، وإن تغيّرت جذريًا المؤسسات التي استند إليها فعليًا.
  summary_ar_by: model-reviewed
  confidence: A
  sources:
    - dcaf-constitution-2014
  notes:
