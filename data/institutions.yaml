  summary: The highest court in the Tunisian judicial system. Hears appeals from lower courts on points of law.
  summary_fr: La plus haute juridiction du système judiciaire tunisien. Statue en appel sur les questions de droit.
  summary_fr_by: model-reviewed
  summary_ar: أعلى محكمة في المنظومة القضائية التونسية. تنظر في الطعون المتعلقة بمسائل القانون.
  summary_ar_by: model-reviewed
  confidence: B
  sources:
    - dcaf-loi-67-29
    - cassation-tn
  notes:
    - "Sources attached 2026-08-13. Loi n° 67-29 (DCAF, read in full) places \"une cour de cassation siégeant à Tunis\" at the head of the judicial order; the court's own site (cassation.tn) corroborates the institution. DATE FLAG: record active.start 1959 is NOT supported by loi 67-29 (1967), which organises the Cour de cassation. The 1959 date likely conflates the 1959 Code de procédure civile (cassation review within the cour d'appel) with the autonomous court organised in 1967. Propose verifying against the JORT before keeping 1959."
  notes_fr:
