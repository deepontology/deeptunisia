  summary: "Small by regional standards and historically kept at a distance from politics. The post of Chief of Staff of the Armed Forces, coordinating all three services, has existed only intermittently: it lapsed under Ben Ali after 1991 and was revived for Rachid Ammar in April 2011."
  summary_fr: "De taille réduite à l'échelle régionale et historiquement tenue à distance de la politique. Le poste de chef d'état-major des armées, coordonnant les trois armes, n'a existé que par intermittence : il est tombé en désuétude sous Ben Ali après 1991 et a été rétabli pour Rachid Ammar en avril 2011."
  summary_fr_by: model-reviewed
  summary_ar: "صغيرة بالمقاييس الإقليمية وأُبقيت تاريخيًا بعيدة عن السياسة. أما منصب رئيس أركان الجيوش، المنسّق للأسلحة الثلاثة، فلم يوجد إلا متقطعًا: تُرك مهملًا في عهد بن علي بعد 1991 وأُعيد إحياؤه لفائدة رشيد عمار في أفريل 2011."
  summary_ar_by: model-reviewed
  sources:
