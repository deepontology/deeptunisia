  summary: State-owned monopoly over Tunisian phosphate extraction, and the largest single employer in the south-west. Production reached eight million tonnes in 2010, making Tunisia the world's fifth-largest producer, at roughly four per cent of GDP and ten per cent of exports. After 2011 strikes, sit-ins and transport blockades in the mining basin held output near 3.4 million tonnes a year for a decade, with capacity utilisation below thirty-five per cent. The 2026 recovery plan targets 4.5 million tonnes that year and 9.4 million by 2035 against 2.7 billion dinars of investment. This company is where the post-2011 bargain between employment and output is actually visible.
  summary_fr: Monopole public sur l'extraction du phosphate tunisien, et premier employeur du sud-ouest. La production a atteint huit millions de tonnes en 2010, faisant de la Tunisie le cinquième producteur mondial, pour environ quatre pour cent du PIB et dix pour cent des exportations. Après 2011, grèves, sit-in et blocages du transport dans le bassin minier ont maintenu la production autour de 3,4 millions de tonnes par an pendant une décennie, avec un taux d'utilisation des capacités inférieur à trente-cinq pour cent. Le plan de redressement de 2026 vise 4,5 millions de tonnes cette année-là et 9,4 millions en 2035, pour 2,7 milliards de dinars d'investissement. C'est dans cette entreprise que le compromis post-2011 entre l'emploi et la production est réellement visible.
  summary_fr_by: model-reviewed
  summary_ar: احتكار عمومي لاستخراج الفسفاط التونسي، وأكبر مشغّل منفرد في الجنوب الغربي. بلغ الإنتاج ثمانية ملايين طن سنة 2010، فصارت تونس خامس منتج عالمي، بما يعادل نحو أربعة بالمائة من الناتج المحلي وعشرة بالمائة من الصادرات. وبعد 2011 أبقت الإضرابات والاعتصامات وقطع النقل في الحوض المنجمي الإنتاج قرب 3.4 مليون طن سنويًا طوال عقد، بنسبة استغلال للطاقة دون خمسة وثلاثين بالمائة. ويستهدف مخطط الإنعاش لسنة 2026 بلوغ 4.5 مليون طن تلك السنة و9.4 مليون سنة 2035 مقابل 2.7 مليار دينار من الاستثمار. في هذه الشركة تحديدًا تتجلّى المقايضة القائمة بعد 2011 بين التشغيل والإنتاج.
