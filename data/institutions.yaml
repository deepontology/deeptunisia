  summary: Tunisia's judicial system, comprising ordinary courts, administrative courts, and the Court of Cassation. The High Council of the Judiciary (CSM) manages judicial appointments. Under Kais Saied, the judiciary has been subject to mass dismissals, political prosecutions of opposition figures, and the dissolution of the CSM in 2022.
  summary_fr: Système judiciaire tunisien, comprenant les tribunaux ordinaires, les tribunaux administratifs et la Cour de cassation. Le Conseil supérieur de la magistrature (CSM) gère les nominations. Sous Kaïs Saïed, la magistrature a fait l'objet de licenciements massifs, de poursuites politiques et de la dissolution du CSM en 2022.
  summary_fr_by: model-reviewed
  summary_ar: المنظومة القضائية التونسية، تشمل المحاكم العادية والمحاكم الإدارية ومحكمة النقض. يدير مجلس القضاء الأعلى التعيينات. في عهد قيس سعيّد، تعرض القضاء لعمليات إقالة جماعية وملاحقة سياسية لمعارضين وحل مجلس القضاء في 2022.
  summary_ar_by: model-reviewed
  confidence: B
  sources:
    - dcaf-loi-67-29
    - dcaf-constitution-2014
    - reuters-judges-2022
    - reuters-csn-dissolved
  notes:
    - "Sources attached 2026-08-13. Loi n° 67-29 du 14 juillet 1967 (DCAF, read in full) is the organic law organising the judicial order (\"Les juridictions de l'ordre judiciaire comprennent: une cour de cassation, des cours d'appel, un tribunal immobilier, des tribunaux de première instance, des justices cantonales\"); the 2014 constitution re-founds the pouvoir judiciaire; the Reuters items back the summary's contemporary claims (57 judges dismissed June 2022; CSM dissolved June 2022). The reviewer should confirm the 2014 judicial articles (Arts. 102–118) from the DCAF text."
  notes_fr:
    - "Sources rattachées le 2026-08-13. La loi n° 67-29 du 14 juillet 1967 (DCAF, lue en entier) est la loi organique organisant l'ordre judiciaire (« Les juridictions de l'ordre judiciaire comprennent: une cour de cassation, des cours d'appel, un tribunal immobilier, des tribunaux de première instance, des justices cantonales ») ; la constitution de 2014 refonde le pouvoir judiciaire ; les articles Reuters appuient les affirmations contemporaines du résumé (57 juges révoqués en juin 2022 ; CSM dissous en juin 2022). Le relecteur devrait confirmer les articles judiciaires de 2014 (art. 102-118) dans le texte DCAF."
  notes_fr_by: model-reviewed
  notes_ar:
    - "أُرفقت المصادر بتاريخ 2026-08-13. القانون عدد 67-29 المؤرخ في 14 جويلية 1967 (DCAF، مقروء كاملًا) هو القانون الأساسي المنظّم للترتيب القضائي («تضم محاكم الترتيب القضائي: محكمة تعقيب، ومحاكم استئناف، ومحكمة عقارية، ومحاكم ابتدائية، وعدالة كانتونية»)؛ ويعيد دستور 2014 تأسيس السلطة القضائية؛ ويُسندان خبيرا رويترز الادعاءات المعاصرة في الملخص (إقالة 57 قاضيًا في جوان 2022؛ حل المجلس الأعلى للقضاء في جوان 2022). وينبغي للمراجع تأكيد فصول القضاء في دستور 2014 (الفصول 102-118) من نص DCAF."
  notes_ar_by: model-reviewed
