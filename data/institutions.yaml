- id: land-forces
  name_en: Land Army
  name_fr: Armée de terre
  name_ar: القوات البرية
  type: military
  layer: security
  parent: armed-forces
  order: 12
  active:
    start: 1956-06-24
    end: ongoing
  summary: The largest branch of the Tunisian Armed Forces with approximately 25,000 active personnel. Commanded from Bizerte. Organised into three mechanised infantry brigades, a desert brigade, and a special forces brigade. Led most counterterrorism operations along the Algerian border, including the Chaambi and Ben Guerdane campaigns.
  summary_fr: La plus grande branche des Forces Armées Tunisiennes avec environ 25 000 militaires actifs. Commandement à Bizerte. Organisée en trois brigades d'infanterie mécanisée, une brigade désertique et une brigade de forces spéciales. A dirigé la plupart des opérations antiterroristes le long de la frontière algérienne, y compris les campagnes du Chaambi et de Ben Guerdane.
  summary_fr_by: model-reviewed
  summary_ar: أكبر فرع من القوات المسلحة التونسية بحوالي 25 ألف جندي نشط. يُقَاد من بنزرت. منظمة في ثلاث فرق مشاة ميكانيكية وفرقة صحراوية وفرقة قوات خاصة. قادت معظم العمليات الإرهابية على طول الحدود الجزائرية، بما في ذلك حملات الشعambi وبن قردان.
  summary_ar_by: model-reviewed
  confidence: B
  sources:
    - defense-tn
    - setaf-elghoul-2020
    - mdn-dz-elghoul-2025
  notes:
    - Sources attached 2026-08-13 (MoD portal defense.tn lists "جيش البر" under the ministry's structures; existing setaf-elghoul-2020 and mdn-dz-elghoul-2025 name the Land Army chief of staff). The summary's numeric claims (~25,000 personnel; the three mechanised brigades, desert brigade, special-forces brigade; Chaambi/Ben Guerdane operations) are NOT covered by these sources and remain unsourced — likely IISS Military Balance territory, not retrieved this run.
  notes_fr:
    - Sources rattachées le 2026-08-13 (le portail du ministère de la Défense defense.tn liste « جيش البر » parmi les structures du ministère ; setaf-elghoul-2020 et mdn-dz-elghoul-2025, déjà présents, nomment le chef d'état-major de l'armée de terre). Les chiffres du résumé (~25 000 personnels ; les trois brigades mécanisées, la brigade désertique, la brigade de forces spéciales ; opérations du Chaambi et de Ben Guerdane) ne sont PAS couverts par ces sources et restent non sourcés — probablement du ressort de l'IISS Military Balance, non récupéré lors de ce passage.
  notes_fr_by: model-reviewed
  notes_ar:
    - أُرفقت المصادر بتاريخ 2026-08-13 (بوابة وزارة الدفاع defense.tn تدرج «جيش البر» ضمن هياكل الوزارة؛ ومصدرا setaf-elghoul-2020 وmdn-dz-elghoul-2025 الموجودان سابقًا يسمّيان رئيس أركان الجيش البري). الأرقام في الملخص (نحو 25 ألف جندي؛ الفرق الآلية الثلاث، الفرق الصحراوي، فرقة القوات الخاصة؛ عمليات الشعانبي وبن قردان) غير مغطاة بهذه المصادر وتبقى بلا مصدر — وهي على الأرجح من مجال IISS Military Balance، لم تُسترجع في هذه الجولة.
  notes_ar_by: model-reviewed
