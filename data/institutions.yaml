  summary: "The extended presidential family network around Kais Saied, comprising two rival clans: the president's brother Naoufel Saied and the Chebil family (the president's wife Ichraf Chebil and her sister Atika). Unlike the Ben Ali/Trabelsi network, this clan holds no formal institutional positions — influence is exercised through kinship, proximity, and control of informal channels. The two clans compete over the succession, key nominations, and the \"penal settlement\" extortion system."
  summary_fr: "Le réseau familial présidentiel élargi autour de Kaïs Saïed, comprenant deux clans rivaux : le frère du président Naoufel Saïed et la famille Chebil (l'épouse du président Ichraf Chebil et sa sœur Atika). À la différence du réseau Ben Ali/Trabelsi, ce clan ne détient aucune position institutionnelle formelle — l'influence s'exerce par la parenté, la proximité et le contrôle de canaux informels. Les deux clans se disputent la succession, les nominations clés et le système d'extorsion du « règlement pénal »."
