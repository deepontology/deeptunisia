# Places — point features with coordinates (spec §8.2).
#
# Kinds: port, airport, military-base, power-plant, pipeline, water,
# desalination, road, rail, industrial-zone, free-zone, resource-field,
# embassy, palace, town, quarter.
#
# Every point-class place must carry WGS84 [lon, lat] coordinates and a
# `parent` region/governorate (V10), each with its own source. Coordinates
# are claims like any other number — they are authored only from a cited
# source, never estimated to fill a row. The governorate polygons for the
# map view ship separately in static/tn-adm.geojson (geoboundaries-tun-adm1).
#
# Merged 2026-08-08 from data/contrib/places-2026-08-08.yaml (roadmap P1 #11):
# 12 strategic assets. Coordinates are verbatim from the cited registry records
# (Wikidata P625 / OSM); place-gafsa-basin is the one reasoned proxy (C) — the
# basin has no registry record as a single feature, so the point of Métlaoui
# town anchors it, with reasoning + falsifier (see the record).

