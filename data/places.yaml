    - >-
      DIVERGENCE DE STATUT (enregistrée, non résolue) : l'affirmation de la feuille de route
      selon laquelle Skhira serait « la seule raffinerie en activité » est contredite par
      « Énergie en Tunisie » de fr.wikipedia (juin 2026), qui décrit la raffinerie STIR de
      Bizerte comme l'unique raffinerie du pays ; l'article « Skhira » documente l'attribution
      en mai 2007 à Qatar Petroleum d'une seconde raffinerie de 120 000 barils/jour (« après
      celle de Bizerte »), et la déclaration ministérielle de mars 2021 selon laquelle TRAPSA
      ne disposait pas des papiers réglementaires pour exploiter le port pétrolier de Skhira.
