    as a geographic feature (only on the 2008 strikes inside it); GeoNames was
    unreachable from this environment; and OSM carries only individual mining
    installations (Mdhilla washing plant, Métlaoui and Redeyef stockage
    quarries). The basin is conventionally anchored on Métlaoui, the historic
    centre of Compagnie des phosphates de Gafsa mining and the rail head of the
    Gafsa-Sfax line; the adopted point is the registry coordinate of Métlaoui
    town (Wikidata Q983673, P625 (8.401389, 34.319444), precision 0.000277
    deg). The Gafsa Governorate item (Q269968, P625 (8.783333, 34.416667))
    brackets the basin's spread, which runs from Redeyef (~8.15 E) through
    Métlaoui (~8.40 E) to Mdhilla (~8.75 E).
