  reasoning: >-
    No registry record exists for the Sehib mine complex as a feature (no
    Wikidata item for the mine or the town, no OSM quarry/mine feature in the
    Mdhilla delegation area), and no Wikidata item exists for Sehib town. The
    record stands for the phosphate mining centre at Sehib, one of the CPG
    mining settlements east of Métlaoui in the Gafsa basin: en.wikipedia
    "Geology of Tunisia" confirms CPG "runs all phosphate mining and
    processing for Tunisia, out of eight open-pit mines near Sehib and Gafsa".
    The adopted point is the only registry feature carrying the name: the OSM
    railway station node 8231384457 'Sehib' (railway=station, stop_id 137,
    position 8.6467126, 34.2370276), on the Gafsa mining-basin rail line that
    serves the CPG washing plants — the same class of transport-registry anchor
    the 08-11 run used for the Bizerte free zone (post-office node).
  falsifiable_by: >-
    An official CPG/ONM point for the Sehib mining complex, or a Wikidata item
    for Sehib town with a P625 statement, placing the representative point
    elsewhere, would overturn the railway-station anchor. So would a
    demonstration that the station belongs to a different settlement.
