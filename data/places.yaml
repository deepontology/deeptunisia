    - >-
      تباين في الوضع (مُسجَّل، غير مُحسوم): ادعاء خارطة الطريق أن الصخيرة «المصفاة الوحيدة
      العاملة» تناقضه مقالة «Énergie en Tunisie» في ويكيبيديا الفرنسية (جوان 2026) التي تصف
      مصفاة STIR بنزرت بأنها المصفاة الوحيدة في البلاد؛ ويوثّق مقال «Skhira» إسناد مشروع
