- id: wikipedia-sadok-mokaddem-fr
  title: Sadok Mokaddem
  publisher: French Wikipedia
  url: https://fr.wikipedia.org/wiki/Sadok_Mokaddem
  tier: 3
  lang: fr
  excerpt: President of the National Assembly 1964-1981 (17 years), succeeding Jallouli Farès and preceding Mahmoud Messadi. Also secretary of state for foreign affairs 29 July 1957-29 August 1962 and justice minister under the Ben Ammar government (7 August 1954-7 September 1955). Born 24 April 1914, died 17 December 1993.
  excerpt_fr: Président de l'Assemblée nationale de 1964 à 1981 (17 ans), succédant à Jallouli Farès et précédant Mahmoud Messadi. Également secrétaire d'État aux Affaires étrangères du 29 juillet 1957 au 29 août 1962 et ministre de la Justice sous le gouvernement Ben Ammar (7 août 1954-7 septembre 1955). Né le 24 avril 1914, mort le 17 décembre 1993.
  excerpt_fr_by: machine
  excerpt_ar: رئيسًا لمجلس الأمة من 1964 إلى 1981 (17 عامًا)، خلفًا للجلولي فارس وسبقًا لمحمود المسعدي. وتولى أيضًا خطة كاتب دولة للشؤون الخارجية من 29 جويلية 1957 إلى 29 أوت 1962 ووزارة العدل في حكومة بن عمار (من 7 أوت 1954 إلى 7 سبتمبر 1955). وُلد في 24 أفريل 1914 وتوفي في 17 ديسمبر 1993.
  excerpt_ar_by: machine
