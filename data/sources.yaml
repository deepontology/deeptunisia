  date: 2021-04-13
  url: https://legislation-securite.tn/latest-laws/decret-gouvernemental-n-2021-212-du-13-avril-2021-portant-approbation-de-lavenant-n-4-a-la-convention-dattribution-dune-licence-pour-linstallation-et-lexploitation-dun-reseau/
  tier: 1
  lang: fr
  excerpt: "Recites the whole Orange licence chain: convention conclue le 13 juillet 2009; décret n° 2009-2270 du 31 juillet 2009 portant approbation de la convention (fixe + 2G + 3G); avenants 2014-37 (07-01-2014), 2017-65 (06-01-2017), 2018-350 (16-04-2018); framework décret n° 2009-283 du 2 février 2009 (3G licence conditions)."
  excerpt_fr: "Récite toute la chaîne de la licence Orange : convention conclue le 13 juillet 2009 ; décret n° 2009-2270 du 31 juillet 2009 portant approbation de la convention (fixe + 2G + 3G) ; avenants 2014-37 (07-01-2014), 2017-65 (06-01-2017), 2018-350 (16-04-2018) ; décret-cadre n° 2009-283 du 2 février 2009 (conditions de la licence 3G)."
  excerpt_fr_by: machine
  excerpt_ar: "يسرد سلسلة رخصة أورنج كاملة: الاتفاقية المبرمة في 13 جويلية 2009؛ والأمر عدد 2009-2270 المؤرخ في 31 جويلية 2009 المتعلق بالمصادقة على الاتفاقية (الهاتف الثابت + الجيل الثاني + الجيل الثالث)؛ والملاحق 2014-37 (07-01-2014) و2017-65 (06-01-2017) و2018-350 (16-04-2018)؛ والأمر الإطاري عدد 2009-283 المؤرخ في 2 فيفري 2009 (شروط رخصة الجيل الثالث)."
