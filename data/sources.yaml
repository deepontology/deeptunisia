  tier: 3
  lang: fr
  excerpt: Born 1921 Tunis, died 2000 La Marsa; Zitouna theologian, nephew of Mahmoud El Materi, son-in-law of Mohamed Salah Khatteche. In 1967 first director of the Muslim cult of the Republic, running the religious affairs administration for more than twenty years — the ancestor of the 1992 ministry. Father of Saloua Tarzi Ben Attia.
  excerpt_fr: Né en 1921 à Tunis, mort en 2000 à La Marsa ; théologien zitounien, neveu de Mahmoud El Materi, gendre de Mohamed Salah Khatteche. En 1967 premier directeur du culte musulman de la République, dirigeant l'administration des affaires religieuses pendant plus de vingt ans — l'ancêtre du ministère de 1992. Père de Saloua Tarzi Ben Attia.
  excerpt_fr_by: machine
  excerpt_ar: وُلد سنة 1921 بتونس وتوفي سنة 2000 بمرسى؛ عالم دين زيتوني وابن أخت محمود الماطري وصهر محمد صالح خطّاش. وفي 1967 أول مدير للشؤون الدينية بالجمهورية، إذ أدار إدارة الشؤون الدينية لأكثر من عشرين عامًا — السلف للوزارة المحدثة سنة 1992. والد سلوى الطرزي بن عطية.
