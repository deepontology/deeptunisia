  excerpt_ar: يؤكد الطاهر بن حسين على إذاعة جوهرة أن سامي الفهري وعائلته يملكون الآن أغلبية رأسمال قناة الحوار التونسي بعد شراء 45% من الأسهم؛ ويحتفظ بن حسين بـ35%.
  excerpt_ar_by: machine
