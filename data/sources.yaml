- id: dcaf-decret-loi-2011-120
  title: Décret-loi cadre n° 2011-120 du 14 novembre 2011, relatif à la lutte contre la corruption
  title_gloss_ar: مرسوم إطاري عدد 2011-120 بتاريخ 14 نوفمبر 2011 يتعلق بمكافحة الفساد
  title_gloss_ar_by: model-reviewed
  publisher: DCAF legislation-securite.tn
  date: 2011-11-14
  url: https://legislation-securite.tn/latest-laws/decret-loi-cadre-n-2011-120-du-14-novembre-2011-relatif-a-la-lutte-contre-la-corruption/
  tier: 1
  lang: fr
  excerpt: "Art. 12 crée l'Instance nationale de lutte contre la corruption (INLUCC). Art. 15 : l'INLUCC peut demander à la Cour des comptes l'accès aux déclarations sur l'honneur des biens déposées au titre de la loi 87-17. Art. 27 : le président et les membres de l'organe de prévention et d'investigation doivent eux-mêmes déclarer sur l'honneur leurs biens. Art. 41 : l'INLUCC se substitue à la commission nationale d'investigation sur la corruption et la malversation (décret-loi 2011-7 du 18-02-2011)."
  excerpt_ar: "يحدث الفصل 12 الهيئة الوطنية لمكافحة الفساد. الفصل 15: يمكن للهيئة أن تطلب من محكمة المحاسبات الاطلاع على التصريحات على الشرف بالممتلكات المودعة بمقتضى القانون 87-17. الفصل 27: رئيس هيئة الوقاية والتحقيق وأعضاؤها مطالبون بأنفسهم بالتصريح على الشرف بممتلكاتهم. الفصل 41: تحل الهيئة محل اللجنة الوطنية للتحقيق في الفساد والاختلاس (المرسوم عدد 2011-7 المؤرخ في 18-02-2011)."
  excerpt_ar_by: machine
- id: dcaf-loi-87-17
  title: Loi n° 87-17 du 10 avril 1987, relative à la déclaration sur l'honneur des biens des membres du Gouvernement et de certaines catégories d'agents publics
  title_gloss_ar: قانون عدد 87-17 بتاريخ 10 أفريل 1987 يتعلق بالتصريح الشرفي بأموال أعضاء الحكومة وبعض أصناف الأعوان العموميين
  title_gloss_ar_by: model-reviewed
  publisher: DCAF legislation-securite.tn (JORT n° 27 du 14-04-1987, p. 507)
  date: 1987-04-10
  url: https://legislation-securite.tn/latest-laws/loi-n-87-17-du-10-avril-1987-relative-a-la-declaration-sur-lhonneur-des-biens-des-membres-du-gouvernement-et-de-certaines-categories-dagents-publics/
  tier: 1
  lang: fr
  excerpt: "Art. 1 : membres du gouvernement, magistrats, ambassadeurs, gouverneurs, présidents d'entreprises mères/filiales et catégories listées déclarent sur l'honneur leurs biens, ceux du conjoint et des enfants mineurs dans le mois de la désignation. Art. 4 : dépôt auprès du Premier Président de la Cour des comptes (3 exemplaires pour les membres du gouvernement, un exemplaire transmis au Président de la République). Art. 5 : toute communication à des tiers est interdite (art. 109 Code pénal). Art. 6 : utilisable devant les tribunaux seulement dans une action pénale contre le déclarant. Art. 7 : non-déclaration → démission d'office. Statut : abrogée (loi 2018-46, art. 51)."
  excerpt_ar: "الفصل 1: أعضاء الحكومة والقضاة والسفراء والولاة ورؤساء الشركات الأم/الفرعية والفئات المذكورة يصرحون على الشرف بممتلكاتهم وممتلكات الزوج والأبناء القصر في الشهر الموالي للتسمية. الفصل 4: الإيداع لدى الرئيس الأول لمحكمة المحاسبات (3 نسخ لأعضاء الحكومة ونسخة تُحال إلى رئيس الجمهورية). الفصل 5: يحجر كل إطلاع على الغير (الفصل 109 من المجلة الجزائية). الفصل 6: لا يُحتج بها أمام المحاكم إلا في دعوى جزائية ضد المصرح. الفصل 7: عدم التصريح يؤدي إلى العزل وجوبًا. الوضع: ملغاة (القانون 2018-46، الفصل 51)."
  excerpt_ar_by: machine
