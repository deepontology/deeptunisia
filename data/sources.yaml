  excerpt: Zied El Heni, a veteran journalist, was arrested in late April 2026 and sentenced on 7 May 2026 by the Tunis first-instance court to one year under Article 86 of the Telecommunications Code for remarks at an academic forum commenting on the Khalifa Kasmi case. Nawaat frames the prosecution as part of a systematic policy targeting free critical voices.
  excerpt_fr: Zied El Heni, journaliste chevronné, a été arrêté fin avril 2026 et condamné le 7 mai 2026 par le tribunal de première instance de Tunis à un an de prison en vertu de l'article 86 du Code des télécommunications pour des propos tenus lors d'un forum académique commentant l'affaire Khalifa Kasmi. Nawaat présente les poursuites comme partie d'une politique systématique visant les voix critiques libres.
