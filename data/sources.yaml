  lang: fr
  excerpt: The indictment chamber specialised in financial corruption at the Tunis Court of Appeal confirmed on 3 August 2026 the closure of the investigation and referred former foreign minister Rafik Abdessalem Bouchlaka to the criminal chamber of the economic-financial judicial pole over the "Chinese donation" affair, for abuse of function and misappropriation of public funds. He is being tried in absentia (en état de fuite).
  excerpt_fr: La chambre d'accusation spécialisée en corruption financière auprès de la cour d'appel de Tunis a confirmé le 3 août 2026 la clôture de l'information et renvoyé l'ancien ministre des Affaires étrangères Rafik Abdessalem Bouchlaka devant la chambre criminelle du pôle judiciaire économico-financier dans l'affaire du « don chinois », pour abus de fonction et détournement de fonds publics. Il est jugé par contumace (en état de fuite).
