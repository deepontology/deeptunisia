  tier: 3
  lang: fr
  excerpt: "Biography: born 29 August 1960 in Radès; Minister of State Properties and Land Affairs in the Mechichi government from August 2020, dismissed on 15 February 2021; Minister of Justice from 11 October 2021."
  excerpt_fr: "Biographie : née le 29 août 1960 à Radès ; ministre des Domaines de l'État et des Affaires foncières dans le gouvernement Mechichi à partir d'août 2020, démissionnée le 15 février 2021 ; ministre de la Justice depuis le 11 octobre 2021."
  excerpt_fr_by: machine
  excerpt_ar: "سيرة: وُلدت في 29 أوت 1960 باردس؛ وزيرة لأملاك الدولة والشؤون العقارية في حكومة المشيشي منذ أوت 2020، وأُقيلت في 15 فيفري 2021؛ ووزيرة للعدل منذ 11 أكتوبر 2021."
  excerpt_ar_by: machine
