  excerpt: "Dated list of justice ministers: Mestiri 15 Apr 1956-30 Dec 1958; Khefacha 30 Dec 1958-5 Sep 1966; Mongi Slim 5 Sep 1966-6 Sep 1969; Snoussi 6 Sep 1969-12 Jun 1970; Bourguiba Jr 12 Jun-6 Nov 1970; Fitouri 6 Nov 1970-29 Oct 1971; Bellalouna 29 Oct 1971-5 Jun 1973; Baly 5 Jun 1973-25 Apr 1980; Chaker 25 Apr 1980-29 Oct 1984; Ben Ali 29 Oct 1984-12 Feb 1986; Ayari 12 Feb 1986-12 Apr 1988; Baly (2nd) 12 Apr-27 Jul 1988; H. Karoui 27 Jul 1988-27 Sep 1989; Bouaziz 27 Sep 1989-3 Mar 1990; Neffati 3 Mar 1990-20 Feb 1991; Zouari 20 Feb 1991-9 Jun 1992; Chaabane 9 Jun 1992-22 Jan 1997; Kallel 22 Jan 1997-17 Nov 1999; Tekkari 17 Nov 1999-15 Jan 2010; Bououni 15 Jan 2010-17 Jan 2011; Karoui Chebbi 17 Jan-24 Dec 2011; Bhiri 24 Dec 2011-13 Mar 2013; Ben Ammou 13 Mar 2013-29 Jan 2014; Ben Salah 29 Jan 2014-6 Feb 2015; Ben Aissa 6 Feb-20 Oct 2015; Horchani interim 20 Oct 2015-12 Jan 2016; Omar Mansour 12 Jan-27 Aug 2016; Ghazi Jeribi 27 Aug 2016-14 Nov 2018; El Jamoussi 14 Nov 2018-27 Feb 2020; T. Jeribi 27 Feb-2 Sep 2020; Bousseta 2 Sep 2020-15 Feb 2021; Jaffel since 11 Oct 2021."
  excerpt_fr: "Liste datée des ministres de la Justice : Mestiri 15 avr. 1956-30 déc. 1958 ; Khefacha 30 déc. 1958-5 sept. 1966 ; Mongi Slim 5 sept. 1966-6 sept. 1969 ; Snoussi 6 sept. 1969-12 juin 1970 ; Bourguiba Jr 12 juin-6 nov. 1970 ; Fitouri 6 nov. 1970-29 oct. 1971 ; Bellalouna 29 oct. 1971-5 juin 1973 ; Baly 5 juin 1973-25 avr. 1980 ; Chaker 25 avr. 1980-29 oct. 1984 ; Ben Ali 29 oct. 1984-12 févr. 1986 ; Ayari 12 févr. 1986-12 avr. 1988 ; Baly (2e) 12 avr.-27 juil. 1988 ; H. Karoui 27 juil. 1988-27 sept. 1989 ; Bouaziz 27 sept. 1989-3 mars 1990 ; Neffati 3 mars 1990-20 févr. 1991 ; Zouari 20 févr. 1991-9 juin 1992 ; Chaabane 9 juin 1992-22 janv. 1997 ; Kallel 22 janv. 1997-17 nov. 1999 ; Tekkari 17 nov. 1999-15 janv. 2010 ; Bououni 15 janv. 2010-17 janv. 2011 ; Karoui Chebbi 17 janv.-24 déc. 2011 ; Bhiri 24 déc. 2011-13 mars 2013 ; Ben Ammou 13 mars 2013-29 janv. 2014 ; Ben Salah 29 janv. 2014-6 févr. 2015 ; Ben Aissa 6 févr.-20 oct. 2015 ; Horchani (intérim) 20 oct. 2015-12 janv. 2016 ; Omar Mansour 12 janv.-27 août 2016 ; Ghazi Jeribi 27 août 2016-14 nov. 2018 ; El Jamoussi 14 nov. 2018-27 févr. 2020 ; T. Jeribi 27 févr.-2 sept. 2020 ; Bousseta 2 sept. 2020-15 févr. 2021 ; Jaffel depuis le 11 oct. 2021."
  excerpt_fr_by: machine
  excerpt_ar: "قائمة مؤرخة لوزراء العدل: المستيري من 15 أفريل 1956 إلى 30 ديسمبر 1958؛ الخفاشة من 30 ديسمبر 1958 إلى 5 سبتمبر 1966؛ منجي سليم من 5 سبتمبر 1966 إلى 6 سبتمبر 1969؛ السنوسي من 6 سبتمبر 1969 إلى 12 جوان 1970؛ بورقيبة الابن من 12 جوان إلى 6 نوفمبر 1970؛ الفيتوري من 6 نوفمبر 1970 إلى 29 أكتوبر 1971؛ بلعلونة من 29 أكتوبر 1971 إلى 5 جوان 1973؛ بالي من 5 جوان 1973 إلى 25 أفريل 1980؛ شاكر من 25 أفريل 1980 إلى 29 أكتوبر 1984؛ بن علي من 29 أكتوبر 1984 إلى 12 فيفري 1986؛ العياري من 12 فيفري 1986 إلى 12 أفريل 1988؛ بالي (الثانية) من 12 أفريل إلى 27 جويلية 1988؛ ح. كرو من 27 جويلية 1988 إلى 27 سبتمبر 1989؛ بوعزيز من 27 سبتمبر 1989 إلى 3 مارس 1990؛ النفاتي من 3 مارس 1990 إلى 20 فيفري 1991؛ الزواري من 20 فيفري 1991 إلى 9 جوان 1992؛ شعبان من 9 جوان 1992 إلى 22 جانفي 1997؛ الكاللي من 22 جانفي 1997 إلى 17 نوفمبر 1999؛ التكاري من 17 نوفمبر 1999 إلى 15 جانفي 2010؛ بوعوني من 15 جانفي 2010 إلى 17 جانفي 2011؛ كرو الشبّي من 17 جانفي إلى 24 ديسمبر 2011؛ البحيري من 24 ديسمبر 2011 إلى 13 مارس 2013؛ بن عمّو من 13 مارس 2013 إلى 29 جانفي 2014؛ بن صالح من 29 جانفي 2014 إلى 6 فيفري 2015؛ بن عيسى من 6 فيفري إلى 20 أكتوبر 2015؛ الحرشاني (بالنيابة) من 20 أكتوبر 2015 إلى 12 جانفي 2016؛ عمر منصور من 12 جانفي إلى 27 أوت 2016؛ الغازي الجريبي من 27 أوت 2016 إلى 14 نوفمبر 2018؛ الجموسي من 14 نوفمبر 2018 إلى 27 فيفري 2020؛ ت. الجريبي من 27 فيفري إلى 2 سبتمبر 2020؛ بوسطة من 2 سبتمبر 2020 إلى 15 فيفري 2021؛ الجافل منذ 11 أكتوبر 2021."
  excerpt_ar_by: machine
