- id: enwiki-tunisian-independence
  title: Tunisian independence
  title_gloss_fr: Indépendance de la Tunisie
  title_gloss_fr_by: model-reviewed
  title_gloss_ar: استقلال تونس
  title_gloss_ar_by: model-reviewed
  publisher: English Wikipedia
  url: https://en.wikipedia.org/wiki/Tunisian_independence
  tier: 3
  lang: en
  excerpt: |-
    Lead image: "Tunis on 20 March 1956, the day of independence." States the Franco-Tunisian protocol of 20 March 1956 was signed by Grand Vizier Tahar Ben Ammar and French Foreign Minister Christian Pineau; the new government deemed the country independent by virtue of this protocol.
    Referenced encyclopedia article (footnotes to Mestiri, Périllier, Sayah). Used only for the Tunis-day-of-independence tie and the protocol signatories.
  excerpt_fr: "Image de tête : « Tunis on 20 March 1956, the day of independence. » Précise que le protocole franco-tunisien du 20 mars 1956 a été signé par le Grand Vizir Tahar Ben Ammar et le ministre français des Affaires étrangères Christian Pineau ; le nouveau gouvernement a tenu le pays pour indépendant en vertu de ce protocole. Article encyclopédique référencé (notes renvoyant à Mestiri, Périllier, Sayah). Utilisé uniquement pour le lien avec le jour de l'indépendance de Tunis et les signataires du protocole."
  excerpt_fr_by: machine
  excerpt_ar: "صورة افتتاحية: «تونس في 20 مارس 1956، يوم الاستقلال». ويذكر أن البروتوكول الفرنسي-التونسي المؤرخ في 20 مارس 1956 وقعه الوزير الأكبر الطاهر بن عمار ووزير الخارجية الفرنسي كريستيان بينو؛ واعتبرت الحكومة الجديدة البلاد مستقلة بمقتضى هذا البروتوكول. مقال موسوعي بمراجع (حواشي إلى المستيري وبيريلييه وصياح). يُستعمل فقط للربط بيوم استقلال تونس وبموقّعي البروتوكول."
  excerpt_ar_by: machine
- id: frwiki-tahar-ben-ammar
  title: Tahar Ben Ammar
  publisher: French Wikipedia
  url: https://fr.wikipedia.org/wiki/Tahar_Ben_Ammar
  tier: 3
  lang: fr
  excerpt: |-
    "De nouvelles négociations avec le gouvernement français sont lancées après le voyage à Paris de Bourguiba le 4 février 1956 ... le protocole d'accord franco-tunisien sur l'indépendance de la Tunisie est signé le 20 mars 1956 par Ben Ammar et Christian Pineau, ministre français des Affaires étrangères."
    Documents that the independence negotiations ran with the French government (in Paris) — the basis for the caveat that the signing act occurred outside Tunisia.
  excerpt_fr: « De nouvelles négociations avec le gouvernement français sont lancées après le voyage à Paris de Bourguiba le 4 février 1956 ... le protocole d'accord franco-tunisien sur l'indépendance de la Tunisie est signé le 20 mars 1956 par Ben Ammar et Christian Pineau, ministre français des Affaires étrangères. » Documente que les négociations d'indépendance se sont déroulées avec le gouvernement français (à Paris) — la base de la réserve selon laquelle l'acte de signature a eu lieu hors de Tunisie.
  excerpt_fr_by: machine
  excerpt_ar: «تنطلق مفاوضات جديدة مع الحكومة الفرنسية بعد زيارة بورقيبة لباريس في 4 فيفري 1956 ... ويُوقع البروتوكول الفرنسي-التونسي حول استقلال تونس في 20 مارس 1956 من بن عمار وكريستيان بينو، وزير الخارجية الفرنسي». يوثق أن مفاوضات الاستقلال جرت مع الحكومة الفرنسية (في باريس) — وهو الأساس للتحفظ القائل إن حفل التوقيع جرى خارج تونس.
  excerpt_ar_by: machine
