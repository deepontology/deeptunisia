  excerpt: "HAICA council decision of 24 July 2014 (president Nouri Lejmi) granting broadcast licences, including: licence d'exploitation d'une chaîne de télévision privée à la société Al Hiwar Attounsi, sous la dénomination Al Hiwar Attounsi. Recipients had been broadcasting since 2011 under a provisional licence granted by the prime minister (INRIC process)."
