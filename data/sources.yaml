- id: dcaf-loi-2018-46
  title: Loi n° 2018-46 du 1er août 2018, relative à la déclaration de patrimoine et d'intérêts, et à la lutte contre l'enrichissement illicite et les conflits d'intérêts
  title_gloss_ar: قانون عدد 2018-46 بتاريخ 1 أوت 2018 يتعلق بالتصريح بالمكاسب والمصالح ومكافحة الإثراء غير المشروع وتضارب المصالح
  title_gloss_ar_by: model-reviewed
  publisher: DCAF legislation-securite.tn (JORT)
  date: 2018-08-01
  url: https://legislation-securite.tn/latest-laws/loi-n-2018-46-du-1er-aout-2018-relative-a-la-declaration-de-patrimoine-et-dinterets-et-a-la-lutte-contre-lenrichissement-illicite-et-les-conflits-dinterets/
  tier: 1
  lang: fr
  excerpt: "Art. 4 : 'Instance' = Instance nationale de la bonne gouvernance et de la lutte contre la corruption (art. 130 Constitution 2014). Art. 5 : 37 catégories de déclarants (60 jours). Art. 6 : patrimoine + intérêts, conjoint et enfants mineurs. Art. 8 : dépôt auprès de l'Instance, copie à la Cour des comptes, conservation 10 ans après cessation de fonctions, publication du contenu pour les catégories 1-8. Art. 15 : vérification obligatoire des catégories 1-12. Art. 30 : divulgation du contenu punie d'un an de prison. Art. 48 : l'INLUCC (décret-loi 2011-120) exerce les missions de l'Instance jusqu'à sa prise de fonctions. Art. 49 : accès aux déclarations déposées auprès du premier président de la Cour des comptes. Art. 50 : régularisation en deux mois après le décret-modèle. Art. 51 : abroge la loi 87-17 du 10-04-1987."
  excerpt_ar: "الفصل 4: «الهيئة» = الهيئة الوطنية للحوكمة الرشيدة ومكافحة الفساد (الفصل 130 من دستور 2014). الفصل 5: 37 فئة من المصرحين (60 يومًا). الفصل 6: المكاسب والمصالح والزوج والأبناء القصر. الفصل 8: الإيداع لدى الهيئة ونسخة لمحكمة المحاسبات وحفظ لمدة 10 سنوات بعد انتهاء الوظائف ونشر المضمون للفئات 1-8. الفصل 15: تدقيق إجباري للفئات 1-12. الفصل 30: الإفشاء بالمضمون يعاقب عليه بسنة سجن. الفصل 48: تتولى الهيئة الوطنية لمكافحة الفساد (المرسوم 2011-120) مهام الهيئة إلى حين مباشرتها لمهامها. الفصل 49: الاطلاع على التصريحات المودعة لدى الرئيس الأول لمحكمة المحاسبات. الفصل 50: التسوية في شهرين بعد الأمر النموذجي. الفصل 51: يلغي القانون 87-17 المؤرخ في 10-04-1987."
  excerpt_ar_by: machine
