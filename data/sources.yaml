  title: Subvention américaine de 1,5 million de dollars pour un projet dans le phosphate tunisien !
  publisher: Kapitalis
  date: 2026-08-09
  url: https://kapitalis.com/tunisie/2026/08/09/subvention-americaine-de-15-million-de-dollars-pour-un-projet-dans-le-phosphate-tunisien/
  tier: 4
  lang: fr
  excerpt: The US Embassy in Tunis and the Bureau of Near Eastern Affairs (aid coordination) launched a call for proposals under the initiative "Securing American critical-mineral supply chains – Tunisia", a single grant of 1,000,000–1,536,511 USD for 18–24 months supporting transparent private investment in the Tunisian phosphate sector. Application deadline 2 September 2026 (grants.gov ref DFOP0019505).
