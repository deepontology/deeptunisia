- id: wmc-jaffel-2021
  title: Qui est Leila Jaffel, ministre de la Justice ?
  title_gloss_ar: من هي ليلى جعفر، وزيرة العدل؟
  title_gloss_ar_by: model-reviewed
  publisher: Webmanagercenter
