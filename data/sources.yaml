- id: kapitalis-bensedrine-brigade-2026
  title: IVD | Entendue par la brigade financière, Sihem Bensedrine laissée en liberté
  publisher: Kapitalis
  date: 2026-08-07
  url: https://kapitalis.com/tunisie/2026/08/07/ivd-entendue-par-la-brigade-financiere-sihem-bensedrine-laissee-en-liberte/
  tier: 4
  lang: fr
  excerpt: Sihem Bensedrine, former president of the Truth and Dignity Commission (IVD), was heard on 7 August 2026 by the financial brigade (brigade des recherches et de la lutte contre l'évasion fiscale) over financial and fiscal files tied to her management of the IVD, then left free. The piece recalls that she was sentenced at first instance to a cumulative 25 years in the two conciliation-accord cases (Slim Chiboub, Abdelmajid Bouden) and has appealed.
- id: african-manager-eau-2026
  title: "Crise de l'eau : 608 signalements en juillet, une urgence hydrique sans précédent"
  publisher: African Manager
  date: 2026-08-09
  url: https://africanmanager.com/crise-de-leau-608-signalements-en-juillet-une-urgence-hydrique-sans-precedent/
  tier: 4
  lang: fr
  excerpt: The Tunisian Water Observatory (Observatoire tunisien de l'eau, OTE) reports 608 water-distribution signals in July 2026 — the heaviest monthly total of the year — of which 549 concern unannounced cuts and distribution failures. Sahel and Cap Bon concentrate the reports (Nabeul 65, Monastir 62, Mahdia 51, Sousse 49, Sfax 42, Médenine 41). Water-related protest movements rose from 23 in June to 34 in July (+48%). The OTE calls the situation a "critical phase of water emergency".
