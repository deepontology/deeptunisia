  title: Vacance du pouvoir en Tunisie, ce que prévoit la Constitution de 2022
  title_gloss_ar: شغور السلطة في تونس، ما ينص عليه دستور 2022
  title_gloss_ar_by: model-reviewed
  publisher: Inkyfada
  date: 2026-07-28
  url: https://inkyfada.com/fr/2026/07/28/tunisie-vacance-pouvoir-kais-saied-constitution-2014-2022/
  tier: 4
  lang: fr
  excerpt: Kaïs Saïed was absent from public view between 8 and 18 July 2026; he gave no Republic Day speech on 25 July and reappeared on 27 July receiving European diplomats. The 2022 Constitution entrusts the interim to the president of a Constitutional Court that has never been installed, and no organ is designated to certify an incapacity the president cannot himself declare.
  excerpt_fr: Kaïs Saïed a été absent de la vue publique entre le 8 et le 18 juillet 2026 ; il n'a pas prononcé de discours pour la fête de la République le 25 juillet et a réapparu le 27 juillet recevant des diplomates européens. La Constitution de 2022 confie l'intérim au président d'une Cour constitutionnelle jamais installée, et aucun organe n'est désigné pour constater une incapacité que le président ne peut lui-même déclarer.
  excerpt_fr_by: machine
  excerpt_ar: غاب قيس سعيد عن المشهد العام بين 8 و18 جويلية 2026؛ ولم يلقِ خطاب عيد الجمهورية في 25 جويلية وعاد للظهور في 27 جويلية مستقبلًا دبلوماسيين أوروبيين. ويعهد دستور 2022 بتولي المؤقت لرئيس محكمة دستورية لم تُنصّب قط، ولا يوجد أي جهاز مخول للتحقق من حالة عجز لا يمكن للرئيس نفسه التصريح بها.
