- id: dcaf-decret-loi-2011-13
  title: Décret-loi n° 2011-13 du 14 mars 2011, portant confiscation d'avoirs et de biens meubles et immeubles
  title_gloss_ar: مرسوم عدد 2011-13 بتاريخ 14 مارس 2011 يتعلق بمصادرة الأموال والأصول المنقولة والعقارية
  title_gloss_ar_by: model-reviewed
  publisher: DCAF legislation-securite.tn (JORT n° 18 du 18-03-2011, pp. 338-342)
  date: 2011-03-14
  url: https://legislation-securite.tn/latest-laws/decret-loi-n-2011-13-du-14-mars-2011-portant-confiscation-davoirs-et-de-biens-meubles-et-immeubles/
  tier: 1
  lang: fr
  excerpt: "Confisque au profit de l'État tous biens meubles et immeubles et droits acquis après le 7 novembre 1987 revenant à Zine El Abidine Ben Ali, à son épouse Leila Trabelsi et aux personnes de la liste annexée. Art. 2 impose à tout détenteur/débiteur de déclarer à la commission de confiscation (créée à l'art. 3, auprès du ministère des Domaines de l'État) les biens détenus sous deux mois. Art. 8 : transfert des biens à l'État sur rapport de la commission. Modifié par décret-loi 2011-47 du 31-05-2011."
  excerpt_ar: "يصادر لفائدة الدولة كل الممتلكات المنقولة والعقارية والحقوق المكتسبة بعد 7 نوفمبر 1987 العائدة لزين العابدين بن علي وزوجته ليلى الطرابلسي والأشخاص المذكورين في القائمة الملحقة. ويفرض الفصل 2 على كل حائز/مدين التصريح للجنة المصادرة (المحدثة بالفصل 3 لدى وزارة أملاك الدولة) بالممتلكات المودعة لديه خلال شهرين. الفصل 8: تحويل الممتلكات إلى الدولة بناء على تقرير اللجنة. عُدّل بالمرسوم عدد 2011-47 المؤرخ في 31-05-2011."
  excerpt_ar_by: machine
