  tier: 3
  lang: fr
  excerpt: Tahar Ben Hassine confirms on Jawhara FM that Sami Fehri and his family now hold a majority of El Hiwar Ettounsi's capital after buying 45% of the shares; Ben Hassine retains 35%.
  excerpt_fr: Tahar Ben Hassine confirme sur Jawhara FM que Sami Fehri et sa famille détiennent désormais la majorité du capital d'El Hiwar Ettounsi après l'achat de 45 % des parts ; Ben Hassine en conserve 35 %.
