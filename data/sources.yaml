  tier: 3
  lang: fr
  excerpt: Ben Hassine confirms on Shems FM that the majority of Al Hiwar shares were bought by the Fehri family, explaining why Sami Fehri never applied to HAICA for a new channel licence.
  excerpt_fr: Ben Hassine confirme sur Shems FM que la majorité des parts d'Al Hiwar a été rachetée par la famille Fehri, expliquant pourquoi Sami Fehri n'a jamais demandé de nouvelle licence de chaîne à la HAICA.
  excerpt_fr_by: machine
  excerpt_ar: يؤكد بن حسين على إذاعة شمس أن أغلبية أسهم قناة الحوار اشترتها عائلة الفهري، موضحًا لماذا لم يتقدم سامي الفهري قط إلى الهايكا بطلب ترخيص قناة جديد.
