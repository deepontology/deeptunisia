  title: Décret gouvernemental n° 2021-212 du 13 avril 2021, portant approbation de l'avenant n° 4 à la convention d'attribution d'une licence pour l'installation et l'exploitation d'un réseau public de télécommunications pour la fourniture des services de télécommunications fixes et des services de télécommunications mobiles de deuxième et troisième génération entre l'Etat tunisien et la société « Orange Tunisie »
