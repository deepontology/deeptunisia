  lang: fr
  excerpt: "Ouverture des offres le 2 mars 2016 (ministre Noomane Fehri): Ooredoo 160.000.000 dinars (lots 5 et 6), Orange Tunisie 156.331.000 dinars (lots 2 et 3), Tunisie Telecom 155.100.001 dinars (lots 1 et 4). Minimum recevable: 155.000.000 dinars. Finalisation fixée au plus tard le 30 mars 2016, officielle après publication au JORT."
  excerpt_ar: "فتح العروض يوم 2 مارس 2016 (الوزير نعمان الفهري): أوريدو 160.000.000 دينار (الحصتان 5 و6)، أورنج تونس 156.331.000 دينار (الحصتان 2 و3)، اتصالات تونس 155.100.001 دينار (الحصتان 1 و4). الحد الأدنى المقبول: 155.000.000 دينار. وحدد استكمال الإجراءات في موعد أقصاه 30 مارس 2016، لتصبح رسمية بعد النشر بالرائد الرسمي."
  excerpt_ar_by: machine
- id: kapitalis-4g-471md-2016
  title: Les 471 MD des licences 4G seront utilisés pour créer des emplois
  title_gloss_ar: مبلغ 471 مليون دينار من رخص الجيل الرابع سيخصص لخلق مواطن شغل
  title_gloss_ar_by: model-reviewed
  publisher: Kapitalis
  date: 2016-03-24
  url: https://kapitalis.com/tunisie/2016/03/24/les-471-md-des-licences-4g-seront-utilises-pour-creer-des-emplois/
  tier: 4
  lang: fr
  excerpt: Les 471 millions de dinars, montant global des 3 licences 4G attribuées à Tunisie Telecom, Ooredoo et Orange, seront versés avant le 15 avril 2016 dans les caisses de l'Etat (conseil ministériel du 22 mars 2016, chef du gouvernement Habib Essid).
  excerpt_ar: سيُودع مبلغ 471 مليون دينار، وهو الإجمالي العام لرخص الجيل الرابع الثلاث الممنوحة لاتصالات تونس وأوريدو وأورنج، قبل 15 أفريل 2016 في خزينة الدولة (مجلس وزاري يوم 22 مارس 2016، رئيس الحكومة الحبيب الصيد).
  excerpt_ar_by: machine
- id: kapitalis-4g-appel-doffres-2016
  title: "Appel d'offres 4G : Pas de 4e opérateur étranger en ligne"
  title_gloss_ar: "مناقصة الجيل الرابع: لا مشغل أجنبي رابع في الأفق"
  title_gloss_ar_by: model-reviewed
  publisher: Kapitalis
  date: 2016-02-01
  url: https://kapitalis.com/tunisie/2016/02/01/appel-doffres-4g-pas-de-4e-operateur-etranger-en-ligne/
  tier: 4
  lang: fr
  excerpt: Appel d'offres 4G lancé le 3 novembre 2015; seuls les 3 opérateurs nationaux ont répondu (échéance 1er février 2016). Commission créée par décret n° 1543 du 23 octobre 2015; membres désignés par arrêté du ministre (n° 93 du 02 novembre 2015); 9 membres incluant BCT, Instance nationale des télécommunications (INT) et Agence nationale des fréquences (ANF).
  excerpt_ar: أُطلق طلب عروض الجيل الرابع في 3 نوفمبر 2015؛ ولم يستجب سوى المشغلين الوطنيين الثلاثة (آخر أجل 1 فيفري 2016). لجنة أحدثت بالأمر عدد 1543 المؤرخ في 23 أكتوبر 2015؛ وأعضاء عيّنهم أمر وزاري (عدد 93 بتاريخ 2 نوفمبر 2015)؛ 9 أعضاء يشملون البنك المركزي والهيئة الوطنية للاتصالات والوكالة الوطنية للترددات.
  excerpt_ar_by: machine
- id: zawya-tt-3g-2010
  title: Tunisie Telecom awarded 3G phone license
  title_gloss_fr: Tunisie Telecom obtient une licence de téléphonie mobile 3G
  title_gloss_fr_by: model-reviewed
  title_gloss_ar: اتصالات تونس تتحصل على رخصة هاتف جوال من الجيل الثالث
  title_gloss_ar_by: model-reviewed
  publisher: Zawya
  date: 2010-09-24
  url: https://www.zawya.com/en/business/tunisie-telecom-awarded-3g-phone-license-oz05rx0q
  tier: 4
  lang: en
  excerpt: "24 September 2010: Tunisia awarded a third-generation (3G) telecom license to Tunisie Telecom; the deal involves an amount of 80 million dollars, announced by the Ministry [of Communication Technologies]."
  excerpt_fr: "24 septembre 2010 : la Tunisie a attribué une licence de télécommunications de troisième génération (3G) à Tunisie Telecom ; la transaction porte sur un montant de 80 millions de dollars, annoncé par le ministère [des technologies de la communication]."
  excerpt_fr_by: machine
  excerpt_ar: "24 سبتمبر 2010: أسندت تونس رخصة اتصالات من الجيل الثالث لاتصالات تونس؛ وتتعلق الصفقة بمبلغ 80 مليون دولار، وفق ما أعلنت وزارة [تكنولوجيات الاتصال]."
  excerpt_ar_by: machine
- id: regulation-afrique-tt-3g-2010
  title: "Tunisie : la troisième licence 3G des télécommunications n'est pas à l'ordre du jour"
  title_gloss_ar: "تونس: رخصة الجيل الثالث للاتصالات ليست على جدول الأعمال"
  title_gloss_ar_by: model-reviewed
  publisher: regulation-afrique.blogspot.com (relayant Business News)
  date: 2010-10-15
  url: https://regulation-afrique.blogspot.com/2010/10/tunisie-la-troisieme-licence-3g-des.html
  tier: 4
  lang: fr
  excerpt: "Le ministre Mohamed Naceur Ammar: Tunisie Telecom « a acheté la licence 3G le mois dernier » (septembre 2010), engagement pris lors de la cession des 35 % du capital à l'investisseur émirati; « le prix était identique à celui de la licence d'Orange, c'est-à-dire 116 millions de dinars ». Orange: « c'est une concession globale qui a été vendue »."
  excerpt_ar: "الوزير محمد الناصر عمار: اتصالات تونس «اشترت رخصة الجيل الثالث الشهر الماضي» (سبتمبر 2010)، وهو التزام قُطع عند بيع 35% من رأس المال للمستثمر الإماراتي؛ «وكان السعر مطابقًا لسعر رخصة أورنج، أي 116 مليون دينار». أورنج: «إنها امتياز شامل تم بيعه»."
  excerpt_ar_by: machine
