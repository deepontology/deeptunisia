  tier: 3
  lang: fr
  excerpt: "Full career: Commerce and Handicrafts minister 10 June 2009-29 December 2010 (Ghannouchi I, succeeding Ridha Touiti); secretary of state for renewable energy and food industries 2004-2007; GCT/CPG CEO 2008-2009; STEG CEO March 2011-January 2013; ambassador to Belgium November 2018-September 2020. Never finance minister."
