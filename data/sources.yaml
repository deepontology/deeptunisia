  lang: en
  excerpt: Founded 11 May 2002 as Tunisiana; commercial operations 27 December 2002; on 24 May 2012 secured licences to deliver 3G and fixed services (citing Kapitalis); renamed Ooredoo Tunisia on 24 April 2014.
  excerpt_fr: Fondée le 11 mai 2002 sous le nom de Tunisiana ; activités commerciales le 27 décembre 2002 ; le 24 mai 2012, obtention de licences pour fournir les services 3G et fixes (citant Kapitalis) ; renommée Ooredoo Tunisie le 24 avril 2014.
