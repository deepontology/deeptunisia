- id: wikipedia-banque-zitouna-fr
  title: Banque Zitouna
  publisher: Wikipédia (fr)
  url: https://fr.wikipedia.org/wiki/Banque_Zitouna
  tier: 5
  lang: fr
  excerpt: Fondée en 2009 par Mohamed Sakhr El Materi; agrément des autorités monétaires obtenu en janvier 2009; constitution publiée au JORT le 10 septembre 2009 (capital initial 30 MD); démarrage officiel le 28 mai 2010; mise sous administration provisoire par la BCT le 19 janvier 2011; cession de 69,15 % au groupe qatari Majda en 2018.
  excerpt_ar: تأسس بنك الزيتونة سنة 2009 على يد محمد صخر الماطري؛ وتحصل على موافقة السلطات النقدية في جانفي 2009؛ ونُشر تأسيسه بالرائد الرسمي في 10 سبتمبر 2009 (رأس مال أولي 30 مليون دينار)؛ وانطلق رسميًا في 28 ماي 2010؛ ووُضع تحت الإدارة المؤقتة من البنك المركزي في 19 جانفي 2011؛ وبيعت حصة 69.15% للمجموعة القطرية مجدا سنة 2018.
  excerpt_ar_by: machine
