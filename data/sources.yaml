  lang: fr
  excerpt: Deuxième opérateur mobile privé; licence adjugée en juillet 2009 pour 257,3 millions de dinars; premier opérateur titulaire d'une licence 3G et de téléphonie fixe; lancement commercial le 5 mai 2010; controverses sur les conditions d'attribution de la licence 3G.
