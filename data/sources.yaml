- id: nawaat-migrants-cour-africaine-2026
  title: "Migrants Tortured: Tunisia Accused, EU Complicit"
  publisher: Nawaat
  date: 2026-08-08
  url: https://nawaat.org/2026/08/08/migrants-tortured-tunisia-accused-eu-complicit/
  tier: 4
  lang: en
  excerpt: "For the first time, Tunisia must respond before an international court over systematic violations against migrants. The Italian association ASGI and lawyer Brahim Belguith submitted four petitions to the African Court on Human and Peoples' Rights (press conference 30 June 2026): arbitrary detention, torture, mass expulsion into the desert, sale of detainees to Libyan border guards, and provoked sea wrecks. The petition also alleges EU complicity through border-management funding. Context: Tunisia's Article 34(6) declaration accepting individual petitions was withdrawn, effective 7 March 2026."
- id: kapitalis-khelifi-2026
  title: UGTT | Décès de Chamseddine Khelifi, SG de la Fédération générale du transport
  publisher: Kapitalis
  date: 2026-08-08
  url: https://kapitalis.com/tunisie/2026/08/08/ugtt-deces-de-chamseddine-khelifi-sg-de-la-federation-generale-du-transport/
  tier: 4
  lang: fr
  excerpt: The UGTT announced on 8 August 2026 the death of Chamseddine Khelifi, secretary-general of the General Transport Federation (Fédération générale du transport), a key figure of recent social struggles in the sector. Burial 9 August 2026 at Gammarth cemetery.
- id: kapitalis-cameras-libye-2026
  title: Caméras sur 200 km le long de la frontière libyenne avec la Tunisie
  publisher: Kapitalis
  date: 2026-08-07
  url: https://kapitalis.com/tunisie/2026/08/07/cameras-sur-200-km-le-long-de-la-frontiere-libyenne-avec-la-tunisie/
  tier: 4
  lang: fr
  excerpt: The Libyan Border Guard (under Tripoli's Interior Ministry) launched the first phase of an electronic-surveillance project covering about 200 km of the Libya–Tunisia border (Al-Assa sector), with the EU's EUBAM mission. Optical and thermal cameras, 24/7. The Al-Assa/Ras Jedir priorities were set at the 2024 joint committee. The project targets smuggling, irregular migration and cross-border crime; Kapitalis questions what it will mean for sub-Saharan migrant flows into Tunisia.
- id: kapitalis-algerie-litige-2026
  title: Tunisie – Algérie | Le litige frontalier entre l'histoire et le droit
  publisher: Kapitalis
  date: 2026-08-09
  url: https://kapitalis.com/tunisie/2026/08/09/tunisie-algerie-le-litige-frontalier-entre-lhistoire-et-le-droit/
  tier: 4
  lang: fr
  excerpt: 'Part of a Kapitalis op-ed exchange (Fékih 08-06, Cherfouh 08-09) reviving the Tunisia–Algeria border dispute: the 1970 bornage convention, the "Borne 233" dispute, the El Borma oilfield, and TransMed gas-transit dependence. Includes the concrete fact that on 4 August 2026 STEG (PDG Fayçal Trifa) sent a letter of thanks to Sonelgaz for emergency electricity supply. Commentary and memory-war debate; no new state action.'
