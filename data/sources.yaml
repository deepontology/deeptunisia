- id: frwiki-othman-battikh
  title: Othman Battikh
  publisher: French Wikipedia
  url: https://fr.wikipedia.org/wiki/Othman_Battikh
  tier: 3
  lang: fr
  excerpt: "Mufti of the Republic twice: 1 November 2008-6 July 2013 (succeeding Kameleddine Djaït, succeeded by Hamda Saïed) and 12 January 2016-25 October 2022 (died in office). Minister of Religious Affairs 6 February 2015-12 January 2016. Born 17 April 1941 Tunis, died 25 October 2022."
  excerpt_fr: "Mufti de la République à deux reprises : 1 novembre 2008-6 juillet 2013 (succédant à Kameleddine Djaït, remplacé par Hamda Saïed) et 12 janvier 2016-25 octobre 2022 (mort en fonction). Ministre des Affaires religieuses du 6 février 2015 au 12 janvier 2016. Né le 17 avril 1941 à Tunis, mort le 25 octobre 2022."
  excerpt_fr_by: machine
  excerpt_ar: "مفتي الجمهورية مرتين: من 1 نوفمبر 2008 إلى 6 جويلية 2013 (خلفًا لكمال الدين جعيط وخلفه حمدة سعيد) ومن 12 جانفي 2016 إلى 25 أكتوبر 2022 (توفي في المنصب). وزير للشؤون الدينية من 6 فيفري 2015 إلى 12 جانفي 2016. وُلد في 17 أفريل 1941 بتونس وتوفي في 25 أكتوبر 2022."
  excerpt_ar_by: machine
