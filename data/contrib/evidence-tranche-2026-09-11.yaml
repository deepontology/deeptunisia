#   aljazeera-ghannouchi-speaker-2019, dw-clampdown-2025).
# Failure vocabulary (must not be collapsed):
#   - "12-35 is a range across the 8 July 2025 first-instance sentences, not a single sentence."
#   - "BBC states Kamel Guizani was sentenced in absentia on 8 July 2025 without publishing
#      his term; the 35-year term against him is confirmed at the 2 February 2026 appeal in
#      a TAP-derived report, not in the 8 July text."
#   - "'political conflict' is a record label: the fetched passages state the freeze, the
#      immunity suspension, the prosecution and the detention; no fetched document uses
#      that characterisation."
#   - "TAP is client-gated beyond the headline and the chapô; those are the published,
#      quotable text."
#   - "Slim Ennaceur's youth swimming titles (minime/cadet) are not stated by the three
#      cited obituary/encyclopaedia sources fetched here."
