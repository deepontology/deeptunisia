# reverify-2026-10-01 — P0 #6 re-verification batch: 15 state officeholder roles
#
# MISSION: the build downgraded 34 `ongoing` officeholder positions to
#   `last-verified` because no source on the record is dated within 90 days of
#   the research cutoff (2026-09-30; window opens 2026-07-02). This file
#   re-verifies the 15 state roles of the first batch (SOE/media owners are a
#   later batch): who holds each role as of 2026-09-30, with either an
#   in-window source attached to the unchanged holder, or a sourced end date
#   plus a sourced start for the successor, or an honest non-finding.
# SOURCES USED (all retrieved 2026-10-01; full text fetched where marked
#   [fetched], otherwise the verbatim excerpt is the live page's search-index
#   highlight — same caveat applies to every row so marked):
#   - JORT decree text via the 9anoun mirror [fetched] — tier 1
#     https://9anoun.tn/fr/kb/jorts/jort-2026-025-165c3/decret-ndeg-2026-30-du-2-mars-2026-portant-nomination-de-la-premiere-presidente-du-tribunal-administratif-2
#   - La Presse de Tunisie (est. 1936, national daily) — tier 3
#     https://www.lapresse.tn/ (articles dated 2026-07-14, 2026-07-18 [fetched],
#     2026-03-03, 2026-09-25)
#   - Mosaïque FM, L'Economiste Maghrébin, Business News, Webdo, El Watan,
#     Leaders, WMC DirectInfo, Nawaat, Hivos EuSee — tier 3 (established
#     journalism / established organisational publications)
#   - Association des magistrats tunisiens, report to the UIM (Baku, Oct 2025)
#     and the INTOSAI Journal — tier 2 (institutional primary documents)
#   - Univers News — tier 4 (single outlet)
#   Tiers follow the ladder as written (established journalism = 3). The
#   registry itself grades the same publisher 3 and 4 in different rows (La
#   Presse is 4 in data/sources.yaml today); that inconsistency is flagged for
#   editorial reconciliation here, not silently fixed.
# FAILURE VOCABULARY (must not be collapsed):
#   - "an in-window article names the person in the role" is not "a JORT
#     appointment decree was located": no gazette act was fetched for any
#     incumbent's continuing tenure in this batch. The one decree fetched
#     (n° 2026-30 du 2 mars 2026) concerns a successor's appointment, not the
#     predecessor's cessation.
#   - "the successor's dated appointment bounds the predecessor's end" is not
#     "a cessation decree names the holder": used for Grissiaa (Guiza's decree,
#     2 March 2026) and Taboubi (Selmi's election, 28 March 2026) — both graded
#     B / basis inferred, per the house convention (cf. p-soe-sonede-ahmed-soula
#     in jort-2026-09-25.yaml).
#   - "a one-day boundary is not an exact date": Kchaou left "fin septembre
#     2023" (Univers News) vs "October 1, 2023" (Nawaat) — the end token is
#     "~2023-10", never a chosen day.
#   - "a dateless official page" is not "a dated source": the BTK board page
#     (btkbank-elloumi-board, tier 1, fetched 2026-10-01, still lists Faouzi
#     Elloumi as board chairman) carries no date and therefore cannot enter the
#     90-day window; it does not restore `ongoing` for p-econ-faouzi-elloumi.
#   - "styling by an international journal" is not "an appointment decree":
#     the INTOSAI Journal (30 Apr 2026) styles Fadhila Gargouri "Premier
#     Président de la Cour des comptes" while AMT/WMC (10 Feb 2026) still report
#     the post vacant — recorded as a conflict flag, not as a position.
#   - REJECTED: tixup.com "Tunisie: Remaniement au sein du corps judiciaire"
#     (surfaced 2026-03-08) listing Ibrahim Mejri as first president of the
#     Court of Cassation — Mejri held that post until 2014 (Nawaat 2013, conference
#     records); the page is a scraped aggregator with contradictory timestamps
#     and no verifiable issue date. Tier 5 lead, not evidence for 2026.
#   - Corroboration located but NOT registered in this batch (attach later if a
#     second citation is wanted): nessma.tv 2026-07-23 and WMC 2026-06-19
#     (Nouri/Intérieur), Mosaïque 2026-07-16 and African Challenges 2026-07-20
#     (Jaffel), WMC/TAP 2026-07-22, Réalités 2026-07-31, AMI Mauritania
#     2026-09-15 (Bouhali), Tustex 2026-09-30 (BCT), Radio Express 2026-07-20
#     (Bethabet), Kapitalis 2026-09-11 (UGTT), Tuniscope 2026-03-03 and Webdo
#     2026-03-03 (Guiza).
#   - The justice-minister "alarm" (roadmap P0 #6: last attested 2021) is a
#     NON-FINDING in the other direction: Leïla Jaffel never left office; the
#     gap was citation, not turnover.
#   - Patch rows (patch_reason) are merge instructions, not whole records;
#     fields not shown (notes/translations/long reasoning) stay as they are in
#     the canonical row.
# CANDIDATES ARE PROPOSALS, NOT GRAPH DATA. Nothing canonical was changed (P4).

sources:
  - id: lapresse-nouri-interieur-2026-07-18
