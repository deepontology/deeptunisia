    tier: 3
    lang: fr
    excerpt: >-
      Le ministre de l'Intérieur, Khaled Nouri, a réaffirmé la volonté de son
      département de poursuivre la modernisation de l'appareil sécuritaire afin
      de bâtir un système “moderne et efficace”, conciliant performance
      opérationnelle, respect de l'État de droit et protection des droits de
      l'Homme. S'exprimant vendredi à l'École nationale de la Garde nationale
      de Bir Bouregba, à l'occasion de la cérémonie de remise des diplômes de
      la 38e promotion des officiers de l'École d'application…
