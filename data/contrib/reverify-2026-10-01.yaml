      Cassation—the highest jurisdiction in the judicial hierarchy—has remained
      vacant. … The authority lacks a president, a consequence of the unfilled
      position of first president of the Court of Cassation, who is also to
      serve as president of the Provisional High Judicial Council. … the Council
      of Financial Magistrates is chaired by the president of the Court of
      Auditors, … whose president—also the president of the Court of
      Auditors—was retired two years ago and not replaced.

