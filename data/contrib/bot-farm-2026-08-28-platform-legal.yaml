  - id: cc-isie-art143-207-votes-2019-verify-2026-08-28
    entity: null
    claim: >-
      For the 6 October 2019 legislative election, ISIE applied Article 143 of the electoral law to partially annul results of Aich Tounsi (3ich Tounsi) in the France-2 diaspora constituency, withdrawing 207 votes for Facebook campaign advertising detected via ISIE social-media monitoring (political advertising prohibited during campaign). The seat consequently shifted to Courant Démocratique (Attayar). This is the sole quantified Art.143 application for sponsored Facebook content in the EU EOM final report.
    assessment: >-
      Documented institutional sanction: EU EOM FR final p54 records the 207-vote withdrawal explicitly as a Facebook advertising violation, linking it to ISIE monitoring. Carter Center 2019 final (p47+) corroborates ISIE authority to apply Art.143 for spending/silence breaches and notes ISIE decision 2019-22 disclosure rule, but Carter does not cite the 207 figure — EU EOM is the source for the number. Global Voices Oct 2019 similarly notes the cancellation without detail on method. Confidence B as cross-institutional documented, but keep note this is not a bot count.
    confidence: B
