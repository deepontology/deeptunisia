# Platform transparency & legal track — bot-farm 2016-2026 supplement
# Mission: Exhaustive negatives + legal verification for window 2016-2026.
#   Re-check Meta Threat Reporting index (CIB 2018-2026 + quarterly Adversarial Threat Reports),
#   X (Twitter) Transparency country/global reports, Google TAG bulletins, ISIE reports list (2019+2024),
#   ISIE-HAICA joint decision scope, Carter Center/EU EOM disinfo annexes, Decree Law 54 text,
#   and implementing decrees 2023-2024. Document absence explicitly.
# Sources used (publisher, URL, tier):
#   - Meta Transparency Center — https://transparency.meta.com/metasecurity/threat-reporting — Tier 2 (platform/institutional) — live webfetch 2026-08-28 (body captured, updated Aug 27 2026)
#   - X Transparency — https://transparency.x.com/en/reports/countries/tn — Tier 2 — live webfetch 2026-08-28 (empty body, country page is info-requests/removal-requests only) + websearch site:transparency.x.com Tunisia
#   - X Transparency global — https://transparency.x.com/en/reports/global-reports/2025-transparency-report — Tier 2 — webfetch 2026-08-28 empty (no Tunisia bot count)
#   - Google Threat Analysis Group — https://blog.google/threat-analysis-group/ + websearch "Google TAG Tunisia" / "Google threat analysis group Tunisia 2019 2020" — Tier 2 — 2026-08-28 no Tunisia bulletin found
#   - ISIE Rapports — https://www.isie.tn/fr/isie/rapports-des-elections-et-du-referendum/ — Tier 1 — live webfetch 2026-08-28 (HTML list captured; PDFs are Arabic originals, not fetched to text)
#   - ISIE-HAICA 2019 joint decision context — via Global Voices 2019-12-09 + Carter Center 2020 + EU EOM 2019 FR final report — Tier 2/3 — websearch + webfetch 2026-08-28
#   - legislation-securite.tn (DCAF) — https://legislation-securite.tn/latest-laws/decret-loi-n-2022-54-du-13-septembre-2022-relatif-a-la-lutte-contre-les-infractions-se-rapportant-aux-systemes-dinformation-et-de-communication/ — Tier 1 (gazette mirror) — live webfetch 2026-08-28 (full text Art.1-38 captured) ; https://legislation-securite.tn/law/105306 returned 404 on 2026-08-28, alternative DCAF latest-laws URL used
#   - Websearch "Decree Law 54 Tunisia implementing decree 2023 2024" — Tier 3 — 2026-08-28 no implementing decree found (only commentary/analysis)
#   - Websearch "X information operations Tunisia" / "X IO dataset Tunisia" — Tier 3 — 2026-08-28 no Tunisia IO archive entry found (only Meta May 2019 Archimedes + May 2020 UReputation)
#   - Prior outbox anchors reused: meta-transparency-threat-index, x-transparency-tunisia-2025, isie-reports-list-2019, jort-decree54-2022-09-13
# Failure vocabulary (must not be collapsed):
#   - "no published enumeration is a documented negative, not evidence of absence"
#   - "sponsored pages ≠ bot count — Art.143 sanctions are spending/silence sanctions, not a bot enumeration"
#   - "global network includes Tunisia is not a Tunisia count"
#   - "meta index lists titles only — Tunisia absent from title means no Tunisia-origin CIB entry, verifiable by reading index"
#   - "Art.24 false news/rumours criminalisation contains no bot number"
#   - "implementing decree search negative is absence until proven by JORT publication"
# Candidates are proposals, not graph data. Outbox only — no canonical data, UI, or script changed.

