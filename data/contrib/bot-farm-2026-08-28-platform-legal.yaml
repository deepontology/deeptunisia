    sources:
      - eu-eom-tunisia-2019-final-fr
      - carter-center-tunisia-2019-final
    notes: "Art.143 scope clarification: 'substantial and decisive' standard leaves characterization to ISIE subject to Administrative Court review (IRI/IFES context); 207 assessment method not published."

  # Decree Law 54 — legal track verification (Tier 1)
  - id: cc-decree54-art24-no-bot-enumeration-2022-verify-2026-08-28
    entity: null
    claim: >-
      Decree-Law No. 2022-54 of 13 September 2022 (JORT No.103, 16 Sep 2022) — full text mirrored at legislation-securite.tn — criminalises production/spreading false news/data/rumours/forged documents via info systems (Article 24: 5 years imprisonment + 50,000 TND, doubled if target is public official/assimilé; second paragraph same for defamation/reputation/hate-speech use). It imposes retention ≥2 years (Art.6 by joint ministerial order by nature of service) and cooperation/interception obligations (Arts 7–15) but contains no enumeration of bots, fake accounts, or farm size. The decree is offence definition, not a census.
    assessment: >-
      Tier 1 verification: entire decree body (Arts 1–38) fetched 2026-08-28 via DCAF latest-laws mirror; text of Art.24 verbatim in French and Arabic matches prior outbox citation (jort-decree54-2022-09-13). Title law/105306 URL returned 404, so mirror used — content identical to JORT. Crucially, no article counts bots. Article 6 explicitly delegates retention duration to future joint ministerial order (Defence/Interior/Justice/Telecoms) — explains why Art.6 has no fixed number beyond the floor of 2 years. Falsifiable by an amendment or implementing decree that adds bot metrics, but decree itself contains none.
    confidence: A
    basis: documented
    sources:
      - decree54-dcaf-2022-09-13
    notes: "Tier 1 — gazette/mirror text. Enforced provisions include extraterritorial jurisdiction (Art.34) and corporate liability (Art.32). Vagueness of 'false news/rumours' is analytical commentary (ICJ/HRW/Amnesty), not decree text."

  - id: cc-decree54-no-implementing-decree-2023-2024-verify-2026-08-28
    entity: null
    claim: >-
      No JORT-published implementing/application decree for Decree Law 54 fixing the Art.6 retention modalities or publishing Article 24 enforcement statistics was surfaced by websearch on 2026-08-28 for 'Decree Law 54 Tunisia implementing decree 2023 2024' (alternative queries in French/Arabic not exhaustive). The search returned only analytical/legal commentary and case coverage (HRW Dec 2023 Chaima Issa/Zneidi examples, ICJ briefing, CPJ/ARTICLE19), not a JORT implementing text.
    assessment: >-
      Documented negative on legal sub-track: absence is in searchable web/JORT mirror, not proof none exists under different official title (Arabic 'قرار مشترك' etc.). DCAF database search 2026-08-28 only returned the decree itself, not a subsequent joint order. Keep as C (single search pass) — needs JORT systematic scan by human reviewer to upgrade to B. No bot count would be expected in such an implementing order in any case (it would fix durations/procedures).
    confidence: C
    basis: reported
    attributed_to: Websearch aggregate negative (no JORT result) on 2026-08-28
    sources:
      - decree54-implementing-negative-2026-08-28
      - decree54-dcaf-2022-09-13
    reasoning: "Searched index X (legislation-securite.tn/JORT mirror + websearch for implementing decree 2023-2024), found no entry publishing Art.6 joint order or Art.24 statistics; therefore no implementing decree enumeration is retrievable via these indexes as of 2026-08-28."
    falsifiable_by: "A JORT-published arrêté conjoint (Ministres Défense/Intérieur/Justice/Télécoms) dated 2023-2024 fixing retention periods per Art.6, or a JORT statistical annex on Decree 54 prosecutions."

