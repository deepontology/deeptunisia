world_claims:
  # Meta transparency — exhaustive negative (platform)
  - id: cc-meta-threat-index-no-additional-tunisia-2018-2026-verify-2026-08-28
    entity: null
    claim: >-
      Meta's public Threat Reporting index (CIB 2018–2026 + quarterly Adversarial Threat Reports Q2 2022–H2 2026) lists no additional Tunisia-origin coordinated inauthentic behavior takedown beyond the two already documented for 2018–2026: May 2019 Archimedes (origin Israel, Tunisia among six African targets, not origin Tunisia) and May 2020 UReputation (origin Tunisia, 446 Pages / 182 FB accounts / 96 Groups / 60 events / 209 IG accounts). The index titles contain no other 'Tunisia' entry in this window.
    assessment: >-
      Documented negative on disclosure: live webfetch of https://transparency.meta.com/metasecurity/threat-reporting on 2026-08-28 captured full index updated Aug 27 2026. Manual title scan shows no Tunisia-origin entry besides the two anchors whose numbers are quoted in prior outbox (265 global for Archimedes, 993 total for UReputation). Quarterly Adversarial Threat Report titles (Q3 2022, Q4 2022, Q1–Q3 2023, Q4 2023, Q1–Q3 2024, Q4 2024, H1+H2 2026) likewise show no Tunisia heading. This is absence of enumeration in platform disclosure, not proof of zero activity. Falsifiable by Meta publishing a new CIB entry with 'Tunisia' origin or by opening a quarterly PDF that embeds a Tunisia network not reflected in its title.
    confidence: B
    basis: documented
    sources:
      - meta-threat-reporting-2026-08-28
    reasoning: "Searched index X (full title list 2017–2026), found no entry beyond the two dated anchors; therefore no additional Tunisia-origin CIB enumeration is published in this source for window 2018–2026."
    falsifiable_by: "A Meta CIB/Adversarial Threat Report dated 2018-2026 with Tunisia as origin (or Tunisia slice table) that is absent from current index scan."

