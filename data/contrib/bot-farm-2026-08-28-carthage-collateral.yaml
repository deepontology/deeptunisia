  - id: dfrlab-operation-carthage-2020-06-05
    title: "Operation Carthage: How a Tunisian Company Conducted Influence Operations in African Presidential Elections"
    publisher: DFRLab / Atlantic Council
    date: 2020-06-05
    url: https://www.atlanticcouncil.org/wp-content/uploads/2020/06/operation-carthage-002.pdf
    tier: 2
