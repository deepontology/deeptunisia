    live_verified: 2026-08-28
    live_status: "200 — curl + pdftotext captured (webfetch unsupported type but curl succeeded); 30-page PDF captured"
    archive_url: https://web.archive.org/web/*/https://www.atlanticcouncil.org/wp-content/uploads/2020/06/operation-carthage-002.pdf
    excerpt: "A Tunisia-based company operated sophisticated campaign involving multiple platforms and websites to influence Tunisia 2019 presidential election and other African elections. DFRLab investigation began Sep 2019, uncovered dozens of assets with connections to UReputation. On June 5 2020 Facebook announced >900 assets: 182 user accounts, 446 pages, 96 groups, 209 Instagram accounts. Operation involved multiple Francophone websites some >5 years old. Targeted people in 10 African countries (Chad, Comoros, Congo-Brazzaville, Côte d'Ivoire, Gambia, Guinea, Mali, Niger, Senegal, Tunisia per p19). Supported Nabil Karoui (Tunisia 2019), Faure Gnassingbé (Togo Feb 2020 — Tous Faure, ~30k + 27k follower pages, unir.ureputation.net mirror), Henri Konan Bédié (CIV Oct 2020 — 50+ assets, 20+ pages pre-Mar 2020, 60k followers, hkb2020.com), Azali Assoumani (Comoros Mar 2019 — CERPMA mock on dev.ureputation.net/Le Moronien). Francophone sites include Revue de l'Afrique (revue-afrique.com, reg May 2014 via Digital Kevlar), Afrika News, AfrikanPost, Maghreb-Info, Actu-France, Eco-Mag — >2 dozen pages removed, same-day launches 8 Jul 2016, footers identical, fictitious bios + suspended Twitter handles. Fake News Checking page (launched 29 Aug 2019, co-founder Moëz Bhar) linked to @360_tn (created Feb 2015, renamed, new @360_tn empty); Bar LinkedIn cites ureputation.net since Jun 2014. kaissaied.com WHOIS: DBB, Avenue Roseleo, Barcelona (near-identical to Digital Big Brother Carrer del Rosselló 218, operator Lotfi Bel Hadj); hkb2020.com WHOIS: DBB, Avenue Roseleo (Sep 2019). Emna Raissi registered lotfibelhadj.com via 'Urepuation' (misspelling). $331k ad spend primarily EUR/USD."

  - id: dfrlab-medium-carthage-2020-06-05
    title: DFRLab uncovers Tunisia-based political influence operation on Facebook
    publisher: DFRLab / Medium
    date: 2020-06-05
    url: https://medium.com/dfrlab/dfrlab-uncovers-tunisia-based-political-influence-operation-on-facebook-8c4d16b90744
    tier: 2
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured"
    excerpt: "On June 5 2020, after its own investigation, Facebook announced it had taken down more than 900 assets affiliated with UReputation: 182 user accounts, 446 pages, 96 groups, 209 Instagram accounts. Operation involved publication of multiple Francophone websites, some going back more than five years. Influence operation designated Operation Carthage; based around inauthentic Facebook pages targeting 10 African countries. According to open source + assets provided by Facebook, operation supported Togolese President Faure Gnassingbé Feb 2020 reelection, former Ivorian President Henri Konan Bédié campaign for Oct 2020 Côte d'Ivoire election. Approximately 3.8M Facebook accounts followed one or more pages, with nearly 132,000 joining groups and over 171,000 following Instagram accounts. Ads ~$331k (detailed report cost). Quote: 'individuals used fake accounts to masquerade as locals, post/like own content, drive to off-platform sites, manage groups/pages posing as independent news entities.' 'Some pages engaged in abusive audience building changing focus non-political→political including substantial name/admin changes.' 'Although people attempted to conceal identities, investigation found links to Tunisia-based PR firm UReputation.' Context: May 2019 Archimedes Group 250+ assets in 13 countries; Aug 2019 Egypt/UAE takedown."

  - id: article19-tunisia-accounts-2020-06-15
    title: "Tunisia: Confusion over deactivated Facebook accounts"
    publisher: ARTICLE 19
    date: 2020-06-15
    url: https://www.article19.org/resources/tunisia-confusion-over-deactivated-facebook-accounts/
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured"
    excerpt: "Up to 60 Facebook accounts were de-activated without warning between 29 and 30 May [2020]. Facebook told Guardian 4 Jun it was a 'technical error: Due to a technical error we recently removed a small number of profiles, which have now been restored. We were not trying to limit anyone's ability to post or express themselves, and apologise for any inconvenience.' Guardian reported only some reinstated. Facebook May 2020 CIB Report then stated it deliberately removed 446 Pages, 182 accounts, 96 Groups, 60 events and 209 Instagram accounts linked to UReputation. It is not clear whether accounts disabled at end of May were accidentally removed as part of investigation. Affected include journalist Haythem El Mekki, blogger Sarah Ben Hamadi, musician Bendir Man (Baryem Kilani), Nassim Belhadjali co-manager Radyoon رديون (facebook.com/radyoon.tn — participative musical web radio since 2012, non-lucrative, platform dispatching Tunis/Paris/Cairo/Geneva/Casablanca): 'There is a lot of damage on the Tunisian art scene. Our page Radyoon was deleted along with many other pages of Tunisian artists, graphic designers, illustrators, DJs, producers, rappers etc. Contrary to Dfrlab investigation, in Facebook press release and in press, the deleted pages are not pages related to Ureputation. Radyoon is a musical and participative web radio active since 2012.' Also Deena Abdelwahed, Soudani Jawher (Vajo), Hamdi Toukabri (Downtown Vibes), Emen Hattab, Haythem Briki — all deny political operation, describe loss of livelihood during COVID-19. ARTICLE 19: 'We are calling for Facebook to look urgently into what is happening.'"

  - id: nawaat-operation-carthage-2020-06-16
    title: "«Operation Carthage»: Nabil Karoui and lobbyist Lotfi Bel Hadj busted by Facebook"
    publisher: Nawaat
    date: 2020-06-16
    url: https://nawaat.org/2020/06/16/operation-carthage-nabil-karoui-and-lobbyist-lotfi-bel-hadj-busted-by-facebook
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured"
    excerpt: "Following Facebook removal of Tunisian users' accounts overnight May 29-30, many expressed astonishment. Following intervention of Facebook Trusted Partners such as I Watch, a number of removed accounts were reactivated. One week later Atlantic Council DFRLab revealed source: UReputation — 'disinformation as a service' for Nabil Karoui Tunisia 2019. Report identifies 446 pages, 182 accounts, 96 groups, 60 events and 209 Instagram accounts majority fake linked to UReputation. Politicians who benefited: Nabil Karoui plus Comorian Azali Assoumani, Ivorian Henri Konan Bédié (Oct 2020), Togolese Faure Gnassingbé (Feb 2020). UReputation describes as 'Monitoring, cyber-influence, intelligence and big data analysis influence traditional communication. UReputation sculpts contours of your digital fingerprint.' Legal status LLC via National Registry of Enterprises. Nawaat sources in digital comms and close to Karoui identify owner as French-Tunisian lobbyist Lotfi Bel Hadj (Alternative Carbon, Greenrock Funds Luxembourg, Observatoire économique des banlieues, 'Bible du Halal' 2015, Digital Big Brother incubator). Not first use: May 2019 Facebook removed >250 accounts linked to Archimedes Group (13 countries incl Tunisia)."
    notes: "Also links Lotfi Bel Hadj political rapprochements Ennahdha 2014 / Tahya Tounes Mar 2019 before Karoui/Qalb Tounes."

  - id: accessnow-carthage-transparency-2020-06-12
    title: "Transparency required: is Facebook's effort to clean up 'Operation Carthage' damaging free expression in Tunisia?"
    publisher: Access Now
    date: 2020-06-12
    url: https://www.accessnow.org/transparency-required-is-facebooks-effort-to-clean-up-operation-carthage-damaging-free-expression-in-tunisia
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured"
    excerpt: "At least 60 accounts mysteriously disabled at end of May [2020]. On 29 May a number reported disabled without warning: 'you are not eligible to use Facebook and decision is final.' Local Tunisian NGOs compiled list of over 60 disabled accounts. Some belonged to influencers/journalists/activists including Haythem El Mekki, Baryem Kilani (Bendirman), Sarah Ben Hamadi; many private accounts not large following; some IG and administered Pages also disabled. After days of silence Facebook told Guardian 'due to technical error we recently removed a small number of profiles, which have now been restored.' Thanks to IWatch (local trusted Facebook partner) and Access Now Digital Security Helpline, 28 accounts had been restored, yet Facebook had not explained further nor directly communicated with impacted users including those restored. 5 Jun Atlantic Council DFRLab investigation revealed UReputation sophisticated disinformation campaigns to influence presidential elections (Tunisia 2019, Togo Feb 2020, Côte d'Ivoire Oct 2020). Same day Facebook announced removed >900 assets affiliated with UReputation: 182 user accounts, 446 pages, 96 groups, 209 Instagram accounts, violating policy against foreign interference (CIB on behalf of foreign entity). 'Were any of the 60 linked to Operation Carthage? In absence of explanation, we can only speculate these may be collateral damage for Operation Carthage clean-up, since Facebook report says company routinely uses automated systems to detect/disable fake accounts.' Notes disparity vs US identity verification and ad library transparency (MENA excluded except Israel). In Sep 2019 Egypt operation, Facebook disabled Hend Nafea, Ganzeer, Ahmad Hasan al-Sharqawi as prior collateral example."

