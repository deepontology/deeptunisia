  - id: cc-bot-carthage-dispute-technical-vs-deliberate-2026-08-28
    entity: null
    claim: >-
      The sequencing of Facebook explanations for late-May 2020 Tunisian deactivations — 'technical error, small number restored'
      (4 Jun via Guardian relay) followed by 'deliberate removal of 446/182/96/60/209' (5 Jun CIB Report) — leaves open
      whether the ~60 collateral complaints were false positives of the UReputation enforcement or an unrelated error,
      with no reconciliation published by Facebook as of the Access Now / ARTICLE 19 reports (12–15 Jun 2020).
    assessment: >-
      Inferred framing synthesis across primaries: observes that both statements come from same actor (Facebook) one day
      apart with different numbers and mechanisms (small number / error vs 993 / CIB graph detection + DFRLab OSINT).
      Access Now explicitly asks 'Were any of the 60 linked to Operation Carthage? We can only speculate collateral damage
      since Facebook routinely uses automated systems.' ARTICLE 19 says 'it is not clear whether accounts disabled at end of
      May were accidentally removed as part of investigation.' Inference retains open status rather than choosing a side;
      keeps censorship risk and due-process concern visible while not negating documented CIB network.
    confidence: C
    basis: inferred
    attributed_to: Research synthesis across Meta, ARTICLE 19, Access Now, Nawaat
    reasoning: >-
      Both Facebook statements are documented (Guardian relay exact quote and CIB Report breakdown). Dates 29–30 May (collateral)
      and 5 Jun (report publication) create necessary temporal overlap; Access Now 12 Jun still reports no direct Facebook
      communication to impacted users and counts only 28 restorations. No source merges the two lists handle-by-handle, so
      asserting identity or distinctness without per-handle audit would be invented data.
    falsifiable_by: >-
      A Facebook statement reconciling the two windows with per-handle audit, a transparency report mapping which of the ~60
      appear (or not) in the 182/446 enforcement lists, or a trusted-partner disclosure of overlap percentage.
    sources:
