  - id: dfrlab-archimedes-2019-05-17
    title: Inauthentic Israeli Facebook Assets Target the World
    publisher: DFRLab / Atlantic Council (Medium)
    date: 2019-05-17
    url: https://medium.com/dfrlab/inauthentic-israeli-facebook-assets-target-the-world-281ad7254264
    tier: 2
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch captured 2026-08-28"
    excerpt: "Facebook announced May 16 it removed 265 Facebook and Instagram assets including accounts, pages, groups, events linked to Archimedes Group. DFRLab, alerted by Facebook beforehand, found pages posting political content, posing as news/leak organizations. Tunisia examples: 'Stop à la désinformation et aux mensonges' created March 2019 ~11k followers; 'Tunisie Mon amour' used Morocco/Turkey images as Tunisia. Targeted at least 13 countries, >2.8M followers. No single ideological theme — profit-driven. Ad spend ~$812k in BRL/ILS/USD."
