    excerpt: "Au total, onze pages sont concernées. Les 11 pages incriminées ont été créées entre le 17 janvier et le 12 mars 2019 et cumulaient près de 500.000 abonnements (infographie précise: 494 865 likes). Le contenu analysé englobe 359 publications ayant généré plus d'1 million d'interactions et 36 vidéos ayant cumulé près de 8 millions de vues. Inkyfada n'a pu accéder qu'aux dernières publications de 'La Voix tunisienne' via cache. Les pages critiquent de nombreuses personnalités mais jamais Nabil Karoui; 5 pages partagent contenu favorable à Nessma TV / Khalil Tounes. DFR Lab, partenaire de Facebook, a sauvegardé quasi-totalité du contenu avant désactivation."
