    date: 2020-03-23
    url: https://demtech.oii.ox.ac.uk/research/posts/the-challenges-of-monitoring-social-media-in-the-arab-world-the-case-of-the-2019-tunisian-elections/
    tier: 2
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch captured 2026-08-28"
    excerpt: "Tunisian civil society raised alarms about disinformation/hate speech in 2019 elections but monitoring was limited and uncoordinated; Facebook ad library did not archive electoral/political ads in Tunisia; limited Facebook data access forced manual gathering and lack of CrowdTangle for many groups; Tunisian data-privacy/election laws insufficient for digital age. Context for why ATIDE/DRI sample-based 38.5% finding was produced under constrained access."

world_claims:
  - id: cc-bot-archimedes-global-2019-verify-2026-08-28
    entity: null
    claim: >-
      Meta's 16 May 2019 CIB announcement reports 265 total assets removed — 65 Facebook accounts + 161 Pages + 23 Groups + 12 events + 4 Instagram accounts = 265 — originating in Israel (Archimedes Group) and focused on Nigeria, Senegal, Togo, Angola, Niger and Tunisia plus LATAM/SEA; About 2.8M accounts followed one or more Pages, ~5,500 joined a Group, ~920 followed an IG account; ~$812,000 ad spend Dec 2012–Apr 2019 paid in BRL/ILS/USD.
    assessment: >-
      Live-reverified 2026-08-28: body fetched via webfetch confirms all six elements verbatim (265 total, exact 65/161/23/12/4 split, country list including Tunisia, follower totals, $812k with three currencies and date window). Arithmetic 65+161+23+12+4=265 verified. This is global-including-Tunisia, not a Tunisia count — source does not publish Tunisia slice. Shared with DFRLab/Nawaat who independently quote same totals. Falsifiable by Meta publishing country breakdown or revising Detailed Report totals.
    confidence: A
    basis: documented
    sources:
      - fb-cib-israel-2019-05-16
      - dfrlab-archimedes-2019-05-17
      - nawaat-archimedes-tunisia-2019-05-27
    disputes:
      - claim: 265 is the Tunisia bot-farm size for 2019
        held_by: Popular retelling (non-specific)
        status: rejected
        assessment: Platform primary lists Tunisia as one of six named African focus countries and later notes at least 13 countries targeted — global total cannot stand as Tunisia total; Nawaat 2019-05-27 explicitly states Tunisia-specific count was not disclosed at announcement.
        source: fb-cib-israel-2019-05-16
    notes: "verified — no delta to outbox 2026-08-28; failure vocabulary enforced: Tunisia share = ? until Meta country slice published"

  - id: cc-bot-archimedes-inkyfada-11pages-2019-verify-2026-08-28
    entity: null
    claim: >-
      For the Tunisia subset of the Archimedes takedown, Inkyfada (via DFRLab dataset) counts 11 Pages created 17 Jan–12 Mar 2019 holding 494,865 followers (~500k) as of 15 May 2019 (range 9,083 to 104,268 per Page); their 359 posts generated >1M interactions and 36 videos gathered ~8M views (with 'Tout sauf Chahed' 35 videos >7.6M views); posts criticised dozens of politicians but never attacked Nabil Karoui / Safi Saïd on the 'Marre de la politique' Page, and 5 Pages shared content favourable to Nessma TV / Khalil Tounes; Inkyfada accessed quasi-totality via DFRLab pre-takedown save except 3 Pages partial via cache.
    assessment: >-
      Live-reverified 2026-08-28 via full-body fetch of both /fr/ and /en/ versions: creation window 17 Jan–12 Mar, infographic 494,865 likes, 359 publications / >1M interactions / 36 videos / ~8M views, and Karoui-never-attacked pattern all verbatim. Language states Pages, not accounts — do not aggregate with 65 accounts. Basis remains journalistic analysis of DFRLab's dataset, not platform-published country slice — thus C. Falsifiable by the 11 Page IDs or Meta's Tunisia breakdown. Enrichment: DFRLab medium piece corroborates method (Facebook alerted DFRLab before takedown to allow save) and Tunisia examples ('Stop à la désinformation' >11k followers, 'Tunisie Mon amour' misattributed images).
    confidence: C
    basis: reported
    attributed_to: Inkyfada (Monia Ben Hamadi, via DFRLab dataset), corroborated by DFRLab and Global Voices summaries
    sources:
      - inkyfada-facebook-israel-2019-06-03
      - dfrlab-archimedes-2019-05-17
      - nawaat-archimedes-tunisia-2019-05-27
    notes: "verified — no delta; textise/Global Voices fallback not needed — Inkyfada body fetched and confirms numbers; paywall not encountered; Inkyfada notes 3 Pages not entirely saved, so completeness qualifier retained"

  - id: agg-bot-prevalence-2019-atide-385pct-verify-2026-08-28
    entity: null
    claim: >-
      Between 15 May and 15 July 2019, unofficial Facebook Pages with no declared political affiliation or purpose — self-categorised as entertainment or satirical — produced 38.5% of political messages in the ATIDE/DRI study sample; DRI posits possible coordination and calls clusters sharing similar content within time windows a 'page network', becoming more active as elections approached.
    assessment: >-
      Not live-reverified 2026-08-28: PDF URL returned HTTP 403 Cloudflare challenge (both webfetch and curl -I), so excerpt and method details retain citation from outbox 2026-08-28 (Tier 2 ATIDE/DRI Report One dated 2019-09-11). Confidence stays B as institutional research but flagged needs-primary-source for human to re-fetch via alternative host or authenticated copy. The 38.5% is share of messages in a defined sample/window, not an enumeration of bots or accounts — do not convert to a farm size. Sample definition, page-network method, and window (15 May–15 Jul 2019) are as previously cited. OII DEMTECH memo 2020-03-23 contextualises why sample-based monitoring was used (ad library did not archive Tunisia political ads, no CrowdTangle for many groups, manual gathering). Falsifiable by re-fetching PDF methodology section.
    confidence: B
    basis: documented
    sources:
      - dri-atide-tunisia-social-media-2019-09-11
      - oii-demtech-tunisia-monitoring-memo-2020-03-23
    notes: "live fetch 403 — needs-primary-source; no correction found in websearch 2026-08-28 — verified excerpt unchanged; failure vocabulary enforced: 38.5% is not a bot count"

  - id: cc-bot-archimedes-tunisia-slice-question-2026-08-28
    entity: null
    claim: >-
      The Tunisia-specific scale of the Archimedes network remains undisclosed by Meta; the only Tunisia-sliced enumeration found for 2019 is Inkyfada's 11 Pages (~500k followers), not an account count, and other contemporary explainers (Nawaat 2019-05-27) noted 'published information about Tunisia are quite scarce' with no page/account breakdown at announcement.
    assessment: >-
      Documented negative on enumeration: Meta's announcement gives only the global 265 breakdown and lists Tunisia among focus countries without country slice; DFRLab's global corroboration likewise does not publish Tunisia count; Inkyfada supplies Page count only; OII memo describes systemic data-access constraints that explain scarcity. Keep Tunisia slice as ? per failure vocabulary. This guards against inflating 11 Pages to 265 accounts or treating 38.5% as Archimedes share.
    confidence: B
    basis: documented
    sources:
      - fb-cib-israel-2019-05-16
      - inkyfada-facebook-israel-2019-06-03
      - nawaat-archimedes-tunisia-2019-05-27
      - oii-demtech-tunisia-monitoring-memo-2020-03-23
    disputes:
      - claim: "Archimedes operated 265 (or 161) Tunisia bots/Pages in 2019"
        held_by: Loose summary conflating global totals with Tunisia
        status: rejected
        assessment: 265 and 161 are global totals across at least 13 countries; Tunisia list membership does not imply all assets targeted Tunisia. Only 11 Tunisia Pages are attested; account/group/event splits for Tunisia remain unpublished.
        source: fb-cib-israel-2019-05-16
    notes: "no delta to prior disputes — re-affirmed 2026-08-28 with live sources; websearch for Archimedes Tunisia corrections returned no new country-slice publication"

