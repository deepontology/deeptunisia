sources:
  - id: fb-cib-israel-2019-05-16
    title: Removing Coordinated Inauthentic Behavior From Israel
    publisher: Meta (Facebook Newsroom) — Nathaniel Gleicher
    date: 2019-05-16
    url: https://about.fb.com/news/2019/05/removing-coordinated-inauthentic-behavior-from-israel/
    tier: 2
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch + curl -I confirmed; body captured"
    archive_url: https://web.archive.org/web/*/https://about.fb.com/news/2019/05/removing-coordinated-inauthentic-behavior-from-israel/
    excerpt: "Today we removed 265 Facebook and Instagram accounts, Facebook Pages, Groups and events involved in coordinated inauthentic behavior. This activity originated in Israel and focused on Nigeria, Senegal, Togo, Angola, Niger and Tunisia along with some activity in Latin America and Southeast Asia. Presence: 65 Facebook accounts, 161 Pages, 23 Groups, 12 events and four Instagram accounts. Followers: About 2.8 million accounts followed one or more of these Pages, about 5,500 accounts joined at least one of these Groups and around 920 people followed one or more of these Instagram accounts. Advertising: Around $812,000 in spending for ads on Facebook paid for in Brazilian reals, Israeli shekel, and US dollars. The first ad ran in December 2012 and the most recent ad ran in April 2019."
