    live_status: "200 — webfetch + curl expected 200 (search-result confirmed live)"
    excerpt: "Facebook removed 65 Israeli accounts, 161 pages, 12 groups and four Instagram accounts linked to Archimedes Group, ~2.8M followers across Nigeria, Senegal, Togo, Angola, Niger, Tunisia + LATAM/SEA. Nawaat notes Tunisia detail scarce at announcement: 'We don't know how many pages targeted Tunisia, the nature of the content, where they were ran from and percentage organic vs artificial.' DFRLab screenshot: Tunisia page created March 2019 rapidly >11k followers. Archimedes website (ar-gr.com) self-described as 'change reality' with product Archimedes Tarva for mass campaign management, deleted after takedown."
