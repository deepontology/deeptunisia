notes:
  - >-
    Note, not a record: SONEDE-AfDB ratification. On Monday 2 November 2026 the
    ARP bureau sent to the finance and budget committee, for urgent review, a
    bill approving the state guarantee agreement between Tunisia and the African
    Development Bank for EUR 111.5 million for the Greater Tunis drinking-water
    network project. The underlying guarantee agreement is already recorded as
    agr-tunisia-afdb-sonede-gct-2026 (signed 22 September 2026); this item is
    the parliamentary ratification step, not a new agreement. The article gives
    the project total as EUR 151.1 million (AfDB EUR 111.5 million, EU grant
    EUR 30 million, SONEDE EUR 9.6 million), a 2026-2031 implementation period,
    a 20-year loan with a five-year grace period, a six-month Euribor plus 0.8%
    margin and 0.25% opening and commitment fees. No duplicate record is
    proposed. Source: am-sonede-afdb-2026-11-03.
  - >-
    Note: 2027 budget process. The first plenary sessions on the 2027 finance
    bill are scheduled for 9-10 November 2026; the ARP bureau returned nine
    bills to the finance and budget committee; the presidency budget is
    reported up 8%, justice up 8.43% and finance up 10% to 1,626.6 million
    dinars, with more than 32,000 recruitments and 49.6 billion dinars of
    projected tax revenue. These are budget-process and document figures spread
    across several African Manager items, not a voted appropriation; no record
    is proposed until the plenaries and the published text. Source:
    am-budget-2027-plenaries-2026-11-03.
  - >-
    Note: Jebeniana follow-up. Nawaat's 2 November 2026 investigation adds
    detail and context to the already-recorded death of Aoun Salhi on
    21 October 2026 and the unrest of 22 October
    (ev-jebeniana-death-aoun-salhi-2026-10-21,
    ev-unrest-ettadhamen-jebiniana-2026-10-22): the victim was 24, from Drabla,
    had worked in Italy, had recently married and left a pregnant wife; his
    family and friends deny the drug-trafficking accusation; no looting or
    damage to public or private property was reported; schools, shops, cafes
    and the municipal market closed; calm returned around 14:00 and the funeral
    was held the same afternoon. The piece also carries the activists' account
    of Jebeniana as a security laboratory for migration control and of the
    weakening of civil-society mediation. No contradiction with the canonical
    records was found, so this is a note, not a correction. Source:
    nawaat-jebeniana-followup-2026-11-02.
  - >-
    Note: Tunisians in the Russian army. France 24 broadcast on 29 October 2026
    a report on Tunisian families without news of children enlisted in the
    Russian army to fight in Ukraine; Kapitalis's 31 October account relays it
    and names two cases, Zied Ben Khedher (a death certificate received seven
    months after deployment, no information from the foreign ministry or the
    Russian embassy) and Aymen Dhaouadi (arrested in Russia in 2022, held 19
    months, then contracted with the military in May 2025 and deployed, now
    missing). It cites an Amnesty International report on coercive recruitment
    of foreigners in irregular situations and an Amnesty open letter of
    27 October 2026. No Tunisian official response, figure or policy document
    was retrieved, and the foreign ministry, the Russian embassy and Amnesty
    have no graph records. Research backlog, not a record. Source:
    kapitalis-tunisians-russia-2026-10-31.
  - >-
    Note: US phosphate project. The US embassy in Tunis announced a
    US-government-funded project with CrossBoundary to connect US investors and
    companies with PhosCo's phosphate project in the North Basin over the next
    two years, aiming to mobilise private investment, increase local phosphate
    production and integrate Tunisian minerals into global supply chains, per
    African Manager on 29 October 2026. The piece names no Tunisian state
    signatory or instrument; PhosCo, CrossBoundary and the US embassy have no
    graph records. Research backlog, not a record. Source:
    am-us-phosphate-2026-10-29.
  - >-
    Note: T-MED. The European Commission launched the T-MED investment
    platform in Brussels on 28 October 2026, backed by up to EUR 4.5 billion of
    EU guarantees, to mobilise renewable-energy and clean-technology investment
    across the Mediterranean. In Tunisia it supports two 100 MW photovoltaic
    plants and associated transmission infrastructure, with about EUR 92
    million for one project and EUR 80 million for the other. This is an EU
    initiative, not a Tunisian state act or a signed project agreement; no
    record is proposed. Source: am-tmed-2026-10-28.
  - >-
    Note: Tunisia-Senegal chambers. The Tunis Chamber of Commerce and Industry
    (CCIT) and Senegal's national union of chambers of commerce, industry and
    agriculture (UNCCIAS) signed a partnership agreement on the margins of SIAT
    2026, in the presence of Senegalese agriculture minister Cheikhou Oumar Ba,
    and discussed a Tunisian business mission to the Dakar international fair
    on 19-23 December 2026, per African Manager on 3 November 2026. This is a
    chamber-to-chamber agreement, not a state treaty; CCIT and UNCCIAS have no
    graph records. Note, not a record. Source: am-senegal-ccit-2026-11-03.
  - >-
    Note: appointments not proposed. African Manager reported on 1 November
    2026 that Nizar Chaddad, formerly director-general of payments and
    financial inclusion at the central bank, was appointed director-general of
    the Société Monétique de Tunisie (SMT), succeeding Bilel Darnaoui, who
    retired; and on 3 November 2026 that Yahia Chiboub is PDG of the Société
    régionale de transport du gouvernorat de Nabeul, with a salary of 5,122.296
    dinars gross per month fixed six months after his April 2025 appointment
    and an auditor's finding that the PDG is not a shareholder as article 208
    of the commercial companies code requires. SMT and SRTGN have no
    institution records, and the SRTGN item is a governance/compensation story
    rather than a power change; both stay in the research backlog rather than
    becoming records with dangling references. The items are
    africanmanager.com/nizar-chaddad-nomme-dg-de-la-societe-monetique-tunisie/
    and
    africanmanager.com/srtgn-un-pdg-nomme-en-avril-un-salaire-fixe-en-octobre/.
