# JORT verification pass, candidate file dated 2026-09-11 (produced 2026-09-14).
#
# MISSION: resolve `verification: needs-primary-source` positions with fetched
#   primary records — JORT appointment decrees and equivalent gazette text.
# SCOPE: post-1956 positions only. Priority: ministers, service chiefs,
#   directors-general, with vague or single-source dates. PRE-1956 BEYLICAL
#   OFFICES ARE OUT OF SCOPE in this pass: the Grand Vizier tenures (1759-1956,
#   p-gv-*) are not JORT appointments and no gazette surrogate was fetched, so
#   they are noted here and not guessed at.
# METHOD: (1) read the canonical row in data/positions.yaml; (2) locate the
#   issue by target date via jort.tn year browse and view pages, fetch the
#   issue PDF from lake.jort.tn, extract with pdftotext; (3) for government and
#   judiciary decrees 2011-2022, fetch the full text on legislation-securite.tn
#   (DCAF) and 9anoun.tn. Every record below was fetched on 2026-09-14 and the
#   decisive passage grepped from the fetched text, never from a search snippet.
# CONFIRMED: 20 positions patched, 17 new tier-1 sources.
#   Appointment date confirmed, no date token changed (13): p-int-feki,
#   p-csm-kchaou, p-audit-nejib-ktari, p-cassation-hedi-guediri,
#   p-finance-boughdiri, p-finance-zribi, p-finance-yaiche, p-milsec-bentaous,
#   p-ig-nafti, p-air-bedoui, p-equipment-zouari, p-csee-sg-boughdiri,
#   p-douane-zouaghi (already-cited gazette source now read, flag flipped).
#   Start corrected to the gazette date (4): p-finance-dimassi (2011-12-29),
#   p-finance-chalghoum-2 (2017-09-12), p-finance-kooli (2020-09-02),
#   p-cassation-moncef-kchaou (2021-10-22).
#   Start corrected to the gazette effective date (1): p-cassation-khaled-ayari
#   (2014-09-18; the decree itself is dated 2014-10-02).
#   Start narrowed by a signed record (1): p-finance-jeri (<=1997-04-05).
#   End narrowed (1): p-finance-zorgati-2 (verified:1997-01-18).
# FAILURE VOCABULARY (must not be collapsed):
#   - "the fetched page is the gazette text" is not the same as "a cessation
#     decree was found". For p-finance-boughdiri the start is named by decree
#     2021-138; the end is only bounded by the successor's signature (Michket
#     Slama Khaldi signing as ministre des finances on 12 February 2025), no
#     decree in the fetched issues ends her functions by name.
#   - "the successor's gazetted appointment bounds the predecessor's end" is a
#     corollary, not a names-the-holder record: the arrêtés of 21 August 2013
#     (JORT n° 69) name Ben Taous, Nafti and Bédoui, not their predecessors, so
#     p-air-jelassi and p-ig-laajimi are left as leads even though their ends
#     fall on 2013-08-22 by succession.
#   - "a signature block names the office, not the person" when the minister is
#     not named in the arrêté itself; only records that print the holder's name
#     are treated as naming the holder.
#   - "2019 lake.jort.tn PDFs served under /fr/ are the Arabic edition" for
#     2019/020 (1 Rajab 1440 = 8 March 2019); the French security appointments of
#     February 2019 were therefore not resolved.
#   - "the 2004 PDF has a text layer but its encoding is shifted +29 on
#     printable ASCII": names decode, decree numbers and dates do not; no 2004
#     record is claimed from it.
#   - "the 1989 and 1991 lake.jort.tn issues probed are image-only" and tesseract in this
#     environment has only eng/osd traineddata, so no OCR claim is made for
#     1989-1996 (p-justice-bouaziz, p-foreign-khelil, p-foreign-boulares,
#     p-finance-zorgati-1, p-dgsn-seriati and the other Ben Ali-era security
#     rows stay unresolved).
#   - "a decree number discarded earlier stays discarded until the issue is
#     read": the 2023-268 lead that an earlier pass rejected as a French decree
#     is in fact the Tunisian appointment decree of Kamel Fekih (JORT n° 29 du
#     21 mars 2023). This pass read the issue, so the lead is reinstated.
# UNRESOLVED LEADS (position id, what was searched, what was found):
#   - p-finance-abdelkefi: JORT n° 74 du 15 septembre 2017 shows "Le ministre
#     des finances par intérim Mouhamed Fadhel Abdelkefi" countersigning a
#     decree dated 17 August 2017; the DCAF text of the 12
#     September 2017 government decree (2017-124) names Chalghoum as finance
#     minister. The canonical 2017-09-06 to 2017-12 span for Abdelkefi is not
#     supported by either fetched record. No patch: the two records contradict
#     the row but do not establish the correct span.
#   - p-cassation-taieb-rached: searched JORT 2018 issues 089, 090, 092, 093,
#     095, 096, 097, 099 (November-December 2018); no appointment of Taïeb
#     Rached located.
#   - p-audit-abdellatif-kharrat: searched JORT 2014 issues 022 to 026 (March
#     2014); only Mondher Kharrat appears, not the Audit Court president.
#   - p-ng-ksiksi: searched JORT 2013 issues 078 to 084 (September-October
#     2013); the National Guard command appointment was not located.
#   - p-ng-guezguez: searched JORT 2022 issues 083 to 088 (July-August 2022);
#     not located.
#   - p-dgsp-harroum: the February-March 2019 issues consulted served the
#     Arabic edition under /fr/; not resolved.
#   - p-soe-sncft-boufaied, p-soe-steg-trifa, p-soe-sonede-soula,
#     p-soe-poste-*, p-bank-stb-rachid-batita, p-bank-stb-*, p-bank-bna-*:
#     JORT issues around the appointment dates (2022 issue 005, 2024 issues
#     074 to 079, 2023 issue 101 and others) were fetched and grepped; these
#     director-general appointments are not gazetted as decrees in the issues
#     searched, or not under the holder's name.
#   - p-onat-*: bar association elections, not a JORT appointment; out of scope.
#   - p-admin-*, p-ivd-bensedrine, p-audit-faiza-kefi and the remaining
#     cassation rows: not attempted in this pass; no lead formed.
# Candidates are proposals, not graph data. Review only; nothing canonical changed.

