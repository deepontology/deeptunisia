  - id: businessnews-decret54-mohamed-ali-2026-09-24
    title: "Décret 54 : deux ans et demi après son dépôt, Mohamed Ali affirme que l'amendement se heurte toujours à un mur au Parlement"
    publisher: Business News
    date: 2026-09-24
    url: https://businessnews.com.tn/2026/09/24/decret-54-deux-ans-et-demi-apres-son-depot-mohamed-ali-affirme-que-lamendement-se-heurte-toujours-a-un-mur-au-parlement/1419889/
    tier: 3
    lang: fr
    excerpt: >-
      Plus de deux ans et demi après son dépôt, la proposition d'amendement du
      décret 54 continue de faire du surplace au Parlement. À l'origine de
      l'initiative, le député Mohamed Ali affirme que le texte, après avoir
      longtemps attendu avant d'être transmis à une commission, n'a toujours pas
      dépassé le stade d'une première audition. Il estime que même cette
      révision, qu'il présente comme le « minimum », s'est heurtée à un « mur »
      au sein de l'Assemblée. ... Dans sa version déposée en février 2024, elle
      proposait notamment la suppression de l'article 24.
    note: >-
      Backstory for the executive-bypass reading of the 30 September decree:
      Parliament's amendment route was stalled; the President's decree achieved
      the article 24 rewrite without it.

  - id: mosaiquefm-moussi-cassation-2026-09-29
    title: "Cour de cassation : Les recours de Abir Moussi rejetés"
    publisher: Mosaique FM
    date: 2026-09-29
    url: https://www.mosaiquefm.net/fr/national-tunisie/1531829/cour-de-cassation-les-recours-de-abir-moussi-rejetes
    tier: 3
    lang: fr
    excerpt: >-
      La Cour de cassation a rejeté les recours introduits par le collectif de
      défense de la présidente du Parti destourien libre (PDL), Abir Moussi,
      contre plusieurs décisions rendues à son encontre en appel, dans
      différentes affaires. Les recours concernent notamment l'affaire dite du
      « bureau d'ordre de la présidence de la République », ainsi que deux autres
      affaires engagées contre elle par l'Instance supérieure indépendante pour
      les élections (ISIE). Le 13 mars 2026, la Chambre criminelle de la Cour
      d'appel de Tunis avait condamné Abir Moussi à dix ans de prison dans
      l'affaire du « bureau d'ordre », ainsi qu'à six mois de prison pour
      « entrave à la liberté du travail ». Dans les deux affaires liées à
      l'ISIE, elle avait été condamnée en appel à deux ans de prison dans le
      premier dossier et à six mois dans le second. Le cumul des peines
      prononcées dans ces trois affaires s'élève ainsi à 12 ans et six mois de
      prison.

