  - id: mosaiquefm-decret54-amendement-2026-09-30
    title: "Amendement du décret 54 : La peine de prison annulée"
    publisher: Mosaique FM
    date: 2026-09-30
    url: https://www.mosaiquefm.net/fr/national-tunisie/1531930/amendement-du-decret-54-la-peine-de-prison-annulee
    tier: 3
    lang: fr
    excerpt: >-
      D'après le Journal officiel de la République tunisienne du 30 septembre
      2026, l'article 24 du décret-loi 54 de 2022, relatif à la lutte contre les
      infractions se rapportant aux systèmes d'information et de communication,
      vient d'être amendé. En effet, la peine de cinq ans de prison et les
      50 mille dinars d'amende ont été remplacés par une amende de 10 mille à
      20 mille dinars, infligée à quiconque utilise sciemment des systèmes et des
      réseaux d'information et de communication, en vue de produire, répandre,
      diffuser, envoyer, ou rédiger de fausses nouvelles, de fausses données,
      des rumeurs, des documents faux ou falsifiés ou faussement attribués à
      autrui, dans le but de porter atteinte aux droits d'autrui ou porter
      préjudice à la sûreté publique ou à la défense nationale ou de semer la
      terreur parmi la population. En cas de récidive, de l'une de ces
      infractions, la peine est portée à six mois de prison et à 50 mille dinars
      d'amende. Les peines prévues sont portées au double si la personne visée
      est un agent public ou assimilé.
    note: >-
      The headline ("la peine de prison annulée") describes the base offence
      only; the gazette keeps six months' imprisonment for recidivism — noted,
      not treated as a contradiction.

  - id: mosaiquefm-reconciliation-penale-2026-09-30
    title: "Amendement du décret sur la réconciliation pénale"
    publisher: Mosaique FM
    date: 2026-09-30
    url: https://www.mosaiquefm.net/fr/national-tunisie/1531944/amendement-du-decret-sur-la-reconciliation-penale
    tier: 3
    lang: fr
    excerpt: >-
      Le décret-loi n° 2 de 2026, portant modification du Décret-loi- n° 2022-13
      du 20 mars 2022, portant sur la réconciliation pénale et l'affectation de
      ses ressources, a été publié au Journal officiel de ce mercredi
      30 septembre et ce, après avoir été examiné par le Conseil ministériel qui
      a eu lieu, hier à Carthage, sous la présidence du chef de l'Etat, Kais
      Saïed. L'amendement de l'article 25 de ce décret-loi de 2022, prévoit la
      possibilité de proposer un projet de conciliation provisoire comprenant le
      paiement d'au moins 50 % des montants financiers dus, assorti d'un
      engagement de verser les sommes restantes dans les délais proposés par la
      commission et qui ne doivent pas dépasser les deux ans. ... L'amendement de
      l'article 30 prévoit, par ailleurs, que les recettes issues de la
      conciliation pénale soient affectées au financement des projets mentionnés
      au premier paragraphe de cet article, conformément aux décisions du Conseil
      de sécurité nationale.

  - id: tunisienumerique-decret54-article24-2026-09-30
    title: "Tunisie : ce qui change dans l'article 24 du décret 54"
    publisher: Tunisie Numérique
    date: 2026-09-30
    url: https://www.tunisienumerique.com/tunisie-ce-qui-change-dans-larticle-24-du-decret-54/
    tier: 3
    lang: fr
    excerpt: >-
      Le Journal officiel de la République tunisienne (JORT) a publié, ce
      mercredi 30 septembre 2026, le décret n°1 de 2026 modifiant le décret-loi
      n°54 du 13 septembre 2022 relatif à la lutte contre les infractions liées
      aux systèmes d'information et de communication. Le texte remplace
      intégralement les anciennes dispositions de l'article 24, sans supprimer
      cet article. ... Le nouvel article 24 prévoit désormais, pour les faits
      visés par ses deux premiers paragraphes, une amende comprise entre 10.000
