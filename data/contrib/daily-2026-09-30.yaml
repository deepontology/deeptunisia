  - id: kapitalis-naufrage-hasdrubal-2026-09-30
    title: "Naufrage de migrants au large de la Tunisie | 28 rescapés, 2 morts et 6 disparus"
    publisher: Kapitalis
    date: 2026-09-30
    url: https://kapitalis.com/tunisie/2026/09/30/naufrage-de-migrants-au-large-de-la-tunisie-28-rescapes-2-morts-et-6-disparus/
    tier: 3
    lang: fr
    excerpt: >-
      Le navire Aurora de l'ONG Sea Watch a repéré un canot pneumatique quasi
      dégonflé — signalé par Alarm Phone dans la zone SAR libyenne — transportant
      5 personnes et 2 corps sans vie, dont celui d'un enfant selon les témoins,
      indique l'agence Ansa. « Environ 25 personnes s'étaient accrochées à la
      plateforme Hasdrubal pour échapper au naufrage. Deux femmes ont raconté
      avoir perdu leurs enfants dans les vagues », explique l'ONG. « Le canot se
      trouvait à la limite des zones SAR libyenne et tunisienne ; ce sont les
      5 survivants qui nous ont indiqué que d'autres personnes avaient réussi à
      atteindre la plateforme pétrolière après le naufrage », souligne Sea Watch,
      ajoutant que « parmi les deux corps sans vie se trouvait celui d'un
      enfant ». ... « En discutant avec les survivants à bord de l'Aurora, nous
      avons appris qu'il y a six disparus, dont trois enfants. » Le navire a fait
      débarquer les personnes secourues à Lampedusa, Italie. Elles sont au nombre
      de 28 : 5 secourues depuis le canot pneumatique et 23 depuis la plateforme
      de production de gaz et de pétrole offshore.

