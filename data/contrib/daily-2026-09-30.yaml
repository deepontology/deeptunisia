    summary: >-
      On 30 September 2026 Kapitalis relayed Ansa and Sea Watch: the NGO ship
      Aurora found a nearly deflated dinghy — signalled by Alarm Phone in the
      Libyan SAR zone — carrying five people and two bodies, one of a child
      according to witnesses; about 25 people had clung to the Hasdrubal offshore
      gas platform to escape the sinking, and two women said they lost their
      children in the waves; the dinghy was at the boundary of the Libyan and
      Tunisian SAR zones, and survivors told Sea Watch that others reached the
      platform after the sinking. After recovering the five survivors and the two
      bodies, the Aurora — authorised by the Tunisian authorities — transferred
      people from the platform and disembarked 28 people (five women and a young
      child among them) at Lampedusa, Italy; six people are missing, three of
      them children. The account rests on Sea Watch and Alarm Phone statements
      relayed by one outlet; no Tunisian authority statement was cited.
