  - id: ev-decret-2026-1-decret54-amendment-2026-09-30
    date: "2026-09-30"
    title_en: "Decree 2026-1 published: article 24 of Decree-Law 54 rewritten, prison replaced by a fine outside recidivism"
    title_fr: "Décret n° 1 de 2026 publié : l'article 24 du décret-loi 54 réécrit, la prison remplacée par une amende hors récidive"
    title_ar: "مرسوم عدد 1 لسنة 2026 يتعلق بتنقيح المرسوم عدد 54 لسنة 2022 المتعلق بمكافحة الجرائم المتصلة بأنظمة المعلومات والاتصال"
    category: legal
    subcategory: legislation
    actors: [kais-saied]
    institutions: [presidency]
    causes: [ev-conseil-ministres-decrets-2026-09-29]
    documents:
      - "مرسوم عدد 1 لسنة 2026 المؤرخ في 30 سبتمبر 2026، الرائد الرسمي عدد 96، ص 2056"
      - "https://lake.jort.tn/journal-officiel/ar/2026/096.pdf"
    summary: >-
      JORT n° 96 of 30 September 2026 (p. 2056) published Decree No. 1 of 2026,
      dated 30 September 2026, which repeals and replaces article 24 of
      Decree-Law 54/2022 of 13 September 2022 on combating offences related to
      information and communication systems; it does not repeal the article, it
      rewrites it, and the rest of Decree-Law 54 is untouched. The new article 24
      punishes with a fine of 10,000 to 20,000 dinars — no custodial sentence for
      the base offence — anyone who deliberately uses information and
      communication networks or systems to produce, promote, publish, send or
      prepare false news, data or rumours, fabricated or forged documents, or
      material falsely attributed to others, where the purpose is to harm
      others' rights or public security or national defence, or to spread terror
      among the population; the same fine applies to deliberate publication of
      false personal data or untrue attributions intended to defame or harm,
      incite an attack on a person, or incite hatred. On recidivism the penalty
      is six months' imprisonment and a 50,000-dinar fine; the penalties double
      where the targeted person is a public official or equivalent; article 53
      of the Penal Code does not apply to these offences in cases of recidivism.
      The decree followed the Council of Ministers of 29 September 2026 and
      bypasses Parliament, where MP Mohamed Ali's February 2024 initiative to
      delete article 24 had remained blocked in committee; the SNJT, RSF and
      other organisations had demanded repeal of article 24, not its conversion
      to a fine. Press readings describe the headline change as the abolition of
      the prison sentence (Mosaïque FM); the gazette text keeps imprisonment on
      recidivism.
    confidence: A
    basis: documented
    verification: verified
    falsifiable_by: >-
      The gazette text itself is the record; a misreading would be shown by a
      human re-read of JORT n° 96 p. 2056 (the two-column extraction is
      artefacted).
    sources:
