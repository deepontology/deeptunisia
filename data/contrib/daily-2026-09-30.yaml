    summary: >-
      JORT n° 96 of 30 September 2026 (p. 2057) published Decree No. 3 of 2026,
      dated 30 September 2026, amending organic law 2012-23 on the Independent
      High Authority for Elections. It repeals articles 5, 6 and 9 and replaces
      them: the ISIE council is composed of nine independent, neutral members
      chosen as follows — three with at least ten years' experience in election
      administration chosen by the President; a judicial judge with at least ten
      years' seniority from three proposed by the Conseil supérieur de la
      magistrature; an administrative judge proposed by the administrative
      judiciary council; a financial judge proposed by the financial judiciary
      council; an engineer specialised in information systems and security from
      three proposed by the National Information Centre; a statistics engineer
      from three proposed by the National Institute of Statistics; and a retired
      diplomat from three proposed by the Ministry of Foreign Affairs. Members
      are appointed by decree, public-sector members keep their original ranks,
      and the President appoints the ISIE president from among the members. Each
      member serves a non-renewable six-year term, with one third of the council
      renewed every two years; a lottery fixes the first renewals at the end of
      the second and fourth years, the president not being drawn in the first two
      rounds; the ISIE president informs the President three months before a term
      ends. Members appointed under Decree-Law 2022-22 continue until the new
      council takes office. The article 3 substitutions also drop references to
      "the head of government" and replace "five members" with "seven members",
      "by presidential decree" with "by decree", "accountant" with "specialist in
      accounting or financial audit", and the Audit Court references.
    confidence: A
    basis: documented
    verification: verified
    sources:
      - jort-2026-096
      - businessnews-conseil-ministres-2026-09-30

