    excerpt: >-
      La commission des finances et du budget de l'Assemblée des représentants du
      peuple a approuvé, hier mardi, sept projets de loi relatifs au financement de
      projets stratégiques visant à renforcer la sécurité hydrique et à développer
      le système d'approvisionnement en eau potable. [...] Ces projets ont été
      adoptés, selon un communiqué publié ce mercredi soir par le Parlement, à
