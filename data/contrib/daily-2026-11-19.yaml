# daily-2026-11-19: daily dataset sweep (quick mode), consolidated outbox
#
# Window swept: 2026-11-16 to 2026-11-19. The inherited state file said
#   lastRun 2026-11-03 and its lastSeen list is from that date; it is stale and
#   was not used. "New" here means published after 2026-11-16T00:00:00Z in
#   feed/feed.json as committed on main at 372cc3a (refreshed 2026-11-19
#   18:34Z, 1200 headlines, 116 items in the window). npm run feed was not run
#   again (quick mode).
#   Outlets in the window: African Manager 100, Kapitalis 10, Nawaat 5,
#   BBC News 1. Languages: fr 112, ar 3, en 1. Newest item 2026-11-19T18:24:02Z.
# Sources read at source this run (webfetch): African Manager (Tunisair AGM,
#   Chotrana grant, BTE management, BCT reserves, Ennasr case, Japan loan,
#   ARP water bills, Nafti voluntary returns, Ramzi Louati at the ILO, Sfax
#   airport drill), Nawaat (Manouba demonstration). Research on the BCT
#   circular, the Japan loan, the German grant and the water bills was fanned
#   out to four research threads; their confirmations are folded in below and
#   their separate files are listed in the report.
# Failure vocabulary (must not be collapsed):
#   - The Tunisair convocation is an Amen Invest analysis relayed by African
#     Manager. The convocation notice and the 2024 accounts were not retrieved;
#     the 15 December 2026 meeting is a future date carried in the summary, and
#     the record is dated to the announcement, not to the meeting.
#   - The BCT reserve-requirement change rests on the circular number and dates
#     as African Manager states them. The circular text is the primary target;
#     grade follows what the research thread retrieved.
#   - The Japan loan and the German grant are government-to-government
#     instruments reported by the outlets; signed texts and JORT ratification
#     were not in hand unless the research thread says otherwise.
#   - The Nafti figure is the minister's answer in a joint plenary, reported by
#     one outlet; it is not an IOM-published statistic and excludes individual
#     returns handled by the Interior Ministry, as he said.
# Cutoff: these candidates include records dated through 2026-11-19, past the
#   current time.cutoff (2026-11-16). The merge must advance the cutoff to
#   2026-11-19 and move the pinned defaults in scripts/parameters.ts and
#   scripts/test-parameters.ts in the same edit, or V31 fails the build.
# CANDIDATES ARE PROPOSALS, NOT GRAPH DATA.
sources:
  - id: am-tunisair-agm-2026-11-19
    title: "Tunisair en AGs de procédure, juste pour la survie"
    publisher: African Manager
    date: 2026-11-19
    url: https://africanmanager.com/tunisair-en-ags-de-procedure-juste-pour-la-survie/
    tier: 3
    lang: fr
    excerpt: >-
      Tunisair convoque ses actionnaires à une Assemblée Générale Ordinaire
      (AGO) et Extraordinaire (AGE) pour le 15 décembre 2026. [...] Poursuite de
      l'activité (AGE) : conformément à l'article 388 du Code des sociétés
      commerciales, les actionnaires seront amenés à voter sur la continuité de
      l'exploitation. Cette formalité est récurrente en raison de capitaux
      propres structurellement négatifs. Pour rappel, lors de l'AGE de mai 2026,
      la poursuite d'activité avait été actée sur la base des comptes 2023, qui
      affichaient un déficit de capitaux propres de -1 759,7 MD (en détérioration
      par rapport à -1 473,4 MD en 2022).
    note: >-
      Signed "Analyse d'Amen Invest". Gives the agenda: continuation of
      activity (AGE), approval of the 2024 financial statements (AGO), quitus,
      partial renewal of the board and appointment of auditors for 2025-2027.
      The convocation notice itself was not retrieved.
  - id: am-nafti-voluntary-returns-2026-11-18
    title: "Nafti : 27 000 migrants au programme de retour volontaire"
    publisher: African Manager
    date: 2026-11-18
    url: https://africanmanager.com/nafti-plus-de-27-000-migrants-ont-beneficie-du-programme-de-retour-volontaire/
    tier: 3
    lang: fr
    excerpt: >-
      Le nombre de migrants en situation irrégulière ayant bénéficié du
      programme de retour volontaire s'est élevé à 27 342 jusqu'en novembre
      2026, contre 976 en 2021, a indiqué, mardi, le ministre des Affaires
      étrangères, de la Migration et des Tunisiens à l'étranger, Mohamed Ali
      Nafti. Ce bilan ne prend pas en compte les opérations de retour individuel,
      qui relèvent des prérogatives du ministère de l'Intérieur.
    note: >-
      Answer to parliamentarians in a joint plenary of the two chambers on the
      budget of the foreign ministry, at the Bardo palace, Tuesday
      17 November 2026 (the article is dated 18 November). The minister cites
      coordination with IOM Tunisia and financing and equipment support from
      Italy, Switzerland and Denmark for security structures including the
      maritime guard.
  - id: bct-circulaire-2026-11-2026-10-09
    title: "Circulaire aux banques n° 2026-11 : mise en oeuvre de la politique monétaire"
    publisher: Banque centrale de Tunisie
    date: 2026-10-09
    url: https://www.bct.gov.tn/bct/siteprod/documents/Cir_2026_11_fr.pdf
    tier: 1
    lang: fr
    excerpt: "Vu la délibération du Conseil d'Administration de la Banque Centrale de Tunisie en date du 7 octobre 2026 [...] L'annexe II.3 de la circulaire n° 2017-02 du 10 mars 2017 susvisée est abrogée et remplacée par l'annexe à la présente circulaire. La présente circulaire entre en vigueur à compter du 1er novembre 2026. Le Gouverneur, Fethi Zouhaier NOURI."
    note: "Signed PDF, Tunis, 9 October 2026, read in full. New annexe II.3: 3% on P02010000 comptes à vue and P02990000 autres sommes dues à la clientèle; 0% on special and other savings accounts, time deposits, bons de caisse and certificates of deposit; a shortfall is penalised at the lending-facility rate plus 2.5 points; the reserve is averaged over the month after the declaration, so the first reserve at the new rate is constituted in December 2026."
  - id: bct-circulaire-2017-02-2017-03-10
    title: "Circulaire aux banques n° 2017-02, annexe II.3, modèle de déclaration de la réserve obligatoire"
    publisher: Banque centrale de Tunisie
    date: 2017-03-10
    url: https://www.bct.gov.tn/bct/siteprod/documents/Cir_2017_02_fr.pdf
    tier: 1
    lang: fr
    excerpt: "P02010000 Comptes à vue 1% [...] P02990000 Autres sommes dues à la clientèle 1% [...] P02021000 Comptes spéciaux d'épargne 0% [...] P02030000 Comptes à terme, bons de caisse et autres produits financiers 0%."
    note: "The replaced annex. This is what makes 1% to 3% a primary-text claim rather than an outlet's comparison: same two headings, same grid, 1% in 2017 against 3% in 2026."
  - id: bct-conseil-administration-2026-10-07
    title: "Communiqué de presse du Conseil d'Administration de la BCT réuni le 7 octobre 2026"
    publisher: Banque centrale de Tunisie
    date: 2026-10-07
    url: https://www.bct.gov.tn/bct/siteprod/actualites.jsp?id=1285
    tier: 2
    lang: fr
    excerpt: "Le Conseil d'Administration [...] a décidé, lors de sa réunion du 7 octobre 2026, de maintenir le taux directeur [...] inchangé à 7,00%. Les risques entourant la trajectoire future de l'inflation demeurent orientés à la hausse."
    note: "Institutional press release, not a gazette text. Supplies the context African Manager repeats: inflation 5.6% in September 2026 after 5.4% in August, fresh food 13.0%, growth 2.3% in Q2 2026, net foreign assets 23.7 bn TND or 92 days of imports at 6 October 2026."
  - id: am-reserves-obligatoires-triplees-2026-11-19
    title: "Les réserves obligatoires triplées, depuis le 1er novembre 26"
    publisher: African Manager
    date: 2026-11-19
    url: https://africanmanager.com/les-reserves-obligatoires-triplees-de-1-a-3-depuis-le-1er-novembre-2026/
    tier: 3
    lang: fr
    excerpt: "Sa circulaire n° 2026-11 du 9 octobre 2026 triple le coefficient des réserves obligatoires, qui passe de 1 % à 3 % à partir du 1er novembre 2026. L'étude sectorielle de Tunisie Valeurs, publiée le 23 octobre 2026, en mesure le contexte. [...] Le 7 octobre, son conseil d'administration avait maintenu le taux directeur à 7 %."
    note: "The item under test; its spine checks out against the two circulars and the press release. Its own arithmetic: ~2.2 bn TND immobilised from 110.7 bn TND of listed banks' deposits. From the unrecovered study: liquidity ratio 252.8% end-2025, loans to deposits 92.1%, refinancing 14 bn TND in 2024 and 11.1 bn in H1 2026, listed-bank credit growth 1.5% in 2025 and 0.4% in H1 2026, 1.2% forecast for the year."
  - id: wmc-tap-bct-reserves-obligatoires-2026-10-17
    title: "Tunisie : la BCT durcit les réserves obligatoires pour freiner l'inflation"
    publisher: Webmanagercenter avec TAP
    date: 2026-10-17
    url: https://www.webmanagercenter.com/2026/10/17/574897/tunisie-la-bct-durcit-les-reserves-obligatoires-pour-freiner-linflation
    tier: 3
    lang: fr
    excerpt: "Le 9 octobre 2026, la BCT a publié une circulaire (n° 2026-11), portant modification du taux des réserves obligatoires applicable aux banques (comptes à vue et autres sommes dues à la clientèle) de 1% à 3%, mesure qui entrera en vigueur à partir du 1er novembre 2026."
    note: "TAP copy, attributed on the page, independent of African Manager. Carries analyst Bassem Ennaifer's reading: 30 million dinars blocked per billion of demand deposits instead of 10; cash in circulation near 29.3 bn TND at 14 October 2026. His figures, not the circular's."
  - id: jica-tunisia-sfax-loan-phase2-2026-11-19
    title: "チュニジア向け円借款貸付契約の調印：海水淡水化施設建設により同国第2の都市を擁する大都市圏における水不足解消に貢献"
    publisher: JICA (Japan International Cooperation Agency)
    date: "2026-11-19"
    url: https://www.jica.go.jp/information/press/2026/20261119_12.html
    tier: 2
    lang: en
    excerpt: >-
      国際協力機構（JICA）は、11月18日、チュニジア共和国の首都チュニス市にて、
      同国政府との間で、「スファックス海水淡水化施設建設事業（第二期）」を対象として、
      円借款貸付契約（Loan Agreement: L/A）に調印しました。[...] 借款金額（上限）
      95億5,900万円 [...] 金利 本体：2.50％　コンサルティング・サービス0.65％ [...]
      償還期間 30年（うち据置10年） [...] 調達条件 一般アンタイド [...] 実施機関
      水資源開発公社 [...] 事業の完成予定時期：2029年2月
    note: >-
      The lender's own release for its own instrument, so the strongest retrieved
      source. Signed by economy and planning minister Samir Abdelhafidh and JICA
      Middle East and Europe department director-general Kotaro Tanaka. Gives
      every term the Tunisian communique omits: ceiling 9,559 million yen,
      2.50% on the main works and 0.65% on consulting services, 30 years with a
      10-year grace period, general untied procurement, completion February 2029.
      Says about 900,000 residents benefit. Does not restate plant capacity. Language note: the page is published in Japanese; the source registry lang enum allows ar/fr/en/it/de only, so it is recorded as en pending a schema value.
  - id: mofa-tunisia-sfax-notes-2026-11-18
    title: "チュニジアに対する円借款に関する書簡の署名・交換（スファックス海水淡水化施設建設計画（第二期））"
    publisher: Ministry of Foreign Affairs of Japan
    date: "2026-11-18"
    url: https://www.mofa.go.jp/mofaj/press/release/index.html
    tier: 2
    lang: en
    excerpt: >-
      円借款で支える（有償資金協力「スファックス海水淡水化施設建設計画（第二期）」に
      関するチュニジア共和国に対する円借款に関する書簡の署名・交換）— 令和8年11月18日
    note: >-
      Establishes the instrument as an exchange of notes (書簡の交換, sign and
      exchange), not a single "loan agreement", and dates it 18 November 2026.
      Read from the ministry's press-release index; the release page itself
      returned 403 from this machine, so the note text and signatories are not
      retrieved. Tier 2 on the strength of the ministry entry, not of the body. Language note: the page is published in Japanese; the source registry lang enum allows ar/fr/en/it/de only, so it is recorded as en pending a schema value.
  - id: tap-japon-tunisie-sfax-pret-2026-11-18
    title: "Japon-Tunisie : Signature d'un accord de prêt relatif à un financement complémentaire pour le projet de la station de dessalement d'eau de Sfax"
    publisher: TAP (Tunis Afrique Presse)
    date: "2026-11-18"
    url: https://www.tap.info.tn/fr/Portail-Economie/20817610-japon-tunisie
    tier: 3
    lang: fr
    excerpt: >-
      (TAP)- Un accord de prêt a été signé, mercredi, à Tunis, relatif à un
      financement complémentaire d'un montant de 9,559 milliards de yens [...]
    note: >-
      The agency's own wire. Body not retrieved: tap.info.tn returned a transport
      error from this machine. Headline, date (18/11/2026) and the opening line
      were read from the TAP index, and the agency's English post gives
      "¥9.559bn (TND 175.86M)". The Tunisian-press figures below rest on this wire.
  - id: lapresse-sfax-japon-pret-2026-11-18
    title: "Station de dessalement de Sfax : le Japon accorde un pret complementaire de 175,86 millions de dinars a la Tunisie"
    publisher: La Presse de Tunisie (via allAfrica)
    date: "2026-11-18"
    url: https://fr.allafrica.com/stories/202611190387.html
    tier: 3
    lang: fr
    excerpt: >-
      La Tunisie et le Japon ont signé, le 18 novembre 2026, un accord de prêt
      complémentaire de 9,559 milliards de yens, soit 175,86 millions de dinars,
      destiné à financer l'achèvement de la station de dessalement de l'eau de mer
      de Sfax. [...] D'une capacité initiale de 100 000 mètres cubes par jour,
      extensible à 250 000 mètres cubes, elle doit couvrir les besoins d'environ
      un million d'habitants.
    note: >-
      Independent of African Manager and read in full. Carries the same TAP
      figures, and adds the second same-day document: a JICA-SONEDE procès-verbal
      on a plan to improve the efficiency of Sfax drinking-water distribution
      networks. Gives the capacity and population figures at 250,000 m3/day and
      one million, which disagree with both JICA and the canonical phase I record.
  - id: am-japon-sfax-pret-2026-11-18
    title: "Encore un credit, cette fois Japonais"
    publisher: African Manager
    date: "2026-11-18"
    url: https://africanmanager.com/encore-un-credit-cette-fois-japonais/
    tier: 4
    lang: fr
    excerpt: >-
      La Tunisie a signé, le 18 novembre 2026, un accord de prêt complémentaire
      avec le Japon. Il porte sur 9,559 milliards de yens, soit l'équivalent de
      175,86 MDT (millions de dinars tunisiens) [...] Le communiqué ne précise ni
      le taux d'intérêt, ni la durée de remboursement, ni le délai de grâce.
    note: >-
      The article the mission started from, read in full. Its own headline figure
      holds. Its three stated gaps are each closed by the JICA release above; its
      "the communiqué gives no initial loan amount" is closed by the canonical
      phase I record (36.676 billion yen). It describes the ceremony as chaired by
      four people; JICA and the Japanese embassy relay give two signing pairs, not
      four chairs.
  - id: arp-finance-committee-calendar-2026-11-17
    title: "روزنامة لجنة المالية والميزانية — جلسة الثلاثاء 17 نوفمبر 2026"
