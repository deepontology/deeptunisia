    note: >-
      Transcription of the ARP bureau minutes of Monday 2 November 2026, which also
      lists n° 66/2026 (EBRD guarantee, STEG Grombalia-Kandar line) and n° 74/2026
      (Maghreb bank, STEG gas). Nine laws referred; the water package is seven.
      This is the cleanest published derivation of which bill number is which
      instrument: 64 AfDB, 65 IsDB, 67 EIB Bejaoua, 68 AFD treated water, 69 EIB
      Greater Tunis, 70 AFD loan, 71 AFD guarantee.
  - id: am-chotrana-don-allemand-2026-11-19
