  - id: managers-arp-water-bills-2026-11-19
    title: "Eau potable : sept textes de financement avancent au Parlement, le Code des eaux en réforme"
    publisher: Managers
    date: 2026-11-19
    url: https://managers.tn/2026/11/19/eau-potable-sept-textes-de-financement-avancent-au-parlement-le-code-des-eaux-en-reforme/
    tier: 3
    lang: fr
    excerpt: >-
      Réunie le 17 novembre 2026, la commission parlementaire a approuvé sept
      textes relatifs à des prêts, des garanties et des financements complémentaires
      concernant notamment la Société nationale d'exploitation et de distribution
      des eaux (Sonede). [...] Le texte n° 64/2026 concerne une garantie liée à un
      financement de la BAD [...] Le texte n° 65/2026 porte sur un financement
