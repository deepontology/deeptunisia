      the hour and the count of seven; announces a hearing, not an approval.
  - id: am-arp-water-bills-2026-11-19
    title: "Approbation en commission de 7 projets hydriques"
    publisher: African Manager
    date: 2026-11-19
    url: https://africanmanager.com/approbation-en-commission-de-sept-projets-de-loi-lies-a-la-securite-hydrique/
