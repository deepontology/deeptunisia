      - wmc-tap-bct-reserves-obligatoires-2026-10-17
  - id: ev-arp-water-financing-bills-committee-2026-11-17
    date: "2026-11-17"
    title_en: "ARP finance and budget committee approves seven bills on water-sector loan and guarantee agreements"
    title_fr: "La commission des finances et du budget de l'ARP approuve sept projets de loi sur des accords de prêt et de garantie dans le secteur de l'eau"
    category: political
    subcategory: legislation
    location: [gov-tunis]
    actors: []
    institutions: [arp-2023, sonede]
    causes: []
    consequences: []
    summary: >-
      The finance and budget committee of the Assembly of the Representatives of the
      People approved on Tuesday 17 November 2026, at the end of a hearing of
      representatives of the economy and planning, agriculture/water resources/
      fisheries and finance ministries and of the SONEDE chief executive, seven
      draft laws approving water-sector loan, guarantee and supplementary-financing
      agreements concluded between the Republic of Tunisia and international lenders
      for the benefit of SONEDE, per a Parliament communiqué of Wednesday evening 18
      November as relayed by African Manager, La Presse de Tunisie and Managers on
      19 November. The seven, as African Manager quotes the communiqué: an EIB
      first-demand guarantee of 28 April 2025 on a supplementary loan for the
      Bejaoua water treatment plant and its connection to SONEDE's networks; an AFD
      first-demand guarantee of 19 February 2026 on a supplementary loan for the
      treated-water transport works; an EIB supplementary financing contract of 28
      April 2025 for the Greater Tunis drinking-water supply security programme; an
      AFD loan agreement of 12 September 2025 for the same programme; an AFD
      first-demand guarantee of 19 February 2026 for the same programme; an IsDB
      murabaha (forward-sale) agreement of 10 May 2026 for additional financing of
      the Saida and Kalaat El Kebir dams and their associated water-transfer works;
      and an AfDB guarantee agreement of 22 September 2026 for the Greater Tunis
      drinking-water network technical and energy performance project. Per the ARP
      bureau minutes of 2 November 2026 the seven carry bill numbers 64, 65 and 67
      to 71 of 2026; a ninth law referred the same day, n° 66, is an EBRD guarantee
      for a STEG Grombalia-Kandar line and is not among the seven. Committee approval
      is one stage: no plenary vote, promulgated law or JORT act was found for any of
      the seven, and none of the sources read states an amount, tenor or dinar value.
    confidence: B
    verification: needs-primary-source
    attributed_to: "A Parliament communiqué of Wednesday 18 November 2026, as relayed by African Manager, La Presse de Tunisie and Managers on 19 November 2026; the committee's agenda for 17 November 2026 on arp.tn"
    reasoning: >-
      Two institutional facts carry this record and one does not. The ARP's own
      committee calendar fixes the committee, the date, the hour and the count of
      seven bills on exactly this subject, so the sitting is tier-2 documented. The
      vote, the attendance list and the seven instruments come from a communiqué
      that was not retrieved, relayed near-verbatim by three outlets on the same day
      — enough for B (several credible outlets), not for A, which needs the
      communiqué itself. The bill-number mapping is the ARP bureau minutes of 2
      November as transcribed by Espacemanager; the underlying PDF is a scan whose
      Arabic was read only through a search index's OCR. The event is graded on the
      approval, not on the financing: each of the seven agreements is older (April
      2025 to September 2026) and none was verified here. No figure is carried
      because no source states one.
    falsifiable_by: >-
      The Parliament communiqué of 18 November 2026, the committee's minutes or
      report for the 17 November sitting, the plenary record, or a JORT law
      ratifying any of the seven would confirm or correct the date, the count and the
      list; a different bill number for any instrument, or a sitting held on
      Wednesday 18 November instead of Tuesday 17, would correct the record.
    sources:
