  - id: espacemanager-arp-bureau-nine-bills-2026-11-02
    title: "Bureau ARP : neuf projets de loi renvoyés à la Commission des finances et du budget"
    publisher: Espacemanager
    date: 2026-11-02
    url: https://espacemanager.com/bureau-arp-neuf-projets-de-loi-renvoyes-a-la-commission-des-finances-et-du-budget
