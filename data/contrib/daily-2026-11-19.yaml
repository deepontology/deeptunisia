  - id: ev-tunisair-agm-egm-convocation-2026-11-19
    date: "2026-11-19"
    title_en: "Tunisair convokes its shareholders to ordinary and extraordinary meetings for 15 December 2026"
    title_fr: "Tunisair convoque ses actionnaires en assemblée générale ordinaire et extraordinaire pour le 15 décembre 2026"
    category: economic
    location: [gov-tunis]
    actors: []
    institutions: [tunisair]
    causes: []
    consequences: []
    summary: >-
      Tunisair convoked its shareholders to an ordinary general meeting and an
      extraordinary general meeting for 15 December 2026, per an Amen Invest
      analysis relayed by African Manager on 19 November 2026. The extraordinary
      meeting is to vote on continuation of activity under article 388 of the
      commercial companies code, a recurring formality because the carrier's
      equity is structurally negative; the analysis recalls that the May 2026
      extraordinary meeting approved continuation on the 2023 accounts, which
      showed an equity deficit of 1,759.7 million dinars, against 1,473.4
      million dinars in 2022. The ordinary meeting is to approve the 2024
      financial statements and to decide the quitus, a partial renewal of the
      board and the appointment of auditors for 2025-2027. The convocation
      notice, the 2024 accounts and the May 2026 resolution were not retrieved;
      the meeting date is future and is carried in this summary, not as the
      record date.
    confidence: C
    verification: needs-primary-source
    attributed_to: "Amen Invest analysis relayed by African Manager (19 November 2026)"
    reasoning: >-
      One outlet relaying a broker's analysis of a convocation. The agenda, the
      article 388 procedure and the equity figures are as that relay states
      them; no convocation notice, board minutes or financial statements were
      retrieved. The record is dated to the announcement, not to the December
      meeting.
    falsifiable_by: >-
      The convocation notice published by Tunisair (BVMT or company site), the
      2024 financial statements and the May 2026 extraordinary-meeting minutes
      would confirm the agenda and the equity figures; a different date, agenda
      or figures would correct the record.
    sources:
