  - id: ev-bct-reserve-requirement-tripled-2026-10-09
    date: "2026-10-09"
    title_en: "Central Bank triples the reserve-requirement rate on demand deposits from 1% to 3%"
    title_fr: "La Banque centrale triple le taux des réserves obligatoires sur les comptes à vue, de 1 % à 3 %"
    category: economic
    subcategory: monetary-policy
    location: []
    actors: [fethi-zouhair-nouri]
    institutions: [bct]
    causes: []
    consequences: []
    summary: >-
      The Central Bank of Tunisia issued circular to banks no. 2026-11 on 9 October
      2026, replacing annexe II.3 of the 2017-02 circular of 10 March 2017 and
      setting the reserve-requirement rate at 3% on demand accounts (P02010000) and
      other sums due to customers (P02990000), against 1% in the replaced grid, with
      special and other savings accounts, time deposits, bons de caisse and
      certificates of deposit unchanged at 0%. It enters into force on 1 November
      2026 and recites the board deliberation of 7 October 2026; the reserve is
      averaged over the month after the declaration, so the first reserve at the new
      rate is constituted in December 2026. The board held the policy rate at 7.00%
      at that meeting, saying inflation risks remained tilted upward, with inflation
      at 5.6% in September 2026. African Manager reported the measure on 19 November
      2026, deriving about 2.2 bn TND immobilised from 110.7 bn TND of listed banks'
      deposits at end-June 2026 against a regulatory base it concedes may differ, and
      citing an unrecovered Tunisie Valeurs sector study of 23 October 2026 for the
      liquidity and credit context.
    confidence: A
    verification: verified
    attributed_to: "Circular and press release: Banque centrale de Tunisie. Derived 2.2 bn TND and the sector figures: African Manager (19 November 2026), citing a Tunisie Valeurs study of 23 October 2026."
    reasoning: >-
      The circular and the annex it replaces were both retrieved from the BCT and
      read, so the number, date, headings, the 1% to 3% change and the 1 November
      2026 entry into force are the instrument's own words. The 7% decision is the
      board's press release. Dated on the circular rather than on the effective date
      because the instrument is the event; the effective date and the December
      constitution are stated in the summary. Only the quantities are second hand,
      and they are marked derived and attributed.
    falsifiable_by: >-
      A JORT printing showing another rate or entry into force, an amending or
      repealing circular before 1 November 2026, or BCT statistics showing a reserve
      base different from African Manager's derivation would correct the record; a
      7 October board decision at another rate would correct the policy-rate
      sentence.
    sources:
