    publisher: Kapitalis
    date: 2026-09-15
    url: https://kapitalis.com/tunisie/2026/09/15/transport-aerien-le-canada-et-la-tunisie-elargissent-leur-accord-bilateral/
    tier: 3
    lang: fr
    excerpt: >-
      Le Gouvernement du Canada annonce l’élargissement de l’accord sur le transport aérien
      entre le Canada et la Tunisie, qui permettra aux transporteurs des deux pays d’accroître
      leurs services. jusqu’à sept vols passagers-cargo hebdomadaires pour chaque pays (contre
      quatre auparavant) [...] un accès illimité à tous les points dans chaque pays (contre un
      seul point pour chaque pays auparavant) [...] un nombre illimité de vols tout-cargo
      hebdomadaires [...]
  - id: iaea-tunisia-cpf-2026-09-17
    title: "Tunisia Signs a Country Programme Framework (CPF) for 2026-2030"
    publisher: IAEA
    date: 2026-09-17
    url: https://www.iaea.org/newscenter/news/tunisia-signs-a-country-programme-framework-cpf-for-2026-2030
    tier: 2
    lang: en
    excerpt: >-
      Mr Hua Liu, IAEA Deputy Director General and Head of the Department of Technical
      Cooperation, and HE Mr Mondher Belaid, Minister of Higher Education and Scientific
      Research, Tunisia, signed Tunisia’s Country Programme Framework (CPF) for the period
      2026–2030 on 17 September 2026. A CPF is the frame of reference for the medium-term
      planning of technical cooperation between a Member State and the IAEA [...] Tunisia has
      been an IAEA Member State since 1957.
  - id: am-iaea-cpf-2026-09-22
    title: "Tunisie-AIEA : signature d'un programme national de coopération pour 2026-2030"
    publisher: African Manager
    date: 2026-09-22
    url: https://africanmanager.com/tunisie-aiea-signature-dun-programme-national-de-cooperation-pour-2026-2030/
    tier: 3
    lang: fr
    excerpt: >-
      L’accord a été signé jeudi à Vienne par le ministre de l’Enseignement supérieur et de la
      Recherche scientifique, Mondher Belaïd, également président de la Commission nationale de
      l’énergie atomique, et Liu Hua, directeur général adjoint de l’AIEA chargé de la
      coopération technique, en marge de la 70e session ordinaire de la Conférence générale de
      l’agence. [...] un cadre stratégique pour orienter la coopération technique et scientifique
      entre la Tunisie et l’AIEA [...] dans sept domaines.
  - id: kapitalis-sidi-bou-said-2026-09-24
    title: "La Tunisie reçoit le certificat officiel d'inscription de Sidi Bou Saïd à l'Unesco"
    publisher: Kapitalis
    date: 2026-09-24
    url: https://kapitalis.com/tunisie/2026/09/24/la-tunisie-recoit-le-certificat-officiel-dinscription-de-sidi-bou-said-a-lunesco/
    tier: 3
    lang: fr
    excerpt: >-
      A la suite de la décision adoptée à l’unanimité par le Comité du patrimoine mondial, le
      25 juillet 2026, à l’occasion de sa 48ème session, tenue à Busan, en République de Corée,
      portant inscription du Village de Sidi Bou Saïd sur la Liste du patrimoine mondial de
      l’UNESCO, M. Dhia Khaled, Ambassadeur, Délégué permanent de la République tunisienne
      auprès de l’Unesco, a reçu, le 24 septembre 2026, au Siège de l’Organisation, de
      M. Lazare Eloundou Assomo, Directeur du Centre du patrimoine mondial de l’Unesco, le
      Certificat officiel d’inscription.
  - id: am-sidi-bou-said-2026-09-24
    title: "Consécration internationale : remise du certificat d'inscription de Sidi Bou Saïd à l'UNESCO"
    publisher: African Manager
    date: 2026-09-24
    url: https://africanmanager.com/consecration-internationale-remise-du-certificat-dinscription-de-sidi-bou-said-a-lunesco/
    tier: 3
    lang: fr
    excerpt: >-
      À la suite de son inscription unanime au patrimoine mondial de l’UNESCO le 25 juillet
      2026 à Busan (Corée), le certificat officiel a été remis ce jeudi 24 septembre 2026 au
      siège de l’organisation à Paris. [...] Avec l’inscription du Village de Sidi Bou Saïd, le
      nombre de biens tunisiens inscrits sur la Liste du patrimoine mondial de l’UNESCO s’élève
      désormais à dix, dont neuf biens culturels et un bien naturel [...]
  - id: am-nafti-iom-2026-09-23
    title: "Nafti et l'OIM examinent les résultats du retour volontaire"
    publisher: African Manager
    date: 2026-09-23
    url: https://africanmanager.com/nafti-et-la-dg-de-loim-examinent-les-resultats-du-mecanisme-de-retour-volontaire/
    tier: 3
    lang: fr
    excerpt: >-
      Le ministre des Affaires étrangères, de la Migration et des Tunisiens à l’étranger,
      Mohamed Ali Nafti, s’est entretenu mardi, à New York, avec la directrice générale de
      l’Organisation internationale pour les migrations (OIM), Amy Pope [...] les deux parties
      ont examiné les résultats du mécanisme de retour volontaire et de réintégration qui a
      abouti au retour volontaire de 5 077 migrants en situation irrégulière depuis le
      1er janvier 2026, portant ainsi à 25 351 le nombre total des migrants en situation
      irrégulière ayant bénéficié de ce mécanisme depuis sa mise en place.
  - id: nawaat-migration-decline-2026-09-20
    title: "Migration: Tunisians continue to leave, despite growing death toll and tighter controls"
    publisher: Nawaat
    date: 2026-09-20
    url: https://nawaat.org/2026/09/20/migration-tunisians-continue-to-leave-despite-growing-death-toll-and-tighter-controls/
    tier: 4
    lang: en
    excerpt: >-
      In terms of arrivals by nationality, Viminale recorded 820 Tunisians debarking on Italian
      shores between January 1 and August 15, 2026, or approximately 4.7% of the 17,495 migrants
      who arrived by sea during that period. [...] Tunisia is the primary country of origin for
      repatriated migrants in Italy: 600 Tunisian nationals were forcibly repatriated in 2025
      (versus 1,849 in 2024) [...] On August 10, 2026, Dhaoui Lassoued, a 30-year-old Tunisian
      migrant from Ben Guerdane, died after falling from the roof of the Palazzo San Gervasio
      pre-removal detention center (CPR) in Italy.
  - id: am-ras-jedir-2026-09-23
    title: "Ras Jedir: jusqu'à 70 h d'attente, Abdelkébir tire la sonnette d'alarme !"
    publisher: African Manager
    date: 2026-09-23
    url: https://africanmanager.com/ras-jedir-jusqua-70-h-dattente-abdelkebir-tire-la-sonnette-dalarme/
    tier: 3
    lang: fr
    excerpt: >-
      Le président de l’Observatoire tunisien des droits de l’Homme, Mustapha Abdelkébir, a
      indiqué ce mardi 22 septembre 2026 que la situation au poste-frontière de Ras Jedir est
      devenue extrêmement difficile. Il a précisé que le temps d’attente des voyageurs tunisiens
      a, dans certains cas, dépassé 70 heures, contre trois à quatre heures en temps normal.

