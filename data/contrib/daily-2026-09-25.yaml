events:
  - id: ev-phoenix-express-2026-09
    patch_reason: >-
      2026-09-18 completion coverage adds dated closing facts (21st edition, ceremony at the
      La Goulette naval base, twelve-day exercise, five ships, two one-week phases) and exposes
      a participant-list discrepancy the current summary does not carry (09-18 closing report
      lists Saudi Arabia as the 13th country; the same day's Anderson report lists Malta; the
      09-17 ministerial readout lists twelve countries with neither).
    date: "2026-09-06"
    date_end: "2026-09-18"
    title_en: "Phoenix Express 2026 multinational naval exercise hosted in Tunisia"
    title_fr: "L'exercice naval multinational Phoenix Express 2026 accueilli en Tunisie"
    category: military
    subcategory: joint-exercise
    institutions: [ministry-defence]
    summary: >-
      Tunisia hosted the Phoenix Express 2026 multinational maritime exercise from 6 to 18
      September 2026 at La Goulette and Bizerte, with US AFRICOM (reported end date 18
      September; one US Navy imagery set is dated 7 September, so opening ceremonies may fall
      on the 7th — the one-day discrepancy is not smoothed here). African Manager, relaying
      the Defence Ministry communiqué, reports ~400 personnel and observers and lists Algeria,
      Libya, Morocco, Egypt, Turkey, Italy, France, Spain, Belgium, Georgia and the United
      States alongside host Tunisia; Kapitalis reports thirteen participating countries.
      Stated aims are maritime security, smuggling and trafficking interdiction. No Phoenix
      event exists in the graph. Completion coverage (African Manager, 18 September): the
      closing ceremony was held at the La Goulette naval base, ending the 21st edition in a
      twelve-day exercise (the same one-day tension with the 6-18 window noted above);
      African Manager reports five military ships and two one-week phases — ashore/command-post
      work including a multinational communications centre, and a tactical sea phase with
      visit-board-search-seizure, search-and-rescue, demining and CBRN exchanges — and quotes
      Tunisian navy chief of staff Adel Jehane and Vice-Admiral Jeffrey Anderson. The 09-18
      closing report lists Saudi Arabia as the thirteenth country, while the same day's
      Anderson report lists Malta; the two African Manager pieces disagree on the thirteenth
      participant and the graph does not resolve it. The 09-17 ministerial readout lists
      twelve countries (neither Malta nor Saudi Arabia). Anderson, commander of the US 6th
      Fleet and NATO Naval Striking and Support Forces, is described as based in Naples.
    confidence: B
    basis: reported
    falsifiable_by: Tunisian Defence Ministry communiqué of 5 September 2026 or the US AFRICOM/NAVAF exercise release
    sources:
      - african-manager-phoenix-mod-2026-09-09
      - african-manager-phoenix-26-2026-09-05
      - kapitalis-phoenix-2026-09-06
      - am-phoenix-close-2026-09-18
      - am-phoenix-anderson-2026-09-18
  - id: ev-bizerte-maritime-excellence-centre-2026
    date: "~2026-06-14"
    title_en: "Bizerte Maritime Centre of Excellence under construction with US funding"
    title_fr: "Le Centre d'excellence maritime de Bizerte en construction avec un financement américain"
    category: military
    subcategory: infrastructure
    location: [gov-bizerte]
    institutions: [ministry-defence, united-states]
    summary: >-
      African Manager (23 September 2026) reports that the United States relaunched the
      Bizerte Maritime Centre of Excellence project through the US government procurement
      platform. The article relays US Naval Forces Europe/Africa and Sixth Fleet material
      dated 14 June 2026 in which Admiral George M. Wikoff, commander of US Naval Forces
      Africa, described the centre under construction as dedicated to training marine
      commandos: a close-combat site, two firing ranges, an obstacle course, a training tower,
      gym and pool, a port and a heliport, with administrative, academic and logistics
      buildings. The construction contract went about two years earlier to the Turkish firm
      Biltek under a US Department of Defense award; the article states a negotiated value of
      about USD 1.3 million raised above USD 2.15 million through amendments, and that the
      works are in their third phase and should not exceed two years. It states the United
      States handles contracting, financing and execution while the centre remains on Tunisian
      territory under Tunisian sovereignty and military command. The centre was discussed at
      the Shili–Anderson meeting of 16 September 2026, where the minister called it the Centre
      of Excellence of the naval special forces. No agreement or memorandum of understanding
