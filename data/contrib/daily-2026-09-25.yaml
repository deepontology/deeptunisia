#   touching entities already in the graph (BCT, STEG, SONEDE, UGTT, ARP,
#   ministries, tribunals), starting from the 157 positions still flagged
#   `verification: needs-primary-source`.
# WINDOW: no issue is dated 10 September 2026. The window is n° 91 (11 Sep),
#   92 (15 Sep), 93 (18 Sep), 94 (22 Sep), 95 (25 Sep). n° 96 does not exist
#   yet: /fr/2026/096.pdf and /ar/2026/096.pdf both return 404.
# URLS FETCHED 2026-09-25 (tier-1 gazette text; read with pdftotext and the
#   OCR mirror, never quoted from a search snippet):
#   - https://lake.jort.tn/journal-officiel/fr/2026/091.pdf   (issue dated 11 Sep 2026)
#   - https://lake.jort.tn/journal-officiel/ar/2026/091.pdf   (Arabic official edition)
#   - https://lake.jort.tn/journal-officiel/fr/2026/092.pdf   (15 Sep 2026)
#   - https://lake.jort.tn/journal-officiel/fr/2026/093.pdf   (18 Sep 2026)
#   - https://lake.jort.tn/journal-officiel/fr/2026/094.pdf   (22 Sep 2026)
#   - https://lake.jort.tn/journal-officiel/fr/2026/095.pdf   (25 Sep 2026)
#   - https://lake.jort.tn/journal-officiel/fr/{2010/015, 2016/029, 2017/036,
#     2020/127, 2021/066, 2021/092, 2022/023, 2024/150, 2026/043}.pdf
#   - https://api.jort.tn/search and https://ocr.jort.tn (full-text index and
#     OCR mirror over the gazette; every hit below re-verified against the
#     fetched lake.jort.tn PDF before being used)
#   jort.gov.tn does not resolve from this environment; www.iort.gov.tn
#   serves http-only. lake.jort.tn served every PDF above.
# WINDOW RESULT: the five window issues carry exactly three decrees —
#   2026-219 du 8 septembre 2026 (convocation of voters, Mosrata/Siliana,
#   vote on 15 November 2026), 2026-220 and 2026-221 du 10 septembre 2026
#   (both relieve Wadii Rhouma, conservateur de la propriété foncière and
#   président-directeur général of the Office national de la propriété
#   foncière). No government, security or judiciary appointment decree was
#   gazetted in the window. The rest of the five issues is routine arrêtés
#   (concours, promotions, mid-level postings), two regulatory acts (STEG
#   standard contract; BCT circular 2026-9) and board-representative
#   postings, all noted below.
# WORKLIST RESULT: six positions flagged needs-primary-source were resolved
#   to exact gazette dates — p-soe-poste-marouen-ben-slimene (start and end),
#   p-soe-sncft-taoufik-boufaied, p-soe-sncft-belgacem-tayaa, p-soe-sonede-
#   ahmed-soula, p-media-ett-dali, p-admin-abdessalem-mehdi-grissiaa — plus
#   two more evidenced in the notes (p-soe-sncft-sarra-rejeb, p-air-laajimi),
#   and three new appointment candidates recorded (Rhouma, Faria, Mnaja).
#   The decrees were located with api.jort.tn's full-text index and then read
#   in the fetched PDFs.
# FAILURE VOCABULARY (must not be collapsed):
#   - "the fetched issue is the gazette text" is not "an appointment decree
#     was found": JORT n° 93 and n° 94 contain no decree at all, and n° 95
#     contains none beyond routine arrêtés.
#   - "a JORT arrêté that cites an appointment decree names the decree and
#     its date, but is not the decree": décret n° 2008-358 du 9 février 2008
#     (Taieb Laajimi, chef d'état-major de l'armée de l'air) is cited in JORT
#     n° 15 du 19 février 2010 and n° 17 du 15 mars 2011; the February 2008
#     issue itself was not fetched, so p-air-laajimi is evidenced here but
#     not upgraded to A.
#   - "a signature block names the office, not the appointment": the arrêté
#     of 3 September 2026 (JORT n° 91) is signed by « Le ministre chargé à
#     titre temporaire de diriger le ministère de l'industrie, des mines et
#     de l'énergie, Slah Zouari »; it documents the acting portfolio on that
#     date, not the start of it, and no appointment decree for that portfolio
#     was found in the window.
#   - "the successor's gazetted appointment bounds the predecessor's end":
#     used for Soula (SONEDE) where no names-the-holder cessation decree was
#     located; the patch is graded B for that reason, unlike the Ben Slimene
#     patch, which rests on a decree that names him.
#   - "api.jort.tn uses a trigram tokenizer": quoted phrases still return
#     partial matches, so no snippet was used as evidence without locating
#     the passage in the fetched issue text.
#   - "a 'Vu' citation is not a fetched instrument": JORT n° 91 cites décret
#     n° 2026-159 du 23 juillet 2026 (Tarek Ben Salem) inside a "Vu"; that
#     issue was not fetched, so no record is made from it.
# UNRESOLVED after name search and office-phrase search on api.jort.tn
#   (French edition): p-soe-poste-sami-mekki, p-soe-poste-jaouher-ferjaoui,
#   p-soe-steg-faycal-trifa, p-soe-tunisair-montassar-bnouni, p-soe-etap-
#   dalila-chebbi-bouattour, p-bank-stb-*, p-bank-bna-*, p-bank-bh-*, the
#   p-dgsn-*/p-ng-*/p-dgsp-* security rows, p-cassation-taieb-rached and
#   p-audit-abdellatif-kharrat: no appointment decree located. A negative in
#   the indexed French edition is not proof the appointment was never
#   gazetted (Arabic-only acts exist).
# Candidates are proposals, not graph data. Nothing canonical changed.

sources:
  - id: jort-2026-091
    title: "Décrets n° 2026-220 et 2026-221 du 10 septembre 2026 (Wadii Rhouma, conservateur de la propriété foncière et président-directeur général de l'Office national de la propriété foncière), JORT n° 91 du 11 septembre 2026, p. 1854"
    publisher: Journal Officiel de la République Tunisienne (archive officielle lake.jort.tn)
    date: "2026-09-11"
    url: https://lake.jort.tn/journal-officiel/fr/2026/091.pdf
    tier: 1
    lang: fr
    excerpt: "Par décret n° 2026-220 du 10 septembre 2026. Monsieur Wadii Rhouma, inspecteur général de la propriété foncière, est déchargé des fonctions de conservateur de la propriété foncière. Par décret n° 2026-221 du 10 septembre 2026. Monsieur Wadii Rhouma, inspecteur général de la propriété foncière, est déchargé des fonctions de Président-directeur général de l'Office national de la propriété foncière."
    notes:
      - "The same issue also carries: décret n° 2026-219 du 8 septembre 2026 (convocation of the registered voters of the Mosrata sector, El Aroussa delegation, Siliana, to vote on 15 November 2026 on the revocation of a local council member); the arrêté of the acting industry minister of 3 September 2026 approving the STEG standard supply contract, signed « Le ministre chargé à titre temporaire de diriger le ministère de l'industrie, des mines et de l'énergie, Slah Zouari »; and BCT circular to banks n° 2026-9 of 4 September 2026 (revision of agricultural credit scales)."
