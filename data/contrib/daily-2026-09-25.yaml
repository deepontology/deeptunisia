sources:
  - id: am-phoenix-close-2026-09-18
    title: "Phoenix Express 2026 s'achève en Tunisie"
    publisher: African Manager
    date: 2026-09-18
    url: https://africanmanager.com/phoenix-express-2026-sacheve-en-tunisie/
    tier: 3
    lang: fr
    excerpt: >-
      L’exercice Phoenix Express, un exercice maritime multinational de premier plan facilité
      par les forces navales américaines en Afrique et dirigé par la 6e flotte américaine, a
      conclu sa 21e édition lors d’une cérémonie de clôture qui s’est tenue à la base navale
      de La Goulette, ce vendredi 18 septembre. [...] Les pays participant à Phoenix Express
      2026 sont l’Algérie, la Belgique, l’Égypte, la France, la Géorgie, l’Italie, la Libye,
      le Maroc, la Tunisie, la Turquie, l’Arabie saoudite, l’Espagne et les États-Unis.
  - id: am-phoenix-anderson-2026-09-18
    title: "Phoenix Express 26 : le vice-amiral Jeffrey Anderson salue la solidité du partenariat tuniso-américain"
    publisher: African Manager
    date: 2026-09-18
    url: https://africanmanager.com/phoenix-express-26-le-vice-amiral-jeffrey-anderson-salue-la-solidite-du-partenariat-tuniso-americain/
    tier: 3
    lang: fr
    excerpt: >-
      Organisé du 6 au 18 septembre en coopération avec le Commandement des États-Unis pour
      l’Afrique (AFRICOM), « Phoenix Express 26 » réunit environ 400 militaires et observateurs
      de 13 pays, dont la Tunisie, les Etats-Unis, l’Algérie, la Libye, le Maroc, l’Egypte,
      la Turquie, Malte, l’Italie, la France, l’Espagne, la Belgique et la Géorgie. Cinq
      bâtiments militaires ont également pris part à l’exercice [...]
  - id: am-sehli-anderson-2026-09-17
    title: "Sehli reçoit le commandant de la 6ème flotte américaine"
    publisher: African Manager
    date: 2026-09-17
    url: https://africanmanager.com/le-ministre-de-la-defense-nationale-recoit-le-commandant-de-la-sixieme-flotte-americaine/
    tier: 3
    lang: fr
    excerpt: >-
      Le ministre de la Défense nationale, Khaled Sehili, a reçu, mercredi, au siège du
      ministère, le commandant de la Sixième flotte américaine, le vice-amiral Jeffrey Anderson,
      en visite en Tunisie à l’occasion de l’exercice naval multilatéral « Phoenix Express 26 ».
      La rencontre s’est déroulée en présence de l’ambassadeur des États-Unis en Tunisie et du
      chef d’état-major de la Marine nationale, indique le ministère de la Défense dans un
      communiqué. [...] Il a déclaré que la Tunisie dispose des atouts nécessaires pour devenir
      un pôle régional dans le domaine de l’entraînement et de la formation militaires selon les
      normes de référence, surtout à travers le Centre d’excellence des forces spéciales navales.
  - id: am-bizerte-coe-2026-09-23
    title: "La Tunisie et les USA se dotent d'un Centre d'excellence maritime à Bizerte. De quoi s'agirait-il ?"
    publisher: African Manager
    date: 2026-09-23
    url: https://africanmanager.com/la-tunisie-et-les-usa-se-dotent-dun-centre-dexcellence-maritime-a-bizerte-de-quoi-sagirait-il/
    tier: 3
    lang: fr
    excerpt: >-
      Les Etats-Unis ont relancé le projet de création du Centre d’Excellence Maritime de
      Bizerte, via la plateforme des marchés publics du gouvernement américain. [...] Négocié
      et conclu initialement pour un montant d’environ 1,3 million de dollars US, il porte
      présentement sur la construction d’infrastructures dédiées à la formation maritime et
      militaire. L’enveloppe financière allouée a été portée en chemin à plus de 2,15 millions
      de dollars aux termes d’avenants. [...] les États-Unis sont responsables de la passation
      de marchés, du financement et de l’exécution des travaux [...] tandis que le centre
      demeure situé sur le territoire tunisien et sous souveraineté et commandement militaires
      tunisiens.
  - id: am-sehili-industry-2026-09-23
    title: "Sehili voudrait renforcer la production militaire locale"
    publisher: African Manager
    date: 2026-09-23
    url: https://africanmanager.com/le-ministre-de-la-defense-appelle-a-renforcer-la-production-militaire-nationale/
    tier: 3
    lang: fr
    excerpt: >-
      La Tunisie doit mobiliser l’ensemble de ses ressources humaines, matérielles,
      scientifiques et technologiques afin de soutenir sa transition économique et renforcer
      ses capacités industrielles nationales, a déclaré mardi le ministre de la Défense,
      Khaled Sehili. [...] Cette démarche doit contribuer à l’élaboration d’une stratégie
      nationale d’industrie militaire visant à réduire la dépendance aux importations
      d’équipements de défense et à promouvoir leur fabrication localement [...] Il a également
      appelé à dépasser les projets individuels pour construire une « souveraineté industrielle
      de défense » durable [...]
  - id: tc-canada-tunisia-air-2026-09-14
    title: "The Government of Canada announces expanded air transport agreement between Canada and Tunisia"
    publisher: "Transport Canada (news release, via Cision/Newswire)"
    date: 2026-09-14
    url: https://www.canada.ca/en/transport-canada/news/2026/09/the-government-of-canada-announces-expanded-air-transport-agreement-between-canada-and-tunisia.html
    archive_url: https://www.newswire.ca/news-releases/the-government-of-canada-announces-expanded-air-transport-agreement-between-canada-and-tunisia-894639399.html
    tier: 2
    lang: en
    excerpt: >-
      Today, the Honourable Steven MacKinnon, Minister of Transport and Leader of the
      Government in the House of Commons, announced an expanded air transport agreement
      with Tunisia. The expanded agreement includes: Up to seven weekly passenger-combination
      flights for each country (up from four); Access to all points in each country (up from
      one point each); Unlimited weekly all-cargo flights (previously no dedicated all-cargo
      rights). [...] Since the Agreement was last expanded in 2019, passenger traffic between
      Canada and Tunisia is up more than 55 per cent.
    notes:
      - "canada.ca timed out from this environment; the text above was fetched from the Cision/Newswire mirror of the same Transport Canada release on 2026-09-25."
  - id: kapitalis-canada-air-2026-09-15
