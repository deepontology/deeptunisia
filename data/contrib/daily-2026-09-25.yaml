      Bilateral air transport agreement originally concluded in 2010 and first expanded in
      2019; Transport Canada announced a further expansion on 14 September 2026 (Minister of
      Transport Steven MacKinnon): up to seven weekly passenger-combination flights per
      country (from four), access to all points in each country (from one each), and unlimited
      weekly all-cargo flights (previously no dedicated all-cargo rights). The release also
      states passenger traffic between the two countries is up more than 55 per cent since the
      2019 expansion, bilateral merchandise trade reached CAD 439 million in 2025, Canadian
      direct investment CAD 183 million, a Canadian-Tunisian diaspora of more than 30,000
      (2021 Census) and nearly 3,000 Tunisian students in Canada in 2025. No Canadian page or
      Tunisian readout of the 2026 expansion was located; the announcement date is the release
      date, not a signature or entry-into-force date, which the release does not give.
      the release date, not a signature or entry-into-force date, which the release
      does not give.
    confidence: A
    basis: documented
    sources:
      - tc-canada-tunisia-air-2026-09-14
      - kapitalis-canada-air-2026-09-15
  - id: tunisia-iaea-country-programme-framework-2026-2030
    title_en: "Tunisia–IAEA Country Programme Framework 2026–2030"
    title_fr: "Programme national-cadre Tunisie–AIEA 2026-2030"
    kind: other
    parties: [iaea]
    signed: 2026-09-17
    text_url: https://www.iaea.org/newscenter/news/tunisia-signs-a-country-programme-framework-cpf-for-2026-2030
    summary: >-
      Signed in Vienna on 17 September 2026 by Hua Liu, IAEA Deputy Director General and Head
      of the Department of Technical Cooperation, and Mondher Belaid, Tunisian Minister of
      Higher Education and Scientific Research (also president of the National Atomic Energy
      Commission per African Manager), on the margins of the 70th regular session of the IAEA
      General Conference (14-18 September 2026). A CPF is the frame of reference for
      medium-term technical cooperation; Tunisia's 2026-2030 CPF identifies seven priority
      areas: nuclear and radiation safety and nuclear security; health and nutrition; food and
      agriculture; water and the environment; industrial applications and radiation
      technology; energy planning and nuclear power; nuclear knowledge development and
      management. The IAEA release calls the signatories' roles as above and records Tunisia
      as a member state since 1957.
