#   african-manager-carburant-preavis-2026-08-27, and the four sources already
#   on ev-yousfi-detention-2026-09.
# FAILURE VOCABULARY (must not be collapsed):
#   - "mardi 16 septembre" (ASF/Kapitalis) carries the wrong weekday: 16
#     September 2026 is a Wednesday; the date is kept, the weekday rejected.
#   - the Mrabet seizure figures are not reconciled: African Manager/TAP
#     "plus de 8 kg de cocaïne et 4 kg de cannabis" vs Kapitalis "8 kg de
#     cocaïne, 40 plaquettes de résine de cannabis (zatla)".
#   - the Mrabet co-accused count is not reconciled: six co-accused (Kapitalis
#     13 Sept) vs nine detention warrants and 21 prosecuted (African Manager
#     17 Sept, citing TAP).
#   - Akremi's prior totals conflict: Kapitalis says he "already" carried 20
#     years; Business News and CRLDHT say 23 years at first instance (4 March
#     2026) raised to 29 on appeal (13 July 2026). Kept as a recorded conflict,
#     never summed with the new 15-year sentence.
#   - the 23 September hunger-strike count is 38 days (Kapitalis) vs "39th day"
#     (Al Jazeera / Gaza Sumud Flotilla). Both kept, not averaged.
#   - "grève de la faim sauvage" is rendered as an open-ended/wildcat hunger
#     strike; the French term is the source's.
#   - charges, sentences and "flagrant délit permanent" are press-relayed
#     documents; none is a court dispositif.
#   - the CRLDHT and ASF passages are the organisations' own statements and are
#     primary for what those organisations claim, not for state facts.
#   - no Al Jazeera item dated 11 September exists in the window; the assigned
#     09-11 signal is the 09-10 story, already canonical.
# CANDIDATES ARE PROPOSALS, NOT GRAPH DATA. Nothing canonical was changed;
#   humans dispose (P4).

