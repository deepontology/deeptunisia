    publisher: Journal Officiel de la République Tunisienne (édition arabe officielle, archive lake.jort.tn)
    date: "2026-09-11"
    url: https://lake.jort.tn/journal-officiel/ar/2026/091.pdf
    tier: 1
    lang: ar
    excerpt: "بمقتضى أمر عدد 220 لسنة 2026 مؤرخ في 10 سبتمبر 2026. يعفى السيد وديع رحومة، متفقد عام للملكية العقارية، من مهام حافظ الملكية العقارية. بمقتضى أمر عدد 221 لسنة 2026 مؤرخ في 10 سبتمبر 2026. يعفى السيد وديع رحومة، متفقد عام للملكية العقارية، من مهام رئيس مدير عام الديوان الوطني للملكية العقارية."
