agreements:
  - id: canada-tunisia-air-transport-agreement
    title_en: "Canada–Tunisia Air Transport Agreement (concluded 2010; expanded 2019 and 2026)"
    title_fr: "Accord sur le transport aérien Canada–Tunisie (conclu en 2010 ; élargi en 2019 et 2026)"
    kind: other
