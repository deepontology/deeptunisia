    role: sonede-pdg
    holder: ahmed-soula
    start: "2023-07"
    end: "2024-12-11"
    confidence: B
    basis: inferred
    verification: verified
    patch_reason: >-
      End corrected from ongoing to 2024-12-11. No cessation decree naming Soula was located;
      the end is bounded by décret n° 2024-636 du 11 décembre 2024, which charges Abdelhamid
      Mnaja with the SONEDE PDG functions. Per the failure vocabulary, a successor's
      appointment is a corollary, not a names-the-holder record, hence B. The start 2023-07
      remains encyclopedic and is not fixed by a fetched record.
    reasoning: >-
      The end date is not stated by any fetched act: it is reasoned from the tier-1
      decree charging a successor with the same functions on 11 December 2024, so it
      is recorded as an inference rather than a documented cessation.
