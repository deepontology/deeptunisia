positions:
  # ---- Window decrees (JORT n° 91 du 11 septembre 2026) -------------------
  - id: p-onpf-rhouma
    role: onpf-pdg
    holder: wadii-rhouma
    start: "?"
    end: "2026-09-10"
    confidence: A
    basis: documented
    verification: verified
    sources: [jort-2026-091, jort-2026-091-ar]
    notes:
      - >-
        New position and new role/institution (Office national de la propriété foncière is not
        in the graph). Décret n° 2026-221 du 10 septembre 2026 (JORT n° 91 du 11 septembre 2026,
        p. 1854) ends his functions as « Président-directeur général de l'Office national de la
        propriété foncière »; the same day's décret n° 2026-220 ends the separate function of
        « conservateur de la propriété foncière ». Only the end is documented; the appointment
        (start) was not located, so a second position row for the conservateur office is kept in
        this note rather than claimed. The Arabic edition confirms the operative verb (يعفى,
        relieved).
  # ---- Office national des postes ----------------------------------------
  - id: p-soe-poste-marouen-ben-slimene
    role: la-poste-pdg
    holder: marouen-ben-slimene
    start: "2024-12-11"
    end: "2026-04-27"
    confidence: A
    basis: documented
    verification: verified
    patch_reason: >-
      Start corrected from 2024-12 to the appointment decree date; end corrected from ongoing
      to 2026-04-27. Décret n° 2024-641 du 11 décembre 2024 names him PDG of the Office National
      des Postes; décret n° 2026-62 du 27 avril 2026 states « Il est mis fin aux fonctions de
      Monsieur Marouen Ben Slimene le Président-directeur général de l'Office national des
      postes. » The canonical ongoing end was contradicted by the gazette.
    sources: [wikipedia-la-poste-tunisienne, jort-2024-150, jort-2026-043]
  - id: p-soe-poste-faria-2026
    role: la-poste-pdg
    holder: yassine-faria
    start: "2026-04-27"
    end: ongoing
    confidence: A
    basis: documented
    verification: verified
    sources: [jort-2026-043]
    notes:
      - >-
        Décret n° 2026-61 du 27 avril 2026 (JORT n° 43 du 28 avril 2026) : « Monsieur Yassine
        Faria est nommé Président-directeur général de l'Office national des postes. » Same-day
        décret n° 2026-62 ends Ben Slimene's functions. New person row for yassine-faria is
        needed; his Arabic spelling was not fetched, so none is proposed here.
  # ---- SONEDE -------------------------------------------------------------
