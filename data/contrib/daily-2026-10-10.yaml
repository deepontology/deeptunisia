# daily-2026-10-10, daily dataset sweep (full mode), consolidated outbox
#
# Window swept: 2026-10-05T15:32:57Z to 2026-10-10 (117 new feed items). Feed
#   refreshed 2026-10-10: 1200 archived, +123 new, 123 aged out.
# Sources swept: African Manager, Kapitalis, Nawaat, Inkyfada. The websearch
#   provider was retried this run and fell back to direct webfetch on the
#   outlet URLs named in the worklist.
# Web-verified 2026-10-10 by direct fetch: Nawaat (March of Dignity 10-05,
#   hunger-strike video 10-06, SNJT editorial 10-07, Yakine 10-08), Inkyfada
#   (prison deaths 10-05), African Manager (Saied audiences 10-09, Tunisia-Libya
#   10-09, Tunisia-China 10-08, Tunisia-World Bank 10-08, Hemissi/UPAP 10-09,
#   Chaabouni conviction 10-09, CMF/UADH 10-08), Kapitalis (CATG Guinea 10-10,
#   R. Stahl 10-10).
# Coverage gap: fetch-feed.ts keeps only the 10 newest items per outlet, so any
#   outlet's 6-9 October surplus beyond the newest ten is unrecoverable through
#   the feed. Nothing graph-relevant from that gap is known this run.
# Entity checks requested by the worklist were re-run against data/*.yaml:
#   UADH, CMF, Guinea, R. Stahl, Melia, ARSAM, BFSU, Yakine, Salah Hdider and
#   Hemissi are NOT in the graph (the worklist said UADH and Guinea were;
#   neither is). ahmed-nejib-chebbi, bensedrine, nafti, snjt, ltdh, steg,
#   presidency, legislature, cnrd, judiciary, china, libya, world-bank,
#   la-poste-tunisienne, conseil-superieur-education, kais-saied,
#   brahim-bouderbala, imed-derbali, khaled-nouri, mohamed-ali-boughdiri and
#   yassine-faria ARE.
# FAILURE VOCABULARY (must not be collapsed):
#   - "rendering of accounts" / "reddition des comptes" is a presidency framing
#     relayed by African Manager; it is not an audit, a prosecution or a court
#     finding.
#   - the prison-death counts are not reconciled and never averaged: LTDH
#     "more than 20", Intersection "near 30", an earlier AFP/Kapitalis count
#     "at least 23", young-doctors' national estimate "150-200 heat deaths"
#     (all hospital causes, not prison-only), health ministry "633 heat-related
#     consultations" with no death toll.
#   - the March of Dignity demand is "activation of law no. 18" as the marchers
#     state it; no text of the law was fetched and no official response found.
#   - the SNJT congress and the 8 September 2026 "press emergency" rest on a
#     signed editorial by an SNJT executive member, a partisan source graded
#     C, not on a union communiqué.
#   - "Sofien Hemissi" (communication technologies), "Yassine Friâa"
#     (La Poste PDG) and "Hatem Chaabouni" are press spellings; only Friâa maps
#     to a graph person (yassine-faria, la-poste-pdg, confidence A) and that
#     mapping is a transliteration judgement, not a sourced identity.
#   - R. Stahl, Melia, ARSAM, BFSU, CATG, Djeneba Keita Hann, Salah Hdider and
#     Amina Srarfi have no graph record, so their items are notes, not records.
# Cutoff: this file carries events dated up to 2026-10-10, past the current
#   time.cutoff (2026-10-05) in data/parameters.yaml. Whoever merges must
#   advance the cutoff to 2026-10-10 in the same edit and update the pinned
#   defaults in scripts/parameters.ts and scripts/test-parameters.ts. No cutoff
#   was advanced here: proposals only.
# CANDIDATES ARE PROPOSALS, NOT GRAPH DATA. Nothing canonical was changed;
#   humans dispose (P4).

# DISPOSITION 2026-10-10 (maintainer review): six of the seven events merged into
#   data/events.yaml (ev-march-of-dignity, ev-prison-heat-deaths,
#   ev-saied-carthage-audiences, ev-tunisia-libya-security,
#   ev-tunisia-china-investment-wg, ev-tunisia-worldbank-cpf) with the seven
#   sources they cite. ev-snjt-congress was demoted to a note: the press
#   emergency it leans on is already recorded in ev-yousfi-detention-2026-09, and
#   its only new content is a congress forward-dated past the research cutoff.
#   The five C events carry basis inferred (the house mapping for a grade-C claim
#   with no primary source). Entity gaps left open by design: UADH, the CMF, the
#   TABC, Guinea and R. Stahl are not in the graph and were not added; each is a
#   research task, not a merge task.
sources:
  - id: nawaat-marche-dignite-2026-10-05
    title: "بعد 9 أيام مشيا على الأقدام، مسيرة الكرامة تطل على العاصمة"
    publisher: Nawaat
    date: 2026-10-05
    url: https://nawaat.org/2026/10/05/%d8%a8%d8%b9%d8%af-9-%d8%a3%d9%8a%d8%a7%d9%85-%d9%85%d8%b4%d9%8a%d8%a7-%d8%b9%d9%84%d9%89-%d8%a7%d9%84%d8%a3%d9%82%d8%af%d8%a7%d9%85%d8%8c-%d9%85%d8%b3%d9%8a%d8%b1%d8%a9-%d8%a7%d9%84%d9%83%d8%b1%d8%a7/
    tier: 3
    lang: ar
    excerpt: >-
      تواصل مسيرة الكرامة لحاملي الشهادات المعطلين عن العمل طريقها نحو العاصمة،
      بعد انطلاقها يوم 27 سبتمبر من منزل بوزيان بسيدي بوزيد للمطالبة بتفعيل
      القانون عدد 18 القاضي بتشغيلهم. وبعد قضاء ليلة في قرمبالية، استأنف
      المشاركون صباح 5 اكتوبر مسيرهم قبل التوقف مساء في منطقة برج السدرية على
      تخوم العاصمة للتشاور حول مواصلة الطريق نحو قصر قرطاج.
    note: >-
      Video report by Malek Ben Dekhil, reviewed by Aymen Rezgui and Chaker
      Jahmi. Names no organising body or leader.

  - id: inkyfada-prisons-deces-chaleur-2026-10-05
    title: "Décès dans les prisons durant l'été 2026 : chaleur record et opacité sur les causes"
    publisher: Inkyfada
    date: 2026-10-05
    url: https://inkyfada.com/fr/2026/10/05/deces-dans-les-prisons-durant-lete-2026/
    tier: 3
    lang: fr
    excerpt: >-
      En juillet et août 2026, la Tunisie a connu des températures record ...
      Selon la Ligue tunisienne des droits de l'Homme, plus de 20 décès liés à
      la hausse des températures ont été recensés, tandis que le juge
      d'instruction du 11ème bureau du tribunal de première instance de Tunis
      s'est saisi de 16 dossiers à ce sujet ... le nombre approximatif de décès
      suspects dans les prisons tunisiennes s'élève à près de 30 cas, dont la
      plupart à la prison de Mornaguia ... les autorités restent silencieuses sur
      le bilan officiel des décès.
    note: >-
      Reportage by Jihen Nasri, collaboration Manel Lassoued. Names families,
      lawyers and NGOs; cause of each death not medically established and
      forensic reports withheld.

  - id: nawaat-snjt-congres-2026-10-07
