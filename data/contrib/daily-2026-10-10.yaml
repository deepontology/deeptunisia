      السابع كنقابة حرة مستقلة منذ مؤتمرها التأسيسي في 2008 ... بإعلان النقابة
      الوطنية يوم 8 سبتمبر الماضي حالة الطوارئ الصحفية، بعد الزج بالصحفي محمد
      اليوسفي في السجن، ليلتحق بزملائه منخرطي النقابة خلف القضبان زياد الهاني
