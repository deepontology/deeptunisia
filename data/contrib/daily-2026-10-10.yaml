events:
  - id: ev-march-of-dignity-2026-10-05
    date: "2026-09-27"
    date_end: "2026-10-05"
    title_en: "March of Dignity: unemployed graduates walk to Tunis for law 18"
    title_fr: "Marche de la Dignité : les diplômés chômeurs marchent vers Tunis pour la loi 18"
    title_ar: "مسيرة الكرامة: حاملو الشهادات المعطلون عن العمل يسيرون نحو العاصمة"
    category: protest
    subcategory: employment
    location: [gov-sidi-bouzid, gov-tunis]
    actors: []
    institutions: []
    causes: []
    consequences: []
    summary: >-
      The March of Dignity (مسيرة الكرامة) of unemployed higher-education
      graduates set off on 27 September 2026 from Menzel Bouzaiane, Sidi Bouzid,
      to demand activation of law no. 18 on their employment. It reached the
      edge of the capital on 5 October 2026: after a night in Grombalia the
      marchers resumed in the morning and stopped in the evening at Borj Cedria,
      on the capital's outskirts, to decide whether to continue to the Carthage
      Palace. Nawaat reported the march on 5 October 2026, its ninth day. The
      report names no organising body and no leader. Nothing links it to the
      Nafas collective (see ev-nafas-protest-2026-08-20), whose August march was
      a broad anti-government mobilisation; this one is a graduates' employment
      march.
    confidence: C
    basis: reported
    verification: needs-primary-source
    attributed_to: "Nawaat (5 October 2026)"
    reasoning: >-
      Single outlet, and the piece is a short video report; the start date,
      route and demand are as Nawaat states them. The marchers are a collective
      of unemployed graduates with no graph entity, so no actor or institution
      is attributed and the record rests on the outlet alone.
    falsifiable_by: >-
      The march's own communiqués, an Interior Ministry statement, or a second
      outlet's account would confirm or correct the 27 September start, the
      route and the law-18 demand; a report that the march was rerouted or
      called off would correct it.
    sources:
      - nawaat-marche-dignite-2026-10-05

  - id: ev-prison-heat-deaths-2026-summer
    date: "2026-07-01"
    date_end: "2026-08-31"
    title_en: "Summer 2026 prison deaths: record heat and opacity on the causes"
    title_fr: "Décès dans les prisons à l'été 2026 : chaleur record et opacité sur les causes"
    title_ar: "وفيات السجون في صيف 2026: حرارة قياسية وغموض حول الأسباب"
    category: legal
    subcategory: detention-death
    actors: []
    institutions: [ltdh, ministry-health, steg]
    summary: >-
      In July and August 2026 Tunisia recorded record heat (up to 50°C in places;
      July 2026 ranked second-hottest July since 1950; Kairouan hit 49.8°C on
      26 July), and Inkyfada reported on 5 October 2026 that prisons recorded
      deaths and health deterioration tied to heat, electricity cuts,
      overcrowding and gaps in medical care. Named cases include Sami Arbi
      Ayadi, 52, held at Mornaguia in a bank-offence case, who died around
      28 August 2026 after a transfer to Charles-Nicolle hospital per his sister
      Faten Ayadi; a Gafsa prison detainee whose death from cardiac arrest the
      LTDH Gafsa section announced on 26 August, its president Afef Zarrouk
      putting the prison at about 200% occupancy (around 700 for a capacity
      under 400); Hamza Dridi, 33, who died on 22 July after more than a year and
      nine months in detention without a ruling, per the association
      Intersection; and Mohamed Ali Ben Khemis, 31, who died on 26 August at
      Mornaguia, his family saying he had been treated at Razi hospital and
      reporting suspected violence marks, with no forensic report obtained. The
      Tunisian young doctors' organisation said on 29 August that deaths and
      emergency admissions from heat stroke were up "unprecedentedly"; its
      president Wajih Dhakar gave a 150-200 national heat-death estimate on
      23 July from more than 30 hospitals; the health ministry counted 633
      heat-related consultations between 1 July and 29 August but published no
      death toll. The LTDH counted more than 20 heat-linked deaths and said the
      investigating judge of the 11th bureau of the Tunis Court of First
      Instance had taken up 16 files; Intersection's Ghaylen Jlassi put
      suspicious deaths near 30, mostly at Mornaguia, plus Monastir, Gabès and
      Sfax. LTDH president Bassem Trifi said some facilities exceeded 300%
      occupancy and likened the conditions to cruel and humiliating treatment
      meeting the definition of torture. An earlier AFP/Kapitalis report of
      13 September said at least 23 prisoners had died and that the authorities
      answered that no prison death could be attributed to heat without forensic
      confirmation, while publishing no figure. Families reported delayed
      notification and withheld forensic reports; the Directorate-General of
      Prisons and the Justice Ministry are described as silent. STEG's Faycel
      Tarifa attributed the cuts to air-conditioning load; President Saïed said
      the cuts were deliberate attacks (see ev-sabotage-declaration-2026-08-26).
      The counts are kept as reported and never averaged.
    confidence: B
    basis: reported
    verification: needs-primary-source
    contested:
      - framing: "More than 20 to 30 prison deaths are linked to the summer heat, overcrowding and power cuts"
        held_by: "LTDH, Intersection pour les droits et les libertés, the Tunisian young doctors' organisation and OMCT (relayed by Inkyfada)"
        source: inkyfada-prisons-deces-chaleur-2026-10-05
      - framing: "No prison death can be attributed to the heat without forensic confirmation; no official figure is published"
        held_by: "Tunisian authorities (prison administration and Justice Ministry), as reported"
        source: kapitalis-prisons-deces-chaleur-2026-09-13
    falsifiable_by: >-
      The forensic and judicial files (the 16 cases before the 11th bureau), an
      official death toll, or the prison administration's records would confirm
      or correct the counts and the causes of each death.
    sources:
