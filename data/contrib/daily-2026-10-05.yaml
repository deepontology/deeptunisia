events:
  - id: ev-chebbi-hunger-strike-2026-10-01
    date: "2026-10-01"
    title_en: "Ahmed Néjib Chebbi begins a hunger strike in Mornaguia prison"
    title_fr: "Ahmed Néjib Chebbi entame une grève de la faim à la prison de Mornaguia"
    category: legal
    subcategory: detention-protest
    actors: [ahmed-nejib-chebbi]
    causes: [nejib-chebbi-arrested-2025]
    summary: >-
      From his cell, Ahmed Néjib Chebbi began a hunger strike on Thursday
      1 October 2026, according to a communiqué published on his own Facebook
      page and relayed by Kapitalis the same day. The communiqué says the
      strike is against "the privation of the right to information imposed on
      detainees and the blocking of independent media in penitentiary
      establishments"; it says prison authorities let in only the press and
      channels that carry official propaganda, and it denounces detention
      conditions meant to isolate opponents from the outside world. He is held
      at Mornaguia prison, where he has been since his arrest on 4 December
      2025 (see nejib-chebbi-arrested-2025); a Kapitalis column of 5 October
      2026 still describes him on hunger strike there. The strike rests on a
      statement by the prisoner himself. No prison administration, medical or
      defence-committee account was found, and no outlet other than Kapitalis
      was located: the websearch provider was unavailable on 2026-10-05.
    confidence: C
    basis: reported
    verification: needs-primary-source
    attributed_to: "Communiqué on Ahmed Néjib Chebbi's Facebook page, as relayed by Kapitalis"
    reasoning: >-
      One outlet, one origin: the report carries a communiqué issued by the
      person concerned, so the claim is his own and uncorroborated. Grade C
      with attribution rather than B, because no second independent account
      was obtained and the search provider was down on the day of the sweep.
      The 5 October column is the same outlet and does not raise the grade.
    falsifiable_by: >-
      A prison administration or medical statement on his condition, a
      follow-up from his defence committee or family, or a second outlet
      reporting the strike would confirm or refute the date and the stated
      grounds; a communiqué withdrawing it would refute the record outright.
    sources:
      - kapitalis-chebbi-greve-faim-2026-10-01
      - kapitalis-chebbi-experience-carcerale-2026-10-05

notes:
  - >-
    Research backlog, priority 1: Khaled Krichi, lawyer and former IVD bureau
    member, has no person record, so the hearing of 1 October 2026 cannot be
    proposed. The criminal chamber specialising in financial corruption near
    the Tunis Court of First Instance examined the alleged overspend in the
    Truth and Dignity Commission's work tied to a reconciliation accord with a
    businessman, then adjourned to 12 October 2026 for the pleas and the
    judgment; Krichi appeared under arrest, Sihem Bensedrine free. Source row
    kapitalis-bensedrine-krichi-proces-2026-10-01. Create the person record
    first, then propose the event against sihem-bensedrine and judiciary.
    Distinct from bensedrine-sentenced-2026 (25 years, appeal pending) and
    bensedrine-financial-brigade-2026 (7 August hearing).
  - >-
    Research backlog, priority 2: TABC mission to Guinea, 6 to 11 October
    2026. Thirty Tunisian business people across infrastructure, energy,
    pharmaceuticals, agri-food, higher education, tourism, technology, health
    and services; B2B and B2G days in Conakry, a PPP workshop by the Tucad
    consortium, and attendance at Focia 2026 on 10 October. The piece also
    gives TABC's stated goal of doubling national exports to the continent to
    13 billion dinars by 2030, and puts African exports at about 10% of total
    trade (6.5 to 6.8 billion dinars), sub-Saharan Africa at about 3% (1.6
