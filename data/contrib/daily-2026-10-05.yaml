  - id: kapitalis-chebbi-greve-faim-2026-10-01
    title: "Tunisie | Ahmed Néjib Chebbi en grève de la faim"
    publisher: Kapitalis
    date: 2026-10-01
    url: https://kapitalis.com/tunisie/2026/10/01/tunisie-ahmed-nejib-chebbi-en-greve-de-la-faim/
    tier: 3
    lang: fr
    excerpt: >-
      Depuis sa cellule Ahmed Néjib Chebbi a entamé, ce jeudi 1er octobre
      2026, une grève de la faim afin de dénoncer la censure en prison, selon
      un communiqué publié sur la page de l'intéressé. Ahmed Néjib Chebbi
      explique que par cette action, il souhaite protester "contre la privation
      du droit à l'information imposée aux détenus et le blocage des médias
      indépendants dans les établissements pénitentiaires".
    note: >-
      Reports a communiqué issued by the person concerned; no prison
      administration, medical or defence account in the piece.

