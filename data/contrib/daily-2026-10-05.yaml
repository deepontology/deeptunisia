    accusations, had his sentence raised from one year to two on appeal at
    the Médenine Court of Appeal on 28 September 2026 (reported 29 September).
    The file first went to the anti-terrorism judicial pole and was moved to
    ordinary Médenine justice after the terrorism suspicions were dropped.
    Intersection association and the CRLDHT both called for his release; the
    CRLDHT call is a Kapitalis flash item of 1 October 2026. Neither the
