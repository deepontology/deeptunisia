# daily-2026-11-24: daily dataset sweep (full mode), consolidated outbox
#
# Window swept: 2026-11-19T18:24Z (the previous run's newest feed item) to
#   2026-11-23T22:43Z (the newest item after this run's refresh). The ticket
#   window 2026-11-19T20:52Z-2026-11-23 has 234 items; five more items fall in
#   the 18:24-20:52 gap the previous run's snapshot left, and four of them were
#   screened (Chaima Issa's hunger strike, the German 75 M EUR item the previous
#   report explicitly skipped, a bourse close, a JCC selection, an Enfidha
#   accident). 239 items were screened in total, by title against the graph and,
#   for the shortlist below, at source.
# Sources swept: African Manager, Kapitalis, Nawaat, Inkyfada, BBC News,
#   France 24, Al Jazeera. npm run feed ran in full mode on 2026-11-24 00:51:
#   1200 items in the archive (cap 1200), +111 new, 111 aged out, 431 KB,
#   languages fr 1173 / ar 21 / en 6, newest item 2026-11-23T22:43:59Z.
#   Outlets in the window: African Manager 189, Kapitalis 46, Nawaat 5.
#   Languages: fr 235, ar 4, en 1.
# Read at source this run (webfetch, 20 pages): African Manager on the Ben
#   Sedrine verdict, Imed Trabelsi, Feriel Chabrak, the 14 state farms, the BCT
#   savings-tax denial, the phosphate plan, the hydrocarbons acceleration, the
#   EIB meeting, UTICA and the Africa trade figures, the Moez Joudi custody
#   report and the German 75 M EUR item; Kapitalis on the ASF and CRLDHT
#   statements, Taieb Rached, Moez Haj Mansour, Hichem Ben Khaled, Ajmi Lourimi
#   and Mossaab Gharbi, Zied El Heni's announced hunger strike, Chaima Issa,
#   the BCT reserve-requirement follow-up; Nawaat on Saifeddine Arfaoui.
# Research fanned out to five children with the dt-research brief, one narrow
#   topic each, all writing only data/contrib/research-0054-<slug>.yaml:
#   bensedrine-verdict, hunger-strikes, phosphate-hydrocarbons, state-farms,
#   germany-75m. Their records and sources are folded in below; the separate
#   files stay beside this one for detail.
# Failure vocabulary (must not be collapsed):
#   - The Ben Sedrine verdict is a court ruling reported by outlets, not a
#     judgment text. African Manager says it was pronounced "late in the night
#     of yesterday" (19 November) and ASF, relayed by Kapitalis, says "today,
#     Friday 20 November"; the record keeps 19 November, the adjourned hearing
#     date, and files the disagreement as a dispute. The 115 MDT joint
#     restitution and Korchid's in-absentia status come from the CRLDHT
#     communique as relayed by Kapitalis, not from a court document.
#   - The Taieb Rached postponement rests on Kapitalis citing Mosaique FM and "a
#     source close to the case". No court record was retrieved; the charges are
#     as the outlet states them.
#   - The two hunger-strike records are announcements or an NGO's account, not
#     prison-administration records. Chaima Issa's start date and continuing
#     status rest on ASF's communique relayed by Kapitalis; Zied El Heni's 10
#     December strike is an announced intention he says he notified to the
#     prison administration, relayed by one outlet.
#   - The phosphate and hydrocarbons records are what the minister told
#     deputies in a budget debate, not published outturns. Mosaique FM credits
#     TAP and the other outlets ran near-identical figures within a day, so
#     agreement supports "he said it", not "it is so". See the research file
#     for the 2.8 vs 3.4 Mt comparator and the two different 500 MD sums.
#   - The 14 state-farm attributions and the 75 M EUR German envelope are
#     announcements. No list of farms, no contract, no split and no terms were
#     retrieved. The German figure may include the 20 M EUR Chotrana grant
#     already recorded on 19 November; that question is left open, not asserted.
# Cutoff: these candidates include records dated 2026-11-19, 2026-11-20,
#   2026-11-22 and 2026-11-23, past the current time.cutoff (2026-11-19). The
#   merge must advance the cutoff to 2026-11-24 and move the pinned defaults in
#   scripts/parameters.ts and scripts/test-parameters.ts in the same edit, or V31
#   fails the build.
# CANDIDATES ARE PROPOSALS, NOT GRAPH DATA.

