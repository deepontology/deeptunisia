agreements:
  - id: agr-tunisia-germany-75m-development-cooperation-2026-11-18
    title_en: "German commitment of EUR 75 million to Tunisia announced at the close of the 2026 Tunisian-German intergovernmental negotiations (a commitment, not a signed instrument)"
    title_fr: "Engagement allemand de 75 millions d'euros annonce a l'issue des negociations intergouvernementales tuniso-allemandes sur la cooperation au developpement (2026)"
    kind: other
    parties: [DE]
    signed: "2026-11-18"
    summary: >-
      A commitment, not a signed instrument. At the close of the Tunisian-German
      intergovernmental negotiations held in Tunis on 17 and 18 November 2026,
      the German government announced EUR 75 million (about 254 million dinars
      per African Manager, at no cited rate) for new cooperation projects with
      Tunisia. The 18 November date in this record is the date the pledge was
      announced, at the end of the session; no financing agreement for the 75
      million is described by any source read, no signatory is named, and
      nothing was signed for it. The German embassy in Tunis, in the release the
      French and Italian coverage relays, puts the money on three headings
      (energy grid infrastructure, drinking water supply, and economic
      development) and names three projects: the extension of the Djerba
      seawater desalination plant, the modernisation of the electricity
      networks, and better access to finance for small and medium enterprises,
      with growth and jobs as the stated aim. The Tunisian foreign ministry's
      communique of 19 November 2026, relayed by the TAP wire, gives the same 75
      million with a different sector list: employment and vocational training,
      digitisation of the public administration, optimal management of water
      resources, and acceleration of the transition to clean and renewable
      energy, framed against the 2026-2030 five-year development plan. The
      negotiations are numbered the twentieth session by the Tunisian side and
      are called "cooperation au developpement" in the German version and
      "cooperation financiere et technique" in the Tunisian one. The two
      co-chairs are named: for Tunisia, the foreign ministry official in charge
      of relations with the northern European countries (Somia Zarray Chaabani
      in the TAP French text, Soumaya Zorai Chaabani in Mosaique FM's); for
      Germany, the director of the North Africa department at the federal
      ministry for economic cooperation and development (Annette von Edig in
      TAP, Annette van Edig in Mosaique FM). African Manager states explicitly
      what the announcement does not say, and no other source read supplies it:
      no split of the 75 million between the projects, no statement whether the
      money is grants or loans, no terms, no timetable, and no period covered.
      The 75 million is described as new by the German release ("nouveaux
      financements", "nouvelle enveloppe", "supplementaires", "new cooperation
      projects"), which is the release's own characterisation and not an
      independent finding. It is a separate commitment from the more than EUR
      100 million of accords signed on 31 August 2026, and separate from the EUR
      20 million KfW grant for the Chotrana 1 plant signed on 18 November 2026
      during the same negotiations
      (agr-tunisia-germany-onas-choutrana-grant-2026-11-18); see the notes for
      why the Chotrana grant is treated as outside this envelope rather than
      inside it, and for what would settle the question.
    confidence: B
    basis: reported
    verification: needs-primary-source
    attributed_to: "The German embassy in Tunis, in a release of 19 November 2026 relayed by African Manager, IlBoursa, L'Economiste Maghrebin, Managers and ITALPRESS, for the EUR 75 million, the three headings and the three named projects; the Tunisian foreign ministry, in a communique of 19 November 2026 relayed by TAP through Nessma TV and Mosaique FM, for the same EUR 75 million, the twentieth session, the venue, the two co-chairs and the alternative sector list."
    reasoning: >-
      The figure is carried by two governments' communications and by at least
      seven separately written news accounts in three languages, which is what
      lifts the record to B rather than C. It does not reach A. Neither
      communique was read at source: the German one sits on the embassy's
      Facebook page behind a login wall, the Tunisian one on a ministry platform
      that returned transport errors, and no BMZ, KfW, GIZ, Auswaertiges Amt or
      JORT document was located. What was read is relay upon relay, and the
      relays are not independent witnesses: five French accounts descend from
      the German release, TAP is the state agency reproducing the ministry, and
      the two Arabic accounts are one text on two mastheads. The agreement is
      therefore evidence that both governments put 75 million into circulation,
      not that any instrument exists. The sector lists diverge and the
      divergence is left standing rather than reconciled, because reconciling it
      would mean inventing a fourth list. The record is dated 18 November
      because that is the day the session ended and the pledge was announced,
      and the summary says so in its first sentence so that no reader takes the
      field for a signature date. "New" is attributed rather than asserted: it
      is the German release's adjective. No split, instrument, term, timetable
      or period is supplied, because none was found, and African Manager's own
      statement that the announcement omits them is quoted in the sources rather
      than paraphrased away.
    falsifiable_by: >-
      The German embassy release and the Tunisian foreign ministry communique
      read at source; a BMZ press release, a KfW press release, the German budget
      line for the 2026-2027 government negotiations, or a Tunisian finance
      ministry or JORT notice would confirm or correct the amount, the period
      and the instrument, and would settle whether the 75 million is grants,
      loans or a mix. A published project list with amounts would supply or
      contradict the split. A statement that the EUR 20 million Chotrana grant is
      counted inside the 75 million would correct this record's treatment of the
      two as separate, and a statement that it is not would close the question
      the notes leave open. A figure other than 75 million in either
      government's own text would correct the headline claim.
    sources:
      - am-germany-75m-djerba-2026-11-19
      - ilboursa-germany-75m-2026-11-19
      - leconomiste-germany-75m-2026-11-19
      - managers-germany-75m-2026-11-19
      - italpress-mna-germany-75m-2026-11-19
      - tap-nessma-germany-75m-2026-11-19
      - mosaiqe-germany-75m-2026-11-19
      - nessma-en-tap-choutrana-20m-2026-11-19
      - alchourouk-germany-75m-2026-11-19
      - diwanfm-germany-75m-2026-11-19

