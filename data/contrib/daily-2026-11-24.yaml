notes:
  - >-
    Note, not a record: Imed Trabelsi (23 November 2026). African Manager
    reports that the Tunis appeal court confirmed a first-instance six-year
    sentence and fines against Imed Trabelsi, described as a brother-in-law of
    former president Ben Ali, and a former La Goulette municipal councillor, in a
    financial and administrative corruption case; the piece recalls a five-year
    sentence in a financial and customs case and three other sentences totalling
    ten years, one of eight years and a three-million-dinar fine. The graph has
    Leila and Belhassen Trabelsi but no Imed Trabelsi person record and no trial
    chain for him. NEEDS RESEARCH: the person, the kin link and the case chain,
    from the court record, before an event. One outlet only.
  - >-
    Note, not a record: Ajmi Lourimi and Mossaab Gharbi (19 November 2026).
    Kapitalis, citing Mosaique FM, reports that the Tunis appeal court's
    terrorism chamber confirmed the 3 July 2026 first-instance three-year
    sentences on Ennahdha secretary-general Ajmi Lourimi and party activist
    Mossaab Gharbi, in a case dating to Lourimi's 2024 arrest near Borj El Amri.
    The graph carries `lajmi-lourimi` (Ennahdha ARP 2014 member) and no Gharbi.
    The transliteration difference (Ajmi/Lajmi) is probably the same person but
    no source read in this run states the equivalence, so the event is not
    proposed. NEEDS RESEARCH: confirm the person id and the secretary-general
    role, create Mossaab Gharbi, then an event.
  - >-
    Note, not a record: Moez Haj Mansour (21 November 2026). Kapitalis reports
    that the Tunis public prosecutor issued a detention warrant against the
    activist, that he was brought in custody before the correctional chamber and
    that the hearing is fixed for 3 December, on a May complaint by the head of
    state litigation for the interior ministry and its officers over September
    2025 social-media posts (imputation of illegal facts to a public official,
    processing personal data without consent). No person record. NEEDS RESEARCH;
    the case is press-and-activist relevant but the entity is missing.
  - >-
    Note, not a record: Hichem Ben Khaled (20 November 2026). Kapitalis relays a
    CRLDHT statement that the revoked former magistrate, arrested on 5 February
    2026 over critical social-media posts under Article 86 of the
    Telecommunications Code, is serving a two-year sentence upheld on appeal on
    9 April 2026. No person record and no event for the arrest or the appeal.
    NEEDS RESEARCH.
  - >-
    Note, not a record: Saifeddine Arfaoui (19 November 2026). Nawaat published a
    video interview with Rabii Gassem of the Nafs citizens' movement on the
    appeal hearing of the activist, detained since 21 August 2026 and sentenced
    at first instance to 18 months for insulting others through communication
    networks over his participation in a Nafs march. No person record for
    Arfaoui or Gassem and no record for Nafs. NEEDS RESEARCH before an event.
  - >-
    Note, not a record: Feriel Chabrak reinstated (19 November 2026). African
    Manager, relaying the broker Amen Invest, reports that Chabrak was restored
    as director-general of the Banque de Tunisie et des Emirats on Thursday 19
    November, less than 24 hours after her removal was announced, with no
    explanation of the conditions or the reason. This resolves the 19 November
    note in data/contrib/daily-2026-11-19.yaml. The bank and Chabrak have no
    records. NEEDS RESEARCH: the bank, the person and the sequence, before any
    record; the reversal is the fact worth keeping.
  - >-
    Note, not a record: Moez Joudi and three bank executives (23 November 2026).
    African Manager, citing a security source via Mosaique FM, reports that the
    financial expert and three bank executives were placed in custody on
    suspicion of money laundering, in an inquiry by the National Guard's unit for
    complex financial crimes. No person records, no bank named, one outlet
    relaying an unnamed source. NEEDS RESEARCH.
  - >-
    Note, not a record: the CNRPS (20 November 2026). African Manager reports
    2.9 billion dinars of penalties to be cancelled and a debt that remains. The
    pension fund has no institution record and the piece is an analysis of its
    accounts, not a fund statement. NEEDS RESEARCH only if the social-insurance
    institutions enter the graph; the same applies to the earlier 220 MDT monthly
    deficit note.
  - >-
    Note, not a record: Cofidur and Cofitel (23 November 2026). African Manager
    reports that the French group Cofidur is in the process of acquiring its
    long-standing Tunisian partner Cofitel. Neither company has a graph record;
    one outlet, no filing or value. NEEDS RESEARCH if the leather and footwear
    sector enters the graph.
  - >-
    Note, not a record: two deaths (22-23 November 2026). Kapitalis reports the
    death of the feminist activist Amel Ben Aba; African Manager and Kapitalis
    report the death of Adel Boussarsar, a tourism figure. Neither has a person
