  - kind: flag
    id: ev-zouari-mining-energy-interview-2026-10-12
    note: >-
      ANNOTATION PROPOSED, no correction of fact. The record carries the
      minister's "ten million tonnes" phosphate ambition from the 12 October 2026
      Attaqa.net interview without a horizon, which is how the sources gave it.
      Two later official statements place it: at the ARP committee on 6 November
