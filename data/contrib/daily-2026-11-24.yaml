    actors: [wajdi-hedhili]
    institutions: [arp-2023, cnrd, etat-tunisien]
    causes: []
    consequences: []
    summary: >-
      At the joint plenary of the Assembly of the Representatives of the People
      and the National Council of Regions and Districts on the 2027 budget of the
      ministry of state domains and land affairs, held on the afternoon of Friday
      20 November 2026 at the Bardo, minister Wajdi Hedhili said that 14 of the
      24 state agricultural farms on the first list drawn up for the purpose had
      been attributed to community companies, the remaining ten having drawn no
      applications that met the legal conditions, per African Manager, Tunisie
      Numerique and RTCI on 20-21 November. He said the farms had been handed
      over to the companies that had completed their files and that the contracts
      with the state domains department were being signed. He cited decree-law
      2025-3 of 2 October 2025, whose article 70 (quinquies) gives community
      companies priority for leases of state agricultural land by mutual
      agreement, for 25 years extendable to 40 and with the first five years
      rent-free, implemented by the joint order of the state domains and
      agriculture ministers of 4 November 2025; a commission under the
      agriculture ministry selects the land and the employment ministry screens
      the files, and the priority does not exempt the companies from the ordinary
      control rules. He added that the ministry had drafted a decree to make
      registration of state property free. The 24 farms are the subset kept from
      a first list of 38 farms (about 17,014 ha) proposed for lease in March 2026
      across ten governorates; the 24 total 11,216 ha. No list of the 14 farms,
      their governorates or the companies was published in the sources read.
    confidence: C
    basis: inferred
    verification: needs-primary-source
    attributed_to: "Wajdi Hedhili, minister of state domains and land affairs, answering MPs in the joint ARP-CNRD plenary of 20 November 2026, as reported by African Manager, Tunisie Numerique and RTCI"
    reasoning: >-
      The event is a public statement in a parliamentary sitting, and the
      sitting itself is documented independently: Le Temps reports the
      examination of this ministry's 2027 budget on Friday 20 November. But the
      only substance is the minister's announcement. The three readable reports
      of the 14-of-24 figure appear within a day, use the same sequence and
      largely the same sentences, and appear to match the TAP dispatch; they are
      not three independent investigations, so the count, the handover and the
      pending contracts are grade C, not B. No ministry list, contract, register
      or JORT act names the 14 farms or the companies. The legal basis is the one
      element that reaches grade A: article 70 (quinquies) of decree-law 2025-3
      says what the minister says it says, and the joint order of 4 November 2025
      is reported by two outlets and by the agriculture ministry's own written
      answer. The ministry has no institution record; the summary names it and no
      id was invented. etat-tunisien is attached as the owner of the domainial
      land, not as a stand-in for the ministry. The 38 / 24 / 14 counts are kept
      distinct: they are three stages, and the earlier reports' looser use of
      "attribuees" for the 24 is recorded rather than resolved.
    falsifiable_by: >-
      A ministry list of the 14 farms and the attributed companies, the signed
      lease contracts, the plenary record or minutes, or a JORT act giving effect
      to the attributions would confirm or correct the count, the handover and
