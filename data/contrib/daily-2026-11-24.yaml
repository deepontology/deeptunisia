events:
  - id: ev-bensedrine-krichi-korchid-verdict-2026-11-19
    date: "2026-11-19"
    title_en: "Ben Sedrine, Krichi and Korchid sentenced in the IVD-Sta conciliation case"
    title_fr: "Ben Sedrine, Krichi et Korchid condamnés dans l'affaire de la conciliation IVD-Sta"
    category: legal
    subcategory: corruption-verdict
    location: [gov-tunis]
    actors: [sihem-bensedrine, khaled-krichi, mabrouk-korchid, lazhar-sta]
    institutions: [judiciary, ivd]
    causes:
      - ev-bensedrine-krichi-adjournment-2026-11-05
    consequences: []
    summary: >-
      The criminal chamber for financial-corruption cases of the economic and
      financial judicial pole at the Tunis Court of First Instance pronounced its
      ruling on the evening of Thursday 19 November 2026, late into the night, in
      the file of the arbitration and conciliation agreement the Truth and
      Dignity Commission (IVD) concluded with the businessman Lazhar Sta, who
      died in detention on 8 September 2026. It sentenced the former IVD
      president Sihem Ben Sedrine, who appeared free, to five years'
      imprisonment, and the lawyer Khaled Krichi, a former IVD member and
      president of its arbitration and reconciliation committee, who is in
      detention, to four years, per TAP's judicial source, Business News, Webdo,
      Kapitalis, African Manager, Assabah News and Le Quotidien on 20 and 21
      November 2026. The same ruling sentenced Mabrouk Korchid, minister of state
      domains and land affairs at the time of the facts, to six years with
      immediate execution; he was not present, and Kapitalis and Le Quotidien
      describe the conviction as in absentia (par contumace) while the other
      outlets call him a fugitive. The court also imposed a 115 million dinar
      money judgment: TAP's judicial source, as relayed by Nessma and Ultra
      Tunisia, says each defendant was fined 115 million dinars and jointly
      ordered to return the same sum, while the CRLDHT communique of 20 November
      describes a single joint 115 million dinar restitution of the value of the
      state's interest. This is a first-instance judgment in a distinct file,
      not an appeal or a revision: in June 2026 the same chamber gave Ben Sedrine
      a first-instance total of 25 years and Krichi ten in two other cases tied
      to the commission's work, both under appeal, and gave Korchid six years in
      the Chiboub settlement case. The offence, as the judicial source described it to TAP,
      is a public official deliberately exploiting his position to cause material
      harm to the administration for an unjustified advantage; the CRLDHT says
      the June IVD cases were charged under Article 96 of the Penal Code. No
      judgment text, court communique or case number was retrieved, no source
      describes this verdict as final, and no appeal against it is reported.
    confidence: B
    basis: reported
    verification: needs-primary-source
    attributed_to: "TAP's judicial source (20 November 2026), Business News, Webdo, Kapitalis relaying and adding to the CRLDHT communique of 20 November 2026, African Manager, Assabah News, Le Quotidien, and the TAP relays in Nessma and Ultra Tunisia"
    reasoning: >-
      The three sentences, Korchid's portfolio and immediate execution, the Sta
      file, the first-instance character and the June relationship are carried by
      several editorial operations that did not all copy one another: the state
      wire's judicial source, Business News, Webdo, Kapitalis (which adds Korchid
      in its own voice, outside the communique it relays), African Manager, Le
      Quotidien and Assabah. That is what lifts the record to B rather than C. It
      does not reach A: no judgment text and no court communique exist in hand,
