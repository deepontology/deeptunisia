    date: "2026-11-20"
    title_en: "Minister says 14 of 24 state agricultural farms were attributed to community companies"
    title_fr: "Le ministre annonce l'attribution de 14 fermes domaniales agricoles sur 24 a des societes communautaires"
    title_ar: "إسناد أربع عشرة ضيعة فلاحية عمومية من أصل 24 إلى شركات أهلية"
