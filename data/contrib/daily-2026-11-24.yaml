    person record if the graph wants either.
  - >-
    Note, not a record: the Union Afro-Arabe du Tourisme et des Voyages
    (23 November 2026). African Manager reports the creation of the body, with an
    ambition to strengthen tourism integration. No graph record, no founding
    instrument or member list read. NEEDS RESEARCH only if international tourism
    bodies enter the graph.
  - >-
    Note, not a record: the German EUR 75 million envelope and the Chotrana EUR
    20 million grant. The question of whether the 20 million sits inside the 75
    million stays open: no source read states the composition of the envelope.
    Three indirect pointers say separate - the three projects the German embassy
    names for the 75 million do not include Chotrana; TAP calls the Chotrana
