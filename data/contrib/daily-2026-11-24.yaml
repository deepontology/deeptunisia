      precise" and that the ministry roadmap presented in June targets 9.4 Mt by
      2035. The 10 Mt therefore sits above the ministry's own 2035 figure and is
      not a 2027 target. Proposed addition to the record's summary, after the
      ten-million-tonne sentence: "No deadline was attached to the ten million
      tonnes; the ministry's roadmap target stated at the ARP committee on 6
      November 2026 is 4.3 Mt in 2027 and 9.4 Mt in 2035, and the 4.3 Mt was
      restated in the joint ARP-CNRD plenary on 22 November 2026." The record's
      existing sources and its C grade for the interview are unaffected.
