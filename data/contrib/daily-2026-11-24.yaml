  - id: ev-chaima-issa-hunger-strike-2026-11-16
    date: "2026-11-16"
    title_en: "Chaima Issa begins an unlimited hunger strike in prison"
    title_fr: "Chaima Issa entame une greve de la faim illimitee en prison"
    category: legal
    subcategory: detention-protest
    actors: [chaima-issa]
    institutions: [judiciary]
    causes: [conspiracy-appeal-2025]
    consequences: []
    summary: >-
      Chaima Issa, held since 29 November 2025 in the case known as "conspiracy
      against state security", began an unlimited hunger strike on 16 November
      2026, her family announced in a communique dated 17 November. The
      communique says she is protesting the continuation of what it calls her
      unjust detention and trials it describes as lacking the most basic
      guarantees of justice, alongside the other defendants, a year after her
      arrest during a feminist march in central Tunis. Her defence lawyer Dalila
      Ben Mbarek Msaddek announced the same action, saying she was denouncing
      injustice, oppression and what she called an iniquitous judgment. On 19
      November Avocats sans frontieres (ASF) published a statement on its
      Facebook page calling for her immediate release and that of all political
      prisoners and asking the penitentiary and judicial authorities to guarantee
      her physical integrity and continuous access to care and medical
      supervision throughout the protest; Kapitalis and Business News report the
      statement the same day. Al Jazeera Arabic reported on 18 November, from her
      sister, that the family had known in advance and tried during its 17
      November visit to dissuade her, and that she refused. No report of the
      strike ending or being suspended was found up to 24 November, and no
      prison-administration or medical statement was retrieved. The family says
      the administration is following the strike and has provided appropriate
      conditions; that is the family's account, not a confirmed administrative
      one. Her term is twenty years on appeal (conspiracy-appeal-2025, 27
      November 2025, raised from eighteen).
    confidence: B
    basis: reported
    verification: needs-primary-source
    attributed_to: >-
      The family of Chaima Issa (communique of 17 November 2026), her defence
      lawyer Dalila Ben Mbarek Msaddek, and Avocats sans frontieres (statement of
      19 November 2026), as reported by Kapitalis, Business News, Al Jazeera,
      Al-Arabi, JINHA and Le Courrier de l'Atlas.
    reasoning: >-
      The fact that an unlimited strike began on 16 November 2026 is carried by
      several credible outlets in French and Arabic, but they rest on three
      speakers: the family, the defence lawyer and ASF. The family and the lawyer
      are one circle and are the origin of the date; ASF is a third party
      asserting the same start date, which is why the grade is B rather than C.
      It is not A: no prison-administration record, medical note or
      administrative document is in hand, and at least two Arabic outlets
      reproduce the family text rather than reporting independently. The record
      is kept separate from conspiracy-appeal-2025, which fixes the sentence, and
      from the earlier periodic solidarity strike of 4 November: this is a new
      unlimited action, not the continuation of that one.
    falsifiable_by: >-
      A prison-administration or medical statement showing she was not on strike
      from 16 November, a family or lawyer announcement of suspension or end
      before 24 November, or a dated source showing the unlimited strike began on
      another date (for instance that the 4 November action continued without a
      break) would correct or refute the record.
