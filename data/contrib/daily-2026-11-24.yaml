  - id: bn-bensedrine-verdict-2026-11-20
    title: "Affaire Lazhar Sta : cinq ans de prison pour Sihem Ben Sedrine, quatre ans pour Khaled Krichi"
    publisher: Business News
    date: "2026-11-20"
    url: https://businessnews.com.tn/2026/11/20/affaire-lazhar-sta-cinq-ans-de-prison-pour-sihem-ben-sedrine-quatre-ans-pour-khaled-krichi/1429729/
    tier: 3
    lang: fr
    excerpt: >-
      La chambre criminelle spécialisée dans les affaires de corruption
      financière près le Tribunal de première instance de Tunis a condamné,
      vendredi 20 novembre 2026, l'ancienne présidente de l'Instance Vérité et
      Dignité (IVD), Sihem Ben Sedrine, à cinq ans de prison ferme. [...] Les
      trois prévenus sont poursuivis dans le cadre de l'affaire relative à la
      décision arbitrale rendue au profit de l'homme d'affaires défunt Lazhar
      Sta. [...] La juridiction a également prononcé des sanctions pécuniaires à
      l'encontre des condamnés.
    note: >-
      Most complete French account read. Names the chamber in the same terms as
      the other dailies, names the Sta arbitration decision as the file, gives
      the parties' procedural positions (Ben Sedrine free, Krichi detained,
      Korchid a fugitive), says the 5 November adjournment was caused by the
      absence of the court formation's legal quorum, and records that in June
      the court gave five years to Ben Sedrine and Krichi and six to Korchid. No
      money figure. Dates the ruling to Friday 20 November.

  - id: webdo-bensedrine-verdict-2026-11-20
    title: "Sihem Ben Sedrine condamnee a cinq ans de prison dans une nouvelle affaire liee a l'IVD"
    publisher: Webdo
    date: "2026-11-20"
    url: https://www.webdo.tn/fr/actualite/national/sihem-ben-sedrine-condamnee-a-cinq-ans-de-prison-dans-une-nouvelle-affaire-liee-a-livd/407502/
    tier: 3
    lang: fr
    excerpt: >-
      La procédure avait connu une nouvelle étape jeudi 19 novembre, lorsque la
      chambre criminelle avait procédé à l'audition de Sihem Ben Sedrine et de
      Khaled Krichi, tandis que Mabrouk Korchid était poursuivi en état de fuite.
      Le jugement a été rendu au lendemain de cette audience.
    note: >-
      The only account read that puts the hearing and the judgment on two
      different days and says so explicitly: hearing Thursday 19 November,
      judgment the following day. Also the clearest statement that this is a
      distinct procedure and not a revision of the June sentences ("une nouvelle
      condamnation dans une procédure distincte, et non une révision des peines
      précédentes"). Gives no money figure beyond "des amendes financières ont
      également été prononcées".

  - id: kapitalis-crldht-bensedrine-verdict-2026-11-21
    title: "Le CRLDHT appelle a la solidarite avec Sihem Ben Sedrine et Khaled Krichi"
    publisher: Kapitalis
    date: "2026-11-21"
    url: https://kapitalis.com/tunisie/2026/11/21/le-crldht-appelle-a-la-solidarite-avec-sihem-ben-sedrine-et-khaled-krichi/
    tier: 3
    lang: fr
    excerpt: >-
      La chambre criminelle du pôle judiciaire économique et financier du
      Tribunal de première instance de Tunis a condamné Sihem Ben Sedrine à cinq
      ans de prison. Dans cette affaire concernant l'accord de conciliation
      arbitrale conclu par l'IVD avec feu Lazhar Sta, Khaled Krichi a été
      condamné à quatre ans de prison. Une condamnation solidaire à verser 115
      millions de dinars a également été prononcée, à titre de restitution de la
      valeur de l'intérêt de l'État. Mabrouk Korchid [...] a été condamné par
      contumace dans le même procès à 6 ans de prison.
    note: >-
      Gives the most precise institutional name for the chamber (criminal chamber
      of the economic and financial judicial pole at the Tunis Court of First
      Instance). The Korchid sentence and the "par contumace" wording are in
      Kapitalis's own voice and are not in the CRLDHT communique it relays, so
      Kapitalis is carrying them independently. Its 115 million sentence follows
      the CRLDHT wording (joint restitution), not the TAP wording.

