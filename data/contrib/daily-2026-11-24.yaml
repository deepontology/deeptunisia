    summary: >-
      At the joint plenary of the Assembly of the Representatives of the People
      and the National Council of Regions and Districts on Sunday 22 November
      2026 at the Palais du Bardo, held on the 2027 budget of the industry, mines
      and energy ministry, Salah Zouari, the minister managing that ministry,
      announced a three-month emergency plan running to January 2027 to finance
      the Compagnie des phosphates de Gafsa (CPG) and the Groupe chimique
      tunisien (GCT), per African Manager, La Presse de Tunisie, Mosaique FM
      (crediting TAP), L'Economiste Maghrebin and Webdo on 22-23 November 2026.
      He said the plan has drawn about 500 million dinars of state-guaranteed
      credits, which the two companies are already using to settle what they owe
      supplier firms, and that 240 million dinars of investment has been
      inscribed in the programme and its implementation begun. The stated target
      is 4.3 million tonnes of commercial phosphate in 2027 against 2.8 million
      tonnes expected for 2026, which requires what he called adequate financial
      and logistical conditions across extraction, transport, processing and the
      settlement of the companies' arrears. He said the M'dhilla 2 unit, called
      "Tifart" by African Manager and Mosaique FM and "Tifert" or "TIFERT" by the
      other three, enters service in 2027 at about 700,000 tonnes; that the
      recovery programme runs to 2035 and covers rehabilitation of production and
      processing units, completion of stalled projects, new equipment, hydraulic
      transport and restructuring of the Societe tunisienne de transport des
      produits miniers; that some units ready to 90 percent stay idle for lack of
      completion credits; and that implementation is monitored at two levels,
      fortnightly meetings at the head of government and daily follow-up by the
      minister, his team and CPG and GCT representatives. These are the
      minister's figures and targets, not published production outturns, and no
      ministry, CPG or GCT statistical release was retrieved.
