sources:
  - id: am-tende-maamoura-drilling-2026-11-09
    title: "Tende Energy loue une plateforme de forage au large des côtes tunisiennes"
    publisher: African Manager
    date: 2026-11-09
    url: https://africanmanager.com/tende-energy-loue-une-plateforme-de-forage-au-large-des-cotes-tunisiennes/
    tier: 3
    lang: fr
    excerpt: >-
      La société de forage offshore Ocean Oilfield a décroché un contrat auprès
      de Tende Energy pour déployer sa plateforme autoélévatrice Ocean MVM dans
      le cadre d'une campagne de forage au large des côtes tunisiennes,
      rapporte le site Splash 247, précisant que la plateforme sera utilisée
      pour le programme de forage Abiod sur la concession de Maâmoura dans le
      golfe d'Hammamet, ciblant un réservoir carbonaté fracturé jusqu'alors
      inexploité. [...] Tende détient une participation de 49 % dans Maâmoura,
      les 51 % restants étant contrôlés par l'ETAP, société d'État tunisienne.
    note: >-
      Relays Splash247 and technical material attributed to Anglo Tunisian Oil &
      Gas. Says Eni's Tunisian subsidiary transferred its previous stake to
      Tende earlier in 2026. The 6,000 boe/d potential is explicitly
      conditional on drilling success and reservoir performance. Contract date
      and value are not given; the article date is the report date.
  - id: am-public-enterprises-restructuring-2026-11-14
    title: "Trois entreprises publiques en cours de restructuration"
    publisher: African Manager
    date: 2026-11-14
    url: https://africanmanager.com/trois-entreprises-publiques-en-cours-de-restructuration/
    tier: 3
    lang: fr
    excerpt: >-
      Le ministre de l'Economie et de la Planification, Samir Abdelhafidh, a
      indiqué que les programmes de restructuration d'entreprises publiques se
      poursuivent afin de renforcer leurs capacités de production, améliorer
      leur situation financière et garantir la continuité de leur activité. Ces
      projets concernent, notamment, la Société tunisienne de sidérurgie « El
      Fouladh », la Société des ciments de Bizerte et la Société tunisienne du
      sucre (STS) de Béja, a-t-il précisé samedi à l'aube au palais du Bardo.
    note: >-
      Reports the minister's answers in a joint plenary of the ARP and the
      National Council of Regions and Districts on the ministry's 2027 budget.
      Gives the El Fouladh cost revision (USD 70m to USD 130m), the Islamic
      Development Bank delegation of 19-23 October 2026 and the April 2027 board
      timetable; the Bizerte cement package (50 MD, capital +53.1 MD); the sugar
      company package (40 MD). These are statements, not audited figures.
events:
  - id: ev-tende-maamoura-abiod-drilling-2026-11-09
    date: "2026-11-09"
    title_en: "Ocean Oilfield rig contracted for Tende's Abiod drilling on the Maamoura concession"
    title_fr: "Une plateforme d'Ocean Oilfield louée pour le forage Abiod de Tende sur la concession de Maâmoura"
    category: economic
    subcategory: oil-and-gas
    location: [gov-nabeul]
    actors: []
    institutions: [etap]
    causes: []
    consequences: []
    summary: >-
      Ocean Oilfield won a contract from Tende Energy to deploy its Ocean MVM
      jack-up rig for a drilling campaign offshore Tunisia, to be used for the
      Abiod drilling programme on the Maamoura concession in the Gulf of
      Hammamet, targeting a fractured carbonate reservoir not previously
      produced, per African Manager on 9 November relaying Splash247 and
      technical material attributed to Anglo Tunisian Oil & Gas. The plan is to
      drill a deviated sidetrack from the existing Maamoura E2 well. Tende holds
      49% of Maamoura and state oil company ETAP the other 51%; the outlet says
      Eni's Tunisian subsidiary transferred its previous stake to Tende earlier
      in 2026. The piece puts potential output above 6,000 barrels of oil
      equivalent per day, explicitly subject to drilling success and reservoir
      performance. Tende Energy, Ocean Oilfield and Anglo Tunisian Oil & Gas have
      no graph records and are named only; the 49/51 split and the Eni transfer
      are the outlet's background, not a retrieved corporate filing.
    confidence: C
    verification: needs-primary-source
    attributed_to: "African Manager (9 November 2026), relaying Splash247 and Anglo Tunisian Oil & Gas technical material"
    reasoning: >-
      One outlet relaying trade press and operator background. The contract,
      the rig, the well plan and the ownership split are as the piece states
      them; no contract, licence or corporate filing was retrieved. The
      conditional production figure is carried as conditional.
    falsifiable_by: >-
      The Ocean Oilfield or Tende announcement, the ETAP joint-venture record,
      or a JORT concession act would confirm the contract, the ownership split
      and the stake transfer; a different split or operator would correct the
      record.
    sources:
      - am-tende-maamoura-drilling-2026-11-09
  - id: ev-public-enterprises-restructuring-2026-11-14
    date: "2026-11-14"
    title_en: "Economy minister sets out the restructuring of El Fouladh, the Bizerte cement company and the Tunisian Sugar Company"
    title_fr: "Le ministre de l'Economie expose la restructuration d'El Fouladh, de la cimenterie de Bizerte et de la Société tunisienne du sucre"
    category: economic
    subcategory: state-owned-enterprises
    location: [gov-tunis]
    actors: [samir-abdelhafidh]
    institutions: [etat-tunisien]
    causes: []
    consequences: []
    summary: >-
      At a joint plenary of the Assembly of People's Representatives and the
      National Council of Regions and Districts on the 2027 budget of the
      economy ministry, held Saturday 14 November 2026 at the Bardo palace,
      economy and planning minister Samir Abdelhafidh said restructuring
      programmes continue at three state companies: El Fouladh (Tunisian steel
      company), the Bizerte cement company and the Tunisian Sugar Company of
      Beja. For El Fouladh he said a new steel plant is under evaluation after
      an Islamic Development Bank delegation visit on 19-23 October 2026, with
      the estimated cost rising from USD 70 million to USD 130 million and a
      financing offer awaiting the bank's board in April 2027. For the Bizerte
      cement company he cited a 50 million dinar energy and environment
      project, a 53.1 million dinar capital increase and rescheduled debt. For
      the sugar company he cited 40 million dinars of equipment upgrades and a
      business plan, plus debt rescheduling, with targets of 180,000 tonnes of
      raw sugar for refining and 171,000 tonnes of white sugar. None of the
      three companies has a graph record; they are named only.
    confidence: C
    verification: needs-primary-source
    attributed_to: "Samir Abdelhafidh, minister of economy and planning, in a joint plenary on 14 November 2026, reported by African Manager"
    reasoning: >-
      One outlet reporting a minister's oral answers in a plenary. The figures
      and the timetable are as the piece states them; no ministry document,
      plenary record or company account was retrieved. The three companies have
      no graph records, so the event carries no company ids and names them in
      the summary.
    falsifiable_by: >-
      The plenary record, a ministry communiqué, the Islamic Development Bank
      board decision of April 2027 or the companies' published accounts would
      confirm the figures and the timetable; different figures would correct
      the record.
    sources:
      - am-public-enterprises-restructuring-2026-11-14
