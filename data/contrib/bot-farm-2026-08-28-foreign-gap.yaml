  - id: arabcenter-tunisia-disinformation-2023-07-21
    title: Disinformation as a Tool of Regime Survival in Tunisia
    publisher: Arab Center Washington DC — C. Ian DeHaven
    date: 2023-07-21
    url: https://arabcenterdc.org/resource/disinformation-as-a-tool-of-regime-survival-in-tunisia/
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured"
    excerpt: "The effects of President Saied's disinformation also ripple through social media, especially on Facebook, where his supporters exhibit a 'heavy digital presence.' Once Saied identifies targets for harassment in televised speeches or recorded government meetings, his supporters reinforce his rule by publicly attacking and doxing individuals until they become too intimidated to act against the regime. Indeed faces of some critics plastered widely across Tunisian internet that passersby ostracize them in street. Using forensic technology that was in part donated by the United Nations to 'fight cybercrime,' President Saied's government monitors critics online and arrests them for 'conspiring against the state' once they publish something that fits broad language of anti-disinformation law, such as criticism of officials, information about protests, or murmurs of revolution. Decree Law no. 54 of 2022. Qualitative only — no number for scale of network is published in this piece; cites 'heavy' but not enumeration. Source for Decree 54 context and UNODC donation note (March 2021 forensic equipment) — piece itself does not claim a count for a Saied bot farm."
  - id: pomed-saied-digital-army-2023-06-15
    title: Expert Q&A — Tunisian President Kaïs Saïed's Digital Army
    publisher: POMED / Middle East Democracy Center — Zachary White interviewing Amine Snoussi
    date: 2023-06-15
    url: https://mideastdc.org/publication/expert-qa-tunisian-president-kais-saieds-digital-army
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured"
    excerpt: "Amine Snoussi: Saied's supporters have always had a heavy digital presence, but ever since his coup on July 25, 2021, they have been more public and more aggressive. Now, whenever the president publicly identifies targets, his backers kick into gear creating content to attack them. This is the green light ... attacks — mostly on Facebook, the leading platform in Tunisia, with 70 percent of Tunisians having at least one active account — take variety of forms including attacks on women judges (sharing medical records, virginity check), sharing addresses/doxxing, disinformation (bogus foreign-agent claims), and alleged leaks of judicial documents that in several cases preceded arrests of named individuals. On coordination: 'It seems clear that there is some level of coordination, as the online campaign supporting Saied — even before his coup — has always been very disciplined... It is so coordinated that it is difficult to imagine it being a grassroots campaign led by simple supporters. The leaking of judicial documents before authorities released them is also evidence of collusion with state bodies.' On drivers: well-known personalities Riadh Jrad, Ben Arfa, Issam Blanko (tens/hundreds of thousands followers) plus majority hidden behind anonymous accounts with few followers, and some likely bots. On Decree 54: 'In September 2022, Saied issued Decree 54, which is ostensibly a tool to crack down on online disinformation... But the law has been used almost exclusively to target Saied's critics. Pro-Saied Facebook pages spreading misinformation and hate speech have not faced consequences.' On surveillance: Ministry of Interior cybercrime unit capabilities progressed significantly over past decade thanks to considerable foreign aid invested in cybersecurity (including UNODC forensic aid). No numeric count of bots/accounts is published — qualitative assessment only."
  - id: unodc-forensic-equipment-2021-03-24
    title: UNODC provides Tunisia with 200,000 USD worth of forensic equipment and software to stop cybercrimes
    publisher: UNODC Regional Office for the Middle East and North Africa
    date: 2021-03-24
    url: https://www.unodc.org/romena/en/Stories/2021/March/unodc-provides-tunisia-with-200-000-usd-worth-of-forensic-equipment-and-software-to-stop-cybercrimes.html
    tier: 2
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured; Tunis 24 March 2021 ceremony"
    excerpt: "Tunis, Tunisia – 24 March 2021 — UNODC provides the Ministry of Interior with 200,000 USD worth of forensic equipment and software under framework 'Supporting Tunisian Capacities to Prevent and Combat Cybercrime' project funded by U.S. Department of State Bureau of International Narcotics and Law Enforcement Affairs (INL). Provision dedicated for use of General Direction of Technical Service and General Direction of National Guard. Project initially launched Feb 2016, second phase Feb 2019. Includes high-end digital forensic equipment and software, certified trainings on use of forensic software to extract and analyse data from digital evidence, capacity building and cryptocurrency/blockchain analysis."
  - id: digitalaction-tunisia-briefing-2024-10-22
    title: Tunisia country briefing — Social media ahead of 6 Oct 2024 presidential election
    publisher: Digital Action / Mena Media Monitoring / Global Coalition for Tech Justice
    date: 2024-10-22
    url: https://digitalaction.co/wp-content/uploads/2024/12/Tunisia-briefing_22-Oct-2024_.pdf
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — referenced via websearch; PDF not re-fetched in full this run but excerpt captured via search snippets"
    excerpt: "In months leading up to 6 Oct 2024 vote Saied and supporters targeted civil society/opposition on Facebook; president's 7 May 2024 Facebook video referring to rights groups as 'traitors / foreign agents' played ~290k times shared 1.7k times. Between July and mid-September 2024 Mena Media Monitoring looked into posts across Facebook pages/groups discovering misinformation meant to confuse/influence/manipulate via false info or incitement; pages/groups have tens of thousands followers, post daily, most managed from abroad. Activists report TikTok videos by Saied supporters inciting hate against migrants/opposition. No published enumeration of bot/fake-account count for Tunisia in this window — network described qualitatively."
  - id: arabfactshub-2024-election-facebook-2024
    title: Just Sfax — Mapping hate and disinformation on Facebook around a Tunisian election
    publisher: Arab Facts Hub — research report (2024 post-election Facebook scrape)
    url: https://www.arabifactshub.com/en/researches/details/45609
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "websearch snippet captured 2026-08-28; full body not fetched but presence logged as documented-negative context"
    excerpt: "Scraper hoovered up over 150,000 posts from Jan 1 to Nov 30 2024, uncovering network of hundreds of pro-Saied Facebook accounts trafficking in conspiracy theories (African settler-colonialism + civil society as foreign agents). Identifies prominent malefactors but publishes no bot/fake-account enumeration — network described as Facebook pages/groups/individual accounts with hateful disinformation, not a counted bot farm."

world_claims:
  - id: cc-bot-hashtag-july2021-12k-tweets-verify-2026-08-28
    entity: null
    claim: >-
      For the hashtag 'Tunisians revolt against the brotherhood' in the days after 25 Jul 2021, an analysis of 12,000 tweets from 6,800 unique accounts found majority self-reported locations in Saudi Arabia or UAE, top-10 most influential accounts all Gulf influencers (monther72, faljubairi, s_hm2030, emarati_shield plus Khalid bin Dhahi, Mohamed Taqi and others named in body), and a sock-puppet cluster of >200 accounts retweeting persona Fairuz @7__e7 >200 times within 5 minutes (velocity indicator of automation) including reused hacked accounts (14-year-old Filipino girl, Emma Roberts / Smurf avatar); persona tweet carried unrelated comic video. Network graph shape: disconnected blue constellation (>200 retweeters of Fairuz) vs main Saudi/Emirati influencer cluster — cited as inorganic behaviour.
    assessment: >-
      Live-reverified 2026-08-28 via Al Jazeera body fetch — all counted elements verbatim: 12,000 tweets, 6,800 unique accounts, majority location Saudi/UAE, top-10 Gulf influencer detail (monther72 most influential per graph caption, faljubairi, s_hm2030, emarati_shield plus bin Dhahi / Taqi in article text), Fairuz handle @7__e7, >200 retweets in 5 min, hacked-account examples, comic video, and disconnected-constellation graph description. Methodology noted in article: hashtag-scoped Twitter collection, location field aggregation, centrality/influence ranking, network graph (connected vs disconnected clusters = inorganic), and velocity (tweets per minute) as automation signal. Typology: real Gulf influencers (high centrality, organic-looking) vs sock-puppets (automated retweets) — do not lump 6,800 as bots. Basis C reported because single-researcher analysis (Marc Owen Jones) published via journalism — reproducible only with tweet IDs which article does not publish. Falsifiable by independent re-collection of same hashtag window or by proof that >200 Fairuz retweeters had persistent organic histories.
    confidence: C
    basis: reported
    attributed_to: Marc Owen Jones via Al Jazeera (28 Jul 2021)
    sources:
      - aljazeera-tunisia-manipulation-2021-07-28
      - jones-twitter-thread-2021-07-xx
    notes: "Methodology explicit in Al Jazeera piece: hashtag-scoped, location field, centrality, graph shape, velocity. Thread dataset not located 2026-08-28 — see jones-twitter-thread record; no delta to 12k/6.8k counts."
    disputes:
      - claim: "6,800 were Tunisian bots"
        held_by: Loose summary (non-specific)
        status: rejected
        assessment: Source specifies majority self-reported location Saudi/UAE and top-10 all Gulf-based; frames episode as foreign amplification on behalf of Tunisians attempting to justify Saied's measures as popular revolt against Brotherhood, not a domestic Tunisian farm. The 12,000 is tweets, not accounts.
        source: aljazeera-tunisia-manipulation-2021-07-28
      - claim: "The 12,000 tweets prove a domestic Saied bot farm"
        held_by: Misreading of same episode
        status: rejected
        assessment: Article explicitly distinguishes Gulf-based influencer core from sock-puppet amplification cluster — this is external influence operation, not evidence for domestic 2021-2026 enumeration.
        source: aljazeera-tunisia-manipulation-2021-07-28

