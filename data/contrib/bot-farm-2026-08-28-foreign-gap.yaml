  - id: cc-bot-digital-army-qualitative-2026-08-28
    entity: null
    claim: >-
      Tunisian President Kais Saied's supporters exhibit a 'heavy digital presence' — especially on Facebook (which has ~70% penetration in Tunisia) — attacking and doxing critics after Saied's televised target-identification, sharing sensitive personal data (e.g., medical records of women judges including virginity-check result, addresses), fabricating foreign-agent claims against journalists, and allegedly leaking judicial documents that in several cases preceded arrests of named individuals; the campaign is described as disciplined/coordinated enough to suggest at least some collusion with state bodies, driven by both well-known influencers (Riadh Jrad, Ben Arfa, Issam Blanko with tens/hundreds of thousands followers) and a majority of anonymous low-follower accounts where some are 'likely bots', but no numeric scale for a bot farm or coordinated network is published.
    assessment: >-
      Qualitative assessment drawn from two independent Tier-3 pieces that converge verbatim on 'heavy digital presence': Arab Center 2023-07-21 and POMED/MEDC 2023-06-15 (Snoussi Q&A). Both describe tactics (doxxing, disinformation, leak-then-arrest pattern), platform (Facebook), trigger (Saied speech) and hybrid network (known influencers + anonymous likely-bots) without ever publishing a count. Inkyfada/DFRLab 2019 and UReputation 2020 are the only enumerated Tunisia-linked networks — neither maps to this 2021-2023 domestic support phenomenon. Treat any number attached to 'Saied digital army' as unsubstantiated unless a future study or platform takedown enumerates it. This is an observed pattern, not an enumerated farm.
    confidence: D
    basis: unsubstantiated
    attributed_to: Amine Snoussi via POMED/MEDC (2023-06-15) and C. Ian DeHaven via Arab Center Washington DC (2023-07-21) — corroborating qualitative claim without enumeration
    reasoning: >-
      Inference is not that a network exists (that is reported) but that its scale cannot be quantified from these sources — they give no denominator, no sample window, no graph detection method comparable to 2021 hashtag study, and no platform CIB figure after May 2020.
    falsifiable_by: >-
      Any Tier 1–2 enumeration that counts a 2021-2026 Tunisia domestic coordinated network: ISIE/HAICA audit with method and account/Page/Group totals; Meta Adversarial Threat / CIB report with Tunisia-origin asset count; peer-reviewed OSINT graph analysis with asset list and follower totals; or a court filing that lists seized handles with provenance.
    sources:
      - arabcenter-tunisia-disinformation-2023-07-21
      - pomed-saied-digital-army-2023-06-15

  - id: cc-bot-no-domestic-enumeration-2021-2026-verify-2026-08-28
    entity: null
    claim: >-
      For 2021-2026 no high-trust (Tier 1–2) source publishes an enumerated size for a domestic Tunisian bot farm or coordinated network around President Kais Saied; the only quantified Tunisia-linked episodes in the decade remain the May 2019 Archimedes global takedown (Tunisia slice 11 Pages per Inkyfada, not accounts) and the Jun 2020 UReputation origin-Tunisia takedown (993 assets, 182 of which are Facebook accounts) — both foreign-facing; the 2021 hashtag episode is foreign amplification (Saudi/UAE majority), not a domestic count. Decree Law 54 of 13 Sep 2022 creates powers to prosecute 'rumours/fake news' but itself contains no bot count; UNODC-donated forensic equipment is documented as capability (USD 200,000 on 24 Mar 2021) but is not a measure of scale of domestic enforcement against bots.
    assessment: >-
      Documented negative after systematic negative search formalised in this pass: websearch 2026-08-28 for 'Tunisia 2024 presidential election disinformation bots' surfaced Digital Action briefing (22 Oct 2024) and Arab Facts Hub scrape (>150k posts Jan–Nov 2024, hundreds of pro-Saied accounts described but not counted as bots), plus Freedom House Election Watch 2024, BBC/NPR coverage — none publishes a bot-farm enumeration; websearch for 'Tunisia Decree 54 UNODC forensic' reconfirmed UNODC ROMENA March 2021 equipment story already cited in Arab Center but no scale metric. Meta Threat Report index and X Transparency Tunisia country report checked in prior outbox and not yielding a Tunisia domestic takedown count through 2025 remain applicable. Keep as unsubstantiated on numeric scale per rule 6 — the popular 'digital army' narrative is kept with attribution, scale is kept as ?.
    confidence: D
    basis: unsubstantiated
    attributed_to: Synthesis of search-negative plus Arab Center/POMED (qualitative only) and prior outbox negatives (Meta/X indices); popular numeric claims circulate without citer
    reasoning: >-
      The claim being graded is not 'nothing happened online' — qualitative harassment/doxxing is documented — but 'there exists a counted domestic farm of N accounts' for 2021-2026. That N is not in any Tier 1–2 primary this research found; converting 'heavy presence' or 'hundreds of accounts scraped' into a bot total would be invention. Gap is therefore a finding, not an omission.
    falsifiable_by: >-
      Publication of any Tier 1–2 enumeration for 2021-2026: e.g., ISIE or HAICA election report table with account/Page count and method; Meta Adversarial Threat / CIB entry 'Origin: Tunisia' with asset breakdown and follower total; DFRLab-equivalent OSINT with WHOIS/subdomain/admin linkage for a post-2021 Tunisia domestic network; or court/INLUCC filing listing seized handles with forensic linkage.
    sources:
      - aljazeera-tunisia-manipulation-2021-07-28
      - arabcenter-tunisia-disinformation-2023-07-21
      - pomed-saied-digital-army-2023-06-15
      - unodc-forensic-equipment-2021-03-24
      - digitalaction-tunisia-briefing-2024-10-22
      - arabfactshub-2024-election-facebook-2024

  - id: cc-bot-2024-election-no-bot-count-2026-08-28
    entity: null
    claim: >-
      Ahead of the 6 Oct 2024 Tunisian presidential election, no published source enumerates a Tunisian bot farm of a stated size: Digital Action / Mena Media Monitoring (Jul–mid-Sep 2024) describe Facebook pages/groups with tens of thousands of followers that publish mis/disinformation and are mostly managed from abroad, and a specific false claim about ISIE president Farouk Bouasker proposing to cut Facebook/TikTok until 6 Oct, but do not count bots; Arab Facts Hub's 2024 scrape (>150k posts, hundreds of pro-Saied entities trafficking in African-colonialism + foreign-agent conspiracies) likewise publishes no bot/fake-account enumeration; Meta and Platform policies failed to act but did not disclose a Tunisia-specific takedown count in this window.
    assessment: >-
      Documented negative on enumeration specific to the 2024 election window. Both 2024 studies are Tier-3 journalism/research — they map networks and narratives (great-replacement / settler-colonialism, traitor/foreign-agent smear of civil society) with qualitative reach metrics (followers, shares) and platform moderation critique, but method is scraper + keyword matching or manual post review, not CIB asset counting. Any attempt to cite them for a 2024 bot total would be invention. Falsifiable by a post-Oct-2024 platform takedown report or ISIE/HAICA annex with count.
    confidence: D
    basis: unsubstantiated
    attributed_to: Digital Action / Mena Media Monitoring (Oct 2024) and Arab Facts Hub (2024) — both describe networks without enumeration; numeric scale, if claimed elsewhere, is unattributed
    falsifiable_by: >-
      A published count with method: e.g., Meta CIB report addendum for H2 2024 listing Tunisia, or ISIE post-election audit annex with enumerated accounts/pages removed or flagged, or peer-reviewed scrape that labels and counts bots vs humans with classification threshold and validation.
    sources:
      - digitalaction-tunisia-briefing-2024-10-22
      - arabfactshub-2024-election-facebook-2024

  - id: cc-bot-unodc-forensic-capability-not-scale-2026-08-28
    entity: null
    claim: >-
      On 24 Mar 2021 UNODC delivered USD 200,000 worth of forensic equipment and software to Tunisia's Ministry of Interior (General Direction of Technical Service and General Direction of National Guard) under the 'Supporting Tunisian Capacities to Prevent and Combat Cybercrime' project funded by U.S. INL (launched Feb 2016, phase 2 from Feb 2019), including high-end digital forensic equipment plus certified trainings on extraction/analysis of digital evidence and crypto/blockchain; Arab Center and POMED cite this capability as the backdrop against which Decree 54 (Sep 2022) has been used to monitor critics' phones/messages and prosecute journalists/students/lawyers/activists for online criticism, while pro-Saied Facebook pages spreading hate/disinformation have not faced consequences — but the equipment value is not evidence of scale of bot enforcement nor of a counted farm.
