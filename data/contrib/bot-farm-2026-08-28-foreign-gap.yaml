  - "Failure vocabulary enforced throughout: 12k tweets ≠ 6.8k accounts; hashtag scope ≠ national total; Gulf influencers + sock-puppets = foreign amplification ≠ domestic farm; documented-negative gap 2021-2026 is finding not omission; heavy presence without number is not a count."
  - "Methodology for 2021 episode made explicit: hashtag-scoped collection, self-reported location field, centrality/influence ranking, network graph disconnected constellation = inorganic, velocity (>200 RT in 5 min) = automation signal, plus hacked-account reuse (Filipino girl, Emma Roberts/Smurf) and comic-video payload."
