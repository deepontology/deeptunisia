sources:
  - id: aljazeera-tunisia-manipulation-2021-07-28
    title: Tunisia crisis prompts surge in foreign social media manipulation
    publisher: Al Jazeera — Marc Owen Jones
    date: 2021-07-28
    url: https://www.aljazeera.com/news/2021/7/28/tunisia-crisis-prompts-surge-in-foreign-social-media-manipulation
    tier: 3
    lang: en
    live_verified: 2026-08-28
    live_status: "200 — webfetch body captured; byline Marc Owen Jones; Published On 28 Jul 2021"
    excerpt: "An analysis of 12,000 tweets from 6,800 unique Twitter accounts on the hashtag 'Tunisians revolt against the brotherhood' revealed a concerted effort by Gulf-based influencers to portray the actions of the president as a popular Tunisian revolt against Islamist parties such as the Muslim Brotherhood. The majority of users tweeting with the hashtag reported their location as being either in Saudi Arabia or the UAE. The top 10 most influential accounts on the hashtag were all Gulf influencers also based in Saudi Arabia or the UAE. These accounts included Emirati Khalid bin Dhahi, Saudi influencer @s_hm2030, Saudi cartoonist Fahad Jubairi, the Emirati writer Mohamed Taqi, as well as an Emirati patriotic account called emarati_shield. Saudi influencer Monther al-Shaykh (monther72), the most influential account in the whole hashtag, even called the sacked prime minister the 'Khamenei of Tunisia'. In addition sock-puppets: account @7__e7 name Fairuz was fake, its tweet contained unrelated 'comic' video of a person falling out of a car while reversing; retweeted hundreds of times; Fairuz's tweet garnered more than 200 retweets within five minutes, speed strongly indicates automation. None of the accounts retweeting her was real — hacked or fake accounts programmed to automatically retweet (example: 14-year-old Filipino girl, Emma Roberts with Smurf display image). Network graph: blue constellation on left shows Fairuz + >200 accounts retweeting her disconnected from main cluster — points to inorganic behaviour. Using hacked accounts for advertising/marketing common including MENA propaganda."
