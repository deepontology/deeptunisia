    tier: 3
    lang: fr
    excerpt: >-
      Le Tribunal militaire permanent de Tunis a condamné Olfa Hamdi, présidente
      du parti « La Troisième République », à quatre ans de prison et à une
      amende de 80 mille dinars dans le cadre de deux affaires engagées à son
      encontre. Son avocat, Akram Moussa, a précisé qu'elle a écopé de deux ans
      de prison et de 40 mille dinars d'amende dans chacune des deux affaires.
    note: >-
      Names the court (permanent military tribunal of Tunis), which Al Jazeera
      does not. Adds the March 2026 two-year sentence in a similar case.

