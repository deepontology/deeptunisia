    reasoning: >-
      One outlet, no parliamentary document. The meeting, its date, the two
      chairing members and the scheduled 28 October hearing are as the piece
      states them; the members' stated concerns are its summary of their
      interventions, not a record of the sitting. The 28 October audition is
      forward-dated, so the record dates the preparatory meeting and reports the
      audition as scheduled rather than held.
    falsifiable_by: >-
