      The finance and budget committees of the Assembly of the Representatives
      of the People (ARP) and of the National Council of Regions and Districts
      (CNRD) held a joint preparatory meeting at ARP headquarters on Wednesday
      21 October 2026, chaired by the two committees' presidents Ali Hassoumi
      Bayouli and Maher Kettari, to fix their common working calendar for the
      2027 economic budget (budget économique) and the 2027 finance bill, per
      African Manager on 22 October 2026. The two committees decided to hold a
      joint hearing of the economy and planning minister on Wednesday
      28 October 2026 — after this sweep's window — and a further joint hearing
      of the finance minister in the following week, with the date to be
      confirmed. Members' interventions, as the piece reports them, concerned
      the need to deepen the figures and indicators in the two texts, a joint
      assessment of the 2026 budget and its execution in the light of the supply
      difficulties of summer 2026, and the non-issuance of the implementing
      decrees needed to make a number of 2026 finance-law measures effective.
