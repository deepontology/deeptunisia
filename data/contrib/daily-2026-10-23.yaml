# daily-2026-10-23, daily dataset sweep (full mode), consolidated outbox
#
# MISSION: sweep the news window 2026-10-19 to 2026-10-23, which has never been
#   merged. time.cutoff in data/parameters.yaml is 2026-10-18 (V31 fails the
#   build on any record dated past it), so nothing in this window exists in the
#   graph. This file is the candidate batch for that window and nothing else.
# SOURCES USED (all fetched and read in full this run, 2026-10-23):
#   - Al Jazeera English, "Rare unrest flares in Tunisian capital as police clash
#     with protesters", 2026-10-23 (AFP and Reuters), tier 3, en
#     https://www.aljazeera.com/news/2026/10/23/rare-unrest-flares-in-tunisian-capital-as-police-clash-with-protesters
#   - Al Jazeera English, "Tunisia jails opposition politician for four years
#     over social media posts", 2026-10-21 (AFP and Reuters), tier 3, en
#     https://www.aljazeera.com/news/2026/10/21/tunisia-jails-opposition-politician-for-four-years-over-social-media-posts
#   - African Manager, 2026-10-21 and 2026-10-22, tier 3, fr (eleven items; URLs
#     on each source row below). African Manager carries no byline beyond its
#     house account, so "African Manager" is the attributing party throughout.
#   - Kapitalis, 2026-10-22, tier 3, fr (signed "Y. N.")
#   - Nawaat, 2026-10-19, 2026-10-21 and 2026-10-22, tier 3/4, ar
#   No tier-1 or tier-2 source was available for this window: no JORT issue was
#   fetched, and no court, ministry or registry record was retrieved. Every
#   record below rests on tier-3/4 reporting.
# WORKSPACE NOTE: feed/feed.json in this worktree is stale (latest item
#   2026-10-10T10:40Z, 1200 items, no 19-23 October material). The triage was
#   done on the checkout's feed/feed.json (latest item
#   2026-10-23T00:51:40Z, 119 items dated 2026-10-18 or later). If the worktree
#   feed is not refreshed before the next sweep, this file's window cannot be
#   reproduced from it.
# COVERAGE GAP, Inkyfada: the feed fetch for that outlet FAILED on 2026-10-23
#   (timeout), so it contributed no item to the triage list. Checked directly:
#   the French front page's "Les derniers articles" block on 2026-10-23 leads
#   with the 5 October 2026 prison-heat-deaths report, followed by 24 September,
#   14 September and 12 September items — no 19-23 October publication surfaced.
#   That is a front-page check, not an archive check, so treat Inkyfada 19-23
#   October as unverified rather than as empty.
# ENTITY CHECKS (every id cited below re-checked with rg against data/*.yaml):
#   CITED AND PRESENT: judiciary, legislature, cnrd, ministry-interior, uib,
#     gov-tunis, gov-sfax, olfa-hamdi (created by this batch). Named but not
#     cited as ids because they have no record: salah-zouari IS present
#     (p-equipment-zouari) and is named in the notes only, because no meeting
#     record is proposed; mohamed-yousfi IS present and is the target of the
#     flag below.
#   ABSENT, contrary to the worklist: bilel-sahnoun has NO person record, no
#     bvmt-dg role and no position (the worklist said the graph has him). UGET
#     has no institution record (confirmed). Olfa Hamdi had no person record
#     (confirmed) although a canonical 2024 event already names her. Also absent:
#     ministry-economy/planning, ministry-agriculture, ministry-industry-energy,
#     the Competition Council, the permanent military tribunal of Tunis, AFCM,
#     SFBT, BTK Bank, the universities and institutes named, and Hela Ben Salem.
#     CNSS does exist (institutions.yaml:3542) and is named in a note, not cited.
# FAILURE VOCABULARY (must not be collapsed):
#   - "condamnée à 4 ans" is two two-year terms in two cases plus 80,000 dinars
#     in fines, per the defence lawyer; it is not one four-year sentence, and no
#     outlet says whether the judgment is appealable or an appeal was lodged.
#   - the 22 October flare-ups are NOT the 17 October march. Al Jazeera frames
#     them as coinciding with it ("coincide with"), attributes them to two
#     deaths in police custody or pursuit, names no organising body and gives no
#     crowd figure, no arrest count and no demand. No source asserts continuity
#     of mobilisation; none is recorded here.
#   - "une amende de plus de 9 MDT du Conseil de la Concurrence" is a 22 October
#     2026 disclosure of a judgment of 29 May 2024 in the UIB statutory
#     auditors' report on the 2025 accounts. The decision is dated 2024, not
#     October 2026; the 9,009,258 dinars is the auditors' transcription of it.
#   - "mise en demeure de la SFBT par la CNSS" concerns a notification of
#     6 July 2026, not an October act; the piece also carries a second, older
#     notification of 8 July 2024 for what the text prints as ".592.742 DT".
#   - the 3,300 km SoutH2 figure, ">40% of the EU's 2030 hydrogen import target"
#     and ">4 Mt a year" are Businessfront's, relayed by African Manager, which
#     relays them without a Tunisian signatory, ministry or date.
#   - "re-elected to the AFCM board" is the Bourse de Tunis (BVMT) keeping a
#     seat, not Bilel Sahnoun being re-elected to anything personal: the AFCM
#     board announced on 21 October 2026 is chaired by Abdulla Alnuaimi of the
#     Abu Dhabi Securities Exchange, so Sahnoun is no longer its president.
#   - "Zouari" in the two 20-21 October items is Slah/Salah Zouari, equipment
#     and housing minister, described as holding the industry, mines and energy
#     portfolio in caretaker form ("chargé de la gestion"); the graph records
#     only the equipment portfolio.
#   - the 11,846 MDT subsidy total is a figure in the 2027 budget-project
#     document as obtained by TAP and relayed by African Manager: a document
#     figure, not an appropriation voted or executed.
# CANDIDATES ARE PROPOSALS, NOT GRAPH DATA. Nothing canonical was changed; no
#   cutoff was advanced. Whoever merges must move time.cutoff to 2026-10-23 in
#   the same edit and update the pinned defaults in scripts/parameters.ts and
#   scripts/test-parameters.ts. Humans dispose (P4).

sources:
  - id: aljazeera-tunisia-unrest-2026-10-23
    title: "Rare unrest flares in Tunisian capital as police clash with protesters"
    publisher: Al Jazeera English
    date: 2026-10-23
    url: https://www.aljazeera.com/news/2026/10/23/rare-unrest-flares-in-tunisian-capital-as-police-clash-with-protesters
    tier: 3
    lang: en
    excerpt: >-
      Tunisian police have clashed with protesters in rare unrest in the capital
      city of Tunis, as well as in the southern town of Jebiniana, over recent
      deaths linked to the police. Police forces fired tear gas on Thursday to
      disperse protesters in Ettadhamen, a suburb of the capital, following the
      death of a man detained on suspicion of drug dealing.
    note: >-
      Credited "By AFP and Reuters", so the piece is wire copy published by one
      outlet; the two agencies are treated as one publication here, not as two
      independent confirmations.

  - id: aljazeera-hamdi-verdict-2026-10-21
    title: "Tunisia jails opposition politician for four years over social media posts"
    publisher: Al Jazeera English
    date: 2026-10-21
    url: https://www.aljazeera.com/news/2026/10/21/tunisia-jails-opposition-politician-for-four-years-over-social-media-posts
    tier: 3
    lang: en
    excerpt: >-
      A Tunisian military court has sentenced an opposition leader to four years
      in prison on charges of plotting against state security and inciting the
      military to disobey orders, her lawyer has said. The charges against Olfa
      Hamdi, a dual Tunisian and United States national, stemmed from social
      media posts, her lawyer Akram Moussa said on Wednesday.
    note: >-
      AFP and Reuters copy. Also the only source here for the biography: 2024
      candidacy rejected on the 40-year age minimum, February detention at Tunis
      airport, earlier spell as head of Tunisair.

  - id: african-manager-hamdi-verdict-2026-10-21
