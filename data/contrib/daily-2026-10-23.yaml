  - id: ev-arp-cnrd-budget-2027-examination-2026-10-21
    date: "2026-10-21"
    title_en: "ARP and CNRD budget committees open the 2027 budget examination and set the minister's hearing"
    title_fr: "Les commissions du budget de l'ARP et du CNRD ouvrent l'examen du budget 2027 et fixent l'audition du ministre"
