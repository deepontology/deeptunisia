events:
  - id: ev-hamdi-military-court-sentence-2026-10-21
    date: "2026-10-21"
    title_en: "Military court sentences Olfa Hamdi to four years in two cases"
    title_fr: "Le tribunal militaire condamne Olfa Hamdi à quatre ans de prison dans deux affaires"
    category: legal
    subcategory: military-court-sentence
    location: [gov-tunis]
    actors: [olfa-hamdi]
    institutions: [judiciary]
    causes: []
    consequences: []
    summary: >-
      The permanent military tribunal of Tunis sentenced Olfa Hamdi, president
      of the Third Republic party (La Troisième République), to four years in
      prison and 80,000 dinars in fines on Wednesday 21 October 2026, in two
      cases brought against her. Her lawyer Akram Moussa told Agence
      France-Presse that the four years are two separate two-year terms, each
      with a 40,000-dinar fine, and that the charges — plotting against state
      security and inciting the military to disobey orders — arose from social
      media posts; Al Jazeera, carrying AFP and Reuters copy, reports the same
      composition of the sentence and the same 80,000 dinars. African Manager,
      reporting the same day, names the court and adds "other military offences"
      to the charges, and recalls a two-year sentence against her in March 2026
      in a similar case. Al Jazeera describes Hamdi as a dual Tunisian and
      United States national who ran in the 2024 presidential election and was
      excluded for not meeting the 40-year age minimum, and who was detained at
      Tunis airport in February (the year is implied by the piece) after living
      abroad. Neither outlet states whether the judgment is appealable or
      whether an appeal has been lodged; a United States State Department
      spokesperson told AFP that Washington was "closely tracking the
      situation". No judgment text, court communiqué or defence filing was
      retrieved, and the permanent military tribunal of Tunis has no graph id,
      so the record cites the judiciary.
    confidence: B
    basis: reported
    verification: needs-primary-source
