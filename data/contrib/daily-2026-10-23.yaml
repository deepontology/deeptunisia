flags:
  - kind: flag
    id: ev-yousfi-detention-2026-09
    note: >-
      CONTESTED DETAIL, no date change proposed. The canonical summary says the
      investigating judge of the Tunis economic-financial pole issued the dépôt
      warrant on 8 September 2026 "after questioning". Nawaat's 22 October 2026
      interview with defence counsel Hela Ben Salem states the opposite on the
      interrogation point: "منذ إيقاف الصحفي محمد اليوسفي في 4 سبتمبر 2026، لم
      يمثل أمام قاضي التحقيق لاستنطاقه في التهم الموجهة اليه من إثراء غير مشروع
      وغسل أموال" — paraphrased, that since his arrest on 4 September 2026 he has
      not appeared before the investigating judge to be interrogated on the
      charges of illicit enrichment and money laundering. Two readings are open
      and this flag does not choose between them: either the 8 September
      questioning was by another officer (the warrant is issued by the
      investigating judge but questioning can precede him), in which case
      "after questioning" is imprecise but not false, or Yousfi has not been
      interrogated at all, in which case the clause should be removed. What the
      Nawaat item adds that the record does not carry: as of 22 October 2026 he
      had still not been interrogated by the investigating judge, seven weeks
      after arrest; the charges are named by the defence as illicit enrichment
      and money laundering (the record already carries these); and the piece
      frames the case as a trial of the free press. What it does not add: any
      hearing or trial date — the headline's "محاكمة" (trial) is the framing, not
      a scheduled session — and any new document. Suggested wording if a human
      accepts it: "a dépôt warrant of 8 September 2026; per defence counsel on
      22 October 2026 he had not yet been interrogated by the investigating
      judge". The person record's closing sentence "Person and detention absent
      from the graph" is also stale and should be removed when this is handled.
    sources:
      - nawaat-yousfi-hela-ben-salem-2026-10-22

notes:
  - >-
    Note, not a record — UGET is absent from the graph but its strike IS
    recorded above: ev-uget-sfax-strike-2026-10-22 cites no institution because
    uget has no id (rg against data/institutions.yaml returns nothing, unlike
    ugtt at institutions.yaml:1534). If a human imports the event without first
    creating the UGET record, the union will exist only as a name in a summary,
    which is the silent dangling reference the house rule forbids — so create
    the institution first, or accept the summary-only form deliberately. Same
    gap for the Institut supérieur des études technologiques de Sfax, the
    university residence (no place row for Sidi Mansour), and the student Rahma
    Dziri, who is named but gets no person record (a death in a public service
    failure, no public role).
  - >-
    Note — SFBT / CNSS: the 1,592,742-dinar mise en demeure was notified on
    6 July 2026, not in the October window; the CNSS had been auditing SFBT
    since 2023 over the 2020, 2021 and 2022 exercises, and the piece also
    recalls a notification of 8 July 2024 for what its text prints as ".592.742
    DT", which looks like a typographical loss of the leading 1 but is left as
    printed rather than corrected silently. Same piece, same company: a customs
    penalty of 11,517,790 dinars over the repatriation of export receipts for
    2000-2024, a conciliation request of 4 December 2025 accepted on 26 December
    2025, immediate payment of 10% plus a first tranche of 545,570 dinars on
    13 March 2026, and on 27 April 2026 a request to update the file in order to
    pay the whole amount. SFBT has no company record, so the item cannot be an
    event; every figure is the outlet's quotation of the company's own first-half
    2026 statements. Source: african-manager-sfbt-cnss-2026-10-21.
  - >-
    Note — BTK Bank, the second bank behind the "Conseil de la Concurrence"
    headline: its 2025 statements (board of 31 March 2026) show equity of
    226,067 KDT and net profit of 15,126 KDT, and the auditors flag a social
    (CNSS-type) verification for 2018-2020 with a preliminary notification of
    10 December 2021 on a 3,003 KDT redressement and an 800 KDT provision; a
    customs investigation opened in 2019 on exchange-regulation breaches, with a
    judgment of 16 October 2024 confirming certain facts, an appeal filed and a
    352 KDT provision; a deep fiscal audit notified in December 2025 for
    2021-2024, still open; a pro-forma restatement raising opening equity by
    8,784 KDT; and a Competition Council case over the treatment of deferred
    instalments during COVID in which, at the report's date, "aucune décision ni
    notification n'a été reçue par la Banque" and no provision was taken. That
    last point matters: the two 22 October African Manager pieces are about two
    different banks, and only UIB has a Competition Council judgment. BTK Bank
    has no graph record, so no event. Source:
    african-manager-btk-menaces-2026-10-22.
  - >-
    Note — SoutH2 hydrogen corridor: African Manager relays Businessfront for a
    project it says is "de 3 300 kilomètres", designed to carry "plus de quatre
    millions de tonnes" of renewable hydrogen a year and to supply "plus de 40 %
    de l'objectif d'importation d'hydrogène de l'Union européenne pour 2030",
    with "plus de 65 %" of the pipeline reusing existing gas infrastructure and
    operations "au début des années 2030". The instrument is a political
    declaration by five states — Tunisia, Algeria, Italy, Austria and Germany —
    which the piece says follows an initial agreement signed in Rome in January
    2025; a secretariat hosted by UNIDO was launched in Rome on 25 September
    (the piece does not give the year). The commercial vehicle named is the
    Alliance Algérie-Europe pour l'hydrogène: Sonatrach and Sonelgaz with Snam,
    SeaCorridor, VERBUND and VNG; the stage is "études de faisabilité
    préliminaires". No Tunisian signatory, ministry, company or signature date
    is named, and no Tunisian entity is a party to the consortium, so there is
    nothing to attach the record to: this is a note, and the 3,300 km and >40%
    figures stay Businessfront's claims as relayed, not graph facts. A Tunisian
    signature would make it an agreement or an event. Source:
    african-manager-hydrogene-south2-2026-10-22.
  - >-
    Note — the "متصدقش" (Matsaddeqsh) campaign is Egyptian, not Tunisian. Nawaat's
    19 October video says the Egyptian authorities arrested the platform's entire
    six-journalist editorial team to block its fact-checking of official claims;
    its 21 October piece reports that eight outlets from Egypt, Syria and Lebanon
    plus Nawaat launched a joint newsroom ("لحد ما يرجعوا .. التحقق مستمر") to
    keep verifying Egyptian official statements, and that the International
    Federation of Journalists issued a solidarity statement demanding the
    journalists' release. There is no Tunisian state action in either piece — no
    prosecution, summons or blocking — and Nawaat appears as a participant in a
    solidarity action, not as a subject. Opinion/solidarity material with no
    Tunisian act: a note. Sources: nawaat-matsaddeqsh-2026-10-19,
    nawaat-matsaddeqsh-solidarite-2026-10-21.
  - >-
    Note — Saïed on food sovereignty: at Carthage on Wednesday 21 October 2026
    the president received the agriculture, water-resources and fisheries
    minister Ezzedine Ben Cheikh, per a presidency communiqué relayed by African
    Manager on 22 October. He called agriculture a pillar of national security
    and sovereignty, asked for cheap credit lines and a reference price for
    small olive growers and more storage capacity at the Office national de
    l'huile, denounced intermediaries depressing date prices, pressed the CRDA
    on plant-health protection (olive diseases, red palm weevil), asked for fair
    and timely fertiliser distribution and for reconstituting the national herd,
    and said there can be no full sovereignty while the people depend on
    imported food; the communiqué also refers to the creation of an "Office Rjim
    Maatoug pour le développement du Sud et du Sahara". No decision, decree or
    instrument: a speech, so a note. Entity gaps it exposes: no
    ministry-agriculture, no ministry-industry-energy, no institution for the
    Office national de l'huile, the Office de l'élevage, the CRDA network or the
    Rjim Maatoug office, and no person record for Ben Cheikh. Source:
    african-manager-saied-autosuffisance-2026-10-22.
  - >-
    Note — 2027 budget subsidy figures: the budget-project document obtained by
    TAP puts subsidy spending at 11,846 MD, split hydrocarbons 59.8%, basic
    products 34.1%, transport 6.1%; 7,090 MD of it for hydrocarbons and
    electricity (3,676 MD for STEG, 3,414 MD for STIR, including about 500 MD of
    STEG arrears for 2017-2023 and 320 MD of STIR arrears for 2022 and 2024); a
    Brent assumption of 80 USD a barrel against 63.3 USD in the 2026 budget;
    4,036 MD for basic products; 720 MD for transport; execution to end-August
    2026 at 4,496 MD, up 6% year on year, 46% of the forecast; and a 75% subsidy
    on domestic gas bottles (cost 35 DT, public price 8.8 DT). These are document
    figures relayed by one outlet, not an appropriation voted or executed, and
    the graph holds no 2027 budget event at all — so the first record to open is
    the deposit of the finance bill, which this piece does not date. A note until
    that instrument is sourced. Source:
    african-manager-subventions-2027-2026-10-22.
  - >-
    Note — Zouari's two meetings, nothing decided: on Tuesday 20 October 2026 the
    equipment and housing minister, holding the industry, mines and energy
    portfolio in caretaker form, met a Scatec delegation led by its chief
    executive Terje Pilskog together with Aeolus (of the Japanese Toyota Tsusho
    group), in the presence of the secretary of state for energy transition Wael
    Chouchane and STEG chief executive Fayçal Trifa, on solar and wind projects,
    storage and the ~120 MW "Sidi Bouzid 2" photovoltaic plant; on Wednesday
    21 October he met Rania Hedia, UN-Habitat's regional director for the Arab
    states, on the 2027 joint action plan, an Alwaleed Philanthropies agreement
    on housing access for persons with disabilities, the SNIT "Jalon" pilot and
    the revision of the national housing strategy. Both are courtesy/preparatory
    meetings with no decision, signature or tender, so no events. The
    position gap they expose is real and worth a record of its own: the graph
    has p-equipment-zouari (salah-zouari, equipment-minister, from 2025-03-20)
    but no industry, mines and energy role and no position for the caretaker
    holding of that portfolio, which is the portfolio that receives Scatec.
    Sources: african-manager-zouari-scatec-2026-10-21,
    african-manager-zouari-onu-habitat-2026-10-22.
  - >-
    Note — BVMT at the AFCM, and a correction to the headline reading: the
    Bourse de Tunis was re-elected to the board of the Arab Federation of
    Capital Markets (AFCM) for 2026-2028, and the AFCM announced its new board on
    21 October 2026 after its general assembly, per its own communiqué relayed by
    African Manager. The board is chaired by Abdulla Alnuaimi, chief executive of
    the Abu Dhabi Securities Exchange group — which means Bilel Sahnoun, BVMT's
    chief executive and AFCM board president since the federation's 13-14 May
    2025 conference in Tunis, is no longer its president. So "Bilel Sahnoun
    réélu" is not what happened: the exchange kept a seat, and the chair moved.
    Entity gaps: contrary to the worklist, the graph has NO bilel-sahnoun person
    record, no bvmt chief-executive role in data/roles.yaml and no position row
    (rg for sahnoun and bvmt-dg across data/ returns nothing); bvmt exists at
    institutions.yaml:1489 and bvmt itself is the seat-holder here, so an event
    could cite bvmt alone — but a governance record needs the person and the
    role first. AFCM has no institution record either. Source:
    african-manager-bvmt-afcm-2026-10-22.
  - >-
    Note — Ghardimaou security campaign: the item exists in the feed
    ("Ghardimaou : Vaste campagne sécuritaire et plusieurs arrestations",
    African Manager, 2026-10-22) but could not be read. The URL in the feed
    (https://africanmanager.com/ghardimaou-vaste-campagne-securitaire-et-plusieurs-arrestations/)
    returns a 301 to https://africanmanager.com/ghardimaou-vaste-c/, which 301s
    back, so a client that follows redirects loops; curl stops after 50 hops,
