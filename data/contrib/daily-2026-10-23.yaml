  - id: ev-uib-competition-fine-2024-05-29
    date: "2024-05-29"
    title_en: "Competition Council fines UIB 9,009,258 dinars over COVID deferred-maturity interest"
    title_fr: "Le Conseil de la Concurrence condamne l'UIB à 9 009 258 dinars sur les intérêts intercalaires du report d'échéances Covid"
    category: economic
    subcategory: competition-ruling
    location: [gov-tunis]
    actors: []
    institutions: [uib]
    causes: []
    consequences: []
    summary: >-
      By a judgment of 29 May 2024, the Competition Council held that the Union
      Internationale de Banques (UIB), the Tunisian subsidiary of Société
      Générale, had processed the intercalary interest on deferred instalments
      during the COVID-19 period in breach of the law on competition and prices,
      and fined it 9,009,258 dinars, per the bank's statutory auditors' report on
      the 2025 accounts as quoted by African Manager on 22 October 2026. The
      auditors state that the judgment carried no provisional execution, so an
      appeal would be suspensive of execution, and that the risk cannot be
      precisely assessed at this stage; the report does not say whether an appeal
      has been lodged. This record is a backfill, not an October 2026 event: the
      22 October item is a disclosure inside the 2025 audit report, and African
      Manager's headline ("Une amende de plus de 9 MDT") does not date the
      decision. The judgment, the Competition Council's decision and any appeal
      filing were not retrieved, and the Council has no graph id.
    confidence: C
    verification: needs-primary-source
    attributed_to: "UIB statutory auditors' report on the 2025 accounts, as quoted by African Manager (22 October 2026)"
    reasoning: >-
      The decision date, the practice and the amount come from one document, the
      auditors' report, quoted verbatim by one outlet; the judgment itself was
      not obtained. The 9,009,258 dinars is the auditors' transcription of the
      fine, not a figure read off the ruling. The date is 29 May 2024 because
      the auditors date the judgment; dating it to October 2026 would attribute
      to the press item a decision it merely discloses.
    falsifiable_by: >-
      The Competition Council's decision of 29 May 2024, the court file, the
      bank's own annual report, or a filing showing an appeal lodged within the
      deadline would confirm the amount, the practice and the procedural
      position, and would show whether the fine is final.
    sources:
      - african-manager-uib-concurrence-2026-10-22
      - african-manager-btk-menaces-2026-10-22

