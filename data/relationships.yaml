  description_ar: مجموعة بوخاطر (الشارقة، الإمارات) هي الشركة الأم لـ SCIT — Sport Cities International Tunis — الذراع التونسية لمشروع مدينة تونس الرياضية على مساحة 250 هك في الضفة الشمالية لبحيرة تونس. يسجّل WMC (19/09/2008) رفع رأس مال SCIT من 5.001م إلى 82.426م دينار في أوت 2008 (77 425 سهمًا جديدًا) ويصفها بأنها «فرعها التونسي»؛ ويدرج موقع المجموعة SCIT ضمن أنشطتها؛ وأُعلن المشروع في ماي 2008 من رئيس المجموعة عبد الرحمن بوخاطر وأُعيد إطلاقه في 10-15/03/2022 برئاسة صلاح بوخاطر ومديرية عفيف بجاوي (منذ 01/02/2022). لم يُنشر أي نسبة، فلا يُدّعى أي رقم.
