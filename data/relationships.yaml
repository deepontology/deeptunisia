- id: rel-khaled-yahyaoui-judiciary-allegation
  from: khaled-yahyaoui
  to: judiciary
  type: allegation
  subtype: circulating claim
  description: "A stronger version of the reported-influence claim circulates, holding that the presidential security chief personally directs state decisions beyond appointments, including judicial ones. No reliable evidence for the stronger claim has been located. What credible reporting supports is narrower: attributed influence over ministerial careers. The two should not be conflated, and this record exists precisely to keep them apart."
  description_fr: "Une version plus forte de l'affirmation d'influence rapportée circule, selon laquelle le chef de la sécurité présidentielle dirige personnellement les décisions de l'État au-delà des nominations, y compris judiciaires. Aucune preuve fiable de cette affirmation plus forte n'a été localisée. Ce que la presse crédible soutient est plus étroit : une influence attribuée sur les carrières ministérielles. Les deux ne doivent pas être confondues, et ce dossier existe précisément pour les maintenir séparées."
  description_fr_by: model-reviewed
  description_ar: "تنتشر نسخة أقوى من ادعاء النفوذ المنقول، مفادها أن رئيس الأمن الرئاسي يوجّه شخصيًا قرارات الدولة بما يتجاوز التعيينات، ومنها القضائية. لم يُعثر على أي دليل موثوق للنسخة الأقوى. ما تدعمه الصحافة الموثوقة أضيق: نفوذ منسوب على المسارات الوزارية. لا ينبغي الخلط بين الاثنين، وهذا السجل موجود تحديدًا للفصل بينهما."
