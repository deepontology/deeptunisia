  description: "As interim president Ennaceur held the constitutional powers of the head of state, including command of the armed forces, for the 90-day period between Essebsi's death and Saied's inauguration; his first working days included a meeting with the minister of defence (Abdelkrim Zbidi) on 6 August 2019, and his working meetings with the head of government repeatedly covered the security situation. This is the thinnest of the presidential security edges: no military appointment or command decision by the interim is documented."
  description_fr: "En tant que président intérimaire, Ennaceur a détenu les pouvoirs constitutionnels du chef de l'État, dont le commandement des forces armées, pendant la période de quatre-vingt-dix jours entre la mort d'Essebsi et l'investiture de Saïed ; ses premiers jours de travail ont inclus une réunion avec le ministre de la Défense (Abdelkrim Zbidi) le 6 août 2019, et ses réunions de travail avec le chef du gouvernement ont régulièrement couvert la situation sécuritaire. C'est la plus ténue des arêtes de sécurité présidentielles : aucune nomination militaire ni décision de commandement de l'intérimaire n'est documentée."
  description_fr_by: model-reviewed
  description_ar: "بصفته رئيسًا مؤقتًا، امتلك الناصر الصلاحيات الدستورية لرئيس الدولة، بما فيها قيادة القوات المسلحة، خلال فترة التسعين يومًا بين وفاة السبسي وتنصيب سعيد؛ وشملت أيام عمله الأولى لقاءً مع وزير الدفاع (عبد الكريم الزبيدي) في 6 أوت 2019، وتناولت لقاءاته العملية مع رئيس الحكومة الوضع الأمني مرارًا. هذه أضعف حافات الأمن الرئاسية: لا توثق أي تعيين عسكري أو قرار قيادي اتخذه الرئيس المؤقت."
  description_ar_by: model-reviewed
