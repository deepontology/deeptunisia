- id: rel-succession-line-art109
  from: brahim-bouderbala
  to: sara-zaafarani
  type: institutional
  description: Per Article 109 of the 2022 constitution, if the president is incapacitated, the President of the Assembly (Bouderbala) assumes interim authority and appoints a new head of government (Zaafrani already in post). Mondafrigue notes this mechanism is untested and the real power dynamics — military, clan, foreign — may override formal constitutional order.
  description_fr: Selon l'article 109 de la constitution de 2022, si le président est empêché, le président de l'Assemblée (Bouderbala) assume l'intérim et nomme un nouveau chef du gouvernement (Zaafrani déjà en poste). Mondafrigue note que ce mécanisme n'a jamais été testé et que les dynamiques de pouvoir réelles — militaire, clanique, étrangère — peuvent primer sur l'ordre constitutionnel formel.
  description_fr_by: model-reviewed
  description_ar: بمقتضى الفصل 109 من دستور 2022، إذا عجز الرئيس، يتولى رئيس المجلس (بودربالة) السلطة مؤقتًا ويعيّن رئيس حكومة جديدًا (الزعفراني في المنصب أصلًا). تلاحظ موندافريك أن هذه الآلية غير مجربة وأن ديناميكيات السلطة الفعلية — العسكرية والعشائرية والأجنبية — قد تتغلب على النظام الدستوري الرسمي.
  description_ar_by: model-reviewed
  confidence: B
  attributed_to: Mondafrigue investigation (August 2026), constitutional analysis
  notes:
    - The constitutional mechanism exists on paper but has never been activated. The article notes that the military, security services, and clan networks may hold more practical power than the constitutional succession line suggests.
  sources:
    - mondafrique-succession-saied-2026
