- id: rel-youssef-saheb-ettabaa-mohamed-larbi-zarrouk-political-conflict
  from: youssef-saheb-ettabaa
  to: mohamed-larbi-zarrouk
  type: political-conflict
  description: "Mohamed Larbi Zarrouk Khaznadar, maternal uncle of princes Hussein and Moustapha, manipulated them to instigate Youssef Saheb Ettabaa's assassination after the death of his protector Hammuda I Bey: attacked 15 September 1814 at the Bardo seraglio entrance, he died of his wounds 23 January 1815. The conflict is documented by Brown (Princeton UP, 2015) and, on the succession-crisis background, by Ben Achour in Leaders. Political-conflict is symmetric in the schema's direction map; the description states the instigator-to-victim orientation."
  description_fr: "Mohamed Larbi Zarrouk Khaznadar, oncle maternel des princes Hussein et Moustapha, les a manipulés pour fomenter l'assassinat de Youssef Saheb Ettabaa après la mort de son protecteur Hammouda Ier Bey : attaqué le 15 septembre 1814 à l'entrée du sérail du Bardo, il est mort de ses blessures le 23 janvier 1815. Le conflit est documenté par Brown (Princeton UP, 2015) et, pour le contexte de la crise de succession, par Ben Achour dans Leaders. Le conflit politique est symétrique dans la carte de direction du schéma ; la description énonce l'orientation instigateur-vers-victime."
  description_fr_by: model-reviewed
  description_ar: "محمد العربي زروق خزندار، الخال للأميرين حسين ومصطفى، دبّرهما للتحريض على اغتيال يوسف صاحب الطابع بعد وفاة حاميه حمودة باشا: اعتُدي عليه في 15 سبتمبر 1814 عند مدخل سراي باردو، ومات متأثرًا بجروحه في 23 جانفي 1815. الصراع موثق من براون (جامعة برينستون، 2015) و، بشأن خلفية أزمة الخلافة، من بن عاشور في ليدرز. الصراع السياسي متماثل في خريطة الاتجاهات في المخطط؛ ويصرح الوصف بتوجه المحرّض نحو الضحية."
