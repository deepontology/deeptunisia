  basis: documented
  attributed_to: the 2014 constitution's attribution of command to the head of state, as described in Jeune Afrique's account of the interim (29 July 2019); the defence-minister meeting as reported by Tunisie Actualité (6 August 2019)
  reasoning: The head of state's command of the armed forces is a constitutional provision, not a documented decision; the edge records that an 85-year-old Bourguiba-era minister held the office for ninety days. It is kept so the security category is not silently empty for this president, with the caveat that no military appointment or command decision by the interim is documented.
  reasoning_fr: Le commandement des forces armées par le chef de l'État est une disposition constitutionnelle, non une décision documentée ; l'arête enregistre qu'un ministre de l'ère Bourguiba âgé de 85 ans a détenu la fonction pendant quatre-vingt-dix jours. Elle est conservée pour que la catégorie « sécurité » ne soit pas silencieusement vide pour ce président, avec la réserve qu'aucune nomination militaire ni décision de commandement de l'intérimaire n'est documentée.
