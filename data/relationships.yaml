- id: rel-leila-jaffel-atika-chebil-conflict
  from: leila-jaffel
  to: atika-chebil
  type: political-conflict
  description: Open rivalry between the two most visible women in the Saied power structure. Atika Chebil attempted to impose her associate Hatem Belahmer as justice minister, replacing Jaffel. Jaffel responded by advancing corruption dossiers against Chebil, including a suspicion of extortion linked to the Abdelaziz Makhloufi case, which resulted in Chebil being placed on the S17 travel-ban list. The dossier was subsequently frozen — neither closed nor pursued — in what sources describe as a "hostage equilibrium" where each clan holds enough material to destroy the other.
  description_fr: Rivalité ouverte entre les deux femmes les plus visibles de la structure de pouvoir de Saied. Atika Chebil a tenté d'imposer son associé Hatem Belahmer comme ministre de la Justice, en remplacement de Jaffel. Jaffel a répondu en avançant des dossiers de corruption contre Chebil, y compris un soupçon d'extorsion lié à l'affaire Abdelaziz Makhloufi, qui a abouti à l'inscription de Chebil sur la liste S17 d'interdiction de voyage. Le dossier a ensuite été gelé — ni clos ni poursuivi — dans ce que les sources décrivent comme un « équilibre des otages » où chaque clan détient assez de matière pour détruire l'autre.
  description_fr_by: model-reviewed
  description_ar: تنافس مكشوف بين أبرز امرأتين في بنية سلطة سعيد. حاولت عتيقة شبيل فرض شريكها هاتم بلحمر وزيرًا للعدل خلفًا لجفال. ردت جفال بتقديم ملفات فساد ضد شبيل، منها شبهة ابتزاز مرتبطة بقضية عبد العزيز مخلوفي، ما أدى إلى إدراج شبيل على قائمة منع السفر S17. جُمّد الملف لاحقًا — لا أُغلق ولا فُتح — فيما تصفه المصادر بـ«توازن الرهائن» حيث يملك كل جناح ما يكفي لتدمير الآخر.
  description_ar_by: model-reviewed
  confidence: C
  attributed_to: Mondafrigue investigation (August 2026), citing judicial sources
  notes:
    - The S17 travel ban and its freezing are reported by Mondafrigue. No primary record (court filing, official statement) has been located. The phrase "if I fall, I will not fall alone" is attributed to Jaffel but not independently verified.
  sources:
    - mondafrique-saied-clans-2026
