- id: rel-armed-forces-presidency-allegation
  from: armed-forces
  to: presidency
  type: allegation
  subtype: circulating claim
  description: "A recurring claim holds that the Tunisian army secretly governs the country. No reliable evidence supports it, and this dataset's own record runs against it: the tri-service command post went unfilled for roughly two decades, officers were removed from civilian posts after 1991, the army did not take power in 2011 when it plainly could have, and the one period of concentrated military authority lasted twenty-six months and was not renewed."
  description_fr: "Une affirmation récurrente prétend que l'armée tunisienne gouverne secrètement le pays. Aucune preuve fiable ne l'appuie, et le propre dossier de ce jeu de données va contre elle : le poste de commandement interarmes est resté vacant pendant environ deux décennies, les officiers ont été écartés des postes civils après 1991, l'armée n'a pas pris le pouvoir en 2011 alors qu'elle le pouvait manifestement, et la seule période d'autorité militaire concentrée a duré vingt-six mois sans être renouvelée."
  description_fr_by: model-reviewed
  description_ar: "ادعاء متكرر يقول إن الجيش التونسي يحكم البلاد سرًا. لا يدعمه أي دليل موثوق، وسجل قاعدة البيانات هذه نفسها يناقضه: ظل منصب القيادة المشتركة بين الأسلحة شاغرًا نحو عقدين، وأُقصي الضباط من المناصب المدنية بعد 1991، ولم يستولِ الجيش على السلطة في 2011 حين كان قادرًا على ذلك بوضوح، والفترة الوحيدة لسلطة عسكرية مركّزة استمرت ستة وعشرين شهرًا ولم تُجدَّد."
  description_ar_by: model-reviewed
  confidence: D
  basis: unsubstantiated
  attributed_to: Recurring claim in Tunisian public and social-media discourse
  review:
    by: adala
    date: "2026-09-02"
    method: judge
    note: >-
      Checked the three sources for what they actually support. Popular-discourse
      is the editorial placeholder for the circulating claim itself. Carnegie
      (2016-02-24, A Quiet Revolution) and Grewal/OUP (2023, Marginalizing the
      Military) both document the inverse: a deliberately small army, officers
      removed from civilian posts after 1991, the vacant tri-service post for
      roughly two decades, and the army not taking power in 2011. No source
      corroborates secret military governance; the description is read as a
      negative finding and the D grading is kept.
  sources:
    - popular-discourse
    - carnegie-quiet-revolution
    - oup-grewal-marginalizing
- id: rel-trabelsi-network-presidency-allegation
  from: trabelsi-network
  to: presidency
  type: allegation
  subtype: circulating claim
  description: "A claim that the Ben Ali-era clan still controls the Tunisian economy unchanged. The documented record complicates it severely: the network was dismantled, assets were confiscated, and the most prominent surviving business figure connected to the presidential family is serving prison sentences. What the evidence does support is the narrower and better-documented World Bank finding that rent-seeking mechanisms survived, which is a claim about structures rather than about persons."
  description_fr: "Une affirmation selon laquelle le clan de l'ère Ben Ali contrôle toujours l'économie tunisienne, inchangé. Le dossier documenté la complique sérieusement : le réseau a été démantelé, les avoirs confisqués, et la figure d'affaires survivante la plus en vue liée à la famille présidentielle purge des peines de prison. Ce que les preuves soutiennent, c'est le résultat plus étroit et mieux documenté de la Banque mondiale selon lequel les mécanismes de recherche de rente ont survécu, une affirmation sur les structures plutôt que sur les personnes."
  description_fr_by: model-reviewed
  description_ar: "ادعاء يقول إن عشيرة عهد بن علي ما تزال تتحكم في الاقتصاد التونسي دون تغيير. يعقّده السجل الموثق تعقيدًا شديدًا: فُككت الشبكة، وصودرت الأصول، وأبرز شخصية اقتصادية ناجية مرتبطة بالعائلة الرئاسية تقضي أحكامًا بالسجن. ما تدعمه الأدلة هو الاستنتاج الأضيق والأفضل توثيقًا للبنك الدولي بأن آليات الريع صمدت، وهو ادعاء حول البنى لا حول الأشخاص."
  description_ar_by: model-reviewed
  confidence: D
  basis: unsubstantiated
  attributed_to: Recurring claim in Tunisian public and social-media discourse
  sources:
    - popular-discourse
    - wb-political-economy
