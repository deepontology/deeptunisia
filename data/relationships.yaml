- id: rel-naoufel-saied-leila-jaffel-alliance
  from: naoufel-saied
  to: leila-jaffel
  type: political-alliance
  description: 'The Naoufel clan backs Justice Minister Leila Jaffel for prime minister. She is described as a "cornerstone" of the presidential apparatus: under her authority the judicial machinery was converted into an instrument pursuing opponents, journalists and recalcitrant magistrates. The clan values her ideological coherence, firmness toward the opposition, and personal loyalty to the president.'
  description_fr: "Le clan Naoufel soutient la ministre de la Justice Leila Jaffel pour le poste de Premier ministre. Elle est décrite comme une « pierre angulaire » de l'appareil présidentiel : sous son autorité, la machinerie judiciaire a été convertie en instrument poursuivant les opposants, les journalistes et les magistrats récalcitrants. Le clan valorise sa cohérence idéologique, sa fermeté envers l'opposition et sa loyauté personnelle au président."
  description_fr_by: model-reviewed
  description_ar: "يدعم جناح نوفل وزيرة العدل ليلى جفال لمنصب رئيس الحكومة. توصف بأنها «حجر الزاوية» في الجهاز الرئاسي: تحت سلطتها تحولت الآلة القضائية إلى أداة تلاحق المعارضين والصحفيين والقضاة غير المطاوعين. يقدر الجناح تماسكها الإيديولوجي وصلابتها تجاه المعارضة وولاءها الشخصي للرئيس."
  description_ar_by: model-reviewed
  confidence: C
  attributed_to: Mondafrigue investigation (August 2026), citing Tunisian political observers
  notes:
