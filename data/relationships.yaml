- id: rel-mebazaa-ghannouchi-succession-conflict
  from: fouad-mebazaa
  to: mohamed-ghannouchi
  type: political-conflict
  start: 2011-01-14
  end: 2011-01-15
  description: 'The 24-hour constitutional contest over the interim: on 14 January 2011 Ghannouchi announced on state television that he was taking over the presidency under article 56 of the 1959 constitution; lawyers publicly contested the claim (article 57), and on 15 January the Constitutional Council declared the vacancy and designated Mebazaa. Ghannouchi accepted the ruling and remained prime minister. The "three presidents in 24 hours" sequence is the first rupture of the post-Ben Ali order.'
  description_fr: "La contestation constitutionnelle de 24 heures autour de l'intérim : le 14 janvier 2011, Ghannouchi a annoncé à la télévision d'État qu'il prenait la présidence en vertu de l'article 56 de la constitution de 1959 ; des juristes ont publiquement contesté cette affirmation (article 57), et le 15 janvier le Conseil constitutionnel a déclaré la vacance et désigné Mebazaa. Ghannouchi a accepté la décision et est resté Premier ministre. La séquence des « trois présidents en 24 heures » est la première rupture de l'ordre post-Ben Ali."
  description_fr_by: model-reviewed
  description_ar: "الصراع الدستوري على مدى 24 ساعة حول الرئاسة المؤقتة: في 14 جانفي 2011 أعلن الغنوشي على التلفزة الرسمية توليه الرئاسة بمقتضى الفصل 56 من دستور 1959؛ وطعن القانونيون علنًا في هذا الادعاء (الفصل 57)، وفي 15 جانفي أعلن المجلس الدستوري شغور المنصب وعيّن المبزع. قبل الغنوشي القرار وبقي رئيسًا للحكومة. وتسلسل «الرؤساء الثلاثة في 24 ساعة» هو أول تصدع في النظام ما بعد بن علي."
