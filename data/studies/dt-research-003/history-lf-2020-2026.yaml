# Adopted state budgets 2020 to 2026, by mission, for the citizen budget study (dt-research-003).
#
# STATUS: adopted-lf. Every amount is read from tableau C ("Dépenses du budget de l'État,
# crédits de paiement") annexed to each year's finance law, as published in the Journal
# Officiel de la République Tunisienne (French translation). Each mission carries the
# printed JORT page. The tables are scanned images; each figure was read from the page
# image and every year's missions add up to the law's stated total to the dinar
# (checked by scripts/check-budget-figures.ts).
#
# These are the budgets as voted in December of the year before. They are not what was
# finally spent, and they do not include later supplementary finance laws. The 2020, 2022
# and 2023 entries were sourced in ticket 0022. 2018 was left out because its tableau C is
# organised by ministry chapter, includes debt principal, and has no programme split, so it
# cannot sit on the same bars honestly. 2015 was not sourced.
#
# Units: millions of dinars (MD), payment credits, nominal (not adjusted for inflation).
# programmes: the two programme lines the board uses to estimate subsidies (the energy
# programme of Industry, Mines and Energy and the domestic trade programme of Commerce),
# read from the same tables.

