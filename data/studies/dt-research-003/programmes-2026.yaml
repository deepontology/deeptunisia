# Programmes inside the adopted 2026 finance law, for the citizen budget study.
#
# STATUS: adopted-lf. Every amount is read from tableau C ("Dépenses du budget
# de l'État, crédits de paiement") of Loi n° 2025-17 du 12 décembre 2025, JORT
# n° 148 of 12 December 2025 (French translation), printed pages 3374 to 3376.
# The page images are kept under sources/. Each mission's programmes must add
# up to the mission total already in history-lf-2020-2026.yaml; the build check
# enforces it.
#
# These are the last adopted law's chapters. They are shown in the board's
# detail panel for context. They are not 2027 figures: the 2027 draft has one
# press-reported total per mission, not a programme split. Nothing here is used
# to split a 2027 board line.

