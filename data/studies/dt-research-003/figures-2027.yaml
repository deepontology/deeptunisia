# Draft 2027 state budget figures for the citizen budget study (dt-research-003).
#
# STATUS: draft-press. Every amount here is press-reported from ministers'
# hearings and budget coverage between 21 October and 9 November 2026. None has
# been read from the official document: the finance ministry site (checked
# 9 November 2026) holds 2024 to 2026 files only. Nothing here may be frozen
# into an instrument. The study freezes only on rows whose status is
# adopted-lf, with a page reference to the Journal Officiel text.
#
# Units: millions of dinars (MD), payment credits.
# Rows marked memo: true are inside another row and are NOT added to the total.
#
# The subsidy memo row (11,846 MD) is split into two derived rows so the board
# can ask about fuel and electricity separately from basic food. The 2027 split
# by type has not been reported. It is apportioned between the two lines that
# contain the memo (Industry, Mines and Energy; Trade and Export Development),
# in proportion to their 2027 draft totals. The two derived rows sum to the memo
# to the dinar. This is an inference, not a reported 2027 figure: the rows carry
# status draft-derived and the board says so on screen.
# Checked by: npx tsx scripts/check-budget-figures.ts

