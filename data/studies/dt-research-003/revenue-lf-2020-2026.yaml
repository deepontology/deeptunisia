# State revenue of the adopted budgets 2020 to 2026, for the citizen budget study (dt-research-003).
#
# STATUS: adopted-lf. Every figure is read from Article premier and Article 2 of each
# year's finance law, as printed in the Journal Officiel de la République Tunisienne
# (French translation for information). Each year carries the printed JORT page and a
# kept full-page PNG crop in sources/rev-<year>-p<page>.png, so the figure can be read
# on the page it came from. Every figure was read twice: once from the PDF text layer
# and once on the 150 dpi page image.
#
# The two ratios this file exists for, defined here once and repeated in words on the
# page and on the board:
#
#   tax per 100 raised  = tax_md / (tax_md + non_tax_md)
#     The denominator is what the state raises itself: tax receipts plus non-tax
#     receipts. Grants (dons) and borrowing are NOT counted, because they are not
#     raised by the state. This is the denominator of the "91 dinars in every 100
#     the state raises itself" hook.
#
#   spending covered by tax = tax_md / spending_md
#     The denominator is the payment credits opened by the same law (tableau C), the
#     same total the board's spending side uses. The rest is covered by non-tax
#     receipts, grants and borrowing.
#
# Identity checks, all to the thousand dinars:
#   tax_md + non_tax_md + grants_md = revenue_md
#   revenue_md - spending_md = -deficit_md
#   spending_md = the same year's total_md in history-lf-2020-2026.yaml
# Checked by: npx tsx scripts/check-budget-figures.ts
#
# Years NOT here, and why:
#   2018 and 2019: their finance laws use the pre-2020 presentation. Article premier
#     fixes one total split into Titre I, Titre II and the special treasury funds, with
#     expenses in Article 3; there is no tax / non-tax / grants split anywhere in the
#     law text. Titre II also carries loans, so it cannot stand in for non-tax revenue.
#     Their revenue cannot be put on the same two ratios without inventing a mapping.
#   2021: the 2021 budget was not voted as a finance law in the same series.
#
# Units: millions of dinars (MD), payment credits, nominal (not adjusted for inflation).

