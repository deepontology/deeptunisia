# -----------------------------------------------------------------------------
# LICENCES — time-bound rights between an operating company and a state body
# (spec §4.5)
#
# A licence is a clean "who owns what permission under which regime" edge: a
# spectrum, banking, mineral, media or import-export right granted by a state
# body to a holder, with a grant date, term and any fees.
#
# Records landed 2026-08-08 from data/contrib/licences-2026-08-08.yaml
# (roadmap P1 #8). Failure vocabulary preserved from that run:
#   - `grant` = convention signature or decision date (tier-1 anchored where
#     possible); the operating/launch date is recorded in the notes.
#   - The licence schema carries `grant` + `term {years}` but no end field, so
#     candidate `end` dates (~2024, ~2031, …) are folded into the notes.
#   - Terms marked "renewable" in the candidates are recorded in the notes
#     (the schema's term object carries only `years`).
#   - Fee figures are claims with attribution; attribution lives in the notes.
#   - The banking holders zitouna-bank and wifak-bank and the sovereign issuer
#     etat-tunisien are real, documented entities that the graph lacked; their
#     institution records were created 2026-08-08 with the same registered
#     sources, so no A-grade JORT-sourced licence was dropped.
# -----------------------------------------------------------------------------

