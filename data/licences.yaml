      (BCT) obtenu en janvier 2009 par Mohamed Sakhr El Materi; constitution
      publiée au JORT le 10-09-2009 (capital 30 M TND); démarrage officiel
      28-05-2010. Mise sous administration provisoire par la BCT le 19-01-2011
      (post-révolution); nationalisée de fait par le décret-loi du 14-03-2011;
      69,15 % cédés au groupe qatari Majda en 2018.
    - >-
      Agrément bancaire — durée indéterminée, soumis à supervision BCT. Pas de
      redevance d'agrément rapportée; capital initial 30 M TND (contexte).
      Holder « zitouna-bank » créé dans le graphe le 2026-08-08 (la banque est
      réelle et documentée; l'id était proposé par les candidats).
  notes_fr:
    - >-
      Première banque islamique tunisienne. Agrément des autorités monétaires (BCT) obtenu
      en janvier 2009 par Mohamed Sakhr El Materi ; constitution publiée au JORT le
      10-09-2009 (capital 30 M TND) ; démarrage officiel 28-05-2010. Mise sous
      administration provisoire par la BCT le 19-01-2011 (post-révolution) ; nationalisée de
