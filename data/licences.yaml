      juillet 2009 (cité dans le décret 2021-212, JORT — annexe non publiée). Lancement
      commercial d'Orange Tunisie le 5 mai 2010. Terme 15 ans INFÉRÉ (template des licences
      3G tunisiennes) -> échéance ~2024 ; avenants successifs (2014-37, 2017-65, 2018-350,
      2021-212) montrent une convention amendée, l'échéance exacte reste à confirmer.
    - >-
      Les conditions d'attribution ont été contestées après 2011 (accusations d'enveloppe
      détournée, 26 M EUR, Usine Nouvelle 14-03-2011) — non retenues ici, à traiter comme
      dispute si reprises.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      رخصة ثابتة+متنقلة 2G/3G مُنحت في 26 يونيو 2009 لتحالف Divona/Orange (فرنسا للاتصالات)
      مقابل 257.251 مليون دينار تونسي (137.647 مليون يورو) — تخصيص شامل (ثابت + متنقل
      2G/3G)؛ أوضح الوزير عمار في 2010 أن رخصة 3G وحدها كانت بقيمة 116 مليون دينار تونسي
      (نفس سعر رخصة اتصالات تونس)، لذلك يتواجد الرقمان معاً.
    - >-
