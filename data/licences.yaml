      Divona/Orange (France Télécom) pour 257,251 M TND (137,647 M EUR) —
      concession globale (fixe + mobile 2G/3G); le ministre Ammar a précisé en
      2010 que la licence 3G seule était chiffrée à 116 M TND (même prix que
      celle de Tunisie Telecom), les deux chiffres coexistent donc.
    - >-
      Convention conclue le 13 juillet 2009; approuvée par décret n° 2009-2270
      du 31 juillet 2009 (cité dans le décret 2021-212, JORT — annexe non
      publiée). Lancement commercial d'Orange Tunisie le 5 mai 2010. Terme
      15 ans INFÉRÉ (template des licences 3G tunisiennes) -> échéance ~2024;
      avenants successifs (2014-37, 2017-65, 2018-350, 2021-212) montrent une
      convention amendée, l'échéance exacte reste à confirmer.
    - >-
      Les conditions d'attribution ont été contestées après 2011 (accusations
      d'enveloppe détournée, 26 M EUR, Usine Nouvelle 14-03-2011) — non
      retenues ici, à traiter comme dispute si reprises.
  notes_fr:
    - >-
      Licence fixe+mobile 2G/3G adjugée le 26 juin 2009 au consortium Divona/Orange (France
      Télécom) pour 257,251 M TND (137,647 M EUR) — concession globale (fixe + mobile 2G/3G)
      ; le ministre Ammar a précisé en 2010 que la licence 3G seule était chiffrée à 116 M
      TND (même prix que celle de Tunisie Telecom), les deux chiffres coexistent donc.
    - >-
