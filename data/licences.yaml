      التونسية) -> الاستحقاق ~2024؛ الإضافات اللاحقة (2014-37، 2017-65، 2018-350، 2021-212)
      تظهر اتفاقية معدّلة، الاستحقاق الدقيق لا يزال قيد التأكيد.
    - >-
      طُعن في شروط المنح بعد 2011 (اتهامات تحويل مبلغ، 26 مليون يورو، مجلة Usine Nouvelle
