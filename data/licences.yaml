  notes_ar:
    - >-
      أول بنك إسلامي تونسي. حصل على موافقة السلطات النقدية (البنك المركزي التونسي) في يناير
      2009 من قبل محمد صخر الماظري؛ نُشر العقد التأسيسي في الجريدة الرسمية في 10-09-2009
      (رأس مال 30 مليون دينار تونسي)؛ بدأ رسمياً في 28-05-2010. وُضع تحت الإدارة المؤقتة من
