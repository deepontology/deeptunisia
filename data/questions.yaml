    حقيقة عن المنصب كما يشغله هو؟
  question_ar_by: model-reviewed
  kind: analytical
  status: partial
  relates_to: [kais-saied, presidency]
  notes: >-
    Every other president here reaches the office through a party — the
    Neo-Destour, the RCD, the CPR, Nidaa Tounes — and the coverage audit
    therefore flags the absence as missing coverage. The dataset's current answer
    is that the absence is real: he was elected in 2019 without a party, has
    never founded one, and governs through appointment rather than through an
    organisation. That is a finding, not a hole. It is filed as partial rather
    than answered because a party-shaped structure operating informally around
    the presidency would be very hard to see from published sources, and its
    absence here is not proof of its absence in fact.
  notes_fr: >-
    Chaque autre président de ce jeu de données accède à la fonction par un parti — le
    Néo-Destour, le RCD, le CPR, Nidaa Tounes — et l'audit de couverture signale donc
    l'absence comme une couverture manquante. La réponse actuelle du jeu de données est que
    cette absence est réelle : il a été élu en 2019 sans parti, n'en a jamais fondé, et
    gouverne par nomination plutôt que par organisation. C'est un résultat, pas un trou. Il
    est classé partiel plutôt que résolu parce qu'une structure de type parti opérant
    informellement autour de la présidence serait très difficile à voir depuis les sources
    publiées, et son absence ici ne prouve pas son absence dans les faits.
  notes_fr_by: model-reviewed
  notes_ar: >-
    كل رئيس آخر في هذه القاعدة البياناتية يصل إلى المنصب عبر حزب — الحزب الحر الدستوري
    الجديد، التجمع الدستوري الديمقراطي، المؤتمر من أجل الجمهورية، نداء تونس — ولذلك يشير
    تدقيق التغطية إلى هذا الغياب بوصفه تغطية ناقصة. الجواب الحالي لقاعدة البيانات هو أن هذا
    الغياب حقيقي: انتُخب في 2019 دون حزب، ولم يؤسس حزبًا قط، ويحكم عبر التعيين لا عبر
