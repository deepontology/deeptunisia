- id: q-wikipedia-tiering
  question: >-
    Is the source tiering honest? 194 of the 242 Wikipedia entries in this
    bibliography are graded tier 3 or tier 4 — "established international
    journalism" or "reputable regional media" — and 293 of 642 claims rest on
    nothing but Wikipedia.
  question_fr: >-
    Le classement des sources est-il honnête ? 194 des 242 entrées Wikipédia de cette
    bibliographie sont classées en niveau 3 ou 4 — « journalisme international établi » ou
    mieux.
  question_fr_by: model-reviewed
  question_ar: >-
    هل تصنيف المصادر أمين؟ 194 من أصل 242 مدخلًا من ويكيبيديا في هذه الببليوغرافيا مصنَّفة
    في المستوى الثالث أو الرابع — أي «صحافة دولية راسخة» أو أعلى.
  question_ar_by: model-reviewed
  kind: verification
  status: open
  relates_to: []
  notes: >-
    Tier is not decoration. It is the input to the one automated guard this
    project has against overstating its evidence: the build refuses to let the
    number of grade-A records backed by nothing better than tier 3 grow past a
    fixed ceiling. If an encyclopaedia entry is graded as journalism, that guard
    is measuring the wrong thing, and a claim can render as `documented` on the
    strength of a page anyone may edit. Records added in July 2026 grade
    Wikipedia at tier 5, which is what the tier table in sources.yaml describes;
    the older entries do not, and the two conventions now sit side by side in one
    file. Resolving it means re-grading roughly 194 sources and then absorbing
    whatever that does to the published documented share — which is precisely why
    it is filed as an open question rather than quietly corrected.
  notes_fr: >-
    Le tier n'est pas décoratif. Il alimente le seul garde-fou automatisé que ce projet
    oppose à la surestimation de ses preuves : la compilation refuse que le nombre de fiches
    de grade A appuyées par rien de mieux qu'un tier 3 dépasse un plafond fixe. Si une
    entrée encyclopédique est classée comme du journalisme, ce garde-fou mesure la mauvaise
    chose, et une affirmation peut s'afficher comme « documenté » sur la foi d'une page que
    n'importe qui peut modifier. Les fiches ajoutées en juillet 2026 classent Wikipédia en
    tier 5, ce que décrit le tableau des tiers dans sources.yaml ; les entrées plus
    anciennes ne le font pas, et les deux conventions coexistent désormais dans un seul
    fichier. Résoudre cela implique de reclasser environ 194 sources puis d'absorber ce que
    cela fait à la part « documentée » publiée — c'est précisément pourquoi c'est classé en
    question ouverte plutôt que corrigé silencieusement.
  notes_fr_by: model-reviewed
  notes_ar: >-
    التصنيف ليس زخرفًا. إنه مدخل الحارس الآلي الوحيد الذي تمتلكه هذه المنصة ضد المبالغة في
    إثباتها: يرفض البناء أن يتجاوز عدد السجلات من درجة A المدعومة بما لا يرقى عن تصنيف 3
    سقفًا ثابتًا. إذا صُنّف مدخل موسوعي بوصفه صحافة، فإن ذلك الحارس يقيس الشيء الخطأ، وقد
    يُعرض ادعاء بوصفه «موثقًا» اعتمادًا على صفحة يمكن لأي شخص تعديلها. السجلات المضافة في
    جويلية 2026 تصنّف ويكيبيديا في التصنيف 5، وهو ما يصفه جدول التصنيفات في sources.yaml؛
    السجلات الأقدم لا تفعل ذلك، وباتت العادتان متجاورتين في ملف واحد. حلّ المسألة يعني إعادة
    تصنيف نحو 194 مصدرًا ثم استيعاب أثر ذلك على الحصة «الموثّقة» المنشورة — وهذا هو بالضبط
    سبب تصنيفها كسؤال مفتوح بدل تصحيحها بصمت.
  notes_ar_by: model-reviewed

