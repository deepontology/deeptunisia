- id: q-saied-no-party
  question: >-
    Kais Saied is the only president in this dataset with no party edge of any
    kind. Is that a gap in the research, or a fact about the office as he holds it?
  question_fr: >-
    Kaïs Saïed est le seul président de ce jeu de données sans aucun lien partisan. Est-ce
    une lacune de la recherche, ou un fait sur la fonction telle qu'il l'exerce ?
  question_fr_by: model-reviewed
