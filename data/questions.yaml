- id: q-cofaf-succession
  kind: verification
  question: >-
    Is there a complete succession list for Chief of Staff of the Armed Forces from
    1987 to 2026, and can the lapse of the post after 1991 be confirmed from an
    official source rather than inferred from reporting?
  question_fr: >-
    Existe-t-il une liste complète des chefs d'état-major des armées de 1987 à 2026, et la
    vacance du poste après 1991 peut-elle être confirmée par une source officielle plutôt
    que déduite de la presse ?
  question_fr_by: model-reviewed
  question_ar: >-
    هل توجد قائمة كاملة بشاغلي منصب رئيس أركان الجيوش من 1987 إلى 2026، وهل يمكن تأكيد شغور
    المنصب بعد 1991 من مصدر رسمي لا استنتاجًا من التقارير الصحفية؟
  question_ar_by: model-reviewed
  status: partial
  relates_to: [chief-armed-forces, rachid-ammar, armed-forces]
  notes: >-
