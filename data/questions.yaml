  notes_ar_by: model-reviewed

- id: q-service-chief-dates
  kind: verification
  question: Exact appointment dates for all Land, Air and Naval service chiefs since 1987.
  question_fr: >-
    Dates exactes de nomination de tous les chefs d'état-major de l'armée de terre, de l'air
    et de la marine depuis 1987.
  question_fr_by: model-reviewed
  question_ar: >-
    التواريخ الدقيقة لتعيين جميع رؤساء أركان الجيش البري والجوي والبحري منذ 1987.
  question_ar_by: model-reviewed
  status: partial
  relates_to: [chief-land-forces, chief-air-force, chief-navy]
  notes: >-
    Land Army is reasonably documented from 2013. Air Force and Navy chronologies
    before 2020 rest largely on secondary sources and are graded C. JORT PDFs on
    legislation.tn could not be machine-read this run (image scans); the decree
    numbers and gazette references are cited as given in the Wikipedia footnotes —
    each is a tier-1 pointer awaiting human verification. Next step: OCR the three
    legislation.tn PDFs (Ja06585, Ja05489, Ja0692003) and the 4 July 2002 Air
    Force decree.
  notes_fr: >-
    L'armée de terre est raisonnablement documentée depuis 2013. Les chronologies de l'armée
    de l'air et de la marine avant 2020 reposent largement sur des sources secondaires et
    sont classées C. Les PDF du JORT sur legislation.tn n'ont pas pu être lus par machine lors
    de ce passage (scans image) ; les numéros de décrets et références de gazette sont cités
    tels que donnés dans les notes de bas de page de Wikipédia — chacun est un pointeur de
    niveau 1 attendant une vérification humaine. Étape suivante : OCRiser les trois PDF de
    legislation.tn (Ja06585, Ja05489, Ja0692003) et le décret du 4 juillet 2002 de l'armée de
    l'air.
  notes_fr_by: model-reviewed
  notes_ar: >-
    القوات البرية موثّقة بشكل معقول منذ 2013. أمّا التسلسلان الزمنيان للقوات الجوية والبحرية
    قبل 2020 فيعتمدان إلى حد كبير على مصادر ثانوية ومصنّفان بدرجة C. تعذّرت القراءة الآلية
    لملفات الرائد الرسمي على legislation.tn في هذه الجولة (مسح ضوئي للصور)؛ وأرقام الأوامر
    ومراجع الجريدة منقولة كما وردت في حواشي ويكيبيديا — كلٌّ منها مؤشر من المستوى 1 بانتظار
    تحقق بشري. الخطوة التالية: التعرف الضوئي على ملفات legislation.tn الثلاثة (Ja06585،
    Ja05489، Ja0692003) وعلى أمر 4 جويلية 2002 الخاص بالقوات الجوية.
  notes_ar_by: model-reviewed
  answer: >-
    The 1987-2026 service-chief sequences are now documented with named holders
    for most of the window; the remaining gaps are tenure boundaries, not entire
    posts. LAND ARMY (fr.wiki list): Abdelaziz Skik until 30 April 2002 (died in
    office, helicopter crash near Medjez el-Bab, Jeune Afrique 13 May 2002);
    Rachid Ammar 2002 - 9 July 2013 (start year-level 2002 per Europa/Routledge
    "The Middle East and North Africa 2007", p. 1076; fr.wiki dates the end
    9 July 2013 — the graph's end of 2013-06-25 is the retirement announcement,
    see flag qa-flag-ammar-end); Mohamed Salah Hamdi 9 July 2013 - 30 July 2014;
    Ismaïl Fathali 12 Aug 2014 - 1 June 2018; Mohamed El Ghoul 1 June 2018 -
    present. Holders between 1987 and 2002 (Boubaker Ben Kraïem, Abdelhamid
    Escheikh, Sadok Gmati, Mohamed Saïd El Kateb, Mohamed Hédi Ben Hassine) are
    listed by fr.wiki without dates. AIR FORCE (fr.wiki + ar.wiki lists):
    Abdelhamid El Fehri from 16 Sep 1985 (décret n° 1115/1985, JORT n° 65,
    p. 1201) to an unknown end; Mahmoud Ben Mohamed 4 July 2002 - 9 Feb 2008
    (JORT decree of 4 July 2002 per fr.wiki footnote); Taïeb Laâjimi 9 Feb 2008 -
    1 Sep 2012; Mohamed Néjib Jelassi 1 Sep 2012 - 22 Aug 2013; Béchir Bédoui
    22 Aug 2013 - 28 Aug 2015; Mohamed Foued El Aloui 28 Aug 2015 - 1 Aug 2017;
    Mohamed El Hajjam from 1 Aug 2017 (still in post). NAVY (ar.wiki list with
    JORT citations + fr.wiki): Mohamed Chadli Cherif from 1 Aug 1989 (décret
    n° 1070/1989, JORT n° 54, p. 1166) to an unknown end; Tarek Faouzi El Arbi
    from 2003 (décret n° 1818/2003, JORT n° 69, p. 2844) to an unknown end;
    Mohamed Khamassi to 1 Oct 2015; Abderraouf Atallah 1 Oct 2015 - 13 May 2020;
    Adel Jehane from 13 May 2020 (still in post, see q-jehane-status).
  answer_fr: >-
    Les séquences des chefs d'état-major 1987-2026 sont désormais documentées avec des
    titulaires nommés pour l'essentiel de la période ; les lacunes restantes sont des bornes
    de mandat, non des postes entiers. ARMÉE DE TERRE (liste fr.wiki) : Abdelaziz Skik jusqu'au
    30 avril 2002 (mort en fonction, crash d'hélicoptère près de Medjez el-Bab, Jeune Afrique
    13 mai 2002) ; Rachid Ammar 2002 - 9 juillet 2013 (début au niveau de l'année 2002 selon
    Europa/Routledge « The Middle East and North Africa 2007 », p. 1076 ; fr.wiki date la fin
    au 9 juillet 2013 — la fin 2013-06-25 du graphe est l'annonce de retraite, voir le drapeau
    qa-flag-ammar-end) ; Mohamed Salah Hamdi 9 juillet 2013 - 30 juillet 2014 ; Ismaïl Fathali
    12 août 2014 - 1er juin 2018 ; Mohamed El Ghoul 1er juin 2018 - présent. Les titulaires
    entre 1987 et 2002 (Boubaker Ben Kraïem, Abdelhamid Escheikh, Sadok Gmati, Mohamed Saïd El
    Kateb, Mohamed Hédi Ben Hassine) sont listés par fr.wiki sans dates. ARMÉE DE L'AIR
    (listes fr.wiki + ar.wiki) : Abdelhamid El Fehri depuis le 16 sept 1985 (décret n° 1115/1985,
    JORT n° 65, p. 1201) jusqu'à une fin inconnue ; Mahmoud Ben Mohamed 4 juillet 2002 -
    9 fév 2008 (décret JORT du 4 juillet 2002 selon la note fr.wiki) ; Taïeb Laâjimi 9 fév 2008 -
    1er sept 2012 ; Mohamed Néjib Jelassi 1er sept 2012 - 22 août 2013 ; Béchir Bédoui
    22 août 2013 - 28 août 2015 ; Mohamed Foued El Aloui 28 août 2015 - 1er août 2017 ; Mohamed
    El Hajjam depuis le 1er août 2017 (toujours en poste). MARINE (liste ar.wiki avec
    citations JORT + fr.wiki) : Mohamed Chadli Cherif depuis le 1er août 1989 (décret
    n° 1070/1989, JORT n° 54, p. 1166) jusqu'à une fin inconnue ; Tarek Faouzi El Arbi depuis
    2003 (décret n° 1818/2003, JORT n° 69, p. 2844) jusqu'à une fin inconnue ; Mohamed Khamassi
    jusqu'au 1er oct 2015 ; Abderraouf Atallah 1er oct 2015 - 13 mai 2020 ; Adel Jehane depuis
    le 13 mai 2020 (toujours en poste, voir q-jehane-status).
  answer_fr_by: model-reviewed
  answer_ar: >-
    أصبحت تسلسلات رؤساء أركان الفترة 1987-2026 موثّقة بأسماء شاغليها لمعظم النافذة؛ والثغرات
    المتبقية هي حدود ولايات لا مناصب كاملة. الجيش البري (قائمة ويكيبيديا الفرنسية): عبد
    العزيز سكيك حتى 30 أفريل 2002 (توفي في المنصب إثر سقوط مروحية قرب مجاز الباب، جون أفريك
    13 ماي 2002)؛ رشيد عمار 2002 - 9 جويلية 2013 (البداية على مستوى السنة 2002 حسب
    Europa/Routledge «The Middle East and North Africa 2007»، ص 1076؛ وتؤرخ ويكيبيديا
    الفرنسية النهاية في 9 جويلية 2013 — ونهاية 2013-06-25 في الرسم البياني هي إعلان التقاعد،
    انظر علم qa-flag-ammar-end)؛ محمد صالح الحامدي 9 جويلية 2013 - 30 جويلية 2014؛ إسماعيل
    الفتحلي 12 أوت 2014 - 1 جوان 2018؛ محمد الغول منذ 1 جوان 2018 - الآن. أما الشاغلون بين
    1987 و2002 (بوبكر بن كريّم، عبد الحميد الشيخ، الصادق قماطي، محمد سعيد الخطاب، محمد الهادي
    بن حسين) فتدرجهم ويكيبيديا الفرنسية دون تواريخ. القوات الجوية (قائمتا ويكيبيديا الفرنسية
    والعربية): عبد الحميد الفهري منذ 16 سبتمبر 1985 (أمر عدد 1115 لسنة 1985، الرائد الرسمي
    عدد 65، ص 1201) حتى نهاية مجهولة؛ محمود بن محمد 4 جويلية 2002 - 9 فيفري 2008 (أمر الرائد
    الرسمي الصادر في 4 جويلية 2002 حسب حاشية ويكيبيديا الفرنسية)؛ الطيب العجيلي 9 فيفري 2008 -
    1 سبتمبر 2012؛ محمد نجيب جلاصي 1 سبتمبر 2012 - 22 أوت 2013؛ بشير بدوي 22 أوت 2013 - 28 أوت
    2015؛ محمد فؤاد العلاوي 28 أوت 2015 - 1 أوت 2017؛ محمد الهاجم منذ 1 أوت 2017 (ما زال في
    المنصب). البحرية (قائمة ويكيبيديا العربية بحواشي الرائد الرسمي + الفرنسية): محمد الشاذلي
    الشريف منذ 1 أوت 1989 (أمر عدد 1070 لسنة 1989، الرائد الرسمي عدد 54، ص 1166) حتى نهاية
    مجهولة؛ طارق فوزي العربي منذ 2003 (أمر عدد 1818 لسنة 2003، الرائد الرسمي عدد 69، ص 2844)
    حتى نهاية مجهولة؛ محمد الخماسي حتى 1 أكتوبر 2015؛ عبد الرؤوف عطاء الله 1 أكتوبر 2015 -
    13 ماي 2020؛ عادل جهان منذ 13 ماي 2020 (ما زال في المنصب، انظر q-jehane-status).
  answer_ar_by: model-reviewed
  confidence: B
  basis: documented
  reasoning: >-
    The Land Army sequence from 2013 and the Air Force/Navy sequences from
    2002/1989 now rest on two encyclopedic lists that cite JORT decrees, plus
    dated reporting (Kapitalis 8 July 2013 and Jeune Afrique 13 May 2002 via
    the fr.wiki footnotes; Mosaïque FM; Business News). The graph's pre-2013
    Land and pre-2008 Air/pre-2010 Navy gaps are filled with named holders;
    only tenure boundaries (El Fehri end, Cherif end, El Arbi end, Khamassi
    start, the 1987-2002 Land holders) remain undated.
  falsifiable_by: >-
    The JORT issues cited (1985 n° 65 p. 1201; 1989 n° 54 p. 1166; 2003 n° 69
    p. 2844; the 4 July 2002 Air Force decree) — each PDF exists on
    legislation.tn but is an image scan; a human reading the decree text would
    confirm or move every boundary dated above.
  sources: [frwiki-land-chief-list, frwiki-air-chief-list, arwiki-air-chief-list, arwiki-navy-chief-list, frwiki-navy-chief-list, jort-1985-1115, jort-1989-1070, jort-2003-1818, tunisie-actualite-jehane-2020]

- id: q-jehane-status
  kind: verification
  question: What is Adel Jehane's current status, and can his appointment date be confirmed from a decree?
  question_fr: >-
    Quel est le statut actuel d'Adel Jehane, et sa date de nomination peut-elle être
    confirmée par un décret ?
  question_fr_by: model-reviewed
  question_ar: >-
    ما هو الوضع الحالي لعادل جيهان، وهل يمكن تأكيد تاريخ تعيينه من مرسوم؟
  question_ar_by: model-reviewed
  status: partial
  relates_to: [adel-jehane, chief-navy]
  notes: >-
    Rank-at-appointment wording: Jawhara FM says promoted from عميد (brigadier)
    to أمير لواء (rear admiral); the graph's people.yaml says "promoted from
    captain major" — likely a mistranslation of عميد; see flag
    qa-flag-jehane-rank. The decree number (12 May 2020) remains the top
    target for a tier-1 upgrade.
  notes_fr: >-
    Formulation du grade à la nomination : Jawhara FM dit promu de عميد (général de brigade)
    à أمير لواء (contre-amiral) ; le people.yaml du graphe dit « promu de capitaine-major » —
    probablement une mauvaise traduction de عميد ; voir le drapeau qa-flag-jehane-rank. Le
    numéro du décret (12 mai 2020) reste la cible prioritaire d'une mise à niveau de niveau 1.
  notes_fr_by: model-reviewed
  notes_ar: >-
    صياغة الرتبة عند التعيين: تقول جوهرة إف إم إنه رُقّي من عميد إلى أمير لواء؛ أما people.yaml
    في الرسم البياني فيقول «رُقّي من نقيب أول» — وهو على الأرجح ترجمة خاطئة لعميد؛ انظر علم
    qa-flag-jehane-rank. ويبقى رقم الأمر (12 ماي 2020) الهدف الأول لترقية إلى المستوى 1.
  notes_ar_by: model-reviewed
  answer: >-
    Appointment: Adel Jehane was appointed Navy chief of staff on 13 May 2020.
    Jawhara FM (13 May 2020) reports the ceremony: at Carthage Palace on
    Wednesday 13 May 2020, President Saied, as supreme commander, promoted
    him from navy brigadier to rear admiral (amiral de brigade) on the
    occasion of appointing him Navy chief of staff, with Defence Minister
    Imad Hazgui present. Mosaïque FM reported the same appointment the same
    day; fr.wiki's navy list dates the tenure from 13 May 2020. The JORT
    decree is dated 12 May 2020 per the graph's p-navy-atallah reasoning; the
    decree number was not located. Current status: still Navy chief of staff
    as of May 2026 — fr.wiki's navy list (edited 6 May 2026) still shows him
    as incumbent; no independent 2025-2026 press confirmation was located, and
    the graph's "verified:2025-12" end date carries no listed source (see flag
    qa-flag-jehane-verified). Career per Jawhara FM: head of the National
    Coast Guard service, director-general of the remote-sensing and
    cartography centre, commander of the Higher War School, then military
    attaché in France.
  answer_fr: >-
    Nomination : Adel Jehane a été nommé chef d'état-major de la Marine le 13 mai 2020.
    Jawhara FM (13 mai 2020) relate la cérémonie : au palais de Carthage, le mercredi 13 mai
    2020, le président Saïed, en tant que commandant suprême, l'a promu de brigadier de la
    marine à contre-amiral (amiral de brigade) à l'occasion de sa nomination comme chef
    d'état-major de la Marine, en présence du ministre de la Défense Imad Hazgui. Mosaïque FM
    a rapporté la même nomination le même jour ; la liste marine de fr.wiki date le mandat du
    13 mai 2020. Le décret JORT est daté du 12 mai 2020 selon le raisonnement de p-navy-atallah
    dans le graphe ; le numéro du décret n'a pas été localisé. Statut actuel : toujours chef
    d'état-major de la Marine en mai 2026 — la liste marine de fr.wiki (éditée le 6 mai 2026)
    le montre toujours en fonction ; aucune confirmation de presse indépendante 2025-2026 n'a
    été localisée, et la date de fin « verified:2025-12 » du graphe ne porte aucune source
    listée (voir le drapeau qa-flag-jehane-verified). Carrière selon Jawhara FM : chef du
    service de la Garde côtière nationale, directeur général du centre de télédétection et de
    cartographie, commandant de l'École supérieure de guerre, puis attaché militaire en
    France.
  answer_fr_by: model-reviewed
  answer_ar: >-
    التعيين: عُيّن عادل جهان رئيسًا لأركان البحرية في 13 ماي 2020. تروي جوهرة إف إم (13 ماي
    2020) الحفل: في قصر قرطاج، الأربعاء 13 ماي 2020، رقّاه الرئيس سعيّد بصفته القائد الأعلى
    من عميد بحري إلى أمير لواء بمناسبة تعيينه رئيسًا لأركان البحرية، بحضور وزير الدفاع عماد
    الحزقي. وروت موزاييك إف إم التعيين نفسه في اليوم نفسه؛ ويؤرخ سطر البحرية في ويكيبيديا
    الفرنسية الولاية من 13 ماي 2020. أما أمر الرائد الرسمي فمؤرخ في 12 ماي 2020 حسب استدلال
    p-navy-atallah في الرسم البياني؛ ولم يُعثر على رقم الأمر. الوضع الحالي: ما زال رئيسًا
    لأركان البحرية حتى ماي 2026 — لا يزال سطر البحرية في ويكيبيديا الفرنسية (المحرَّر في 6 ماي
    2026) يعرضه شاغلًا للمنصب؛ ولم يُعثر على أي تأكيد صحفي مستقل 2025-2026، وتاريخ النهاية
    «verified:2025-12» في الرسم البياني لا يحمل أي مصدر مُدرَج (انظر علم qa-flag-jehane-verified).
    المسار المهني حسب جوهرة إف إم: رئيس مصلحة الحرس البحري الوطني، ومدير عام لمركز الاستشعار
    عن بعد والخرائط، وقائدًا للمدرسة الحربية العليا، ثم ملحقًا عسكريًا في فرنسا.
  answer_ar_by: model-reviewed
  confidence: B
  basis: documented
  reasoning: >-
    The 13 May 2020 date is attested by two independent outlets plus the
    encyclopedic list; the ceremony account (Jawhara FM) quotes the event in
    detail. The current-status portion is weaker (single encyclopedic list)
    and is graded C within this B answer.
  falsifiable_by: >-
    The JORT decree of 12 May 2020 appointing him, or a 2025-2026 ministry
    communiqué naming a successor or confirming him — either would settle the
    decree date and the current status.
  sources: [jawharafm-jehane-2020, mosaique-jehane-2020, frwiki-navy-chief-list, tunisie-actualite-jehane-2020]

- id: q-dhif-status
  kind: verification
  question: >-
    What is Mohamed Habib Dhif's actual appointment date and current status, and does
    any public document establish the ANRSD's statute and powers?
  question_fr: >-
    Quelle est la date réelle de nomination de Mohamed Habib Dhif et son statut actuel, et
    un document public établit-il le statut et les pouvoirs de l'ANRSD ?
  question_fr_by: model-reviewed
  question_ar: >-
    ما هو تاريخ تعيين محمد الحبيب ضيف الفعلي ووضعه الحالي، وهل توجد وثيقة عمومية تُثبت
    النظام الأساسي للوكالة الوطنية للاستخبارات الأمنية والدفاعية وصلاحياتها؟
  question_ar_by: model-reviewed
  status: partial
  relates_to: [mohamed-habib-dhif, anrsd, salah-ben-abdessalem]
  notes: >-
    The strongest available sourcing is specialist subscription reporting. Nothing
    primary has been located. This is the single largest gap in the current security map.
    Open: the 2014-2017 succession between Ben Taous (DGMS to 2014?, per the
    graph's p-milsec-bentaous) and Rahmouni (first ANRSD director?, to 2017)
    is not documented. The ANRSD legal-texts page on legislation-securite.tn
    is the next stop (archived 2021-06-27); the live site requires
    interaction.
  notes_fr: >-
    La meilleure source disponible est une presse spécialisée payante. Aucun document
    primaire n'a été localisé. C'est la plus grande lacune de la carte sécuritaire actuelle.
    À ouvrir : la succession 2014-2017 entre Ben Taous (DGMS jusqu'en 2014 ?, selon le
    p-milsec-bentaous du graphe) et Rahmouni (premier directeur de l'ANRSD ?, jusqu'en 2017)
    n'est pas documentée. La page des textes légaux de l'ANRSD sur legislation-securite.tn est
    la prochaine étape (archivée le 2021-06-27) ; le site en direct exige une interaction.
  notes_fr_by: model-reviewed
  notes_ar: >-
    أقوى مصدر متاح هو الصحافة المتخصصة المدفوعة. لم يُعثر على أي مصدر أولي. هذه أكبر ثغرة في
    الخريطة الأمنية الحالية. مفتوح: التعاقب 2014-2017 بين بن تاوُس (الإدارة العامة للأمن
    العسكري حتى 2014؟، حسب p-milsec-bentaous في الرسم البياني) ورحموني (أول مدير للوكالة؟،
    حتى 2017) غير موثّق. صفحة النصوص القانونية للوكالة على legislation-securite.tn هي المحطة
    التالية (مؤرشفة 2021-06-27)؛ والموقع المباشر يتطلب تفاعلًا.
  notes_ar_by: model-reviewed
  answer: >-
    The ANRSD's statute IS publicly documented: the agency was created — from
    the former Direction Générale de la Sécurité Militaire (DGMS,
    الإدارة العامة للأمن العسكري) — by decree n° 2014-4208 of 20 November
    2014, approved at the Council of Ministers of 20 Nov 2014, as a public
    administrative institution under the President of the Republic (supreme
    commander) and the Ministry of National Defence (ar.wiki citing the DCAF
    legislation-securite.tn security-legislation database, archived June
