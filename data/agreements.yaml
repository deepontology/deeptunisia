- id: arab-maghreb-union-treaty
  title_en: Treaty instituting the Arab Maghreb Union
  title_fr: Traité instituant l'Union du Maghreb Arabe
  title_ar: معاهدة إنشاء اتحاد المغرب العربي
  kind: free-trade
  parties: [DZ, MA, LY, MR]
  signed: "1989-02-17"
  in_force: "1989-02-17"
  text_url: https://treaties.un.org/doc/Publication/UNTS/Volume%201546/volume-1546-I-26844-English.pdf
  summary: >-
    Concluded at Marrakesh by Tunisia, Algeria, Morocco, Libya and Mauritania, and
    registered with the United Nations as treaty I-26844. It committed the five to
    the free movement of goods, services and factors of production between them.
    The institution has been largely dormant since the 1990s, so the treaty is one
    of the clearest cases in this dataset of a document that remains in force while
    describing arrangements that do not operate.
  summary_fr: >-
    Conclu à Marrakech par la Tunisie, l'Algérie, le Maroc, la Libye et la Mauritanie, et
    enregistré auprès des Nations unies sous la référence I-26844. Il engageait les cinq
    États à la libre circulation des biens, des services et des facteurs de production entre
    eux. L'institution est largement en sommeil depuis les années 1990 ; ce traité est donc
    l'un des cas les plus nets de ce jeu de données d'un document qui reste en vigueur alors
    qu'il décrit des arrangements qui ne fonctionnent pas.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أُبرم في مراكش بين تونس والجزائر والمغرب وليبيا وموريتانيا، وسُجّل لدى الأمم المتحدة
    كمعاهدة رقم I-26844. ألزم الدول الخمس بالحرية في تنقل السلع والخدمات وعوامل الإنتاج فيما
    بينها. والمؤسسة في سبات شبه كامل منذ التسعينات، لذا تعدّ هذه المعاهدة من أوضح الحالات في
    هذه المجموعة: وثيقة تبقى نافذة فيما تصف ترتيبات لا تعمل.
  summary_ar_by: model-reviewed
  confidence: A
  basis: documented
  sources: [unts-maghreb-union]

- id: gafta
  title_en: Greater Arab Free Trade Area
  title_fr: Grande zone arabe de libre-échange
  title_ar: منطقة التجارة الحرة العربية الكبرى
  kind: free-trade
  parties: [arab-league]
  signed: "1997-02-19"
  in_force: "1998-01-01"
  text_url: https://rtais.wto.org/rtadocs/16/TOA/English/Pan-Arab%20Free%20Trade%20Area%20Agreement%20(1997).pdf
  summary: >-
    Established by resolution 1317 of the Arab League's Economic and Social Council
    on 19 February 1997 and in force from 1 January 1998, building on the earlier
    Agreement to Facilitate and Develop Trade Among Arab Countries. Tunisia was
    among the founding participants. Tariffs between members were phased out over a
    decade; non-tariff barriers, which are where most Arab intra-regional trade
    friction actually sits, were not.
  summary_fr: >-
    Établie par la résolution 1317 du Conseil économique et social de la Ligue arabe le 19
    février 1997 et en vigueur depuis le 1er janvier 1998, en prolongement de l'accord
    antérieur de facilitation et de développement des échanges commerciaux entre les pays
    arabes. La Tunisie figurait parmi les participants fondateurs. Les droits de douane
    entre membres ont été supprimés progressivement sur une décennie ; les barrières non
    tarifaires — là où se situe en réalité l'essentiel des frictions du commerce
    intra-régional arabe — ne l'ont pas été.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أُنشئت بموجب القرار 1317 الصادر عن المجلس الاقتصادي والاجتماعي لجامعة الدول العربية في
    19 فيفري 1997، ودخلت حيز النفاذ في 1 جانفي 1998، انطلاقًا من الاتفاقية السابقة لتيسير
    وتطوير التبادل التجاري بين الدول العربية. وكانت تونس من المشاركين المؤسسين. أُلغي
    التعريف الجمركي بين الأعضاء تدريجيًا على مدى عقد؛ أما الحواجز غير الجمركية — حيث يكمن
    فعليًا معظم الاحتكاك التجاري العربي البيني — فلم تُلغَ.
  summary_ar_by: model-reviewed
  confidence: B
  basis: documented
  sources: [wto-pafta-text]

- id: agadir-agreement
  title_en: Agadir Agreement
  title_fr: Accord d'Agadir
  title_ar: اتفاقية أغادير
  kind: free-trade
  parties: [EG, JO, MA]
  signed: "2004-02-25"
  in_force: "2006-07-06"
  text_url: https://wits.worldbank.org/GPTAD/PDF/archive/agadir.pdf
  summary: >-
    A free trade agreement between Tunisia, Egypt, Jordan and Morocco, signed at
    Rabat on 25 February 2004. Its practical significance is less the tariff
    schedule than the cumulation of origin it permits with the European Union: goods
    assembled from inputs of several Agadir members can qualify for EU preference in
    a way they could not bilaterally.
  summary_fr: >-
    Un accord de libre-échange entre la Tunisie, l'Égypte, la Jordanie et le Maroc, signé à
    Rabat le 25 février 2004. Son importance pratique tient moins au calendrier tarifaire
    qu'au cumul d'origine qu'il permet avec l'Union européenne : des marchandises assemblées
    à partir d'intrants de plusieurs membres d'Agadir peuvent bénéficier de la préférence
    européenne d'une manière qui serait impossible bilatéralement.
  summary_fr_by: model-reviewed
  summary_ar: >-
    اتفاق تجارة حرة بين تونس ومصر والأردن والمغرب، وُقّع في الرباط في 25 فيفري 2004. وتكمن
    أهميته العملية أقل في جدول التعريفات الجمركية وأكثر في تراكم المنشأ الذي يسمح به مع
    الاتحاد الأوروبي: فالسلع المجمّعة من مدخلات عدة دول من أغادير يمكن أن تستفيد من الأفضلية
    الأوروبية بما لا يمكن تحقيقه ثنائيًا.
  summary_ar_by: model-reviewed
  confidence: B
  basis: documented
  # The two dates below are both real and both cited as "entry into force"; the
  # record adopts the ratification date and keeps the other rather than choosing
  # silently between them.
  disputes:
    - claim: The agreement entered into force on 27 March 2007.
      held_by: Sources dating entry into force from the start of tariff dismantling
      source: wipo-agadir
      assessment: >-
        Both dates describe real events. Ratification requirements were completed on
        6 July 2006, and customs authorities were instructed to begin applying the
        preferences in March 2007. This record uses the ratification date, since that
        is when the treaty bound its parties, and notes the operational date here.
  sources: [wits-agadir-text, wipo-agadir]

- id: comesa-accession
  title_en: Tunisia's accession to COMESA
  title_fr: Adhésion de la Tunisie au COMESA
  title_ar: انضمام تونس إلى الكوميسا
  kind: accession
  parties: [comesa]
  in_force: "2018-07-19"
  summary: >-
    Tunisia was admitted to the Common Market for Eastern and Southern Africa as its
    twentieth member state at the summit held in Lusaka on 18 and 19 July 2018, and
    subsequently joined the COMESA free trade area. The accession is part of a
    broader post-2011 reorientation towards African markets, pursued while trade
    with the European Union remained several times larger.
  summary_fr: >-
    La Tunisie a été admise au Marché commun de l'Afrique orientale et australe comme
    vingtième État membre, lors du sommet tenu à Lusaka les 18 et 19 juillet 2018, puis a
    rejoint la zone de libre-échange du COMESA. Cette adhésion s'inscrit dans une
    réorientation plus large vers les marchés africains engagée après 2011, poursuivie alors
    que le commerce avec l'Union européenne restait plusieurs fois supérieur.
  summary_fr_by: model-reviewed
  summary_ar: >-
    قُبلت تونس في السوق المشتركة لشرق وجنوب أفريقيا (الكوميسا) كعضوها العشرين، في القمة التي
    انعقدت بلوساكا يومي 18 و19 جويلية 2018، ثم انضمت إلى منطقة التجارة الحرة للكوميسا. ويأتي
    هذا الانضمام في إطار إعادة توجيه أوسع نحو الأسواق الأفريقية بعد 2011، تواصلت في وقت ظلّ
    فيه التجارة مع الاتحاد الأوروبي أكبر بعدة مرات.
  summary_ar_by: model-reviewed
  confidence: B
  basis: reported
  attributed_to: COMESA and contemporary regional reporting
  sources: [comesa-tunisia-fta, eastafrican-tunisia-comesa]

- id: afcfta-ratification
  title_en: African Continental Free Trade Area
  title_fr: Zone de libre-échange continentale africaine
  title_ar: منطقة التجارة الحرة القارية الأفريقية
  kind: free-trade
  parties: [african-union]
  signed: "2018-03-21"
  in_force: "2020-11-02"
  summary: >-
    Tunisia signed the AfCFTA agreement at Kigali on 21 March 2018 with 43 other
    states, and deposited its instrument of ratification with the African Union
    Commission on 2 November 2020. The agreement itself had entered into force on
    30 May 2019, once twenty-four states had ratified; the date recorded here is the
    date it began to bind Tunisia.
  summary_fr: >-
    La Tunisie a signé l'accord de la ZLECAf à Kigali le 21 mars 2018 avec 43 autres États,
    et a déposé son instrument de ratification auprès de la Commission de l'Union africaine
    le 2 novembre 2020. L'accord lui-même était entré en vigueur le 30 mai 2019, une fois
    vingt-quatre États ratifiants ; la date consignée ici est celle à laquelle il a commencé
    à lier la Tunisie.
  summary_fr_by: model-reviewed
  summary_ar: >-
    وقّعت تونس اتفاقية منطقة التجارة الحرة القارية الأفريقية (AfCFTA) في كيغالي في 21 مارس
    2018 مع 43 دولة أخرى، وأودعت صك تصديقها لدى مفوضية الاتحاد الأفريقي في 2 نوفمبر 2020.
    وكانت الاتفاقية نفسها قد دخلت حيز النفاذ في 30 ماي 2019 بعد تصديق أربع وعشرين دولة؛
    والتاريخ المسجّل هنا هو التاريخ الذي بدأت فيه تُلزم تونس.
  summary_ar_by: model-reviewed
  confidence: B
  basis: reported
  attributed_to: tralac's ratification tracker and contemporary reporting
  disputes:
    - claim: Tunisia deposited its instrument of ratification on 27 November 2020.
      held_by: Diacron commentary and COMFWB; consistent with tralac's chronological ordering
      source: diacron-afcfta-tunisia
      assessment: >-
        A Diacron briefing and a COMESA Women in Business post both date Tunisia's
        deposit to 27 November 2020. Tralac's chronological list places Tunisia
        after Angola (4 November) and before Cameroon (1 December), consistent with
        that date. The UNECA press release dates it to 2 November 2020. The record
        retains 2 November per the ECA press release; the COMFWB post explicitly
        identifies 27 November as the date Tunisia became the 31st state party.
  sources: [tralac-afcfta-ratification, allafrica-tunisia-afcfta, diacron-afcfta-tunisia]

