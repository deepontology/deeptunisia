  text_url: https://wits.worldbank.org/GPTAD/PDF/archive/Turkey-Tunisia.pdf
  summary: Signed in Tunis on 25 November 2004 and in force from 1 July 2005, with
    a transitional period of up to nine years for the dismantling of tariffs in
    conformity with Article XXIV of GATT 1994 (implementation period recorded by
    the WTO as ending in 2014). It mirrored the EU association model Turkey
    applies on its Euro-Mediterranean flank, and has been the subject of a
    revision process since October 2022.
  summary_fr: Signé à Tunis le 25 novembre 2004 et en vigueur depuis le 1er
    juillet 2005, avec une période transitoire pouvant aller jusqu'à neuf ans
    pour le démantèlement tarifaire, conformément à l'article XXIV du GATT de
    1994 (période de mise en œuvre clôturée en 2014 selon l'OMC). Il transpose
    le modèle d'association de l'UE que la Turquie applique sur son flanc
    euro-méditerranéen et fait l'objet d'un processus de révision depuis octobre
    2022.
  summary_fr_by: machine
  summary_ar: وُقّعت في تونس في 25 نوفمبر 2004 ودخلت حيز النفاذ في 1 جويلية 2005،
