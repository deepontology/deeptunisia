- id: us-tunisia-defense-roadmap-2020
  title_en: U.S.–Tunisia Road Map for Defense Cooperation (2020)
  title_fr: Feuille de route États-Unis–Tunisie pour la coopération de défense (2020)
  title_ar: خارطة طريق التعاون الدفاعي بين تونس والولايات المتحدة (2020)
  kind: other
  parties:
    - US
  signed: 2020-09-30
  in_force: 2020-09-30
  text_url: https://www.war.gov/News/News-Stories/Article/Article/2368982/us-tunisia-sign-road-map-for-defense-cooperation/
  summary: Signed in Tunis on 30 September 2020 by U.S. Defense Secretary Mark
    Esper and Tunisian Defense Minister Brahim Bartagi (TAP describes it as a
    roadmap for military cooperation over 2020-2030). It is a political ten-year
    framework — shared priorities, capability gaps, interoperability — rather
    than a ratified treaty; the date recorded here is the date it became
    effective by signature. It built on Tunisia's 2015 designation as a Major
    Non-NATO Ally, which is itself a presidential designation, not an agreement.
  summary_fr: Signée à Tunis le 30 septembre 2020 par le secrétaire américain à la
    Défense Mark Esper et le ministre tunisien de la Défense Brahim Bartagi (la
    TAP la présente comme une feuille de route de coopération militaire sur
    2020-2030). C'est un cadre politique décennal — priorités partagées, lacunes
    capacitaires, interopérabilité — plutôt qu'un traité ratifié ; la date
    retenue est celle de sa prise d'effet par la signature. Elle s'appuie sur la
    désignation de la Tunisie en 2015 comme allié majeur non-membre de l'OTAN,
    désignation présidentielle, et non accord.
  summary_fr_by: machine
  summary_ar: وُقّعت في تونس في 30 سبتمبر 2020 من طرف وزير الدفاع الأمريكي مارك
    إسبر ووزير الدفاع التونسي إبراهيم البرتاجي (تقدّمها وكالة تونس إفريقيا
    للأنباء كخارطة طريق للتعاون العسكري على فترة 2020-2030). وهي إطار سياسي عشري
    — أولويات مشتركة وفجوات في القدرات وقابلية التشغيل البيني — وليست معاهدة
    مصدَّقًا عليها؛ والتاريخ المسجّل هنا هو تاريخ سريانها بالتوقيع. وهي تستند
    إلى تصنيف تونس سنة 2015 حليفًا رئيسيًا من خارج الناتو، وهو تصنيف رئاسي
    أمريكي وليس اتفاقًا.
  summary_ar_by: machine
