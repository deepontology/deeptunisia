    الرابعة والعشرين من اتفاقية GATT 1994 (أُغلقت فترة التنفيذ سنة 2014 حسب
    منظمة التجارة العالمية). وهي تنقل نموذج الشراكة مع الاتحاد الأوروبي الذي
    تطبّقه تركيا في محيطها الأورومتوسطي، وخضعت لمسار مراجعة منذ أكتوبر 2022.
