  text_url: https://edit.wti.org/document/show/c332ec11-c7df-44da-9f58-f7861fc29bc6
  summary: "One of the oldest investment treaties in the world: signed at Tunis on
    20 December 1963 by Oskar Schlitter for the Federal Republic of Germany and
    Ahmed Ben Salah for Tunisia, with a protocol and two exchanges of letters;
    instruments of ratification exchanged in Bonn, in force 6 February 1966.
    UNCTAD records it as still in force (checked 2026-08-16). Initial term ten
    years, then renewable indefinitely with one year's notice; a twenty-year
    sunset protects investments made before any termination."
  summary_fr: "L'un des plus anciens traités d'investissement du monde : signé à
    Tunis le 20 décembre 1963 par Oskar Schlitter pour la République fédérale
    d'Allemagne et Ahmed Ben Salah pour la Tunisie, avec protocole et deux
    échanges de lettres ; instruments de ratification échangés à Bonn, en
    vigueur le 6 février 1966. L'UNCTAD le recense toujours comme en vigueur
    (vérifié le 16 août 2026). Durée initiale de dix ans, ensuite reconductible
    indéfiniment avec un préavis d'un an ; une clause de survie de vingt ans
    protège les investissements réalisés avant toute dénonciation."
  summary_fr_by: machine
  summary_ar: "من أقدم معاهدات الاستثمار في العالم: وُقّعت في تونس في 20 ديسمبر
    1963 من طرف أوسكار شليتر عن جمهورية ألمانيا الاتحادية وأحمد بن صالح عن تونس،
    مع بروتوكول وتبادل رسالتين؛ تبادل صكوك التصديق في بون، ودخلت حيز النفاذ في 6
