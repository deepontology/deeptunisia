  summary: >-
    Signed in Geneva on 17 December 2004 between Tunisia and the four EFTA
    States — Iceland, Liechtenstein, Norway and Switzerland. The agreement
    entered into force on 1 June 2005 for Switzerland and Liechtenstein, on 1
    August 2005 for Norway and on 1 March 2006 for Iceland; the date recorded
    here is the first entry into force reported by the EFTA Secretariat. The
    EFTA Secretariat also records a 2024 Joint Committee update to rules of
    origin.
  summary_fr: >-
    Signé à Genève le 17 décembre 2004 entre la Tunisie et les quatre États de
    l'AELE — l'Islande, le Liechtenstein, la Norvège et la Suisse. L'accord est
    entré en vigueur le 1er juin 2005 pour la Suisse et le Liechtenstein, le 1er
    août 2005 pour la Norvège et le 1er mars 2006 pour l'Islande ; la date
    consignée ici est la première entrée en vigueur indiquée par le secrétariat
    de l'AELE. Le secrétariat de l'AELE recense également une mise à jour des
    règles d'origine par le comité mixte en 2024.
  summary_fr_by: machine
  summary_ar: >-
    وُقّعت في جنيف في 17 ديسمبر 2004 بين تونس والدول الأربع للرابطة الأوروبية
    للتجارة الحرة، وهي آيسلندا وليختنشتاين والنرويج وسويسرا. دخلت الاتفاقية حيز
    النفاذ في 1 جوان 2005 بالنسبة إلى سويسرا وليختنشتاين، وفي 1 أوت 2005
    بالنسبة إلى النرويج، وفي 1 مارس 2006 بالنسبة إلى آيسلندا؛ والتاريخ المسجّل
    هنا هو أول تاريخ لدخولها حيز النفاذ حسب أمانة الرابطة. كما تسجّل الأمانة
    تحديثًا لقواعد المنشأ اعتمدته اللجنة المشتركة سنة 2024.
  summary_ar_by: machine
  confidence: A
  basis: documented
  sources: [efta-tunisia-page, efta-tunisia-fta-text]

- id: eu-association-agreement
  title_en: EU–Tunisia Euro-Mediterranean Association Agreement
  title_fr: Accord d'association euro-méditerranéen UE–Tunisie
  title_ar: اتفاق الشراكة الأورومتوسطية بين تونس والاتحاد الأوروبي
  kind: association
  parties: [european-union]
  signed: "1995-07-17"
  in_force: "1998-03-01"
  text_url: https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A21998A0330%2801%29
  summary: >-
    The agreement that governs most of Tunisia's external trade. It established a
    free trade area in industrial goods, phased in over twelve years, while leaving
    agriculture largely outside — an asymmetry that has been the substance of every
    subsequent negotiation, including the stalled Deep and Comprehensive Free Trade
    Area talks. Signed at Brussels on 17 July 1995 and in force from 1 March 1998.
  summary_fr: >-
    L'accord qui régit l'essentiel du commerce extérieur de la Tunisie. Il a instauré une
    zone de libre-échange pour les produits industriels, déployée progressivement sur douze
    ans, tout en laissant l'agriculture largement en dehors — une asymétrie qui a constitué
    la substance de toutes les négociations ultérieures, y compris les pourparlers au point
    mort sur l'accord de libre-échange complet et approfondi (ALECA). Signé à Bruxelles le
    17 juillet 1995 et en vigueur depuis le 1er mars 1998.
  summary_fr_by: model-reviewed
  summary_ar: >-
    الاتفاق الذي يحكم معظم التجارة الخارجية لتونس. أقام منطقة تجارة حرة في السلع الصناعية،
    طُبّقت تدريجيًا على مدى اثني عشر عامًا، مع إبقاء الفلاحة خارجها إلى حد كبير — وهو تفاوت
    شكّل جوهر كل مفاوضات لاحقة، بما فيها محادثات اتفاقية التجارة الحرة العميقة والشاملة
    المتعثرة. وُقّع في بروكسل في 17 جويلية 1995 ودخل حيز النفاذ في 1 مارس 1998.
  summary_ar_by: model-reviewed
  confidence: A
  basis: documented
  disputes:
    - claim: The agreement entered into force on 30 March 1998.
      held_by: EC trade relations page
      source: ec-trade-tunisia
      assessment: >-
        The Commission's trade page dates entry into force at 30 March 1998; that
        is the OJ publication date (L 97). The record adopts 1 March 1998, which
        is the date the treaty entered into force per the agreement text.
  sources: [eurlex-tunisia-association, ec-trade-tunisia]

