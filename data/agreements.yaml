    la STEG construisent entre Partanna (Sicile) et Mlaabi (cap Bon). Ratifié
    par la Tunisie le 29 janvier 2020 et par l'Italie le 19 décembre 2021, il
    est entré en vigueur le 25 janvier 2022, selon le site officiel du projet
    Terna/STEG. L'interconnexion a reçu 307 millions d'euros du Mécanisme pour
    l'interconnexion en Europe et vise une mise en service vers 2028.
