    partie intégrante. Approbation autorisée en France par la loi n° 74-1080 du
    21 décembre 1974 ; notifications de ratification échangées le 11 mars 1975
    (la Tunisie ayant ratifié le 14 juin 1974) ; entrée en vigueur le 1er avril
    1975 ; publiée en France par le décret n° 75-1044 du 28 octobre 1975 (JO des
    12 et 13 novembre 1975). Modifiée par un échange de lettres des 29 mai et 24
    juin 1985. Toujours en vigueur sur la liste officielle française des
    conventions fiscales (30 juin 2024).
