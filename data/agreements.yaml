  title_fr: Accord entre la France et la Tunisie sur l'encouragement et la
    protection réciproques des investissements (1997)
  title_ar: الاتفاق بين تونس وفرنسا حول التشجيع والحماية المتبادلة للاستثمارات (1997)
  kind: investment
  parties:
    - FR
  signed: 1997-10-20
  in_force: 1999-09-10
  text_url: https://www.senat.fr/leg/pjl97-348.html
  summary: Signed in Paris on 20 October 1997 by Dominique Strauss-Kahn and
    Mohamed Ghannouchi, together with an interpretative exchange of letters. On
    entry into force (one month after the last notification, which UNCTAD dates
    10 September 1999) it annulled and replaced the earlier France–Tunisia
