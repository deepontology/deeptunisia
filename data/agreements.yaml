    tacitly renewable; ICSID arbitration for investor–state disputes. Published
    in France by décret n° 99-772 of 8 September 1999 (JORF n° 209, 9 September
    1999).
  summary_fr: Signé à Paris le 20 octobre 1997 par Dominique Strauss-Kahn et
    Mohamed Ghannouchi, assorti d'un échange de lettres interprétatif. À son
    entrée en vigueur (un mois après la dernière notification, que l'UNCTAD date
    du 10 septembre 1999), il a annulé et remplacé les conventions
    franco-tunisiennes antérieures du 9 août 1963 (relations économiques et
    protection des investissements) et du 30 juin 1972 (protection des
    investissements). Durée initiale de quinze ans, renouvelable par tacite
    reconduction ; arbitrage CIRDI pour les différends investisseur-État. Publié
    en France par le décret n° 99-772 du 8 septembre 1999 (JORF n° 209 du 9
    septembre 1999).
