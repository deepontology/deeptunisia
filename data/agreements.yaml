# -----------------------------------------------------------------------------
# AGREEMENTS — treaties and accessions binding Tunisia to other states
#
# WHY THESE ARE CLAIMS AND TRADE STATISTICS ARE NOT
#
# Everything in this file is the same kind of object as the rest of data/: a
# statement that something happened on a date, which an instrument records and a
# source can be cited for. So each record carries the full apparatus — basis,
# confidence, sources, disputes — and the build fails on a record without a source,
# exactly as it does for a position or a relationship.
#
# Bilateral trade quantities are not like that. They are measurements, produced in
# bulk, revised, and reported differently by each of the two countries involved.
# They will live in `flows/`, a sibling of this directory, for the same reason the
# news feed lives in `feed/`: so that nobody mistakes an ingested number for a
# graded claim.
#
# TUNISIA IS NEVER LISTED IN `parties`
#
# Every agreement here is one Tunisia is party to — that is the entire selection
# criterion. Naming it in each record would be one more chance to omit it and have
# an arc silently disappear.
#
# COVERAGE IS PARTIAL AND DELIBERATELY SO
#
# Twenty-three records, not the forty-plus Tunisia is actually party to. Each one
# below was written against a source retrieved and read at the time of writing; the
# rest are absent rather than guessed. Tunisia has 50-odd bilateral investment
# treaties and a dozen more trade agreements that belong here, and adding one means
# finding its instrument first. An empty row is a known gap; a plausible row with an
# invented citation is the failure this whole project exists to prevent.
#
# Coverage added 2026-08-16: the EFTA and Tunisia–Turkey FTAs, selected bilateral
# investment treaties, the France double-taxation convention, the ELMED support
# agreement, and two United States security instruments. The TransMed pipeline
# candidate remains in the outbox: its named counterparty is Eni, a company, while
# this ontology's `parties` field can represent only states or institutions. The
# JORT ratification field is still absent from the agreement schema; where a JORT
# instrument was part of the evidence, it remains in the source apparatus rather
# than being silently treated as a separate field.
# -----------------------------------------------------------------------------

