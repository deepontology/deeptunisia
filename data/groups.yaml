# Subsection definitions for the network view.
#
# Each layer gets an ordered list of subsections. A subsection defines a header
# (translatable) and a membership rule. Rules are evaluated in order; the first
# match wins. Any entity matching no rule falls into an auto-appended "Other"
# bucket, so nothing is ever dropped.
#
# Membership keys (any combination; entity matches if ANY rule matches):
#   role        — exact role id from roles.yaml (holds of that role)
#   role_prefix — role id starts with this string (e.g. "minister" catches
#                 agriculture-minister, finance-minister, …)
#   type        — institution.type match (string or array of strings)
#   members     — explicit list of person/institution ids

- layer: security
  subsections:
    - header_en: Armed Forces
      header_fr: Forces armées
      header_ar: القوات المسلحة
      membership:
        type: military

    - header_en: Defence Ministry
      header_fr: Ministère de la Défense
      header_ar: وزارة الدفاع
      membership:
        role: defence-minister
        members: [ministry-defence]

    - header_en: Interior Ministry
      header_fr: Ministère de l'Intérieur
      header_ar: وزارة الداخلية
      membership:
        role: interior-minister
        members: [ministry-interior]

    - header_en: Police & Gendarmerie
      header_fr: Police et gendarmerie
      header_ar: الشرطة والدرك
      membership:
        type: [police, gendarmerie, association]
        role: [ng-commander, usgn-commander, dg-public-security, dg-national-security]
        members: [unsfst, snfsi]

    - header_en: Intelligence
      header_fr: Renseignement
      header_ar: الاستخبارات
      membership:
        type: intelligence
        role: [national-security-adviser, national-security-director]
        members: [national-security-council, presidential-security-adviser]

    - header_en: Presidential Security
      header_fr: Sécurité présidentielle
      header_ar: الحماية الرئاسية
      membership:
        type: presidential-security
        role: [presidential-security-chief, dg-presidential-security]

