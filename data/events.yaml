- id: election-locales-2023
  date: "2023-12-24"
  date_end: "2024-02-04"
  title_en: First local-council elections under the 2022 constitution
  title_fr: >-
    Premières élections des conseils locaux sous la Constitution de 2022
  title_ar: أول انتخابات المجالس المحلية في ظل دستور 2022
  category: election
  summary: >-
    Tunisia's first local-council elections elected 279 local councils in two
    rounds (24/12/2023 and 04/02/2024) under ISIE supervision; 2,129 members
    were elected, all independents. Presidential decree n° 2023-590 of
    21/09/2023 set the framework: 5 regions, 24 regional councils and 279
    local councils. The elections replaced the per-delegation local
    development councils of loi n° 94-87 du 26/07/1994 under the regime of
    décret n° 2023-10 du 08/03/2023, and they are the electoral base that
    feeds the second chamber (CNRD).
  summary_fr: >-
    Les premières élections des conseils locaux de Tunisie ont élu 279 conseils
    locaux en deux tours (24/12/2023 et 04/02/2024) sous la supervision de
    l'ISIE ; 2 129 membres ont été élus, tous indépendants. Le décret
    présidentiel n° 2023-590 du 21/09/2023 a fixé le cadre : 5 régions, 24
    conseils régionaux et 279 conseils locaux. Les élections remplacent les
    conseils locaux de développement par délégation de la loi n° 94-87 du
    26/07/1994 sous le régime du décret n° 2023-10 du 08/03/2023, et elles sont
    la base électorale qui alimente la seconde chambre (CNRD).
  summary_fr_by: model-reviewed
  summary_ar: >-
    انتخبت أول انتخابات المجالس المحلية في تونس 279 مجلسًا محليًا في دورتين
    (24/12/2023 و04/02/2024) تحت إشراف الهيئة العليا المستقلة للانتخابات؛
    وانتُخب 2129 عضوًا، جميعهم مستقلون. وحدد الأمر الرئاسي عدد 2023-590
    المؤرخ في 21/09/2023 الإطار: 5 أقاليم و24 مجلسًا جهويًا و279 مجلسًا محليًا.
    وحلت الانتخابات محل مجالس التنمية المحلية بالمعتمديات المنصوص عليها في
    القانون عدد 94-87 المؤرخ في 26/07/1994 في ظل نظام الأمر عدد 2023-10
    المؤرخ في 08/03/2023، وهي القاعدة الانتخابية التي تغذي الغرفة الثانية
    (المجلس الوطني للجهات والأقاليم).
  summary_ar_by: model-reviewed
  institutions: [isie, cnrd]
  confidence: C
  verification: needs-primary-source
  attributed_to: >-
    Arabic and French Wikipedia (élections locales tunisiennes de 2023-2024;
    conseil local de développement), which cite ISIE results and presidential
    decree 2023-590
  reasoning: >-
    The graph's isie-decree-2022 event already notes the ISIE certified "the
    local elections that seated the second chamber", and the cnrd institution
    record says its members are sent by regional and district councils — but
    no event records the elections themselves. The two flagged Wikipedia
    articles document the dates, the 279-council count, the 2,129 members and
    the 2023-590 framework; the two conseil-local articles document the legal
    framework change (loi 94-87 -> décret 2023-10). All four flagged sources
    resolve to this single warranted event.
  falsifiable_by: >-
    ISIE's official results bulletin or the JORT text of decree 2023-590
    showing different dates or a different council count.
