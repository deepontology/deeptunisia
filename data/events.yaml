- id: belaid-assassinated
  date: "2013-02-06"
  title_en: Chokri Belaid is assassinated
  title_fr: Assassinat de Chokri Belaïd
  title_ar: اغتيال شكري بلعيد
  category: political
  rupture: true
  summary: >-
    The founder of the Popular Front was shot dead outside his home in El Menzah.
    It was the first political assassination in independent Tunisia's post-1956
    history, it collapsed the Jebali government within days, and it began the
    crisis that produced the national dialogue. Eleven years later a court
    sentenced four defendants to death and two to life; proceedings against those
    accused of ordering it were still running in 2025.
  summary_fr: >-
    Le fondateur du Front populaire est abattu devant son domicile à El Menzah. C'est le
    premier assassinat politique de l'histoire de la Tunisie indépendante post-1956 ; il
    fait tomber le gouvernement Jebali en quelques jours et ouvre la crise qui produira le
    dialogue national. Onze ans plus tard, un tribunal condamne quatre accusés à mort et
    deux à la prison à vie ; les procédures contre les auteurs présumés de l'ordre se
    poursuivent encore en 2025.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يُغتال مؤسس الجبهة الشعبية بالرصاص أمام منزله بالمنزه. كان أول اغتيال سياسي في تاريخ
    تونس المستقلة بعد 1956، وأسقط حكومة الجبالي في غضون أيام، وفتح الأزمة التي أفضت إلى
    الحوار الوطني. بعد إحدى عشرة سنة، حكمت محكمة على أربعة متهمين بالإعدام وعلى اثنين بالسجن
    المؤبد؛ وكانت الإجراءات ضد المتهمين بالأمر ما تزال جارية في 2025.
  summary_ar_by: model-reviewed
  actors: [chokri-belaid, hamadi-jebali]
  institutions: [popular-front, ennahda, judiciary]
  location: [gov-tunis]
  confidence: B
  consequences: [national-dialogue-quartet-formed, belaid-verdict-2024]
