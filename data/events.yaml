    - framing: Accountability for genuine corruption
      held_by: The state's case
      source: reuters-mabrouk-chahed-2026
    - framing: Selective justice directed at political and economic rivals
      held_by: Critics of the prosecutions and international rights organisations
      source: hrw-tunisia-2026
  disputes:
    - claim: >-
        The event's place is attached as gov-tunis (economic-financial
        judicial pole), inferred rather than documented: the Mabrouk
        corruption and asset-unfreezing proceedings ran at the economic-
        financial judicial pole of the Tunis Court of First Instance, but the
        held sources report the verdicts from Tunis without naming the
        chamber in their excerpts.
      held_by: The event-locations research pass (2026-08-11)
      source: occrp-mabrouk-2026
      assessment: >-
        The verdicts of 3 March 2026 were reported from Tunis. Falsifiable by
        a court record showing the verdicts were handed outside Tunis.
      status: open
    - claim: "Mabrouk was sentenced to 20 years"
      held_by: Reuters and OCCRP, 3-4 March 2026
      source: occrp-mabrouk-2026
      assessment: >-
        Adopted for the corruption and embezzlement proceedings.
    - claim: "Mabrouk was sentenced to 14 years"
      held_by: Tunis Afrique Presse, 3 March 2026, and confirmed on appeal 3 July 2026
      source: tap-mabrouk-appeal-2026
      assessment: >-
        Also adopted, because it refers to a separate money-laundering case rather than
        contradicting the figure above. The two are routinely conflated in coverage.
    - claim: "Mabrouk was sentenced to four years"
      held_by: La Presse de Tunisie, 17 April 2026
      source: lapresse-mabrouk-4y-2026
      assessment: >-
        Not reconciled. It may describe a third proceeding, a revised term, or an error.
        At least five different sentence lengths circulated across outlets for overlapping
        proceedings in 2026, and the dataset does not claim to know how many distinct cases
        there were. This is recorded as an open contradiction rather than resolved by
        picking the most-cited figure.
    - claim: "Not all defendants in the asset-unfreezing case were convicted"
      held_by: Business News, 3 July 2026, reporting an acquittal on appeal
      source: businessnews-bengharbia-2026
      assessment: >-
        Adopted as a qualification. The proceedings did not run uniformly against every
        defendant, which cuts against reading the case as purely political.
  sources: [reuters-mabrouk-chahed-2026, occrp-mabrouk-2026, tap-mabrouk-14y, ansa-mabrouk-2026]

