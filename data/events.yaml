- id: water-crisis-july-2026-record
  date: "2026-08-09"
  title_en: "Record water-distribution failure signals in July 2026: 608 reported cases"
  title_fr: "Record des signalements de coupures d'eau en juillet 2026 : 608 cas"
  title_ar: "رقم قياسي في بلاغات انقطاع الماء خلال جويلية 2026: 608 بلاغًا"
  category: economic
  summary: >-
    The Tunisian Water Observatory (OTE) reports 608 water-distribution
    signals for July 2026 — the heaviest monthly total since the start of the
    year — of which 549 concern unannounced cuts and distribution failures in
    drinking-water supply. The coastal zones and tourist regions concentrate
    the reports (Nabeul 65, Monastir 62, Mahdia 51, Sousse 49, Sfax 42,
    Médenine 41). Water-related protest movements rose from 23 in June to 34
    in July (+48%), which the Observatory calls "alarming", plus 13 leak cases
    and 12 water-quality reports. The OTE demands urgent intervention and
    rebalancing of national water distribution. SONEDE is the responsible
    public operator; the OTE itself is not yet an institution in the graph.
  summary_fr: >-
    L'Observatoire tunisien de l'eau (OTE) fait état de 608 signalements liés
    à la distribution d'eau pour juillet 2026 — le total mensuel le plus lourd
    depuis le début de l'année — dont 549 concernent des coupures non
    programmées et des défaillances de distribution dans l'approvisionnement en
    eau potable. Les zones côtières et les régions touristiques concentrent les
    signalements (Nabeul 65, Monastir 62, Mahdia 51, Sousse 49, Sfax 42,
    Médenine 41). Les mouvements de protestation liés à l'eau sont passés de 23
    en juin à 34 en juillet (+48 %), ce que l'Observatoire qualifie
    d'« alarmant », auxquels s'ajoutent 13 cas de fuites et 12 signalements de
    qualité de l'eau. L'OTE exige une intervention urgente et un rééquilibrage
    de la distribution nationale de l'eau. La SONEDE est l'opérateur public
    responsable ; l'OTE lui-même n'est pas encore une institution du graphe.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يُعلن المرصد التونسي للمياه عن 608 بلاغات مرتبطة بتوزيع الماء خلال جويلية
    2026 — وهو أثقل إجمالي شهري منذ بداية السنة — منها 549 بلاغًا تتعلق
    بانقطاعات غير مبرمجة وأعطال في التوزيع ضمن تزويد الماء الصالح للشرب.
    تركّزت البلاغات في المناطق الساحلية والجهات السياحية (نابل 65، المنستير
    62، المهدية 51، سوسة 49، صفاقس 42، مدنين 41). وارتفعت الحركات الاحتجاجية
    المرتبطة بالماء من 23 في جوان إلى 34 في جويلية (+48%)، وهو ما وصفه المرصد
