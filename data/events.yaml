- id: joint-chief-revived
  date: "2011-04-12"
  title_en: The Armed Forces Chief of Staff post is revived for Rachid Ammar
  title_fr: >-
    Le poste de chef d'état-major des armées rétabli pour Rachid Ammar
  title_ar: >-
    إحياء منصب رئيس هيئة أركان القوات المسلحة لفائدة رشيد عمار
  category: military
  summary: >-
    The tri-service post, unfilled since Ben Ali's turn against the army, is revived
    and given to the Land Army chief, who keeps both. Contemporary reporting stated the
    position had not existed before him. It concentrated more military authority in one
    officer than at any point since independence, and it was not maintained after his
    retirement.
  summary_fr: >-
    Le poste interarmes, vacant depuis le retournement de Ben Ali contre l'armée, est
    rétabli et confié au chef de l'armée de terre, qui cumule les deux fonctions. La presse
    contemporaine affirmait que le poste n'avait jamais existé avant lui. Il a concentré
    plus d'autorité militaire dans un seul officier qu'à tout autre moment depuis
    l'indépendance, et n'a pas été maintenu après son départ à la retraite.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يُعاد إحياء المنصب المشترك بين الأسلحة، الذي ظل شاغرًا منذ انقلاب بن علي على الجيش،
    ويُسند إلى قائد القوات البرية الذي جمع بين المنصبين. كانت الصحافة المعاصرة تؤكد أن
    المنصب لم يكن قائمًا قبله. ركّز سلطة عسكرية في ضابط واحد أكبر من أي وقت مضى منذ
    الاستقلال، ولم يُحافظ عليه بعد تقاعده.
  summary_ar_by: model-reviewed
  actors: [rachid-ammar]
  institutions: [armed-forces, land-forces]
  confidence: A
  causes: [revolution-2011]
  sources: [leaders-ammar-2011, babnet-joint-chief, carnegie-quiet-revolution]

