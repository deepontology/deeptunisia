    to remove the Administrative Court's power to review ISIE decisions,
    transferring its election powers to the Court of Appeal of Tunis — a response to
    the Court's order reinstating three excluded candidates. The ISIE, whose members
    are appointed by the president, had already refused to reinstate Zenaidi, Mekki
    and Daïmi.
