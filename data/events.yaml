- id: independence
  date: "1956-03-20"
  title_en: Independence from France
  title_fr: Indépendance
  title_ar: الاستقلال
  category: political
  rupture: true
  summary: >-
    Tunisia becomes independent. The state that follows is built around a mass party
    and a deliberately small army.
  summary_fr: >-
    La Tunisie accède à l'indépendance. L'État qui suit est construit autour d'un parti de
    masse et d'une armée délibérément réduite.
  summary_fr_by: model-reviewed
  summary_ar: >-
    تحصل تونس على استقلالها. الدولة التي تلي ذلك تُبنى حول حزب جماهيري وجيش مُصغَّر عن قصد.
  summary_ar_by: model-reviewed
  actors: [bourguiba]
  institutions: [neo-destour]
  location: [gov-tunis]
  confidence: A
  causes: []
  consequences: [army-founded, republic-declared]
  disputes:
    - claim: >-
        The event's place is Tunis (gov-tunis), inferred rather than documented.
      held_by: >-
        English Wikipedia, "Tunisian independence" — lead image caption "Tunis on
        20 March 1956, the day of independence"; the new state was then constituted
        in Tunis (Constituent Assembly elections 25 March 1956).
      source: enwiki-tunisian-independence
      assessment: >-
        Inferred, grade C: the Franco-Tunisian protocol of 20 March 1956 was signed
        by Tahar Ben Ammar and Christian Pineau at the end of negotiations conducted
        in Paris (frwiki-tahar-ben-ammar), so strictly the signing act occurred
        outside Tunisia. The Tunis attachment rests on the commemoration and the
        seat of the new state. Falsifiable by the original protocol's signature
        page or any authoritative record of the signing venue; or an account
        locating the 20 March 1956 commemoration outside Tunis.
      status: open
  sources: [carnegie-quiet-revolution, enwiki-tunisian-independence, frwiki-tahar-ben-ammar]

