    Le décret 2017-70 fixe l'architecture officielle de la prise de décision sécuritaire
    tunisienne : un conseil présidé par le président, avec les chefs du gouvernement et du
    Parlement, les ministres de la Justice, de la Défense, de l'Intérieur, des Affaires
    étrangères et des Finances, et le chef du Centre national du renseignement, plus des
    comités permanents pour le renseignement, la défense et la sécurité civile. C'est le
    document public le plus utile pour cartographier le fonctionnement prévu du système.
