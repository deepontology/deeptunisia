    الانتخابية إلى محكمة الاستئناف بتونس — ردًا على أمر المحكمة بإعادة ثلاثة مرشحين
    مستبعدين. كانت الهيئة، التي يعيّن رئيس الجمهورية أعضاءها، قد رفضت بالفعل إعادة الزنيدي
