  category: legal
  rupture: true
  summary: >-
    Marouane Mabrouk sentenced to 20 years on charges including money laundering,
    embezzlement and receiving unlawful benefits. In a separate case concerning the
    unfreezing of his assets in Europe, former prime minister Youssef Chahed and other
    former ministers were sentenced in absentia to six years. A distinct 14-year
    money-laundering sentence against Mabrouk was upheld on appeal in July 2026. Both
    the Ben Ali-connected economic elite and the post-2011 political elite are now
    being dismantled by the same state.
  summary_fr: >-
    Marouane Mabrouk condamné à 20 ans pour des chefs d'accusation incluant blanchiment
    d'argent, détournement et octroi d'avantages illégitimes. Dans une affaire distincte
    concernant le dégel de ses avoirs en Europe, l'ancien Premier ministre Youssef Chahed et
    d'autres anciens ministres ont été condamnés par contumace à six ans. Une condamnation
    distincte de 14 ans pour blanchiment contre Mabrouk a été confirmée en appel en juillet
    2026. L'élite économique liée à Ben Ali et l'élite politique post-2011 sont désormais
    démantelées par le même État.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يُحكم على مروان المبروك بعشرين عامًا بتهم من بينها غسل الأموال والاختلاس وتلقّي منافع
    غير مشروعة. وفي قضية منفصلة تتعلق بفك تجميد أصوله في أوروبا، حُكم غيابيًا على رئيس
    الوزراء السابق يوسف الشاهد ووزراء سابقين آخرين بست سنوات. وأُيّد في الاستئناف في جويلية
    2026 حكم منفصل بالسجن 14 عامًا ضد المبروك بتهمة غسل الأموال. النخبة الاقتصادية المرتبطة
    ببن علي والنخبة السياسية ما بعد 2011 يجري اليوم تفكيكهما من قبل الدولة نفسها.
  summary_ar_by: model-reviewed
  actors: [marouane-mabrouk, youssef-chahed]
  institutions: [judiciary, mabrouk-group]
  location: [gov-tunis]
  confidence: A
  causes: [mabrouk-detained]
  consequences: [mabrouk-appeal-2026]
