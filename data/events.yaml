- id: ammar-retires
  date: "2013-06-25"
  title_en: Rachid Ammar retires and the joint command lapses
  title_fr: >-
    Rachid Ammar prend sa retraite et le poste interarmes disparaît
  title_ar: >-
    تقاعد رشيد عمار وزوال المنصب المشترك بين الأسلحة
  category: military
  rupture: true
  summary: >-
    He announced his retirement saying he had reached retirement age years earlier and
    had repeatedly been kept in service. His successor took the Land Army only; the
    tri-service post disappeared from the public structure, ending the brief period of
    concentrated military authority.
