    Neuf jours avant l'élection présidentielle, le Parlement modifie la loi électorale pour
    retirer au Tribunal administratif le pouvoir d'examiner les décisions de l'ISIE,
    transférant ses compétences électorales à la cour d'appel de Tunis — une réponse à
    l'ordre du Tribunal de rétablir trois candidats exclus. L'ISIE, dont les membres sont
    nommés par le président, avait déjà refusé de rétablir Zenaidi, Mekki et Daïmi.
  summary_fr_by: model-reviewed
  summary_ar: >-
