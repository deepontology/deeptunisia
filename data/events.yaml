  title_ar: >-
    إحداث مجلس الأمن القومي رسميًا
  category: security
  summary: >-
    Decree 2017-70 sets out the official architecture of Tunisian security
    decision-making: a council chaired by the president, with the heads of government
    and parliament, the justice, defence, interior, foreign and finance ministers, and
    the head of the National Intelligence Centre, plus permanent committees for
    intelligence, defence and civil security. It is the single most useful public
    document for mapping how the system is meant to work.
