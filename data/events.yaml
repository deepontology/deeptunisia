- id: wb-capture-2010
  date: "2010-12-31"
  title_en: The measured scale of state capture
  title_fr: >-
    L'ampleur mesurée de la captation de l'État
  title_ar: >-
    الحجم المُقاس للاستيلاء على الدولة
  category: economic
  summary: >-
    World Bank research later established that firms confiscated from the presidential
    clan accounted for a very small share of private-sector employment while capturing
    roughly a fifth of all private-sector profits, concentrated in sectors shielded
    from competition by regulation. This is the best-documented economic fact in the
    dataset.
  summary_fr: >-
    Des recherches de la Banque mondiale établiront plus tard que les entreprises
    confisquées au clan présidentiel représentaient une part très faible de l'emploi privé
    tout en captant environ un cinquième des profits du secteur privé, concentrées dans des
    secteurs protégés de la concurrence par la réglementation. C'est le fait économique le
    mieux documenté du jeu de données.
  summary_fr_by: model-reviewed
  summary_ar: >-
    أثبتت أبحاث البنك الدولي لاحقًا أن الشركات المصادَرة من العشيرة الرئاسية لم تكن تمثل سوى
    حصة ضئيلة من التوظيف في القطاع الخاص بينما كانت تستحوذ على نحو خمس أرباح القطاع الخاص
    بأكمله، متركّزة في قطاعات تحميها الأنظمة من المنافسة. هذه هي الحقيقة الاقتصادية الأفضل
    توثيقًا في قاعدة البيانات.
  summary_ar_by: model-reviewed
  institutions: [trabelsi-network]
  actors: [ben-ali, leila-trabelsi, belhassen-trabelsi]
  confidence: A
  sources: [wb-all-in-family-qa, wb-wps6810, wb-manipulation-pr]

