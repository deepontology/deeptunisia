- id: revolution-2011
  date: "2011-01-14"
  title_en: Ben Ali leaves the country
  title_fr: Ben Ali quitte le pays
  title_ar: بن علي يفر من البلاد
  category: political
  rupture: true
  summary: >-
    After weeks of nationwide protest the president leaves Tunisia. The internal
    security forces lose public legitimacy; the army, which had not been the regime's
    instrument of repression, retains it. Ali Seriati, the head of presidential
    security, is arrested within days.
  summary_fr: >-
    Après des semaines de protestation nationale, le président quitte la Tunisie. Les forces
    de sécurité intérieure perdent leur légitimité publique ; l'armée, qui n'avait pas été
    l'instrument de répression du régime, la conserve. Ali Seriati, chef de la sécurité
    présidentielle, est arrêté en quelques jours.
  summary_fr_by: model-reviewed
  summary_ar: >-
    بعد أسابيع من الاحتجاج الشعبي، يغادر الرئيس تونس. تفقد قوات الأمن الداخلي شرعيتها
    الشعبية؛ بينما يحتفظ بها الجيش الذي لم يكن أداة القمع في النظام. يُعتقل علي السرياطي،
    رئيس الأمن الرئاسي، في غضون أيام.
  summary_ar_by: model-reviewed
  actors: [ben-ali, rachid-ammar, ali-seriati, fouad-mebazaa]
  institutions: [presidency, armed-forces, ministry-interior, presidential-security]
  location: [gov-tunis, gov-sidi-bouzid]
  confidence: A
  causes: [bouazizi]
  consequences: [rcd-dissolved, assets-confiscated, constitution-2014, joint-chief-revived, ben-achour-commission, hannibal-tv-confiscated]
  contested:
    - framing: The army chief refused an order to fire on demonstrators
      held_by: The conventional account of the revolution, widely reported
      source: lemonde-ammar-2011
    - framing: The precise sequence and wording of orders is not established by any public document
      held_by: Carnegie's more cautious reading of the same events
      source: carnegie-quiet-revolution
  sources: [carnegie-who-will-lead, lemonde-ammar-2011, carnegie-quiet-revolution, enwiki-tunisian-revolution]

