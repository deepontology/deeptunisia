- id: 2022-constitutional-referendum
  date: "2022-07-25"
  title_en: Tunisian constitutional referendum
  title_fr: Référendum constitutionnel tunisien
  title_ar: الاستفتاء الدستوري التونسي
  category: political
  rupture: true
  summary: >-
    Voters approve a new constitution proposed by Kais Saied, replacing the
    2014 constitution. The new text concentrates power in the presidency,
    eliminates the constitutional court requirement, and downgrades the
