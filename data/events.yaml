- id: coup-1987
  date: "1987-11-07"
  title_en: Ben Ali removes Bourguiba
  title_fr: Ben Ali destitue Bourguiba
  title_ar: بن علي يعزل بورقيبة
  category: political
  rupture: true
  summary: >-
    The prime minister declares Bourguiba medically unfit and assumes the presidency.
    Contemporary reporting describes National Guard forces deployed around the
    presidential palace. Habib Ammar, the guard's commander, becomes interior minister
    the same day.
  summary_fr: >-
    Le Premier ministre déclare Bourguiba médicalement inapte et assume la présidence. La
    presse contemporaine décrit des forces de la Garde nationale déployées autour du palais
    présidentiel. Habib Ammar, commandant de la Garde, devient ministre de l'Intérieur le
    jour même.
  summary_fr_by: model-reviewed
  summary_ar: >-
    يعلن رئيس الوزراء عدم أهلية بورقيبة الصحية ويتولى الرئاسة. تصف الصحافة المعاصرة قوات من
    الحرس الوطني منتشرة حول القصر الرئاسي. الحبيب عمار، قائد الحرس، يصبح وزيرًا للداخلية في
    اليوم نفسه.
  summary_ar_by: model-reviewed
  actors: [ben-ali, bourguiba, habib-ammar, hedi-baccouche]
  institutions: [presidency, national-guard, ministry-interior]
  location: [gov-tunis]
  confidence: A
  consequences: [rcd-founded]
  contested:
    - framing: A constitutional succession on medical grounds
      held_by: The incoming government's own account, November 1987
    - framing: A palace coup executed with gendarmerie support
      held_by: Widespread later scholarly and journalistic characterisation
      source: carnegie-quiet-revolution
  sources: [lemonde-1987-coup, habib-bourguiba-net-1987, carnegie-quiet-revolution]

- id: barraket-essahel
  date: "1991-05"
  title_en: The Barraket Essahel affair
  title_fr: L'affaire Barraket Essahel
  title_ar: قضية برقة الساحل
  category: military
  rupture: true
  summary: >-
    Large numbers of military officers and personnel were arrested, tortured or removed
    following accusations of a conspiracy involving Ennahda. The accusations were later
    widely recognised as unfounded. The consequences reshaped the Tunisian state:
    officers were removed from civilian and security posts, the Interior Ministry's
    resources came to dwarf Defence's, and Ben Ali stopped appointing a Chief of Staff
    of the Armed Forces at all, coordinating the services himself from Carthage.
  summary_fr: >-
    De nombreux officiers et militaires sont arrêtés, torturés ou écartés après des
    accusations de complot impliquant Ennahdha. Les accusations seront ensuite largement
    reconnues comme infondées. Les conséquences ont remodelé l'État tunisien : les officiers
    sont écartés des postes civils et sécuritaires, les moyens du ministère de l'Intérieur
    finissent par éclipser ceux de la Défense, et Ben Ali cesse d'instituer un chef
    d'état-major des armées, coordonnant lui-même les armes depuis Carthage.
  summary_fr_by: model-reviewed
  summary_ar: >-
    اعتُقل أو عُذّب أو أُقصي عدد كبير من الضباط والعسكريين بعد اتهامات بمؤامرة تورط فيها حزب
    النهضة. وقد أصبحت هذه الاتهامات معترفًا بها لاحقًا على نطاق واسع بوصفها لا أساس لها.
    أعادت العواقب تشكيل الدولة التونسية: أُقصي الضباط من المناصب المدنية والأمنية، وأصبحت
    إمكانيات وزارة الداخلية تطغى على وزارة الدفاع، وكف بن علي عن تعيين رئيس أركان للجيوش،
    فنسّق بين الأسلحة بنفسه من قرطاج.
  summary_ar_by: model-reviewed
  actors: [ben-ali]
  institutions: [armed-forces, ministry-interior, ministry-defence, ennahda]
  location: [gov-nabeul]
  confidence: A
  causes: [coup-1987]
  consequences: [joint-chief-revived, governors-military-2011]
  sources: [carnegie-quiet-revolution, oup-grewal-marginalizing, leaders-barraket-essahel-2012, frwiki-barraket-essahel, arwiki-barraket-town]

