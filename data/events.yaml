- id: phosphate-collapse
  date: "2011"
  date_end: "2021"
  title_en: Phosphate output halves and stays halved
  title_fr: L'effondrement de la production de phosphate
  title_ar: >-
    انهيار إنتاج الفسفاط
  category: economic
  summary: >-
    Tunisian phosphate production stood at eight million tonnes in 2010, making
    the country the world's fifth-largest producer at roughly four per cent of
    GDP and ten per cent of exports. Through the decade after 2011 it ran near
    3.4 million tonnes a year, peaking at 3.8 million in 2017, with capacity
    utilisation below thirty-five per cent — the result of strikes, sit-ins and
    transport blockades in a mining basin where unemployment runs near
    twenty-nine per cent. After the World Bank's measurement of the confiscated
    Ben Ali firms, this is the best-quantified economic fact in the dataset, and
    it cuts against any account in which the post-2011 state simply carried on.
  summary_fr: >-
    La production tunisienne de phosphates atteignait huit millions de tonnes en 2010,
    faisant du pays le cinquième producteur mondial, soit environ quatre pour cent du PIB et
    dix pour cent des exportations. Au cours de la décennie qui a suivi 2011, elle s'est
    établie près de 3,4 millions de tonnes par an, culminant à 3,8 millions en 2017, avec
    une utilisation des capacités inférieure à trente-cinq pour cent — résultat des grèves,
    sit-in et blocages de transport dans un bassin minier où le chômage avoisine vingt-neuf
    pour cent. Après la mesure par la Banque mondiale des entreprises confisquées de Ben
    Ali, c'est le fait économique le mieux quantifié du jeu de données, et il contredit tout
    récit dans lequel l'État post-2011 aurait simplement poursuivi comme avant.
  summary_fr_by: model-reviewed
  summary_ar: >-
    بلغ إنتاج تونس من الفسفاط ثمانية ملايين طن في 2010، ما جعل البلاد خامس أكبر منتج في
    العالم، أي نحو أربعة بالمائة من الناتج المحلي الإجمالي وعشرة بالمائة من الصادرات. طوال
    العقد الذي تلا 2011، استقر الإنتاج قرب 3.4 ملايين طن سنويًا، وبلغ ذروته عند 3.8 ملايين
    في 2017، مع استخدام للطاقات الإنتاجية دون الخامسة والثلاثين بالمائة — نتيجة إضرابات
    واعتصامات وحصار للنقل في حوض منجمي يتجاوز فيه البطالة تسعًا وعشرين بالمائة. بعد قياس
    البنك الدولي لشركات بن علي المصادرة، تعد هذه الحقيقة الاقتصادية الأفضل قياسًا في قاعدة
    البيانات، وهي تناقض أي سردية مفادها أن الدولة ما بعد 2011 واصلت السير على حالها.
  summary_ar_by: model-reviewed
  institutions: [cpg, gct, ugtt]
  location: [gov-gafsa]
  confidence: B
  contested:
    - framing: A social settlement that bought stability with output and hiring
      held_by: Accounts emphasising post-2011 recruitment into the company and the mining basin's unemployment
      source: jeuneafrique-gafsa-crise
    - framing: A management and infrastructure failure that protest merely exposed
      held_by: The company's own 2026 recovery plan, which names transport, water, ammonia supply, ageing equipment and liquidity
      source: tunisienumerique-cpg-plan
  sources: [jeuneafrique-gafsa-crise, nrgi-cpg, tunisienumerique-cpg-plan]

- id: isie-decree-2022
  date: "2022-04-22"
  title_en: The electoral authority is placed in the president's gift
  title_fr: Le décret-loi 2022-22 sur l'ISIE
  title_ar: >-
    المرسوم عدد 2022-22 المتعلق بالهيئة العليا المستقلة للانتخابات
  category: constitutional
  rupture: true
  summary: >-
    Decree-law 2022-22, published in JORT no. 45, deleted the provisions of
    organic law 2012-23 governing the composition of the Independent High
    Authority for Elections and the method of appointing its members. The
    president of the republic thereafter designated all seven members and their
    president, and could propose their removal. Three weeks later a new council
    was named by decree. It certified the referendum on the constitution that
    ratified this arrangement, the 2022-2023 legislative elections, the local
    elections that seated the second chamber, and the 2024 presidential election.
  summary_fr: >-
    Le décret-loi 2022-22, publié au JORT n° 45, supprime les dispositions de la loi
    organique 2012-23 régissant la composition de l'Instance supérieure indépendante pour
    les élections et le mode de désignation de ses membres. Le président de la République
    désigne désormais les sept membres et leur président, et peut proposer leur révocation.
    Trois semaines plus tard, un nouveau conseil est nommé par décret. Il a certifié le
    référendum constitutionnel qui a ratifié cet agencement, les élections législatives de
    2022-2023, les élections locales qui ont pourvu la seconde chambre, et l'élection
    présidentielle de 2024.
  summary_fr_by: model-reviewed
  summary_ar: >-
    ألغى المرسوم عدد 2022-22، المنشور بالرائد الرسمي عدد 45، أحكام القانون الأساسي عدد
    2012-23 المنظِّمة لتكوين الهيئة العليا المستقلة للانتخابات وطريقة تعيين أعضائها. أصبح
    رئيس الجمهورية يعيّن الأعضاء السبعة ورئيسهم، ويستطيع اقتراح عزلهم. وبعد ثلاثة أسابيع،
    عُيّن مجلس جديد بمرسوم. صادق المجلس على الاستفتاء على الدستور الذي أقرّ هذا الترتيب،
    والانتخابات التشريعية لسنتي 2022-2023، والانتخابات المحلية التي شغّلت الغرفة الثانية،
    والانتخابات الرئاسية لسنة 2024.
  summary_ar_by: model-reviewed
  actors: [kais-saied, nabil-baffoun, farouk-bouasker]
  institutions: [isie, presidency, legislature]
  location: [gov-tunis]
  confidence: B
  causes: [july-25-2021]
  consequences: [legislatives-2022, election-2024]
  contested:
    - framing: A necessary correction to a body captured by the parties that elected it
      held_by: The stated justification for the decree
      source: nawaat-isie-2022
    - framing: The removal of the last institutional check on how elections are counted
      held_by: The outgoing council president, the European Parliament rapporteur, and Tunisian civil society
      source: aa-baffoun-2022
  sources: [nawaat-isie-2022, inkyfada-isie-2022, aa-baffoun-2022]

