    NGOs to petition the Court directly. Its withdrawal restricts access to
    international justice for human-rights victims; the CRLDHT, the Tunisian
    Coalition Against the Death Penalty (CTCPM) and the Tunisian Human Rights
    League (LTDH) denounced the decision, and a coalition of 11 international
