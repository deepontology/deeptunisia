# -----------------------------------------------------------------------------
# VACANCIES — intervals in which an office had no titular holder (decision 0007)
#
# A vacancy is a fact the record knows: a source says nobody held the office.
# A missing position row is a fact the record does not know. The two render
# differently, and this file is what lets them.
#
# Vacant means no titular holder. An acting holder (a position with
# `acting: true`) may sit inside the interval: the office is vacant and someone
# manages it. A titular position overlapping a vacancy in the same role fails
# the build (V32); that is a dispute to record, not a gap to merge.
#
# Do not create a vacancy from the absence of a row. The source has to say the
# office was empty, or the interval has to be bounded by a departure and an
# appointment that the sources tie to each other.
# -----------------------------------------------------------------------------

- id: vac-governor-tunis-2023
  role: governor-tunis
  start: "2023-03-17"
  end: "2024-09-08"
  confidence: B
  reasoning: >-
    Kamel Feki left the post on 17 March 2023, when he was named interior
    minister (Anadolu, 18 March 2023). On 19 April 2023 the governorate's own
    communiqué, reported by Webdo, charged the first delegate Fares Mejri with
    managing its affairs provisionally, pending the president's appointment of
    a new governor, so on that date the post had no titular holder. Decree
    2024-472 of 8 September 2024 names Imed Boukhris governor of Tunis and
    names no predecessor. The first gazette sweep of 2011-2026 found no Tunis appointment between those
    dates.
  reasoning_fr: >-
    Kamel Feki a quitté le poste le 17 mars 2023, nommé ministre de
    l'Intérieur (Anadolu, 18 mars 2023). Le 19 avril 2023, un communiqué du
    gouvernorat, rapporté par Webdo, a chargé le premier délégué Fares Mejri de
    gérer provisoirement ses affaires en attendant la nomination d'un nouveau
    gouverneur par le président : à cette date, le poste n'avait pas de
    titulaire. Le décret 2024-472 du 8 septembre 2024 nomme Imed Boukhris
    gouverneur de Tunis sans nommer de prédécesseur. Le premier dépouillement du JORT
    pour 2011-2026 n'a trouvé aucune nomination à Tunis entre ces dates.
  reasoning_fr_by: machine
