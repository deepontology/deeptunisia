    نقله موقع ويبدو، المعتمد الأول فارس المجري بتسيير شؤونها مؤقتًا في انتظار
    تعيين رئيس الجمهورية واليًا جديدًا، فلم يكن للمنصب في ذلك التاريخ والٍ
