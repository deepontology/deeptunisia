- id: contested-algerie-frontiere-litige-2026
  entity: algeria
  claim: >-
   Circulant en août 2026 dans une série de tribunes Kapitalis : la Tunisie
   aurait renoncé sous contrainte à des revendications territoriales sur des
   territoires annexés à l'Algérie à l'époque coloniale (« coup de poignard »,
   accord de 1970 obtenu « sur le plan juridique mais pas sur le plan
   légitimité »), et l'État algérien pomperait le pétrole du bassin d'El Borma
   par des puits obliques — le plaidateur qualifiant l'Algérie de
   « prédateur ».
  notes:
    - >-
      Circulating in an August 2026 Kapitalis tribune series: that Tunisia
      renounced colonial-era territorial claims under duress (the 1970
      settlement "legal but not legitimate"), and that the Algerian state
      slant-drills into Tunisia's El Borma oil basin - the basin's alleged
      "predator".

  assessment: >-
   Contesté et non étayé : les deux volets sont portés par des tribunes signées
   (Fékih 06/08/2026 ; réplique Cherfouh 09/08/2026), aucune action d'État
   documentée. La réplique invoque l'uti possidetis juris (déclaration du Caire,
   OUA 1964) et la Convention de bornage du 6 janvier 1970 comme règlement
   définitif, et qualifie le « puits oblique » de légende urbaine contre un
   réservoir continu géré conjointement par Sitep et Sonatrach ; TransMed
   rapporte à la Tunisie des redevances de transit et des contrats long terme
   Sonatrach-STEG. Fait daté dans l'échange : lettre de remerciement de la STEG
   à Sonelgaz signée Fayçal Trifa le 4 août 2026. Divergence interne enregistrée
   sans arbitrage : Fékih écrit « accord du 20 mars 1970 », Cherfouh « Convention
   de bornage du 6 janvier 1970 ». Aucun volet ne corrobore une revendication
   étatique en cours.
  confidence: D
  basis: unsubstantiated
  verification: needs-primary-source
  attributed_to: >-
   Tribune authors via Kapitalis (A. Fékih 06/08/2026 ; H. Cherfouh 09/08/2026),
   both private citizens — engineer and physician — not officials.
  falsifiable_by: >-
   Any official Tunisian or Algerian state document reopening the border file,
   or a technical study of El Borma well paths by ETAP/Sonatrach.
  disputes:
    - claim: >-
        Date of the 1970 border-settlement instrument: 20 March 1970 versus
        6 January 1970.
      held_by: Fékih tribune versus Cherfouh rebuttal (both Kapitalis)
      assessment: >-
        Both are tribune printings; the instrument itself (convention de bornage)
        is not yet cited to a registry text in this exchange. Open until the
        convention is pulled.
      status: open
  review:
    by: adala
    date: "2026-09-03"
    method: judge
    note: >-
      Checked the single cited source Kapitalis tribune series Aug 2026 (tier 3/4, tribunes). Fekih 06/08/2026 advances two claims: 1970 settlement 'legal but not legitimate' under duress and Algerian slant-drilling into El Borma basin ('predator'); Cherfouh 09/08/2026 rebuttal invokes uti possidetis (Cairo 1964) and the 6 Jan 1970 bornage convention as definitive, calls slant-drilling an urban legend against a continuous reservoir jointly managed by Sitep/Sonatrach, and cites TransMed royalties and Sonatrach-STEG contracts plus a STEG-Sonelgaz thank-you letter signed Faycal Trifa 4 Aug 2026. No official Tunisian or Algerian state document reopening the file is cited; both are private-citizen tribunes, not officials. Internal date divergence (20 Mar vs 6 Jan 1970) remains open without the convention text. No technical well-path study located. Grade D/unsubstantiated kept; NOT verified against a gazette or technical registry.
  sources:
    - kapitalis-algerie-litige-2026
