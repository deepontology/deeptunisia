# -----------------------------------------------------------------------------
# WORLD CLAIMS — the dossier's shelf (docs/plans/world-rebuild-v2.md §2.7, §4.4)
#
# Two shapes of claim about Tunisia's external relations, one record kind:
#
#   1. AGGREGATES the measured flow families cannot cover — total public debt
#      including DOMESTIC debt (the World Bank IDS series is external-only),
#      tourism receipts and arrivals, anything else a national body publishes
#      that the flow datasets do not. Each is an authored claim with a source,
#      a grade, and an `assessment` stating its boundary.
#
#   2. CONTESTED circulating claims, kept per rule 6 (unsubstantiated claims
#      are kept, never deleted). What the popular account says about a
#      counterparty — "France owns the debt", the IMF narrative — graded D,
#      attributed to who circulates it, beside the measured reality in
#      `assessment`.
#
# A world claim is NEVER a measurement. It carries the full claim envelope:
# basis, confidence, attribution below grade B, and at least one source.
# `entity` is the graph institution id the claim is about, or null when the
# claim is about Tunisia itself.
# -----------------------------------------------------------------------------
