- id: cc-france-largest-creditor
  entity: france
  claim: La France est le premier créancier de la Tunisie / « détient » (ou
    possède) la dette tunisienne, et la dette est l'instrument de la domination
    française sur la Tunisie.
  assessment: >-
    (a) Données IDS 2024 du dépôt (stock de dette publique extérieure PPG, par
    créancier, USD) : la France détient 997,4 M USD — 4,8 % du stock total de 20
    816 M USD. L'Allemagne (1 073 M, 5,2 %) la devance parmi les bilatéraux ;
    les créanciers multilatéraux détiennent à eux seuls 15 246 M USD (73,2 %) :
    Banque mondiale-IBRD 4 327 M, obligataires 2 484 M, BAD 2 398 M, BEI 1 457
    M, UE 1 143 M. La « dette française » est donc, au mieux, un vingtième de la
    dette publique extérieure — et la majorité absolue est détenue par des
    institutions multilatérales et le marché. (b) Côté français (Trésor public,
    fin 2022) : les créances de l'État français, de l'AFD, de Bpifrance AE et de
    Natixis sur la Tunisie totalisent 1 128 M EUR — sixième position africaine,
    derrière le Maroc (3 106 M EUR), l'Égypte et la Côte d'Ivoire. (c) La part
    de vérité historique : la dette des années 1860 a bien servi de prétexte à
    l'établissement du protectorat (1881) — c'est un fait documenté, mais il
    concerne la Tunisie pré-républicaine, pas la structure actuelle de la dette,
    qui depuis 2024 est majoritairement INTÉRIEURE.


    Le récit historique (CADTM/Orient XXI) est lui-même documenté et ne doit pas
    être importé en D : c'est le transfert du récit au présent (« la France
    détient la dette tunisienne aujourd'hui ») qui est non-étayé. La distinction
    (période historique vs stock actuel) doit être visible sur l'étagère.
  confidence: D
  basis: unsubstantiated
  verification: disputed
  attributed_to: Discours souverainiste et posts de réseaux sociaux (non
    attribuables à un auteur unique) ; le récit historique qui l'alimente est
    documenté par CADTM/Orient XXI pour la période 1863-1881 ; la presse
    tunisienne le discute publiquement (La Presse, « Pas de diktats étrangers »,
    mai 2024, qui répond à des affirmations sur la part française de la dette).
  review:
    by: adala
    date: "2026-09-03"
    method: judge
    note: >-
      Checked the three cited sources against the 'France holds the debt' claim. La Presse 2024-05 'Pas de diktats' (tier not in excerpt) discusses public debate on French share, not evidence for dominance. Orient XXI / CADTM (tier 2) documents the 1860s debt as pretext for the 1881 protectorate -- historical phase, not current stock. Economiste Maghrebin 2024 (tier not detailed) is the third citation. Assessment in record shows measured reality: IDS 2024 PPG France 997.4 M USD (4.8% of 20 816 M), Germany 1 073 M (5.2%) ahead among bilaterals; multilaterals 15 246 M (73.2%) dominate; French Treasury end-2022 claims 1 128 M EUR (6th in Africa). No source shows France as largest creditor today; the historical truth (1863-1881) is separated from present structure, which since 2024 is majority domestic. Grade D/unsubstantiated kept; NOT verified against a registry or gazette.
  notes:
    - "Where it appears: lapresse-fb-pas-de-diktats;
      orientxxi-dette-conquete-tunisie"
  sources:
    - lapresse-fb-pas-de-diktats
    - orientxxi-dette-conquete-tunisie
    - economiste-maghrebin-dette-france-2024
- id: cc-imf-debt-trap
  entity: imf
  claim: Le programme du FMI est un piège à dette / les « diktats » du FMI ne
    mènent qu'à davantage d'appauvrissement, et l'endettement envers le FMI
    domine la dette tunisienne.
  assessment: >-
    (a) Le programme n'a jamais existé en pratique : l'accord au niveau des
    services d'octobre 2022 (1,9 Md USD, EFF) n'a jamais été présenté au conseil
    d'administration du FMI et aucune tranche n'a été décaissée. Il ne peut donc
    pas avoir « piégé » la dette : l'encours FMI a au contraire reculé (5,3 Mds
    TND fin 2024, soit ~7 % de l'encours extérieur LT de 75 966 MDT — BCT), et
    le FMI ne figure même pas parmi les créanciers de la série IDS du dépôt. (b)
    La dette a augmenté PENDANT que le programme était gelé : de 84,6 % du PIB
    (2023, note économique Banque mondiale) à 84,9 % (2024, données MF/CEIC),
    par emprunt intérieur — crédit bancaire et avances directes de la BCT (lois
    2024-10 et LF 2025/2026 : 7 + 7 + 11 Mds TND). La séquence observée
    contredit la thèse « c'est le FMI qui endette » : l'endettement marginal est
    domestique. (c) À l'échelle du stock, le programme de 1,9 Md USD
    représentait ~9 % du stock de dette publique extérieure PPG (20,8 Mds USD,
    IDS 2024) et ~4 % de la dette publique totale (135 Mds TND) — un ordre de
    grandeur aux antipodes d'une domination.


    Deux affirmations distinctes sont à garder séparées sur l'étagère : (i) la
    déclaration du président existe (fait documenté sur le discours) ; (ii) la
    thèse selon laquelle le programme FMI est un piège à dette pour la Tunisie
    (non étayée par les données, D). Une partie de la thèse générale « la dette
    est devenue insoutenable » est en revanche un constat partagé (FMI, Banque
    mondiale, EBRD) — c'est la causalité attribuée au FMI qui est contestée.
  confidence: D
  basis: unsubstantiated
  verification: disputed
  attributed_to: "Le président de la République Kaïs Saïed, déclaration du 6 avril
    2023 à Monastir : « En ce qui concerne le FMI, les diktats provenant de
    l'étranger et qui ne mènent qu'à davantage d'appauvrissement sont
    inacceptables » — reprise par AFP/Reuters (L'Orient-Le Jour), Agence Ecofin,
    Anadolu, Kapitalis. La déclaration elle-même est documentée ; la thèse
    causale (le programme du FMI = piège à dette) est une appréciation
    politique."
  review:
    by: adala
    date: "2026-09-03"
    method: judge
    note: >-
      Checked the three cited sources for the 'IMF debt trap' causal claim. L'Orient-Le Jour 2023-04-06 and Agence Ecofin 2023-04-06 (both tier 3/4, via AFP/Reuters) document the president's Monastir declaration of 6 April 2023 -- 'diktats etrangers inacceptables' -- as a speech act, not as evidence for trap mechanics. African Manager 2024 detail (tier 4) provides the debt stock context: IMF encours 5.3 Mds TND end 2024 (~7% of exterior LT 75 966 MDT, BCT), and the programme never existed in practice (Oct 2022 staff-level 1.9 Md USD never presented to board, no tranche disbursed). Assessment shows debt rose while programme frozen (84.6% 2023 World Bank -> 84.9% 2024 MF/CEIC) via domestic borrowing (BCT advances 7+7+11 Mds TND). No source shows IMF domination of stock (programme ~9% of exterior PPG, ~4% of total 135 Mds TND). Two assertions separated: speech fact vs trap thesis (D). Grade D kept; NOT verified against a gazette.
  notes:
    - "Where it appears: lorientlejour-saied-diktats-fmi-2023;
      agenceecofin-saied-fmi-2023"
  sources:
    - lorientlejour-saied-diktats-fmi-2023
    - agenceecofin-saied-fmi-2023
    - africanmanager-dette-exterieure-2024-detail
- id: cc-turkey-fta-kills-industry
  entity: turkey
  claim: "L'accord de libre-échange tuniso-turc (signé 2004, en vigueur 2005) a
    détruit l'industrie tunisienne : il existerait « un lien étroit entre
    l'entrée en vigueur de cet accord et la perte de 250 mille emplois entre
    2005 et 2015 dans le secteur de l'industrie, notamment dans le
    textile/habillement »."
  assessment: >-
    (a) Poids mesuré de la Turquie (Comtrade, retours propres tunisiens, dépôt)
    : en 2024, les importations turques font 1 187,5 M USD — 4,7 % des
    importations totales (25 057,7 M USD) ; les exportations vers la Turquie
    272,2 M USD (1,5 %). Le déficit bilatéral (-915 M USD) est réel mais ne
    représente que 14 % du déficit commercial total. Un flux de 4,7 % des
    importations ne peut pas expliquer seul la destruction d'un secteur
    employeur majeur. (b) Le chiffre de 250 000 emplois est avancé par l'OTIC
    sans aucune source ni méthode ; aucune série d'emploi sectoriel n'est citée.
    La causalité est d'autant plus fragile que janvier 2005 est aussi la fin des
    quotas de l'Accord multifibres (OMC), le choc structurel le plus souvent
    cité pour l'emploi textile en Tunisie — variable confondante que la thèse
    OTIC ignore. (c) La part vraie : l'accord a creusé un déficit commercial
    persistant (le ministère du Commerce parle lui-même d'une « aggravation
    inattendue du déficit commercial », amendement de décembre 2023
    réassujettissant des produits turcs à 27-37,5 % de droits). Cette partie de
    la revendication est étayée (reported, C) ; la partie « 250 000 emplois
    perdus à cause de la Turquie » ne l'est pas (D).


    Variante UE de la même famille (« le libre-échange avec l'UE tue l'industrie
    ») : elle circule dans le discours anti-ALECA et mérite sa propre fiche,
    mais aucune instance citable n'a été recueillie lors de cette passe — piste
    à sourcer (tier 5), pas un record. Mesure UE pour l'étagère : l'UE = 74,3 %
    des exportations et 45,1 % des importations tunisiennes (2024, Comtrade) —
    la dépendance commerciale à l'UE, elle, est un fait mesuré.
  confidence: D
  basis: unsubstantiated
  verification: disputed
  attributed_to: "Organisation Tunisienne pour Informer le Consommateur (OTIC),
    communiqué du 18 septembre 2017 (repris par Webmanagercenter). Variante
    chiffrée extrême : l'économiste Mourad Hattab, mai 2017 — « si elle arrête
    d'importer de la Turquie, la Tunisie pourrait rembourser 53 % de son service
    de dette extérieure »."
  review:
    by: adala
    date: "2026-09-03"
    method: judge
    note: >-
      Checked the three cited sources for the '250 000 jobs destroyed by Turkey FTA' claim. WMC 2017-09-18 OTIC communique (tier 4) advances the 250 000 figure between 2005-2015 in textiles without source or method; no sectoral employment series cited. WMC Hattab 2017-05 (tier 4) gives the extreme variant '53% of external debt service' if imports from Turkey stopped -- same unsourced arithmetic. Kapitalis 2023-12 (tier 4) reports the ministry's own 'aggravation inattendue du deficit' and December 2023 amendment re-imposing 27-37.5% duties -- documenting a persistent bilateral deficit, not mass job loss causation. Measured Comtrade 2024 (not a cited source but assessment data): Turkish imports 1 187.5 M USD (4.7% of total 25 057.7 M), bilateral deficit -915 M (14% of total deficit) -- too small to explain sector-wide destruction; Jan 2005 also ended Multifibre quotas, a confounder the OTIC thesis ignores. The deficit part is C/reported, the 250k jobs part stays D. Grade D kept; NOT verified against a trade registry.
  notes:
    - "Where it appears: wmc-otic-gel-accord-turquie-2017;
      wmc-hattab-turquie-2017"
  sources:
    - wmc-otic-gel-accord-turquie-2017
    - wmc-hattab-turquie-2017
    - kapitalis-accord-turquie-2023

