# -----------------------------------------------------------------------------
# COMPANIES — corporate records keyed by institution id (spec §4.2)
#
# A company IS an institution of type `company`/`bank`/`state-enterprise`/… plus
# this corporate record. The record is keyed by the institution id, so the graph
# node and its corporate identity can never desync into two different things.
#
# Every number carries a date (P7): `capital` is not "the capital is X", it is "a
# primary document shows capital X at this balance-sheet date". Numbers never
# float free.
#
# Records landed 2026-08-08 from data/contrib/companies-2026-08-08.yaml (roadmap
# P1 #6): biat, poulina, mabrouk-group, elloumi-group, gct, steg, tunisair,
# tunisie-telecom. RCC (registre de commerce) numbers were NOT verifiable in
# that run (BRCT/RNE registries unreachable) — no `cin` is invented, and each
# record's notes say where to look. The schema gained the base `notes` field
# (parity with education/place; nothing relaxed — see spec R5/R8 rows).
# -----------------------------------------------------------------------------

