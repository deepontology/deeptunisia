# Regions gazetteer — the administrative hierarchy of Tunisia (spec §8.1).
#
# Names and the region grouping follow the Wikipedia "Governorates of Tunisia"
# article (wikipedia-governorates-tunisia); governorate codes are the official
# ISO 3166-2:TN codes carried by the geoBoundaries TUN ADM1 boundaries
# (geoboundaries-tun-adm1), which also serve as the map view's basemap
# (static/tn-adm.geojson).
#
# Hierarchy: region-tunisia → 6 regions → 24 governorates. Delegations and
# municipalities (264 and ~350) are authored as the records exist; the schema
# and validators already accept them.

- id: region-tunisia
  kind: region
  name_en: Tunisia
  name_fr: Tunisie
  name_ar: تونس
  sources: [wikipedia-governorates-tunisia]

