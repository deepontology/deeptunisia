    commission's report the assets were transferred to the state. State-transfer
    sequence: décret-loi 2011-47 (31-05-2011, amendment), décret-loi 2011-68
    (14-07-2011, commission nationale de gestion des avoirs confisqués), décret
    2013-4420 (10-10-2013, permanent secretariat); by 05-08-2015 Finance Minister
    Slim Chaker announced tenders for 7 companies and 14 confiscated properties.
  summary_fr: >-
