    Décret-loi n° 2011-13 du 14-03-2011 (JORT n° 18 du 18-03-2011, pp. 338-342)
    confiscated for the state all movable/immovable assets and rights acquired
    after 07-11-1987 belonging to Zine El Abidine Ben Ali, his wife Leila
    Trabelsi, and the persons in the annexed list — 112 persons per the WMC
