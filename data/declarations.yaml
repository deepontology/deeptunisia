# -----------------------------------------------------------------------------
# DECLARATIONS — records ABOUT documents, not about the world (spec §4.6)
#
# A declaration record captures that a document exists and what it says (an asset
# declaration filed with the anti-corruption body, an income statement, a DGI
# file). It NEVER asserts the declared values are true — "filed" is the claim,
# "accurate" is not.
#
# Records landed 2026-08-08 from data/contrib/declarations-2026-08-08.yaml
# (roadmap P1 #9). Failure vocabulary preserved from that run:
#   - "filed" = the document exists (or a named account of it exists). It never
#     asserts the declared values are true.
#   - Content of the sealed declarations (values, figures) is NOT known for any
#     individual record.
#   - Regime/class records (the 87-17 era, the confiscation file, the 2018-46
#     regime, the INLUCC candidate list, the verification gap) have no single
#     person declarer: `declarer` is null and the class is described in the
#     summary. The schema's declarer field is nullable for exactly this (the
#     person-less regime record is a legitimate shape — documented in spec §4.6).
#   - The Instance nationale de la bonne gouvernance et de la lutte contre la
#     corruption never took office, so declarations under loi 2018-46 were
#     received by INLUCC (art. 48) — `body` is inlucc where the receiver is
#     documented, null where the holding body is not a graph entity.
# -----------------------------------------------------------------------------

- id: decl-2011-regime-8717
  declarer: null
  date: "~2011"
  kind: asset-declaration
  jurisdiction: tunisia
  body: audit-court
  summary: >-
    The 2011-era declaration regime: loi n° 87-17 du 10-04-1987 (déclaration sur
    l'honneur des biens) obliged members of government, magistrates, ambassadors,
    governors and state-enterprise presidents to declare their own assets, their
    spouse's and minor children's within one month of appointment (renewal every
    five years and at end of functions). Declarations were deposited with the
    Premier Président de la Cour des comptes; for government members one of three
    copies went to the President of the Republic. Art. 5: total secrecy — any
    communication to third parties was a criminal offence (art. 109 Code pénal);
    art. 6: usable in court only in a criminal action against the declarant;
    art. 7: failure to file meant dismissal from the office. The law remained in
    force through the 2011 revolution and the transitional governments
    (Ghannouchi II, Essebsi, Jebali, Laarayedh, Jomaa) until abrogated by
    loi 2018-46 art. 51 (01-08-2018). Under décret-loi 2011-120 art. 15, INLUCC
    could request access to these declarations from the Cour des comptes.
  summary_fr: >-
    Le régime déclaratoire de l'ère 2011 : la loi n° 87-17 du 10-04-1987 (déclaration sur
    l'honneur des biens) obligeait les membres du gouvernement, magistrats, ambassadeurs,
    gouverneurs et présidents d'entreprises publiques à déclarer leurs propres biens, ceux
    de leur épouse et de leurs enfants mineurs dans le mois suivant leur nomination
    (renouvellement tous les cinq ans et à la fin des fonctions). Les déclarations étaient
    déposées auprès du Premier Président de la Cour des comptes ; pour les membres du
    gouvernement, l'un des trois exemplaires allait au Président de la République. Art. 5 :
    secret total — toute communication à des tiers était un délit pénal (art. 109 Code
    pénal) ; art. 6 : utilisables en justice uniquement dans une action criminelle contre le
    déclarant ; art. 7 : défaut de déclaration entraînait la révocation de la fonction. La
    loi est restée en vigueur pendant la révolution de 2011 et les gouvernements
    transitoires (Ghannouchi II, Essebsi, Jebali, Laarayedh, Jomaa) jusqu'à son abrogation
    par la loi 2018-46 art. 51 (01-08-2018). En vertu de l'article 15 du décret-loi
    2011-120, l'INLUCC pouvait demander l'accès à ces déclarations auprès de la Cour des
    comptes.
  summary_fr_by: model-reviewed
  summary_ar: >-
