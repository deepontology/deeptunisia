- id: decl-2018-46-regime
  declarer: null
  date: "2018-08-01"
  kind: asset-declaration
  jurisdiction: tunisia
  body: null
  summary: >-
    Loi n° 2018-46 du 01-08-2018 created the modern declaration regime:
    patrimoine and interests declarations within 60 days of taking office (art. 5),
    covering spouse and minor children (art. 6-7), deposited with the Instance
    (art. 8) with a copy to the Cour des comptes and a 10-year retention after
    leaving office; content publication for categories 1-8 per the model decree
    (art. 8); mandatory verification of categories 1-12 (art. 15); sanctions for
    non-declaration and for divulging content (art. 30-33). The model and
    threshold were fixed by décret gouvernemental 2018-818 du 11-10-2018.
    DOCUMENTED GAP: the Instance nationale de la bonne gouvernance et de la lutte
    contre la corruption never took office — the ARP published candidate lists on
    22-06-2018 but members were never elected (fr-Wikipedia, checked 2026-08), and
    per art. 48 INLUCC ran the missions until the Instance took office. No
    declaration received BY the Instance is documented.
  summary_fr: >-
    La loi n° 2018-46 du 01-08-2018 a créé le régime déclaratoire moderne : déclarations de
    patrimoine et d'intérêts dans les 60 jours suivant la prise de fonctions (art. 5),
    couvrant l'époux et les enfants mineurs (art. 6-7), déposées auprès de l'Instance (art.
    8) avec copie à la Cour des comptes et conservation de 10 ans après la fin des fonctions
    ; publication du contenu pour les catégories 1-8 selon le décret modèle (art. 8) ;
    vérification obligatoire des catégories 1-12 (art. 15) ; sanctions pour non-déclaration
    et divulgation du contenu (art. 30-33). Le modèle et le seuil ont été fixés par le
    décret gouvernemental 2018-818 du 11-10-2018. LACUNE DOCUMENTÉE : l'Instance nationale
    de la bonne gouvernance et de la lutte contre la corruption n'a jamais pris ses
    fonctions — l'ARP a publié les listes de candidats le 22-06-2018 mais les membres n'ont
    jamais été élus (fr-Wikipedia, vérifié le 2026-08), et selon l'article 48, l'INLUCC a
    dirigé les missions jusqu'à ce que l'Instance prenne ses fonctions. Aucune déclaration
    reçue PAR l'Instance n'est documentée.
  summary_fr_by: model-reviewed
