    pour l'État tous les biens meubles/immeubles et droits acquis après le 07-11-1987
    appartenant à Zine El Abidine Ben Ali, à son épouse Leila Trabelsi, et aux personnes de
    la liste annexée — 112 personnes selon la transcription WMC, dont Marouane Mabrouk,
    Belhassen Trabelsi, Sakher El Materi, Slim Chiboub et les filles de Ben Ali. L'article 2
    imposait une obligation de DÉCLARATION : tout détenteur ou débiteur de tels biens devait
    les déclarer à la commission de confiscation dans les deux mois (enregistré, récépissé),
    faute de quoi ils étaient considérés comme débiteurs de l'État. Art. 7-8 : sur le
    rapport de la commission, les biens étaient transférés à l'État. Séquence de transfert
    étatique : décret-loi 2011-47 (31-05-2011, amendement), décret-loi 2011-68 (14-07-2011,
