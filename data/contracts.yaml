      realised value.
  notes_fr:
    - >-
      Protocole d'accord plus contrat annuel signé le 29 avril 2024 pour l'exportation
      d'environ 150 000 tonnes d'engrais vers le Bangladesh pour 2024, signé par le GCT (DG
      Hédi Youssef) et la BADC (président Abdullah Sazzad) en présence de Wael Chouchane
      (secrétaire d'État, transition énergétique) et de la secrétaire d'État agricole
      bangladaise Wahida Aktar. La contrepartie BADC n'est pas encore une entité du graphe ;
