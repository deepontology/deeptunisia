# -----------------------------------------------------------------------------
# CONTRACTS — procurement / PPP / concession records (spec §4.4)
#
# First-class records for the flows that show who gets paid by the state and on
# what terms. `winner`, `losers` and `institution` resolve to graph entities
# (person or institution). `award.value` is attributed — there is no "value
# filled from memory"; a record with an `award` must name who reports the figure
# or draw on a primary source (V4/V5).
#
# Records landed 2026-08-08 from data/contrib/contracts-2026-08-08.yaml
# (roadmap P1 #7). Failure vocabulary preserved from that run:
#   - "announced vs awarded": several records are announcements/loans/proposals,
#     not final awards — each is flagged in `status` and `notes`; no announced
#     value was promoted to an award value.
#   - "unlocatable award": ctr-sncft-alstom-caf-2017 and ctr-steg-eni-gas-2015-2017
#     are D-grade leads KEPT per rule 6 (the popular account claims these
#     contracts; the record documents that no source was found). They carry
#     status `unknown` and a negative-finding note — the contract status enum
#     gained `unknown` for them (additive, documented in spec §4.4).
#   - Counterparties that are not yet graph entities (Airbus, ENI, Alstom, CAF,
#     BADC, EBRD, JICA, Terna, Solar Water PLC, the ministry) are named in the
#     notes, not fabricated as `winner` anchors.
# -----------------------------------------------------------------------------

- id: ctr-tunisair-airbus-a320neo-2016
  title_en: Tunisair – Airbus A320neo order and 2019 sale-and-leaseback
  title_fr: Tunisair – commande d'Airbus A320neo et cession-bail de 2019
  title_ar: تونساير – طلبية إيرباص A320neo وعملية بيع وإيجار لسنة 2019
  institution: tunisair
  kind: procurement
  procurement: { mechanism: negotiated-direct, advertised: "~2016" }
  award: { value: "900000000", currency: TND, year: 2019 }
  status: signed
  start: "2016-09"
  confidence: B
  basis: reported
  attributed_to: >-
    Ali Miaoui, Tunisair Deputy General Manager and head of the negotiating
    committee with Airbus — cost of the 5-aircraft sale-and-leaseback
    operation, reported by African Manager (2019-09-06). Tunisair had paid
    200 million dinars and was to secure the rest over two years.
  falsifiable_by: >-
    The Airbus/Tunisair purchase agreement or JORT decree ratifying the
    financing would supersede the reported 900 MDT figure.
  sources: [africanmanager-tunisair-airbus-2019, wikipedia-tunisair, forbes-tunisair-2017]
  notes:
    - >-
      Counterparty Airbus is not yet a graph entity; the winner field is left
      unset rather than fabricating an anchor. The A320neo order dates from
      September 2016: Tunisair rejigged its 2008 Airbus backlog (10 A320,
      3 A330-200, 3 A350-800; A350 cancelled 2013) into five A320neo
      (Wikipedia citing Flightglobal, 2016-09-06; Airfinance Global dates it
      August 2016).
    - >-
      The roadmap's "2017" framing reflects the order being outstanding through
      2017 (Forbes, 2017-11-24: five A320neos expected 2019/20). Deliveries
      slipped: the sale-and-leaseback was finalised 2019-09-04 for delivery of
      3 aircraft in early 2021 and 2 in early 2022; the fifth A320neo was
      received in August 2023 (Tunisian Transport Ministry). The 900 MDT figure
      is a company-official estimate reported by one outlet — a primary
      contract value (Airbus purchase agreement) was not retrievable this run.
  notes_fr:
    - >-
      La contrepartie Airbus n'est pas encore une entité du graphe ; le champ winner est
      laissé non défini plutôt que de fabriquer un ancrage. La commande A320neo date de
      septembre 2016 : Tunisair a réorganisé son carnet de commandes Airbus de 2008 (10
      A320, 3 A330-200, 3 A350-800 ; A350 annulé en 2013) en cinq A320neo (Wikipédia citant
      Flightglobal, 2016-09-06 ; Airfinance Global la date en août 2016).
    - >-
      Le cadrage « 2017 » de la feuille de route reflète la commande en attente tout au long
      de 2017 (Forbes, 2017-11-24 : cinq A320neos attendus en 2019/20). Les livraisons ont
      glissé : la cession-bail a été finalisée le 2019-09-04 pour la livraison de 3 aéronefs
      début 2021 et 2 début 2022 ; le cinquième A320neo a été reçu en août 2023 (ministère
      tunisien des Transports). Le chiffre de 900 MDT est une estimation officielle de la
      société rapportée par un seul média — une valeur contractuelle primaire (accord
      d'achat Airbus) n'a pas pu être récupérée lors de cette passe.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      الطرف المقابل إيرباص ليس بعد كياناً في الرسم البياني؛ يُترك حقل الفائز غير محدد بدلاً
      من صنع مرساة. تعود طلبية A320neo إلى سبتمبر 2016: أعاد تونساير تنظيم طلبيات إيرباص
      المتأخرة لعام 2008 (10 A320، 3 A330-200، 3 A350-800؛ تم إلغاء A350 في 2013) إلى خمسة
      A320neo (ويكيبيديا ناقلاً Flightglobal، 2016-09-06؛ تُاريخها Airfinance Global في
      أغسطس 2016).
    - >-
      يعكس إطار خارطة الطريق «2017» أن الطلبية معلقة طوال عام 2017 (فوربس، 2017-11-24: خمسة
      A320neos متوقعة في 2019/20). تأخرت التسليمات: تم الانتهاء من عملية البيع والإيجار في
      2019-09-04 لتسليم 3 طائرات في أوائل 2021 و2 في أوائل 2022؛ استُلمت الطائرة A320neo
      الخامسة في أغسطس 2023 (وزارة النقل التونسية). رقم 900 مليون دينار تونسي هو تقدير رسمي
      من الشركة أبلغت عنه وسيلة إعلام واحدة — لم يمكن استرجاع قيمة عقد أولية (اتفاقية شراء
      إيرباص) أثناء هذه الجولة.
  notes_ar_by: model-reviewed

