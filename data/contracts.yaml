      convertir. Le rapport annuel GCT 2024 ou les données douanières d'exportation
      indiqueraient la valeur réalisée.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      بروتوكول اتفاقية وعقد سنوي وُقّع في 29 أبريل 2024 لتصدير ما يقرب من 150,000 طن من
      الأسمدة إلى بنغلاديش لعام 2024، وقّعه المجمع الكيميائي التونسي (المدير العام هادي
      يوسف) وهيئة BADC (الرئيس عبد الله سزّاد) بحضور وايل شوشان (سكرتير دولة، الانتقال
      الطاقي) وسكرتيرة الدولة الزراعية البنغلادية واكدة أكتار. هيئة BADC ليست بعد كياناً في
      الرسم البياني؛ يُترك حقل الفائز غير محدد.
    - >-
      لم تُنشر قيمة العقد في البيان الوزاري — الرقم هو حجم، وليس قيمة؛ سعر الطن مطلوب
      لتحويله. سيذكر التقرير السنوي للمجمع الكيميائي التونسي لعام 2024 أو بيانات التصدير
      الجمركية القيمة المحققة.
  notes_ar_by: model-reviewed

- id: ctr-sncft-ebrd-2017
  title_en: EBRD loan financing SNCFT line works and six electric trains
  title_fr: Prêt de la BERD finançant les travaux de lignes de la SNCFT et six trains électriques
  title_ar: قرض البنك الأوروبي للإعمار والتنمية لتمويل أشغال الخطوط للشركة الوطنية للسكك الحديدية التونسية وستة قطارات كهربائية
  institution: sncft
  kind: procurement
  procurement: { mechanism: bilateral-loan, advertised: "~2017-12" }
  award: { value: "480000000", currency: TND, year: 2017 }
  financing: { type: bilateral-loan, lender: null }
  status: signed
  start: "2017-12-21"
  confidence: B
  basis: documented
  attributed_to: >-
    Webmanagercenter (2017-12-21): 480 million dinars / 160 million euros,
    signed by Minister of Development Zied Laâdhari, EBRD transport director
    Sue Barrett and SNCFT PDG Anis Oueslati; 18-year maturity at 1% interest.
    Kapitalis the same day reports 464 MDT.
  disputes:
    - claim: "Montant du prêt BERD à la SNCFT : 480 vs 464 MDT"
      held_by: "Kapitalis (2017-12-21) : 464 MDT"
      source: kapitalis-sncft-ebrd-2017
      assessment: >-
        Dispute of degree, not of kind: WMC reports 480 MDT (~160 MEUR), Kapitalis
        464 MDT. The 480 MDT figure is adopted here (WMC cites the signing
        parties); the difference is recorded, not silently resolved.
      status: open
  falsifiable_by: >-
    EBRD project page for the SNCFT loan (project number/date) and the signed
    loan agreement would fix the exact amount.
  sources: [wmc-sncft-ebrd-2017, kapitalis-sncft-ebrd-2017]
  notes:
    - >-
      Financing contract, not a supply award. The lender EBRD is not yet a
      graph entity (lender field null rather than a fabricated anchor). Splits:
      265 MDT (~88 MEUR) for the doubling and electrification of the
      Moknine–Mahdia line (25 km) including the acquisition of six modern
      electric trains; 215 MDT (~72 MEUR) for the upgrade of line 6
      Tunis–Kasserine (316 km). A separate 2 MEUR grant covered technical
      assistance. The works contractors were tendered in 2018 and are unnamed
      here.
  notes_fr:
    - >-
      Contrat de financement, pas une attribution de fourniture. Le prêteur BERD n'est pas
      encore une entité du graphe (champ lender nul plutôt qu'un ancrage fabriqué).
      Décompositions : 265 MDT (~88 MEUR) pour le doublement et l'électrification de la
      ligne Moknine–Mahdia (25 km) y compris l'acquisition de six trains électriques
      modernes ; 215 MDT (~72 MEUR) pour la mise à niveau de la ligne 6 Tunis–Kasserine (316
      km). Une subvention séparée de 2 MEUR a couvert l'assistance technique. Les
      entrepreneurs des travaux ont été appelés à l'offre en 2018 et ne sont pas nommés ici.
  notes_fr_by: model-reviewed
  notes_ar:
    - >-
      عقد تمويل، وليس منحة توريد. المُقرض بنك الإعمار الأوروبي للتنمية ليس بعد كياناً في
      الرسم البياني (حقل المُقرض فارغ بدلاً من مرساة مُصنّعة). التفكيك: 265 مليون دينار
      تونسي (~88 مليون يورو) لتوسيع وتوهيج خط موكنين-المهدية (25 كم) بما في ذلك اقتناء ست
      قطارات كهربائية حديثة؛ 215 مليون دينار تونسي (~72 مليون يورو) لترقية الخط 6
      تونس-القصرين (316 كم). غطت منحة منفصلة بقيمة 2 مليون يورو المساعدة الفنية. أُجريت
      مناقشات مقاولي الأعمال في 2018 ولم يتم تسميتهم هنا.
  notes_ar_by: model-reviewed

