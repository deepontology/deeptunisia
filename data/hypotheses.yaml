# -----------------------------------------------------------------------------
# HYPOTHESES
#
# The site's analytical spine. Each is stated so it could in principle be
# falsified, and each carries an honest verdict on how well the current dataset
# supports it. Two of the six come out badly, which is how you can tell the
# exercise is doing something.
#
# `falsifiable_by` states what would OVERTURN THE VERDICT, not merely what would
# contradict the statement. For a hypothesis rated `strong` those are the same
# thing. For one rated `insufficient` or `contradicted` they are not: the useful
# commitment there is naming the evidence that would move the project to the
# opposite finding. Every entry must be specific to its own hypothesis and name
# evidence someone could actually go and look for — a falsifier shared between
# two hypotheses is a falsifier for neither, and `npm run test` now rejects it.
# -----------------------------------------------------------------------------

- id: h1-continuous-deep-state
  label: H1 — A continuous deep state
  label_fr: >-
    H1 — Un État profond continu
  label_fr_by: model-reviewed
  label_ar: >-
    الفرضية 1 — دولة عميقة متواصلة
  label_ar_by: model-reviewed
  statement: >-
    A relatively stable group of security and economic elites has controlled Tunisia
    through every change of regime.
  statement_fr: >-
    Un groupe relativement stable d'élites sécuritaires et économiques a contrôlé la Tunisie
    à travers chaque changement de régime.
  statement_fr_by: model-reviewed
  statement_ar: >-
    مجموعة مستقرّة نسبيًا من النخب الأمنية والاقتصادية سيطرت على تونس عبر كل تغيير في
    النظام.
  statement_ar_by: model-reviewed
  support: insufficient
  reasoning: >-
    The dataset does not support this in its strong form. The Trabelsi network was
    dismantled, the RCD dissolved, Ben Ali died in exile, and the state has since
    prosecuted a former national police and intelligence chief, a former prime
    minister, the country's richest businessman and the leader of its largest party.
    A single continuous ruling group cannot be reconciled with a state that keeps
    imprisoning its own former security leadership.
  reasoning_fr: >-
    Les données ne soutiennent pas cette thèse dans sa forme forte. Le réseau Trabelsi a été
    démantelé, le RCD dissous, Ben Ali est mort en exil, et l'État a depuis poursuivi un
    ancien chef de la police nationale et du renseignement, un ancien chef du gouvernement,
    l'homme d'affaires le plus riche du pays et le dirigeant de son plus grand parti. Un
    groupe dirigeant unique et continu est irréconciliable avec un État qui ne cesse
    d'emprisonner ses propres anciens responsables sécuritaires.
  reasoning_fr_by: model-reviewed
  reasoning_ar: >-
    لا تدعم البيانات هذه الفرضية في صيغتها القوية. فُكّكت شبكة الطرابلسي، وحُلّ التجمّع
    الدستوري الديمقراطي، ومات بن علي في المنفى، ولاحقت الدولة منذئذٍ مديرًا عامًا سابقًا
    للأمن الوطني والاستخبارات، ورئيس حكومة سابقًا، وأثرى رجال أعمال البلاد، وزعيم أكبر
    أحزابها. يستحيل التوفيق بين وجود مجموعة حاكمة واحدة متواصلة ودولةٍ لا تكفّ عن سجن
    قياداتها الأمنية السابقة.
  reasoning_ar_by: model-reviewed
  falsifiable_by: >-
    A prosopography of senior security personnel showing that the same individuals,
    or a stable cohort of them, occupied the commanding posts continuously across
    1987, 2011 and 2021. Alternatively: evidence that the post-2021 prosecutions
    spared a definable inner group while eliminating only its rivals.
  falsifiable_by_fr: >-
    Une prosopographie du personnel sécuritaire de haut rang montrant que les mêmes
    individus, ou une cohorte stable d'entre eux, ont occupé les postes de commandement de
    façon continue à travers 1987, 2011 et 2021. Ou bien : la preuve que les poursuites
    engagées après 2021 ont épargné un noyau identifiable tout en éliminant seulement ses
    rivaux.
  falsifiable_by_fr_by: model-reviewed
  falsifiable_by_ar: >-
    دراسة بروسوبوغرافية لكبار العاملين في الأمن تُظهر أن الأفراد أنفسهم، أو مجموعة ثابتة
    منهم، شغلوا مواقع القيادة دون انقطاع عبر 1987 و2011 و2021. أو بديلًا: دليل على أن
    ملاحقات ما بعد 2021 استثنت نواةً محدّدة واكتفت بإزاحة منافسيها.
  falsifiable_by_ar_by: model-reviewed
  sources: [reuters-sentences-2025, reuters-mabrouk-chahed-2026, wb-wps6810]
  evidence:
    - falsifier_part: "a — prosopography across 1987/2011/2021"
      finding: contradicts
      evidence: >-
        Computed from the built graph (417 positions; security command roles =
        interior/defence ministers, DGSN, DGSR, ANRSD, National Guard, service and
        joint chiefs, presidential security, national security adviser). At
        1987-11-07 the security command was Habib Ammar (Interior Minister,
        appointed that day) and Slaheddine Baly (Defence). At 2011-01-14 it was the
        military service chiefs Rachid Ammar (Land), Taieb Laajimi (Air), Mohamed
        Khamassi (Navy). At 2021-07-25 it was the DGSN chiefs Guizani/Seddik, NG
        commander Ben Khaled, USGN commander Gharbi, service chiefs El Ghoul /
        Hajem / Jehane, DGSR chief Ben Taous, ANRSD chief Dhif and NSA Hamdi.
        ZERO individuals appear at more than one of the three dates. The strongest
        cross-rupture cases are Bennour (DGSN 2006-2008 and DGSN 2011-2012),
        Seriati (DGSN 1991-2002 then DG presidential security 2002-2011),
        Belhaj Ali (presidential security 1987-2001 then DGSN 2015-2016) and
        Akrout (DGSR chief into 2013, NSA 2015-2019) — each with a gap, none
        spanning all three. A stable cohort exists only across the 2021 rupture,
        in the military/defence-security domain: El Ghoul (Land Army chief since
        2018-06-01), Hajem (Air since 2017-08-01), Jehane (Navy since 2020-05-13),
        Ben Taous (DGSR since 2013-08-22), Dhif (ANRSD since ~2018), Harroum (DG
        Public Security since 2019-02-20) and Hamdi (NSA since 2019-10-01) all held
        command on 25 July 2021 and remained in post into 2025-2026 — but that
        cohort was installed between 2013 and 2020, does not reach back to 2011,
        and certainly not to 1987. The falsifier's requirement — the same
        individuals, or a stable cohort, continuously across 1987, 2011 AND 2021 —
        is not met in the graph.
      evidence_fr: >-
        Calculé à partir du graphe construit (417 postes ; rôles de commandement sécuritaire =
        ministres de l'Intérieur/la Défense, DGSN, DGSR, ANRSD, Garde nationale, chefs d'armée
        et interarmées, sécurité présidentielle, conseiller à la sécurité nationale). Au
        1987-11-07, le commandement sécuritaire était Habib Ammar (ministre de l'Intérieur,
        nommé ce jour-là) et Slaheddine Baly (Défense). Au 2011-01-14, c'étaient les chefs
        militaires Rachid Ammar (Terre), Taieb Laajimi (Air), Mohamed Khamassi (Marine). Au
        2021-07-25, c'étaient les chefs de la DGSN Guizani/Seddik, le commandant de la Garde
        nationale Ben Khaled, le commandant de l'USGN Gharbi, les chefs d'armée El Ghoul /
        Hajem / Jehane, le chef de la DGSR Ben Taous, le chef de l'ANRSD Dhif et le conseiller
        Hamdi. ZÉRO individu n'apparaît à plus d'une des trois dates. Les cas de franchissement
        de rupture les plus forts sont Bennour (DGSN 2006-2008 puis DGSN 2011-2012), Seriati
        (DGSN 1991-2002 puis sécurité présidentielle 2002-2011), Belhaj Ali (sécurité
        présidentielle 1987-2001 puis DGSN 2015-2016) et Akrout (chef de la DGSR jusqu'en 2013,
        conseiller 2015-2019) — chacun avec une interruption, aucun ne couvrant les trois. Une
        cohorte stable n'existe qu'à travers la rupture de 2021, dans le domaine militaire/
        défense-sécurité : El Ghoul (chef de l'armée de terre depuis 2018-06-01), Hajem (Air
        depuis 2017-08-01), Jehane (Marine depuis 2020-05-13), Ben Taous (DGSR depuis
        2013-08-22), Dhif (ANRSD depuis ~2018), Harroum (DG Sécurité publique depuis
        2019-02-20) et Hamdi (conseiller depuis 2019-10-01) commandaient tous le 25 juillet
        2021 et sont restés en poste jusqu'en 2025-2026 — mais cette cohorte a été installée
        entre 2013 et 2020, ne remonte pas à 2011, et encore moins à 1987. L'exigence du
        falsifieur — les mêmes individus, ou une cohorte stable, en continu à travers 1987,
        2011 ET 2021 — n'est pas satisfaite dans le graphe.
      evidence_fr_by: model-reviewed
      evidence_ar: >-
        محسوب من الرسم البياني المبني (417 منصبًا؛ أدوار القيادة الأمنية = وزيرا الداخلية
        والدفاع، المديرية العامة للأمن الوطني، المديرية العامة للأمن الرئاسي، الوكالة
        الوطنية للاستخبارات الأمنية والدفاعية، الحرس الوطني، رؤساء الأسلحة وهيئة الأركان
        المشتركة، الأمن الرئاسي، مستشار الأمن القومي). في 1987-11-07 كانت القيادة الأمنية
        للحبيب عمار (وزير الداخلية، عُيّن ذلك اليوم) وصلاح الدين بالي (الدفاع). وفي
        2011-01-14 كان رؤساء الأسلحة رشيد عمار (البري) والطيب العجيلي (الجوي) ومحمد الخماسي
        (البحري). وفي 2021-07-25 كان مديرا الأمن الوطني القيزاني/الصدّيق، وقائد الحرس الوطني
        بن خالد، وقائد الوحدة الخاصة غربي، ورؤساء الأسلحة الغول/الهاجم/جهان، ورئيس المديرية
        العامة للأمن الرئاسي بن تاوُس، ورئيس الوكالة ضيف، والمستشار الحامدي. صفر أفراد يظهرون
        في أكثر من تاريخ واحد من التواريخ الثلاثة. أقوى حالات عبور القطيعة هي بنّور (مديرًا
        عامًا للأمن الوطني 2006-2008 ثم 2011-2012)، والسرياطي (مديرًا عامًا للأمن الوطني
        1991-2002 ثم مديرًا للأمن الرئاسي 2002-2011)، وبالحاج علي (الأمن الرئاسي 1987-2001
        ثم مديرًا عامًا للأمن الوطني 2015-2016)، وعكروت (رئيس المديرية العامة للأمن الرئاسي
        حتى 2013، ومستشارًا 2015-2019) — كلٌّ منها بفجوة، ولا يمتد أيٌّ منها عبر التواريخ
        الثلاثة. وتوجد مجموعة ثابتة فقط عبر قطيعة 2021، في المجال العسكري/الأمني-الدفاعي:
        الغول (رئيس أركان الجيش البري منذ 2018-06-01)، والهاجم (الجوي منذ 2017-08-01)، وجهان
        (البحري منذ 2020-05-13)، وبن تاوُس (منذ 2013-08-22)، وضيف (الوكالة منذ ~2018)،
        وحرّوم (الأمن العمومي منذ 2019-02-20)، والحامدي (مستشارًا منذ 2019-10-01) — جميعهم
        تولّوا القيادة في 25 جويلية 2021 وبقوا في المنصب حتى 2025-2026 — لكن هذه المجموعة
        رُكّبت بين 2013 و2020، ولا تبلغ 2011، فضلًا عن 1987. وشرط الدحض — الأفراد أنفسهم، أو
        مجموعة ثابتة، بلا انقطاع عبر 1987 و2011 و2021 معًا — غير متحقق في الرسم البياني.
      evidence_ar_by: model-reviewed
      confidence: B
      basis: inferred
      reasoning: >-
        The interval data are A/B-grade positions from the graph; the finding is a
        set-theoretic reading of those intervals at the three regime-change dates.
        Because the graph's senior-security coverage is densest after 2011 and
        thinner in the Ben Ali era (several 1987-era entries are B-grade with
        year-only dates), absence in the graph is evidence about the dataset first.
      falsifiable_by: >-
        A primary-source position record (JORT decree) placing any individual in a
        senior security command post at two or more of 1987-11-07, 2011-01-14 and
        2021-07-25, or a complete JORT-based officeholder list for the DGSN/DGSR/
        service commands covering 1987-2021 that shows a cohort spanning all three.
      falsifier_progress: >-
        Moves AWAY from falsifier (a): the strict continuity test fails on the
        graph's own positions. It does, however, sharpen where a weaker version
        could bite — the 2021-2026 military/DGSR cohort (El Ghoul, Hajem, Jehane,
        Ben Taous, Dhif) is real and JORT-adjacent, so a reviewer should test
        whether that counts as a "stable cohort" under the falsifier's wording.
      falsifier_progress_fr: >-
        Éloigne du falsifieur (a) : le test strict de continuité échoue sur les positions
        mêmes du graphe. Il précise néanmoins où une version plus faible pourrait mordre — la
        cohorte militaire/DGSR 2021-2026 (El Ghoul, Hajem, Jehane, Ben Taous, Dhif) est réelle
        et adjacente au JORT, aussi un relecteur devrait-il tester si elle compte comme
        « cohorte stable » au sens du falsifieur.
      falsifier_progress_fr_by: model-reviewed
      falsifier_progress_ar: >-
        يبتعد عن شرط الدحض (أ): يفشل اختبار الاستمرارية الصارم على مواقف الرسم البياني نفسها.
        لكنه يحدّد مع ذلك أين يمكن لنسخة أضعف أن تنال — فمجموعة العسكريين/المديرية العامة
        للأمن الرئاسي 2021-2026 (الغول، الهاجم، جهان، بن تاوُس، ضيف) حقيقية ومجاورة للرائد
        الرسمي، لذا ينبغي لمراجع أن يختبر ما إذا كانت تعدّ «مجموعة ثابتة» بمقتضى صياغة شرط
        الدحض.
      falsifier_progress_ar_by: model-reviewed
      note: >-
        The person-continuity records below carry the full prosopography with
        years. No individual spans all three regime changes; the two-rupture
        crossings (Bennour, Seriati, Belhaj Ali, Akrout, the 2011 service chiefs)
        are all gapped and terminal.
      note_fr: >-
        Les fiches de continuité des personnes ci-dessous portent la prosopographie complète
        avec les années. Aucun individu ne traverse les trois changements de régime ; les
        franchissements à deux ruptures (Bennour, Seriati, Belhaj Ali, Akrout, les chefs
        d'armée de 2011) sont tous interrompus et terminaux.
      note_fr_by: model-reviewed
      note_ar: >-
        تحمل سجلات استمرارية الأشخاص أدناه الدراسة الجماعية الكاملة بالسنوات. لا يمتد أي فرد
        عبر تغييرات النظام الثلاثة؛ والعبورات ذات القطيعتين (بنّور، السرياطي، بالحاج علي،
        عكروت، رؤساء أسلحة 2011) كلها مفصولة ونهاية.
      note_ar_by: model-reviewed
      sources: [carnegie-quiet-revolution, jort-2021-123, jort-2021-124, jort-2022-546, tandf-police-benali, leaders-ammar-2011, webdo-bennour-2011, leaders-belhajali-2015, kapitalis-akrout-2019]
    - falsifier_part: "b — post-2021 prosecutions spared an inner group, eliminated only rivals"
      finding: contradicts
      evidence: >-
        The post-2021 prosecutions are real, broad and politically selective — but
        they fail the falsifier's second clause ("while eliminating only its
        rivals"). Documented targets include political leaders (Ghannouchi, Karoui,
        Chahed, Laarayedh, Moussi, Bhiri), the richest businessman (Mabrouk,
        20 years, March 2026), the former anti-corruption chief (Tabib, 10 years,
        May 2026), journalists and lawyers (29 journalists under Decree-Law
        2022-54, per Amnesty), human rights figures (Bensedrine 25 years, June
        2026; Chebbi, Hammami), NGO workers, and judges dismissed by presidential
        decree in June 2022 — and, decisively for H1, the former Director-General
        of National Security (2019-2021) Kamel Guizani was sentenced in absentia
        in July 2025 (Reuters; graph event sentences-july-2025). Mondafrique's
        "war of clans" reporting (6 Aug 2026) shows the prosecutorial machine
        serves the presidential entourage, not a stable security elite: the
        "règlement pénal" operates as state extraction from businessmen (olive-oil
        exporter Makhloufi freed against a TND 50m bail in Nov 2025; dozens of
        parallel cases), and files are frozen and unfrozen as leverage in the
        family struggle between Naoufel Saied and Atika Chebil (the S17 file
        against Atika Chebil was frozen after being opened). The definable inner
        group that prosecutions spare is the president's own family and its current
        appointees (Justice Minister Leila Jaffel, in post since Oct 2021), plus
        the serving military/defence-security leadership — while the DGSN/NG
        commands were rotated by presidential decree within three weeks of 25 July
        2021 (JORT 2021-123/124) and the displaced DGSN chief was himself
        prosecuted. Selectivity is real; "sparing a definable inner group while
        eliminating only its rivals" is not what the record shows.
      evidence_fr: >-
        Les poursuites post-2021 sont réelles, vastes et politiquement sélectives — mais elles
        échouent sur la seconde clause du falsifieur (« tout en n'éliminant que ses rivaux »).
        Les cibles documentées incluent des dirigeants politiques (Ghannouchi, Karoui, Chahed,
        Laarayedh, Moussi, Bhiri), l'homme d'affaires le plus riche (Mabrouk, 20 ans, mars
        2026), l'ancien chef de la lutte anticorruption (Tabib, 10 ans, mai 2026), journalistes
        et avocats (29 journalistes sous le décret-loi 2022-54, selon Amnesty), des figures des
        droits humains (Bensedrine 25 ans, juin 2026 ; Chebbi, Hammami), des travailleurs d'ONG
        et des juges révoqués par décret présidentiel en juin 2022 — et, décisif pour H1,
        l'ancien Directeur général de la Sûreté nationale (2019-2021) Kamel Guizani a été
        condamné par contumace en juillet 2025 (Reuters ; événement sentences-july-2025 du
        graphe). L'enquête de Mondafrique sur la « guerre des clans » (6 août 2026) montre que
        la machine répressive sert l'entourage présidentiel, non une élite sécuritaire stable :
        le « règlement pénal » opère comme une extraction d'État sur les hommes d'affaires
        (l'exportateur d'huile d'olive Makhloufi libéré contre une caution de 50 M TND en nov
        2025 ; des dizaines de dossiers parallèles), et les dossiers sont gelés et dégelés
        comme levier dans la lutte familiale entre Naoufel Saied et Atika Chebil (le dossier
        S17 contre Atika Chebil a été gelé après son ouverture). Le noyau interne identifiable
        que les poursuites épargnent est la propre famille du président et ses nominations
        actuelles (la ministre de la Justice Leila Jaffel, en poste depuis oct 2021), plus la
        direction militaire/sécurité-défense en fonction — tandis que les commandements DGSN/GN
        ont été remplacés par décret présidentiel dans les trois semaines suivant le 25 juillet
        2021 (JORT 2021-123/124) et que le chef de la DGSN déplacé a lui-même été poursuivi. La
        sélectivité est réelle ; « épargner un noyau interne identifiable tout en n'éliminant
        que ses rivaux » n'est pas ce que montre la fiche.
      evidence_fr_by: model-reviewed
      evidence_ar: >-
        الملاحقات بعد 2021 حقيقية وواسعة وانتقائية سياسيًا — لكنها تفشل في الشرط الثاني
        للدحض («مع إزاحة منافسيه فقط»). تشمل الأهداف الموثّقة قادة سياسيين (الغنوشي، قروي،
        الشاهد، العريض، موسي، بحيري)، وأغنى رجل أعمال (مبروك، 20 سنة، مارس 2026)، ورئيس
        الهيئة السابقة لمكافحة الفساد (طابيب، 10 سنوات، ماي 2026)، وصحفيين ومحامين (29
        صحفيًا بموجب المرسوم-القانون 2022-54، حسب منظمة العفو)، وشخصيات حقوقية (بن سدرين 25
        سنة، جوان 2026؛ الشبّي، الهمامي)، وعاملين في المنظمات، وقضاة أقيلوا بأمر رئاسي في
        جوان 2022 — وبشكل حاسم لفرضية H1، حُكم على المدير العام السابق للأمن الوطني
        (2019-2021) كمال القيزاني غيابيًا في جويلية 2025 (رويترز؛ حدث sentences-july-2025 في
        الرسم البياني). ويُظهر تحقيق موندافريك عن «حرب العشائر» (6 أوت 2026) أن آلة الملاحقة
        تخدم الدائرة الرئاسية لا نخبة أمنية مستقرة: فـ«التسوية الجزائية» تعمل كاستخراج دولي
        من رجال الأعمال (مصدّر زيت الزيتون مخلوفي أُفرج عنه بكفالة 50 مليون دينار في نوفمبر
        2025؛ وعشرات الملفات الموازية)، وتُجمَّد الملفات وتُرفع عنها التجميد كأداة ضغط في
        الصراع العائلي بين نوفل سعيّد وعتيقة شبيل (جُمّد الملف S17 ضد عتيقة شبيل بعد فتحه).
        والنواة الداخلية المحددة التي تستثنيها الملاحقات هي عائلة الرئيس نفسها وتعييناته
        الحالية (وزيرة العدل ليلى جفال، في المنصب منذ أكتوبر 2021)، إضافة إلى القيادة
        العسكرية/الأمنية-الدفاعية القائمة — بينما استُبدلت قيادتا الأمن الوطني والحرس
        الوطني بأمر رئاسي في غضون ثلاثة أسابيع من 25 جويلية 2021 (الرائد 2021-123/124)
        ولُوحق مدير الأمن الوطني المُزاح نفسه. الانتقائية حقيقية؛ أما «استثناء نواة داخلية
        محددة مع إزاحة منافسيها فقط» فليس ما يُظهره السجل.
      evidence_ar_by: model-reviewed
      confidence: B
      attributed_to: >-
        Mondafrique (family/clan reading of the prosecutions, règlement pénal
        extraction, the frozen/unfrozen files); Amnesty International (breadth of
        the crackdown, Decree-Law 2022-54 figures); Reuters and the graph's own
        events (individual convictions, Guizani in absentia).
      basis: reported
      reasoning: >-
        The breadth items rest on Reuters (A/B) and Amnesty (tier 2); the
        selectivity interpretation rests on a single established outlet
        (Mondafrique, tier 3) and is therefore flagged below B on its own.
      falsifiable_by: >-
        A primary record (judgement or JORT instrument) showing a coherent,
        definable group — pre-2021 or continuous since 1987 — that was exempted
        from prosecution while every figure outside it was pursued, with the
        exemptions unexplained by current office-holding.
      falsifier_progress: >-
