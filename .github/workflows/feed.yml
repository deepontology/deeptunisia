# Fetches third-party news headlines into feed/feed.json and commits the result
# to the standalone `feed` branch (never `main`).
#
# This job touches NOTHING on main, in data/, or in src/generated/. The feed is
# not project data: it is a list of links to what other people published,
# carrying no source, no epistemic basis and no confidence grade, because none
# has been assessed. The separation is asserted by scripts/test-feed.ts, which
# runs here before anything is committed.
#
# Two outlets are deliberately absent (businessnews.com.tn, tap.info.tn): both
# fail TLS certificate verification. See the comment in scripts/fetch-feed.ts.
# Do not "fix" that here with NODE_TLS_REJECT_UNAUTHORIZED.

name: News feed

# Every four hours, at :25.
#
# Three of the four feeds expose only their most recent 10 items, and Kapitalis
# alone publishes at roughly that rate over a busy day, so a six-hourly schedule
# would silently drop headlines whenever an outlet had a heavy morning.
on:
  schedule:
    - cron: '25 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify FEED_PAT before checkout
        env:
          FEED_PAT: ${{ secrets.FEED_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${FEED_PAT:-}" ]; then
            echo "::error::FEED_PAT secret is empty. Set a valid classic PAT with repo scope in Settings > Secrets and variables > Actions."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${FEED_PAT}" -H "Accept: application/vnd.github+json" https://api.github.com/user || echo "000")
          if [ "$code" != "200" ]; then
            echo "::error::FEED_PAT authentication failed (HTTP ${code}: token expired or revoked). Mint a new classic PAT with repo scope, update FEED_PAT, and re-run."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.FEED_PAT }}
          fetch-depth: 0

      - name: Fetch feed branch
        run: git fetch --no-tags origin feed:refs/remotes/origin/feed

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate the SvelteKit tsconfig (for the $data alias)
        run: npx --no-install svelte-kit sync

      # Loads feed/feed.json from origin/feed and builds the graph so
      # scripts/test-feed.ts can check feed ids against real entity ids.
      - name: Build the graph (for the separation checks)
        run: npm run data

      - name: Fetch feeds
        run: npx --no-install tsx scripts/fetch-feed.ts

      - name: Assert the feed is separate from the graph
        env:
          DT_FEED_LOCAL: '1'
        run: npx --no-install tsx scripts/test-feed.ts

      - name: Commit the archive to the feed branch if it changed
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$WORK" 2>/dev/null || rm -rf "$WORK"
          }
          trap cleanup EXIT
          git worktree add --detach "$WORK" origin/feed
          git -C "$WORK" checkout -B feed origin/feed
          mkdir -p "$WORK/feed"
          cp feed/feed.json "$WORK/feed/feed.json"
          if [ -z "$(git -C "$WORK" status --porcelain -- feed/feed.json)" ]; then
            echo "feed/feed.json unchanged on feed branch, nothing to commit"
            exit 0
          fi
          git -C "$WORK" config user.name  "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -- feed/feed.json
          count=$(node -e "process.stdout.write(String(require('./feed/feed.json').items.length))")
          git -C "$WORK" commit -m "Feed: refresh news archive (${count} headlines)" \
                                -m "Third-party headlines only. Not project data: no source, no basis, no confidence grade. Written by scripts/fetch-feed.ts." \
                                -m "[skip ci]"
          for attempt in 1 2 3; do
            if git -C "$WORK" push origin HEAD:feed; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git push to feed branch failed after 3 attempts"
              exit 1
            fi
            echo "Push raced with another commit on feed (attempt ${attempt}/3); rebasing and retrying"
            sleep $((attempt * 3))
            git -C "$WORK" pull --rebase --autostash origin feed
          done
